<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mimino.fun — browser games</title>
<meta name="description" content="Nine browser games, built one weekend at a time. Pick a cabinet and play." />
<meta name="theme-color" content="#0a0f20" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Space+Grotesk:wght@500;700&display=swap" />
<style>
  :root{
    --acc:#4d7cff; --acc-rgb:77,124,255; --head:#ff3b30;
    --bg:#0a0f20; --panel:#121a33; --thumb:#16203f;
    --line:#223057; --ink:#eef2ff; --muted:#93a1c9; --chip:#cdd8f5; --dim:#6e7ea8;
    --display:"Bungee",Impact,"Haettenschweiler",sans-serif;
    --body:"DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"Space Grotesk",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);padding:0 32px 56px}
  ::selection{background:var(--head);color:#fff}
  .wrap{max-width:1240px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding:56px 0 32px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(38px,6vw,62px);letter-spacing:-.01em;line-height:1}
  h1 span{color:var(--head)}
  .tagline{margin:14px 0 0;color:var(--muted);font-size:clamp(15px,1.6vw,17px);max-width:46ch;text-wrap:pretty}
  .coin{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bg);background:var(--acc);padding:7px 12px;border-radius:999px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:30px 0 0;margin:0;list-style:none}
  .card{display:flex;flex-direction:column;height:100%;background:var(--panel);border-radius:20px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 0 0 1px var(--line);transition:transform .18s ease,box-shadow .18s ease}
  .card:hover{transform:translateY(-6px);box-shadow:0 0 0 2px var(--acc),0 18px 40px rgba(var(--acc-rgb),.22)}
  .card:focus-visible{outline:none;box-shadow:0 0 0 3px var(--acc),0 18px 40px rgba(var(--acc-rgb),.22)}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--thumb);background-image:radial-gradient(circle at 30% 25%,rgba(var(--acc-rgb),.28),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 8px);display:flex;align-items:flex-end;padding:16px}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .thumb h2{margin:0;position:relative;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;letter-spacing:-.005em;text-shadow:0 3px 16px rgba(0,0,0,.8);text-wrap:pretty}
  .play{position:absolute;inset:0;background:rgba(10,15,32,.58);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#fff;opacity:0;transition:opacity .18s ease}
  .card:hover .play,.card:focus-visible .play{opacity:1}
  .body{display:flex;flex-direction:column;gap:10px;padding:16px 18px 20px;flex:1}
  .body p{margin:0;color:var(--muted);font-size:14px;line-height:1.55;flex:1;text-wrap:pretty}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:5px 10px;border-radius:999px;background:var(--line);color:var(--chip)}
  footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  footer a{color:var(--acc);font-weight:700;text-decoration:none}
  footer a:hover{color:var(--head)}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>mimino<span>.fun</span></h1>
      <p class="tagline">Nine browser games, built one weekend at a time. Pick a cabinet and play.</p>
    </div>
    <span class="coin">insert coin</span>
  </header>

  <main>
    <h2 hidden>Games</h2>
    <ul class="grid" id="grid"></ul>
  </main>

  <footer>
    <span>© mimino.fun</span>
    <a href="https://github.com/mimino67gamer" target="_blank" rel="noopener">github.com/mimino67gamer</a>
  </footer>
</div>

<script>
// Add a game = append one object here.
const GAMES = [
  { slug:"blockvale", title:"Blockvale", lang:"EN", tags:["Sandbox","Crafting"],
    desc:"Mine, craft and build a 2D world grown from a seed. Survival has hunger and mobs; Creative lets you fly and build with everything." },
  { slug:"bring-it-down", title:"Bring It Down", lang:"EN", tags:["Physics","Puzzle"],
    desc:"Plant the charges, time the fuses and drop each building into its own footprint. Anything landing outside the zone costs you." },
  { slug:"sunder", title:"Sunder", lang:"EN", tags:["Fighting","Duel"],
    desc:"Hollow armour duels until only scrap remains. Your blade follows the pointer — sweep fast enough and a limb comes away." },
  { slug:"flappy-dash", title:"Flappy Dash", lang:"CS", tags:["Arkáda","Pro děti"],
    desc:"Slepice v helmě prolétá mezi trubkami. Pruhovaná je za pět bodů, kukuřice za tři a duhové pírko zapne turbo." },
  { slug:"galactus", title:"Galactus", lang:"CS", tags:["Strategie","Vesmír"],
    desc:"Ovládni všechny planety soupeřů. Až pět barev na desce — hraj proti počítači, nebo si podávejte myš kolem stolu." },
  { slug:"vlna", title:"VLNA — 1000 levelů", lang:"CS", tags:["Arkáda","1000 levelů"],
    desc:"Držíš = nahoru, pustíš = dolů. Nic víc. Tisíc levelů od úplně lehkých až po Tidal Wave, k tomu editor vlastních." },
  { slug:"mala-velka-armada", title:"Malá velká armáda", lang:"CS", tags:["Strategie","Bitva"],
    desc:"Brambory, roboti, kočky nebo dinosauři — vyber si armádu a projdi sto levelů ve čtyřech obtížnostech." },
  { slug:"bambilionar", title:"Chcete být Bambilionářem?", lang:"CS", tags:["Kvíz","Pro děti"],
    desc:"Deset otázek, které pořádně zaberou. Tři nápovědy, jistota po milionu — a na konci celý bambilion." },
  { slug:"tajna-zprava", title:"Tajná zpráva", lang:"CS", tags:["Šifry","Pohádka"],
    desc:"Agent Ježek zašifroval pohádku — každé písmenko vyměnil za jiné. Dostaň z toho zpátky češtinu." }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lc = g => g.lang === "CS" ? "cs" : "en";
const langName = g => g.lang === "CS" ? "Czech" : "English";

document.getElementById("grid").innerHTML = GAMES.map((g) => `
  <li>
    <a class="card" href="./games/${esc(g.slug)}.html" target="_blank" rel="noopener"
       aria-label="${esc(g.title)} (${langName(g)}) — opens in a new tab">
      <span class="thumb">
        <img src="./assets/thumbs/${esc(g.slug)}.png" alt="Screenshot of ${esc(g.title)}" loading="lazy"
             onerror="this.remove()" />
        <h2 lang="${lc(g)}">${esc(g.title)}</h2>
        <span class="play" aria-hidden="true">▶ play</span>
      </span>
      <span class="body">
        <p lang="${lc(g)}">${esc(g.desc)}</p>
        <span class="tags">${g.tags.map(t => `<span class="tag" lang="${lc(g)}">${esc(t)}</span>`).join("")}</span>
      </span>
    </a>
  </li>`).join("");
</script>
</body>
</html>
