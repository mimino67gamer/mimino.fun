function kresliPozadi(dt){
  const v = (stav === 'hra' ? rychlost : 70) * dt;
  posunHory   = (posunHory   + v * .05) % 480;
  posunKopcu  = (posunKopcu  + v * .18) % 320;
  posunStromy = (posunStromy + v * .45) % (150 * KOPCE_STROMY.length);
  posunZeme   = (posunZeme   + v) % 60;

  // obloha — den → západ → noc → démonická oblast → svítání
  const nb = nebeTed();
  const den = nb.tma;                       // jak moc je tma
  const noc = nocSila();
  const demon = demonSila();
  const f = cyklFaze();
  const o = ctx.createLinearGradient(0, 0, 0, V);
  o.addColorStop(0, nb.a); o.addColorStop(.55, nb.b); o.addColorStop(1, nb.c);
  ctx.fillStyle = o; ctx.fillRect(0, 0, Š, V);
  if (boss){ ctx.fillStyle = 'rgba(18,24,58,.22)'; ctx.fillRect(0, 0, Š, V); }
  if (bourkaSila > 0){ ctx.fillStyle = 'rgba(38,44,66,' + (.46 * bourkaSila) + ')'; ctx.fillRect(0, 0, Š, V); }

  // hvězdy
  if (noc > 0){
    ctx.fillStyle = '#ffffff';
    for (const h of HVEZDY){
      ctx.globalAlpha = noc * (.4 + Math.abs(Math.sin(hodiny*1.7 + h.f)) * .6);
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // slunce zapadá a zase vychází
  let sunT = -1;
  if (f < .44) sunT = f / .44;
  else if (f > .86) sunT = 1 - (f - .86) / .14;
  if (sunT >= 0 && sunT <= 1){
    const sx = 130 + sunT * 250, sy = 92 + sunT * 330;
    ctx.globalAlpha = omez((1 - sunT) * 3, 0, 1);
    const z = ctx.createRadialGradient(sx, sy, 10, sx, sy, 130);
    z.addColorStop(0, 'rgba(255,226,140,.5)'); z.addColorStop(1, 'rgba(255,226,140,0)');
    ctx.fillStyle = z; ctx.beginPath(); ctx.arc(sx, sy, 130, 0, 7); ctx.fill();
    ctx.fillStyle = mixBarev('#fff3c4', '#ff8a4c', sunT);
    ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 7); ctx.fill();
    ctx.fillStyle = mixBarev('#ffe27a', '#ff6b4a', sunT);
    ctx.beginPath(); ctx.arc(sx, sy, 26, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // krvavý měsíc a jiskry v démonické oblasti
  if (demon > 0){
    const mx = 700, my = 130;
    ctx.globalAlpha = demon;
    const z = ctx.createRadialGradient(mx, my, 12, mx, my, 150);
    z.addColorStop(0, 'rgba(255,60,40,.5)'); z.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = z; ctx.beginPath(); ctx.arc(mx, my, 150, 0, 7); ctx.fill();
    ctx.fillStyle = '#c0261f'; ctx.beginPath(); ctx.arc(mx, my, 54, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(80,10,10,.55)';
    ctx.beginPath(); ctx.arc(mx - 18, my - 14, 13, 0, 7); ctx.arc(mx + 16, my + 8, 9, 0, 7);
    ctx.arc(mx - 4, my + 24, 7, 0, 7); ctx.fill();
    for (const j of JISKRY){
      j.y -= j.s * dt; j.x -= (12 + j.s * .2) * dt;
      if (j.y < 40){ j.y = nah(V - 60, V + 40); j.x = nah(0, Š); }
      if (j.x < -20) j.x = Š + 20;
      const a = demon * (.35 + Math.abs(Math.sin(hodiny * 3 + j.f)) * .65);
      const zg = ctx.createRadialGradient(j.x, j.y, 0, j.x, j.y, 12);
      zg.addColorStop(0, 'rgba(255,180,60,' + (a * .8) + ')');
      zg.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(j.x, j.y, 12, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,150,' + a + ')';
      ctx.beginPath(); ctx.arc(j.x, j.y, j.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // a vychází měsíc
  if (noc > 0){
    const mx = Š - 200, my = 310 - noc * 215;
    ctx.globalAlpha = noc;
    const z = ctx.createRadialGradient(mx, my, 8, mx, my, 95);
    z.addColorStop(0, 'rgba(220,235,255,.4)'); z.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = z; ctx.beginPath(); ctx.arc(mx, my, 95, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2f6ff'; ctx.beginPath(); ctx.arc(mx, my, 29, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(188,203,235,.8)';
    ctx.beginPath(); ctx.arc(mx - 9, my - 7, 6, 0, 7); ctx.arc(mx + 9, my + 4, 4.5, 0, 7);
    ctx.arc(mx - 2, my + 12, 3.4, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // vzdálené hory — se svahy, sněhem a skalami
  tvarKopce(120, 120, 190, posunHory, true);
  ctx.fillStyle = boss ? '#7c9bb5' : '#9fc3d9'; ctx.fill();
  ctx.save(); ctx.clip();
  // osvětlené svahy
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  for (let i = -2; i < 12; i++){
    const x = i * 150 - (posunHory % 150);
    ctx.beginPath(); ctx.moveTo(x, ZEM); ctx.lineTo(x + 46, ZEM - 300); ctx.lineTo(x + 82, ZEM); ctx.closePath(); ctx.fill();
  }
  // stinné svahy
  ctx.fillStyle = 'rgba(40,70,100,.15)';
  for (let i = -2; i < 12; i++){
    const x = i * 150 - (posunHory % 150) + 82;
    ctx.beginPath(); ctx.moveTo(x, ZEM); ctx.lineTo(x + 30, ZEM - 300); ctx.lineTo(x + 62, ZEM); ctx.closePath(); ctx.fill();
  }
  // sníh na vrcholcích
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillRect(0, 0, Š, ZEM - 208);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.fillRect(0, ZEM - 208, Š, 16);
  ctx.restore();

  // mraky
  for (const m of mraky){
    m.x -= m.v * dt * (stav === 'hra' ? 1.4 : .5);
    if (m.x < -170) { m.x = Š + 170; m.y = nah(40, 230); }
    kresliMrak(m.x, m.y, m.m, !!boss);
  }

  // duha po bouřce
  if (duha > 0){
    const a = omez(Math.min(duha, 15 - duha) / 2.2, 0, 1) * .55;
    const cx = Š * .5, cy = ZEM + 210;
    ctx.lineWidth = 13; ctx.globalAlpha = a;
    ['#ff5d5d','#ff9f1c','#ffe066','#5ecf6b','#4dabf7','#5c6bff','#a86bff'].forEach((b, i) => {
      ctx.strokeStyle = b;
      ctx.beginPath(); ctx.arc(cx, cy, 400 - i * 13, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  // zadní kopec
  tvarKopce(74, 40, 110, posunKopcu, false);
  ctx.fillStyle = boss ? '#5f9464' : '#79bf72'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fillRect(0, 0, Š, ZEM - 44);   // světlo shora
  const k1 = Math.floor(posunKopcu / 74);
  for (let i = -1; i < 15; i++){
    const idx = (((i + k1) % KERE.length) + KERE.length) % KERE.length;
    const x = i * 74 - (posunKopcu % 74);
    const y = ZEM - 14 - KERE[idx] * .5;
    ctx.fillStyle = 'rgba(28,92,46,.3)';                    // tmavší trsy
    ctx.beginPath(); ctx.ellipse(x, y, 24, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(46,124,62,.85)';                  // keříky
    ctx.beginPath();
    ctx.arc(x + 30, y - 6, 9, 0, 7); ctx.arc(x + 41, y - 3, 7, 0, 7); ctx.arc(x + 22, y - 2, 6, 0, 7);
    ctx.fill();
    ctx.fillStyle = idx % 3 === 0 ? 'rgba(255,255,255,.75)' : 'rgba(255,225,120,.8)';   // kytičky
    ctx.beginPath(); ctx.arc(x + 12, y + 6, 2.2, 0, 7); ctx.arc(x + 52, y + 3, 2, 0, 7); ctx.fill();
  }
  ctx.restore();

  // stromy na kopci
  const rozestup = 150, k = Math.floor(posunStromy / rozestup);
  for (let i = -1; i <= 8; i++){
    const idx = (((i + k) % KOPCE_STROMY.length) + KOPCE_STROMY.length) % KOPCE_STROMY.length;
    const s = KOPCE_STROMY[idx];
    const x = i * rozestup - (posunStromy % rozestup);
    kresliStrom(x, ZEM - 22, s.m * .8, s.jehl);
  }

  // --- strašidla pobíhající po kopci (jen v noci a v pekle) ---
  ctx.save();
  if (noc > .06 || demon > .06){
    for (const st of STRASIDLA){
      st.x -= ((stav === 'hra' ? rychlost : 70) * .18 + st.beh) * dt;
      st.faze += dt * 5;
      st.mrk -= dt;
      if (st.mrk < -.16) st.mrk = nah(1.4, 4.5);
      if (st.x < -70){ st.x = Š + nah(40, 420); st.vel = nah(.85, 1.25); }
      const sila = (st.druh === 'certik' || st.druh === 'kostlivec') ? demon
                 : st.druh === 'duch' ? noc
                 : Math.max(noc, demon);
      if (sila < .06) continue;
      const sy = vyskaKopce(st.x);
      if (st.druh === 'certik' || st.druh === 'kostlivec')
        stinPod(st.x, sy + 6, 13 * st.vel, .26 * sila);
      else if (st.druh === 'duch')
        stinPod(st.x, sy + 6, 11 * st.vel, .16 * sila);
      kresliStrasidlo(st, sy, sila, demon);
    }
  }
  ctx.beginPath(); ctx.restore();

  // přední kopec
  const pp = posunKopcu * 1.7;
  tvarKopce(34, 18, 70, pp, false, 2);
  ctx.fillStyle = boss ? '#487a4e' : '#5aa84e'; ctx.fill();
  ctx.save(); ctx.clip();
  // tmavší fleky = nerovnosti
  const k2 = Math.floor(pp / 88);
  for (let i = -1; i < 14; i++){
    const idx = (((i + k2) % KAMENY.length) + KAMENY.length) % KAMENY.length;
    const x = i * 88 - (pp % 88);
    ctx.fillStyle = 'rgba(24,80,38,.22)';
    ctx.beginPath(); ctx.ellipse(x + 20, ZEM - 8 - (idx % 14), 34, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(150,150,150,.5)';                 // kamínky
    ctx.beginPath(); ctx.ellipse(x + 58, ZEM - 6 - (idx % 9), 7, 4.5, .3, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(120,120,125,.5)';
    ctx.beginPath(); ctx.ellipse(x + 68, ZEM - 3, 4.5, 3, -.2, 0, 7); ctx.fill();
  }
  ctx.restore();
  // trsy trávy přímo na hraně kopce
  ctx.fillStyle = boss ? '#5b9160' : '#6cc35f';
  for (let xs = -20; xs <= Š + 20; xs += 13){
    const y = ZEM - 34 - Math.sin((xs + pp) / 70 + 2) * 18;
    const h = 6 + ((Math.floor((xs + pp) / 13) % 4) * 2.5);
    ctx.beginPath();
    ctx.moveTo(xs, y + 3); ctx.lineTo(xs + 4, y - h); ctx.lineTo(xs + 8, y + 3);
    ctx.closePath(); ctx.fill();
  }

  // země
  const z = ctx.createLinearGradient(0, ZEM, 0, V);
  z.addColorStop(0, '#a37a4e'); z.addColorStop(1, '#7a5636');
  ctx.fillStyle = z; ctx.fillRect(0, ZEM, Š, V - ZEM);
  ctx.fillStyle = '#4f9b45'; ctx.fillRect(0, ZEM, Š, 15);
  ctx.fillStyle = '#63b955'; ctx.fillRect(0, ZEM, Š, 7);
  // vrstvy hlíny a kamínky v zemi
  ctx.fillStyle = 'rgba(90,62,38,.35)'; ctx.fillRect(0, ZEM + 22, Š, 4);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, ZEM + 15, Š, 3);
  for (let i = -1; i < 17; i++){
    const x = i * 60 - (posunZeme % 60);
    ctx.fillStyle = 'rgba(60,42,26,.35)';
    ctx.beginPath(); ctx.ellipse(x + 12, ZEM + 31, 6, 3.5, .2, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,210,.12)';
    ctx.beginPath(); ctx.ellipse(x + 44, ZEM + 19, 9, 3, -.15, 0, 7); ctx.fill();
  }

  // trsy trávy a kamínky
  const t = 60, kt = Math.floor(posunZeme / t);
  for (let i = -1; i <= 17; i++){
    const idx = (((i + kt) % TRSY.length) + TRSY.length) % TRSY.length;
    const x = i * t - (posunZeme % t);
    ctx.fillStyle = '#3f8a3a';
    for (let j = 0; j < 3; j++){
      ctx.beginPath();
      ctx.moveTo(x + j*7, ZEM + 1);
      ctx.lineTo(x + j*7 + 3, ZEM - TRSY[idx] - j);
      ctx.lineTo(x + j*7 + 6, ZEM + 1);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.13)';
    ctx.beginPath(); ctx.ellipse(x + 34, ZEM + 24 + (idx % 3) * 6, 7, 3, 0, 0, 7); ctx.fill();
  }

  // krajina se stmívá (obloha zůstává, ať jsou vidět hvězdy)
  if (den > .1){
    const cr = Math.round(10 + demon * 80), cg = Math.round(16 - demon * 12), cb = Math.round(46 - demon * 36);
    const g2 = ctx.createLinearGradient(0, 110, 0, V);
    g2.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
    g2.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + ((den - .1) / .9 * .62) + ')');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, Š, V);
  }
  // rozžhavené praskliny v zemi
  if (demon > 0){
    const kd = Math.floor(posunZeme / 60);
    for (let i = -1; i < 17; i++){
      const idx = (((i + kd) % KAMENY.length) + KAMENY.length) % KAMENY.length;
      const x = i * 60 - (posunZeme % 60);
      ctx.globalAlpha = demon * (.5 + Math.sin(hodiny * 3 + i) * .3);
      ctx.strokeStyle = '#ff7a2f'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 6, ZEM + 12 + (idx % 5));
      ctx.lineTo(x + 22, ZEM + 20 + (idx % 7));
      ctx.lineTo(x + 38, ZEM + 12 + (idx % 4));
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,120,.8)'; ctx.lineWidth = 1.4; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(120,10,14,' + (demon * .22) + ')';
    ctx.fillRect(0, 0, Š, V);
  }

  // světlušky — vylétnou, až se setmí
  if (noc > .18 && demon < .3){
    for (const sv of SVETLUSKY){
      sv.x -= (16 + sv.s * 22) * dt * (stav === 'hra' ? 1 : .4);
      if (sv.x < -24){ sv.x = Š + 24; sv.y = nah(280, 470); }
      const y = sv.y + Math.sin(hodiny * 1.5 + sv.f * 2) * 16;
      const a = (noc - .18) / .82 * (.3 + Math.abs(Math.sin(hodiny * 2.4 + sv.f)) * .7);
      const zg = ctx.createRadialGradient(sv.x, y, 0, sv.x, y, 15);
      zg.addColorStop(0, 'rgba(255,255,190,' + (a * .8) + ')');
      zg.addColorStop(1, 'rgba(190,255,130,0)');
      ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(sv.x, y, 15, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,205,' + a + ')';
      ctx.beginPath(); ctx.arc(sv.x, y, sv.r, 0, 7); ctx.fill();
    }
  }
}

// ============ PŘEKÁŽKY ============
function kresliTrubku(p){
  const b = !!p.bonus;
  const dem = demonSila();
  const obr = b ? '#a01f2a' : dem > .3 ? '#2a0d0a' : '#1e5626';
  const g = ctx.createLinearGradient(p.x, 0, p.x + p.š, 0);
  if (b){ g.addColorStop(0, '#dcdcdc'); g.addColorStop(.3, '#ffffff');
          g.addColorStop(.6, '#fdfdfd'); g.addColorStop(1, '#c9c9c9'); }
  else if (dem > .3){
    g.addColorStop(0, mixBarev('#2d7a37', '#241014', dem)); g.addColorStop(.28, mixBarev('#5fc16a', '#4a1d18', dem));
    g.addColorStop(.5, mixBarev('#7ad683', '#6b2a1e', dem)); g.addColorStop(.78, mixBarev('#3f9a49', '#3a1512', dem));
    g.addColorStop(1, mixBarev('#276b30', '#1a0a0a', dem));
  }
  else  { g.addColorStop(0, '#2d7a37'); g.addColorStop(.28, '#5fc16a');
          g.addColorStop(.5, '#7ad683'); g.addColorStop(.78, '#3f9a49'); g.addColorStop(1, '#276b30'); }

  const telo = (y, v) => {
    ctx.fillStyle = g; ctx.fillRect(p.x, y, p.š, v);
    if (b){                                   // červené pruhy
      ctx.save();
      ctx.beginPath(); ctx.rect(p.x, y, p.š, v); ctx.clip();
      ctx.fillStyle = '#e63946';
      const start = Math.floor(y / 46) * 46;
      for (let yy = start; yy < y + v; yy += 46) ctx.fillRect(p.x, yy, p.š, 23);
      ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(p.x + 12, y, 8, v);
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.fillRect(p.x + 12, y, 8, v);
    }
    ctx.strokeStyle = obr; ctx.lineWidth = 3;
    ctx.strokeRect(p.x + 1.5, y, p.š - 3, v);
  };
  const cap = (y) => {
    const gg = ctx.createLinearGradient(p.x - 9, 0, p.x + p.š + 9, 0);
    if (b){ gg.addColorStop(0, '#c9901a'); gg.addColorStop(.35, '#ffd166');
            gg.addColorStop(.6, '#ffe9a8'); gg.addColorStop(1, '#b8801a'); }
    else  { gg.addColorStop(0, '#256b2e'); gg.addColorStop(.3, '#63c76e');
            gg.addColorStop(.55, '#84dd8c'); gg.addColorStop(1, '#215f29'); }
    ctx.beginPath(); ctx.roundRect(p.x - 9, y, p.š + 18, 26, 6);
    ctx.fillStyle = gg; ctx.fill();
    ctx.strokeStyle = b ? '#8f6410' : '#1e5626'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fillRect(p.x - 2, y + 5, 8, 16);
    if (b){
      ctx.textAlign = 'center';
      napis('5', p.x + p.š/2, y + 13, '#ffffff', 'bold 21px system-ui', 5, '#8f6410');
    }
  };
  telo(-20, p.mezeraY + 20);
  cap(p.mezeraY - 26);
  telo(p.mezeraY + p.mezeraV, ZEM - (p.mezeraY + p.mezeraV));
  cap(p.mezeraY + p.mezeraV);

  // žhavé pukliny v pekelné trubce
  if (dem > .3 && !b){
    ctx.globalAlpha = dem * .85;
    ctx.strokeStyle = '#ff7a2f'; ctx.lineWidth = 2.4;
    for (const y of [p.mezeraY - 90, p.mezeraY - 190, p.mezeraY + p.mezeraV + 70, p.mezeraY + p.mezeraV + 170]){
      if (y < 0 || y > ZEM) continue;
      ctx.beginPath();
      ctx.moveTo(p.x + 10, y); ctx.lineTo(p.x + 34, y + 16); ctx.lineTo(p.x + 60, y + 4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // pár lístků, ať to není jen roura
  ctx.fillStyle = b ? '#ffd166' : dem > .3 ? '#ff8c3a' : '#8ede8f';
  ctx.beginPath(); ctx.ellipse(p.x - 12, p.mezeraY - 32, 11, 5, -.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x + p.š + 12, p.mezeraY + p.mezeraV + 32, 11, 5, .5, 0, 7); ctx.fill();
}

function kresliPilu(p){
  ctx.save(); ctx.translate(p.x, p.y);
  // úchyt
  ctx.strokeStyle = 'rgba(60,60,70,.5)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, -p.amp - 30); ctx.lineTo(0, p.amp + 30); ctx.stroke();

  const dem = demonSila();
  if (dem > .3){                                   // v pekle pila žhne
    const zg = ctx.createRadialGradient(0, 0, 4, 0, 0, p.r * 2.1);
    zg.addColorStop(0, 'rgba(255,120,40,' + (dem * .5) + ')');
    zg.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(0, 0, p.r * 2.1, 0, 7); ctx.fill();
  }
  ctx.rotate(p.uhel);
  const g = ctx.createRadialGradient(-8, -8, 4, 0, 0, p.r);
  if (dem > .3){ g.addColorStop(0, mixBarev('#f4f7fa', '#ffd166', dem));
                 g.addColorStop(.6, mixBarev('#c3cad4', '#ff6b2f', dem));
                 g.addColorStop(1, mixBarev('#8e97a4', '#8c1420', dem)); }
  else { g.addColorStop(0, '#f4f7fa'); g.addColorStop(.6, '#c3cad4'); g.addColorStop(1, '#8e97a4'); }
  ctx.fillStyle = g;
  ctx.beginPath();
  for (let i = 0; i < 12; i++){
    const a1 = i / 12 * Math.PI*2, a2 = (i + .5) / 12 * Math.PI*2;
    ctx.lineTo(Math.cos(a1)*p.r, Math.sin(a1)*p.r);
    ctx.lineTo(Math.cos(a2)*p.r*.74, Math.sin(a2)*p.r*.74);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6b7480'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#79828f'; ctx.beginPath(); ctx.arc(0, 0, p.r*.42, 0, 7); ctx.fill();
  ctx.fillStyle = '#e04f4f'; ctx.beginPath(); ctx.arc(0, 0, p.r*.2, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.beginPath(); ctx.arc(-p.r*.22, -p.r*.22, p.r*.09, 0, 7); ctx.fill();
  ctx.restore();
}

function kresliOstny(p){
  const zub = (x, y, š, v, dolu) => {
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + š, y); ctx.lineTo(x + š/2, y + (dolu ? v : -v));
    ctx.closePath(); ctx.fill();
    ctx.stroke();
  };
  const š = 26, pocet = Math.max(1, Math.floor(p.š / š));
  const dem = demonSila();
  ctx.strokeStyle = dem > .3 ? '#5a2016' : '#6b7480'; ctx.lineWidth = 2;
  if (dem > .3 && Math.random() < .25)             // doutná z nich kouř
    castice.push({x: p.x + nah(0, p.š), y: (p.kde === 'nahore' ? STROP + p.v : ZEM - p.v),
                  vx: nah(-90,-20), vy: nah(-60,-15), zivot: nah(.4, .9), max: .9,
                  barva: nahZ(['#6c757d','#adb5bd','#ff7a2f']), vel: nah(4, 8)});

  const rada = (dolu) => {
    const y0 = dolu ? STROP : ZEM;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + (dolu ? p.v : -p.v));
    if (dem > .3){ g.addColorStop(0, mixBarev('#7f8894', '#3a1410', dem));
                   g.addColorStop(.45, mixBarev('#dfe5ec', '#ff8c3a', dem));
                   g.addColorStop(1, mixBarev('#aeb6c2', '#ffe066', dem)); }
    else { g.addColorStop(0, '#7f8894'); g.addColorStop(.45, '#dfe5ec'); g.addColorStop(1, '#aeb6c2'); }
    ctx.fillStyle = g;
    for (let i = 0; i < pocet; i++) zub(p.x + i*š, y0, š, p.v, dolu);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (let i = 0; i < pocet; i++){
      ctx.beginPath();
      ctx.moveTo(p.x + i*š + š*.42, y0);
      ctx.lineTo(p.x + i*š + š*.5, y0 + (dolu ? p.v*.85 : -p.v*.85));
      ctx.lineTo(p.x + i*š + š*.58, y0);
      ctx.closePath(); ctx.fill();
    }
    // podstavec
    ctx.fillStyle = '#5c6470';
    ctx.fillRect(p.x - 3, dolu ? y0 - 8 : y0, pocet*š + 6, 8);
  };
  if (p.kde !== 'nahore') rada(false);
  if (p.kde !== 'dole')   rada(true);
}

function kresliNetopyra(p){
  const mav = Math.sin(p.faze);
  stinPod(p.x, ZEM + 4, 14, .12);
  ctx.save(); ctx.translate(p.x, p.y);

  // křídla
  ctx.fillStyle = '#5b4a86';
  ctx.strokeStyle = '#3b2f5c'; ctx.lineWidth = 2;
  for (const s of [-1, 1]){
    ctx.save(); ctx.scale(s, 1);
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.quadraticCurveTo(26, -18 - mav*10, 42, -4 - mav*14);
    ctx.quadraticCurveTo(34, 4 - mav*4, 30, 10 - mav*6);
    ctx.quadraticCurveTo(22, 2 - mav*2, 16, 10 - mav*3);
    ctx.quadraticCurveTo(12, 2, 6, 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // tělo
  ctx.fillStyle = '#4a3a72';
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 15, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#33285a'; ctx.lineWidth = 2; ctx.stroke();
  // uši
  ctx.fillStyle = '#4a3a72';
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(s*4, -12); ctx.lineTo(s*10, -26); ctx.lineTo(s*12, -10);
    ctx.closePath(); ctx.fill();
  }
  // oči
  const zly = p.stav === 'utoci';
  const oddechuje = p.stav === 'unava';
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5, -3, 4.4, 0, 7); ctx.arc(5, -3, 4.4, 0, 7); ctx.fill();
  ctx.fillStyle = zly ? '#e63946' : '#221c33';
  ctx.beginPath(); ctx.arc(-4.4, -3, 2.4, 0, 7); ctx.arc(5.6, -3, 2.4, 0, 7); ctx.fill();
  // zoubky
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-3, 6); ctx.lineTo(-1, 11); ctx.lineTo(0, 6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2, 6); ctx.lineTo(3.6, 11); ctx.lineTo(5, 6); ctx.closePath(); ctx.fill();
  ctx.restore();

  // nálada
  if (p.stav === 'klid') napis('z z', p.x + 22, p.y - 24, '#e8e3ff', 'bold 16px system-ui', 4);
  else if (oddechuje) napis('uf...', p.x + 26, p.y - 24, '#cfe8ff', 'bold 16px system-ui', 4);
  else if (p.stav === 'vsiml'){
    napis('!', p.x + 20, p.y - 26, '#ffe066', 'bold 30px system-ui', 5);
    ctx.strokeStyle = 'rgba(255,90,90,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 30 + Math.sin(hodiny*20)*4, 0, 7); ctx.stroke();
  } else if (p.stav === 'zdrha'){
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++){
      ctx.beginPath(); ctx.moveTo(p.x + 26 + i*8, p.y - 10 + i*10);
      ctx.lineTo(p.x + 44 + i*8, p.y - 10 + i*10); ctx.stroke();
    }
  }
}

function kresliPortal(p){
  const gravP = !p.druh || p.druh === 'gravitace';
  const dolu = !p.doObracene;                 // kam bude gravitace tahat po průletu
  const A = p.druh === 'zmenseni' ? '#3fd07a' : p.druh === 'rychlost' ? '#ff8f1c'
          : p.druh === 'dvojce' ? '#ff5d95' : p.doObracene ? '#a86bff' : '#3fb8ff';
  const B = p.druh === 'zmenseni' ? '#b6f5cd' : p.druh === 'rychlost' ? '#ffd7a0'
          : p.druh === 'dvojce' ? '#ffc2d8' : p.doObracene ? '#e0b3ff' : '#b3ecff';
  const zar = p.druh === 'zmenseni' ? 'rgba(63,208,122,.4)' : p.druh === 'rychlost' ? 'rgba(255,143,28,.4)'
          : p.druh === 'dvojce' ? 'rgba(255,93,149,.4)' : p.doObracene ? 'rgba(168,107,255,.4)' : 'rgba(63,184,255,.4)';
  const f = hodiny * 4 + p.faze;

  // světelný sloup
  const g = ctx.createLinearGradient(p.x - 26, 0, p.x + 26, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(.5, zar);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(p.x - 30, STROP, 60, ZEM - STROP);

  // sloupky nahoře a dole
  for (const y of [STROP + 16, ZEM - 16]){
    ctx.fillStyle = A;
    ctx.beginPath(); ctx.roundRect(p.x - 20, y - 14, 40, 28, 8); ctx.fill();
    ctx.fillStyle = B;
    ctx.beginPath(); ctx.roundRect(p.x - 13, y - 8, 26, 16, 5); ctx.fill();
  }

  // kroužky, které putují nahoru nebo dolů
  ctx.lineWidth = 4;
  for (let i = 0; i < 6; i++){
    let t = (i / 6 + (f * .12) % 1) % 1;
    if (dolu) t = 1 - t;
    const y = STROP + 30 + t * (ZEM - STROP - 60);
    const w = 16 + Math.sin(t * Math.PI) * 12;
    ctx.strokeStyle = A;
    ctx.globalAlpha = .35 + Math.sin(t * Math.PI) * .55;
    ctx.beginPath(); ctx.ellipse(p.x, y, w, 7, 0, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // značky uprostřed podle druhu portálu
  ctx.fillStyle = B;
  if (gravP){
    for (let i = 0; i < 3; i++){
      const y = 130 + i * 130 + Math.sin(f + i) * 6;
      ctx.beginPath();
      if (dolu){ ctx.moveTo(p.x, y + 16); ctx.lineTo(p.x - 13, y - 6); ctx.lineTo(p.x + 13, y - 6); }
      else     { ctx.moveTo(p.x, y - 16); ctx.lineTo(p.x - 13, y + 6); ctx.lineTo(p.x + 13, y + 6); }
      ctx.closePath(); ctx.fill();
    }
  } else if (p.druh === 'zmenseni'){
    ctx.strokeStyle = B; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++){
      const y = 130 + i * 130;
      for (let q = 0; q < 3; q++){
        const r2 = 26 - ((f * 14 + q * 9) % 26);
        ctx.globalAlpha = r2 / 26;
        ctx.beginPath(); ctx.arc(p.x, y, r2 + 3, 0, 7); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  } else if (p.druh === 'dvojce'){
    for (let i = 0; i < 3; i++){
      const y = 130 + i * 130;
      for (const d of [-13, 13]){
        ctx.beginPath(); ctx.arc(p.x, y + d + Math.sin(f + i) * 3, 8, 0, 7); ctx.fill();
      }
    }
  } else {
    for (let i = 0; i < 3; i++){
      const y = 130 + i * 130;
      for (let q = 0; q < 2; q++){
        const x0 = p.x - 16 + q * 15 + Math.sin(f * 1.5 + q) * 3;
        ctx.beginPath();
        ctx.moveTo(x0, y - 14); ctx.lineTo(x0 + 12, y); ctx.lineTo(x0, y + 14);
        ctx.lineTo(x0 + 5, y); ctx.closePath(); ctx.fill();
      }
    }
  }
  napis(p.druh === 'zmenseni' ? 'ZMENŠENÍ' : p.druh === 'rychlost' ? 'ZRYCHLENÍ'
        : p.druh === 'dvojce' ? 'DVĚ SLEPICE'
        : p.doObracene ? 'VZHŮRU NOHAMA' : 'ZPÁTKY DOLŮ',
        p.x, 66, B, 'bold 16px system-ui', 5);
}

  ctx.restore();
  if (mav > .92) napis('AHOJ!', p.x + 62, vrsek - 26, '#ffffff', 'bold 18px system-ui', 5);

function kresliSteblo(p){
  const oh = Math.sin(hodiny * 1.6 + p.faze) * .07;
  ctx.save(); ctx.translate(p.x, ZEM + 4); ctx.rotate(oh);
  ctx.strokeStyle = '#3f8a3a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -p.v); ctx.stroke();
  ctx.fillStyle = '#4caf50';
  for (let i = 0; i < 3; i++){
    const y = -18 - i * (p.v / 4);
    const s = i % 2 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.quadraticCurveTo(s * 26, y - 14, s * 40, y + 4);
    ctx.quadraticCurveTo(s * 24, y - 2, 0, y + 6);
    ctx.closePath(); ctx.fill();
  }
  // klas nahoře
  const g = ctx.createLinearGradient(-6, 0, 6, 0);
  g.addColorStop(0, '#e8a531'); g.addColorStop(.4, '#ffd85e'); g.addColorStop(1, '#d98f22');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(6, -p.v + 12, 7, 15, .25, 0, 7); ctx.fill();
  ctx.fillStyle = '#7cc35f';
  ctx.beginPath(); ctx.ellipse(0, -p.v - 4, 4, 14, .1, 0, 7); ctx.fill();
  ctx.lineCap = 'butt';
  ctx.restore();
}

function kresliZrno(p){
  const y = p.y + Math.sin(p.faze) * 5;
  ctx.save(); ctx.translate(p.x, y); ctx.rotate(-.35);
  // listy
  ctx.fillStyle = '#4caf50';
  ctx.beginPath(); ctx.ellipse(-9, 12, 6, 15, .5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, 12, 6, 15, -.5, 0, 7); ctx.fill();
  // klas
  const g = ctx.createLinearGradient(-10, 0, 10, 0);
  g.addColorStop(0, '#e8a531'); g.addColorStop(.4, '#ffd85e'); g.addColorStop(1, '#d98f22');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, -2, 11, 19, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b8781c'; ctx.lineWidth = 1.6; ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (let r = -3; r <= 3; r++)

      ctx.beginPath(); ctx.arc(px, py, 1.9, 0, 7); ctx.fill();

}

function kresliPirko(p){
  const y = p.y + Math.sin(p.faze) * 7;
  if (p.druh && p.druh !== 'pirko'){
    const barva = p.druh === 'stit' ? ['#74d4ff','#d6f2ff'] : p.druh === 'magnet' ? ['#ff5d5d','#ffd7d7']
                : ['#4fd8e8','#d3fbff'];
    const zg = ctx.createRadialGradient(p.x, y, 3, p.x, y, 40);
    zg.addColorStop(0, 'rgba(255,255,255,.7)');
    zg.addColorStop(.5, p.druh === 'stit' ? 'rgba(116,212,255,.35)'
                    : p.druh === 'magnet' ? 'rgba(255,93,93,.35)' : 'rgba(79,216,232,.35)');
    zg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(p.x, y, 40, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(p.x, y);
    if (p.druh === 'stit'){                       // bublina se štítem
      ctx.strokeStyle = barva[0]; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(214,242,255,.45)';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
      ctx.fillStyle = barva[1];
      ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, -6); ctx.lineTo(9, 4);
      ctx.quadraticCurveTo(0, 13, -9, 4); ctx.lineTo(-9, -6); ctx.closePath(); ctx.fill();
    } else if (p.druh === 'magnet'){              // magnet
      ctx.rotate(Math.sin(p.faze * .6) * .25);
      ctx.strokeStyle = barva[0]; ctx.lineWidth = 8; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(0, 2, 12, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-12, 2); ctx.lineTo(-12, 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, 2); ctx.lineTo(12, 12); ctx.stroke();
      ctx.strokeStyle = '#f2f6ff'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-12, 12); ctx.lineTo(-12, 18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, 12); ctx.lineTo(12, 18); ctx.stroke();
    } else {                                      // přesýpací hodiny
      ctx.fillStyle = barva[1];
      ctx.fillRect(-12, -16, 24, 4); ctx.fillRect(-12, 12, 24, 4);
      ctx.fillStyle = barva[0];
      ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(10, -12); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-10, 12); ctx.lineTo(10, 12); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 4 + Math.sin(p.faze) * 2, 2.4, 0, 7); ctx.fill();
    }
    ctx.restore();
    for (let i = 0; i < 3; i++){
      const a = p.faze * 1.5 + i * 2.1, r2 = 28 + Math.sin(p.faze * 2 + i) * 5;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a)*r2, y + Math.sin(a)*r2, 2.3, 0, 7); ctx.fill();
    }
    return;
  }
  // záře
  const g = ctx.createRadialGradient(p.x, y, 4, p.x, y, 40);
  g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(.5, 'rgba(255,214,120,.35)');
  g.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, y, 40, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(p.x, y); ctx.rotate(Math.sin(p.faze*.6) * .35 - .5);
  // prapor pírka — duhový
  const d = ctx.createLinearGradient(0, -22, 0, 22);
  d.addColorStop(0, '#ff8fb1'); d.addColorStop(.3, '#ffd166');
  d.addColorStop(.6, '#8ce99a'); d.addColorStop(1, '#74c0fc');
  ctx.fillStyle = d;
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.bezierCurveTo(13, -12, 13, 12, 0, 24);
  ctx.bezierCurveTo(-13, 12, -13, -12, 0, -24);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.6; ctx.stroke();
  // osa a chmýří
  ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, 30); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
  for (let i = -18; i < 20; i += 6){
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(-8, i - 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(8, i - 5); ctx.stroke();
  }
  ctx.restore();

  // jiskřičky
  for (let i = 0; i < 3; i++){
    const a = p.faze * 1.6 + i * 2.1, r = 30 + Math.sin(p.faze*2 + i) * 6;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(p.x + Math.cos(a)*r, y + Math.sin(a)*r, 2.4, 0, 7); ctx.fill();
  }
}

function kresliVejce(p){
  if (p.ohnive){
    const z = ctx.createRadialGradient(p.x, p.y, 3, p.x, p.y, 34);
    z.addColorStop(0, 'rgba(255,190,90,.8)'); z.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = z; ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, 7); ctx.fill();
    if (Math.random() < .5)
      castice.push({x: p.x, y: p.y, vx: nah(-40, 60), vy: nah(-50, 10), zivot: nah(.2, .5), max: .5,
                    barva: nahZ(['#ff7a2f','#ffd166']), vel: nah(3, 6)});
  }
  if (p.zlate){
    const z = ctx.createRadialGradient(p.x, p.y, 3, p.x, p.y, 42);
    z.addColorStop(0, 'rgba(255,240,180,.75)'); z.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = z; ctx.beginPath(); ctx.arc(p.x, p.y, 42, 0, 7); ctx.fill();
    for (let i = 0; i < 3; i++){
      const a = p.uhel*1.4 + i*2.1, rr = 26 + Math.sin(p.uhel*3 + i)*5;
      ctx.fillStyle = 'rgba(255,255,220,.95)';
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a)*rr, p.y + Math.sin(a)*rr, 2.6, 0, 7); ctx.fill();
    }
  }
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.uhel);
  const g = ctx.createLinearGradient(-10, -14, 10, 14);
  if (p.zlate){ g.addColorStop(0, '#fff6d0'); g.addColorStop(.5, '#ffd166'); g.addColorStop(1, '#d99a1c'); }
  else if (p.ohnive){ g.addColorStop(0, '#fff0c0'); g.addColorStop(.5, '#ff8c3a'); g.addColorStop(1, '#b52210'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#fdf0d5'); g.addColorStop(1, '#e8d2a8'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, p.zlate ? 13 : 11, p.zlate ? 16 : 14, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = p.zlate ? '#a87613' : p.ohnive ? '#7a1408' : '#c8ab7d'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = p.zlate ? 'rgba(255,255,255,.35)' : 'rgba(180,150,110,.5)';
  ctx.beginPath(); ctx.arc(3, 4, 2, 0, 7); ctx.arc(-4, 1, 1.5, 0, 7); ctx.arc(1, -6, 1.6, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.ellipse(-4, -6, 3, 4.5, -.4, 0, 7); ctx.fill();
  ctx.restore();
}

// --- pomůcky, aby bossové kreslili stejným štětcem jako slepice ---
function obtah(barva, sirka = 2.4){ ctx.strokeStyle = barva; ctx.lineWidth = sirka; ctx.stroke(); }
function oko(x, y, rr, obrysB = '#2a1f16', pohled = 0, zorn = '#241c14'){
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.fill();
  obtah(obrysB, Math.max(1.4, rr * .3));
  ctx.fillStyle = zorn;
  ctx.beginPath(); ctx.arc(x + pohled, y, rr * .5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x + pohled - rr * .22, y - rr * .26, rr * .21, 0, 7); ctx.fill();
}
function koncetina(x1, y1, cx, cy, x2, y2, w, barva, obrysB){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.strokeStyle = obrysB; ctx.lineWidth = w + 3.4; ctx.stroke();
  ctx.strokeStyle = barva;  ctx.lineWidth = w;       ctx.stroke();
}

// ---------- VLK S BUBNEM ----------
function kresliVlk(bs){
  if (bs.blik > 0 && Math.floor(bs.blik * 16) % 2 === 0) return;
  const O = '#2b3244';
  stinPod(bs.x - 6, ZEM + 4, 66, .26);
  const posk = Math.abs(Math.sin(bs.krok)) * 5;
  ctx.save();
  ctx.translate(bs.x, bs.y - posk);
  ctx.scale(1.3, 1.3);
  ctx.lineJoin = 'round';

  // --- ocas ---
  koncetina(30, -4, 74 + Math.sin(bs.faze*2)*10, -14, 60, -44, 15, '#7d8a99', O);
  ctx.fillStyle = '#f3ece0';
  ctx.beginPath(); ctx.arc(60, -44, 10, 0, 7); ctx.fill(); obtah(O, 2.2);

  // --- nohy (dobře vidět pod tělem) ---
  for (const [i, o] of [[0, -6], [1, 20]]){
    const f = Math.sin(bs.krok + i * 3.14) * 7;
    koncetina(o, 16, o + f*.5, 30, o + f, 44, 12, '#5c6b7d', O);
    ctx.fillStyle = '#4a5768';
    ctx.beginPath(); ctx.ellipse(o + f - 3, 46, 13, 6.5, 0, 0, 7); ctx.fill(); obtah(O, 2.2);
  }

  // --- tělo ---
  const gt = ctx.createLinearGradient(0, -38, 0, 26);
  gt.addColorStop(0, '#a3b4c6'); gt.addColorStop(.55, '#7d8a99'); gt.addColorStop(1, '#546172');
  ctx.fillStyle = gt;
  ctx.beginPath(); ctx.ellipse(8, -6, 36, 29, .06, 0, 7); ctx.fill(); obtah(O, 3);
  ctx.fillStyle = '#f3ece0';
  ctx.beginPath(); ctx.ellipse(-4, 4, 18, 19, -.15, 0, 7); ctx.fill();
  ctx.globalAlpha = .45; obtah(O, 1.8); ctx.globalAlpha = 1;

  // --- BUBEN před ním ---
  ctx.save();
  ctx.translate(-46, 8);
  const zv = 1 + bs.buch * .12;
  ctx.scale(zv, zv);
  const gb = ctx.createLinearGradient(-33, 0, 33, 0);
  gb.addColorStop(0, '#7a3226'); gb.addColorStop(.4, '#c05a41');
  gb.addColorStop(.68, '#9c4130'); gb.addColorStop(1, '#68281e');
  ctx.fillStyle = gb;
  ctx.beginPath(); ctx.roundRect(-33, -22, 66, 46, 8); ctx.fill(); obtah(O, 3);
  ctx.fillStyle = '#f0e2c2';
  ctx.beginPath(); ctx.ellipse(0, -22, 33, 12, 0, 0, 7); ctx.fill(); obtah(O, 2.6);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-12, -25, 11, 3.8, -.2, 0, 7); ctx.fill();
  for (const yy of [-6, 12]){
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.roundRect(-34, yy - 3.5, 68, 7, 3.5); ctx.fill(); obtah('#a87613', 1.8);
  }
  ctx.fillStyle = '#ffd166';                       // vlnovka na bubnu
  ctx.beginPath(); ctx.arc(0, 3, 9, 0, 7); ctx.fill(); obtah('#a87613', 1.8);
  if (bs.buch > 0){
    ctx.lineCap = 'round';
    for (const [j, rr] of [36, 54, 72].entries()){
      ctx.strokeStyle = 'rgba(201,160,255,' + (bs.buch * (1 - j*.22)) + ')';
      ctx.lineWidth = 5 - j;
      ctx.beginPath(); ctx.arc(0, -22, rr * (1.1 - bs.buch * .3), -2.5, -.7); ctx.stroke();
    }
  }
  ctx.restore();

  // --- HLAVA ---
  ctx.save();
  ctx.translate(-18, -58);
  ctx.rotate(-bs.buch * .14);
  for (const sg of [-1, 1]){                       // uši
    ctx.fillStyle = '#7d8a99';
    ctx.beginPath();
    ctx.moveTo(sg*5, -14); ctx.lineTo(sg*16, -48); ctx.lineTo(sg*27, -10);
    ctx.closePath(); ctx.fill(); obtah(O, 2.6);
    ctx.fillStyle = '#e79aa8';
    ctx.beginPath();
    ctx.moveTo(sg*11, -16); ctx.lineTo(sg*17, -38); ctx.lineTo(sg*22, -14);
    ctx.closePath(); ctx.fill();
  }
  const gh = ctx.createLinearGradient(0, -24, 0, 24);
  gh.addColorStop(0, '#adbdcd'); gh.addColorStop(.6, '#8b98a8'); gh.addColorStop(1, '#66738a');
  ctx.fillStyle = gh;
  ctx.beginPath(); ctx.ellipse(0, 0, 28, 25, 0, 0, 7); ctx.fill(); obtah(O, 3);
  ctx.fillStyle = '#f3ece0';                       // čenich
  ctx.beginPath(); ctx.ellipse(-21, 8, 17, 12, -.12, 0, 7); ctx.fill(); obtah(O, 2.4);
  ctx.fillStyle = '#2b3244';
  ctx.beginPath(); ctx.ellipse(-34, 4, 6.5, 5, -.3, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(-36, 2.5, 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff';                       // zub
  ctx.beginPath(); ctx.moveTo(-25, 14); ctx.lineTo(-21, 23); ctx.lineTo(-17, 14);
  ctx.closePath(); ctx.fill(); obtah(O, 1.6);
  oko(-8, -5, 6.8, O, -1.5, '#3d2a12');
  oko(12, -7, 5.8, O, -1.3, '#3d2a12');
  ctx.strokeStyle = O; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-17, -16); ctx.lineTo(-3, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -18); ctx.lineTo(7, -13); ctx.stroke();
  ctx.restore();

  // --- paže s paličkami (kreslí se nad hlavou i bubnem, ať jsou vidět) ---
  for (const sg of [-1, 1]){
    const hx = -58 + (sg > 0 ? 18 : 0);
    const hy = -32 - bs.buch * 24 + (sg > 0 ? 4 : 0);
    koncetina(0, -18, -26, -20, hx, hy, 11, '#8b98a8', O);
    ctx.fillStyle = '#9fadbd';
    ctx.beginPath(); ctx.arc(hx, hy, 8.5, 0, 7); ctx.fill(); obtah(O, 2.2);
    // palička dopadá na blánu bubnu
    const tx = hx + 16, ty = hy + 22 + bs.buch * 6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty);
    ctx.strokeStyle = O; ctx.lineWidth = 9.5; ctx.stroke();
    ctx.strokeStyle = '#e8d5a8'; ctx.lineWidth = 5.5; ctx.stroke();
    ctx.fillStyle = '#f7ecd2';
    ctx.beginPath(); ctx.arc(tx, ty, 7, 0, 7); ctx.fill(); obtah(O, 2.2);
  }

  ctx.restore();

// ---------- PAVOUČÍ KRÁLOVNA ----------
function kresliPavouk(b){
  if (b.blik > 0 && Math.floor(b.blik * 16) % 2 === 0) return;
  const O = '#25102f';

    ctx.lineWidth = turbo > 0 ? 4.5 : 2.6;
    ctx.beginPath();
    ctx.moveTo(vx, b.y + 22);
    for (let yy = b.y + 22; yy < 352; yy += 22)

    ctx.stroke();
    ctx.fillStyle = turbo > 0 ? '#a0ffc9' : '#e6f5ff';       // korálek, ať vlákno nekončí v prázdnu
    ctx.beginPath(); ctx.arc(vx, 352, turbo > 0 ? 6.5 : 4.5, 0, 7); ctx.fill();

  // --- osm nohou ---
  for (let i = 0; i < 4; i++){

      const kx = sg * (46 + i * 12), ky = -54 - i * 5 + sw * 46;
      const ex = sg * (80 + i * 16), ey = 8 + i * 19 + sw * 34;
      koncetina(sg * 12, -6, kx, ky, kx + sg * 8, (ky + ey) / 2, 8 - i * .8, '#6a3a94', O);
      koncetina(kx + sg * 8, (ky + ey) / 2, sg * (62 + i * 12), ey - 12, ex, ey, 6 - i * .7, '#59307f', O);
      ctx.fillStyle = '#3d1d5c';
      ctx.beginPath(); ctx.arc(ex, ey, 4.4, 0, 7); ctx.fill(); obtah(O, 1.6);
    }
  }

  // --- zadeček ---
  const gz = ctx.createRadialGradient(-8, -6, 8, 0, 8, 46);
  gz.addColorStop(0, '#9b62d6'); gz.addColorStop(.55, '#6a34a0'); gz.addColorStop(1, '#3a1359');
  ctx.fillStyle = gz;
  ctx.beginPath(); ctx.ellipse(0, 8, 40, 34, 0, 0, 7); ctx.fill(); obtah(O, 3.2);
  // lesk
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(-14, -6, 12, 7, -.5, 0, 7); ctx.fill();
  // znak přesýpacích hodin
  ctx.fillStyle = '#ff5d73';
  ctx.beginPath();
  ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.lineTo(0, 13);
  ctx.lineTo(11, 28); ctx.lineTo(-11, 28); ctx.lineTo(0, 13); ctx.closePath(); ctx.fill();
  obtah('#8c2436', 2);

  // --- hlava ---
  const gh = ctx.createLinearGradient(0, -42, 0, -12);
  gh.addColorStop(0, '#7f4bb0'); gh.addColorStop(1, '#4a2470');
  ctx.fillStyle = gh;
  ctx.beginPath(); ctx.ellipse(0, -26, 25, 19, 0, 0, 7); ctx.fill(); obtah(O, 3);

  // --- korunka ---
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(-19, -40); ctx.lineTo(-13, -57); ctx.lineTo(-5, -43);
  ctx.lineTo(3, -60); ctx.lineTo(11, -43); ctx.lineTo(18, -56); ctx.lineTo(21, -38);
  ctx.closePath(); ctx.fill(); obtah('#a87613', 2.4);
  ctx.fillStyle = '#ff5d73';
  ctx.beginPath(); ctx.arc(3, -46, 4, 0, 7); ctx.fill(); obtah('#8c2436', 1.6);

  // --- osm očí ---
  oko(-12, -30, 6.2, O, -1.2, '#2b0f3a');
  oko(13, -30, 6.2, O, -1.2, '#2b0f3a');
  ctx.fillStyle = '#ffe066';
  for (const [ox, oy, rr] of [[-4,-35,3.2],[5,-35,3.2],[-8,-20,2.8],[-1,-18,2.4],[6,-19,2.6]]){
    ctx.beginPath(); ctx.arc(ox, oy, rr, 0, 7); ctx.fill(); obtah(O, 1.4);
    ctx.fillStyle = '#2b0f3a';
    ctx.beginPath(); ctx.arc(ox, oy, rr * .45, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe066';

  // kusadla
  for (const sg of [-1, 1]){

  srdcaBosse(b, 88);
}

// ---------- KOHOUT-DRAK (obří brácha slepice) ----------
function kresliKohout(b){
  if (b.blik > 0 && Math.floor(b.blik * 16) % 2 === 0) return;
  const O = '#6b4b2a';                                    // stejný teplý obrys jako u slepice
  stinPod(b.x, ZEM + 4, 66, .26);

  ctx.rotate(Math.sin(b.faze) * .03);
  ctx.lineJoin = 'round';

  // --- ocasní pera (jako u slepice, ale velká a dračí) ---
  for (const [i, c] of ['#2f8a52','#3f9a5c','#57b86f','#8bd48f'].entries()){
    ctx.save(); ctx.rotate(-.42 - i * .2 + Math.sin(b.faze + i) * .04);
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(52 + i * 7, -8, 48 - i * 4, 12, 0, 0, 7); ctx.fill();
    obtah('#1f6b3c', 2.6);
    ctx.restore();
  }

  // --- nohy ---
  for (const o of [-16, 16]){
    koncetina(o, 40, o, 68, o, 94, 10, '#f0a028', O);
    for (const t of [-14, 0, 13]){
      ctx.beginPath(); ctx.moveTo(o, 94); ctx.lineTo(o + t, 100);
      ctx.strokeStyle = O; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = '#f0a028'; ctx.lineWidth = 4.4; ctx.stroke();
    }
  }

  // --- tělo ---
  const gt = ctx.createLinearGradient(0, -48, 0, 48);
  gt.addColorStop(0, '#fdfdfd'); gt.addColorStop(.55, '#e4e4e4'); gt.addColorStop(1, '#b0aaa0');
  ctx.fillStyle = gt;
  ctx.beginPath(); ctx.ellipse(0, 4, 52, 49, 0, 0, 7); ctx.fill(); obtah(O, 3.4);
  // šupiny na hrudi
  ctx.strokeStyle = 'rgba(107,75,42,.35)'; ctx.lineWidth = 2;
  for (let ry = -16; ry < 40; ry += 13)
    for (let rx = -34; rx < 22; rx += 17){
      ctx.beginPath(); ctx.arc(rx + (ry % 26 ? 8 : 0), ry, 7, 3.6, 5.9); ctx.stroke();
    }

  // --- dračí křídlo ---
  ctx.fillStyle = '#3f9a5c';
  ctx.beginPath();
  ctx.moveTo(10, -20);
  ctx.quadraticCurveTo(58, -22, 62, -2);          // horní hrana křídla
  ctx.quadraticCurveTo(56, 4, 52, 0);             // zubatá zadní hrana
  ctx.quadraticCurveTo(52, 12, 46, 10);
  ctx.quadraticCurveTo(44, 22, 38, 20);
  ctx.quadraticCurveTo(34, 30, 26, 26);
  ctx.quadraticCurveTo(14, 8, 10, -20);
  ctx.fill(); obtah('#1f6b3c', 3);
  ctx.strokeStyle = 'rgba(31,107,60,.75)'; ctx.lineWidth = 2.4;
  for (const [ax, ay] of [[52,-1],[46,10],[38,19],[27,25]]){
    ctx.beginPath(); ctx.moveTo(14, -16); ctx.lineTo(ax, ay); ctx.stroke();
  }
  // dračí hřebeny na hřbetě
  ctx.fillStyle = '#2f8a52';
  for (const [hx2, hy2, hs] of [[-2,-46,10],[-16,-40,8],[-28,-30,6]]){
    ctx.beginPath();
    ctx.moveTo(hx2 - hs, hy2 + hs); ctx.lineTo(hx2, hy2 - hs); ctx.lineTo(hx2 + hs, hy2 + hs);
    ctx.closePath(); ctx.fill(); obtah('#1f6b3c', 2);
  }

  // --- hlava ---
  ctx.save();
  ctx.translate(-30, -56);
  ctx.rotate(b.chrl * .26);
  // hřebínek
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(14, -18);
  ctx.quadraticCurveTo(8, -40, 0, -22);
  ctx.quadraticCurveTo(-8, -46, -14, -24);
  ctx.quadraticCurveTo(-22, -42, -26, -18);
  ctx.closePath(); ctx.fill(); obtah('#a8232e', 2.6);
  // dračí rohy — velké a tmavé, aby je bylo proti bílé hlavě i nebi vidět
  for (const [hx, sc] of [[6, 1], [20, .8]]){
    const g = ctx.createLinearGradient(hx, -10, hx + 30*sc, -66*sc);
    g.addColorStop(0, '#8a6f45'); g.addColorStop(.6, '#c9ad78'); g.addColorStop(1, '#efe0bc');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(hx - 8, -14);
    ctx.quadraticCurveTo(hx + 40*sc, -30*sc, hx + 32*sc, -68*sc);
    ctx.quadraticCurveTo(hx + 16*sc, -40*sc, hx + 10, -6);
    ctx.closePath(); ctx.fill(); obtah('#5c4526', 3);
    ctx.strokeStyle = 'rgba(92,69,38,.6)'; ctx.lineWidth = 2;
    for (const t of [.3, .5, .7]){
      const px1 = hx - 8 + (hx + 32*sc - hx + 8) * t, py1 = -14 + (-68*sc + 14) * t;
      const px2 = hx + 10 + (hx + 16*sc - hx - 10) * t, py2 = -6 + (-40*sc + 6) * t;
      ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
    }
  }
  // lebka
  const gh = ctx.createLinearGradient(0, -26, 0, 24);
  gh.addColorStop(0, '#ffffff'); gh.addColorStop(1, '#ddd7cd');
  ctx.fillStyle = gh;
  ctx.beginPath(); ctx.ellipse(0, 0, 28, 25, 0, 0, 7); ctx.fill(); obtah(O, 3.2);
  // zobák
  ctx.fillStyle = '#ffa726';
  ctx.beginPath(); ctx.moveTo(-22, -8); ctx.lineTo(-58, 2 + b.chrl * 5); ctx.lineTo(-22, 8);
  ctx.closePath(); ctx.fill(); obtah(O, 2.6);
  ctx.fillStyle = '#e08a12';
  ctx.beginPath(); ctx.moveTo(-22, 8); ctx.lineTo(-54, 12 + b.chrl * 12); ctx.lineTo(-22, 20);
  ctx.closePath(); ctx.fill(); obtah(O, 2.6);
  // lalok
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.ellipse(-14, 24, 9, 13, 0, 0, 7); ctx.fill(); obtah('#a8232e', 2.2);
  // oko
  oko(-6, -6, 8, O, -1.8, b.stav === 'zasazena' ? '#c9302c' : '#241c14');
  // zamračené obočí, ať je vidět, že je to boss
  ctx.strokeStyle = O; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -18); ctx.lineTo(2, -13); ctx.stroke();
  // oheň v zobáku
  if (b.chrl > .15){
    const zg = ctx.createRadialGradient(-58, 8, 2, -58, 8, 30 * b.chrl);
    zg.addColorStop(0, 'rgba(255,246,208,' + b.chrl + ')');
    zg.addColorStop(.45, 'rgba(255,140,58,' + (b.chrl * .85) + ')');
    zg.addColorStop(1, 'rgba(230,57,70,0)');
    ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(-58, 8, 30 * b.chrl, 0, 7); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  srdcaBosse(b, 152);
}

function kresliSit(p){

function kresliBoss(b){
  if (b.typ === 'vlk')    return kresliVlk(b);
  if (b.typ === 'pavouk') return kresliPavouk(b);
  if (b.typ === 'kohout') return kresliKohout(b);

  // kouř, když je liška domlácená
  if (b.zivoty <= 1 && Math.random() < .35)
    castice.push({x: b.x + 40, y: b.y + nah(-6, 10), vx: nah(-160,-60), vy: nah(-70,-20),
                  zivot: nah(.4,.9), max: .9, barva: nahZ(['#8d99ae','#6c757d','#adb5bd']), vel: nah(5,10)});

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(Math.sin(b.faze) * .06 + (b.stav === 'odlet' ? -.35 : 0));

  // ocasní plochy
  ctx.fillStyle = '#c33d3d';
  ctx.beginPath(); ctx.moveTo(52, -4); ctx.lineTo(86, -44); ctx.lineTo(90, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8e2d0';
  ctx.beginPath(); ctx.roundRect(60, -2, 40, 9, 4); ctx.fill();

  // trup
  const g = ctx.createLinearGradient(0, -30, 0, 32);

  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 76, 30, 0, 0, 7); ctx.fill();

  // pruh
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.roundRect(-40, 6, 74, 8, 4); ctx.fill();

  // spodní křídlo
  ctx.fillStyle = '#f0a049';
  ctx.beginPath(); ctx.roundRect(-52, 16, 104, 15, 7); ctx.fill();
  ctx.strokeStyle = '#a86a24'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.roundRect(-46, 19, 40, 4, 2); ctx.fill();

  // kokpit
  ctx.fillStyle = 'rgba(205,240,255,.8)';
  ctx.beginPath(); ctx.ellipse(-8, -24, 33, 22, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#7d1f27'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.beginPath(); ctx.ellipse(-22, -30, 8, 5, -.5, 0, 7); ctx.fill();

  // motor a vrtule
  ctx.fillStyle = '#5a4033';
  ctx.beginPath(); ctx.roundRect(-88, -12, 16, 24, 5); ctx.fill();
  ctx.fillStyle = 'rgba(120,90,70,.25)';
  ctx.beginPath(); ctx.ellipse(-92, 0, 7, 34, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(-92, 0); ctx.rotate(b.vrtule);
  ctx.fillStyle = 'rgba(70,50,40,.85)';
  ctx.beginPath(); ctx.roundRect(-3.5, -34, 7, 68, 3); ctx.fill();
  ctx.restore();
  // --- kukuřičný kanón pod trupem ---
  const zp = b.zpetny || 0;
  ctx.save();
  ctx.translate(6 + zp * 9, 22);
  ctx.fillStyle = '#6b7480';
  ctx.beginPath(); ctx.roundRect(-84, -9, 96, 18, 8); ctx.fill();
  ctx.strokeStyle = '#3f4753'; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.fillStyle = '#8b98a8';
  ctx.beginPath(); ctx.roundRect(-80, -6, 60, 5, 2.5); ctx.fill();
  // zlaté ústí ve tvaru kukuřičného klasu
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.ellipse(-84, 0, 10, 12, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a87613'; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.fillStyle = '#e8a33c';
  for (const yy of [-6, 0, 6]){ ctx.beginPath(); ctx.arc(-86, yy, 2.2, 0, 7); ctx.fill(); }
  // zásobník kukuřice nahoře
  ctx.fillStyle = '#3f9a5c';
  ctx.beginPath(); ctx.roundRect(-24, -20, 26, 14, 5); ctx.fill();
  ctx.strokeStyle = '#1f6b3c'; ctx.lineWidth = 2; ctx.stroke();
  // záblesk při výstřelu
  if (zp > .1){
    const fg = ctx.createRadialGradient(-92, 0, 2, -92, 0, 34 * zp);
    fg.addColorStop(0, 'rgba(255,246,208,' + zp + ')');
    fg.addColorStop(.5, 'rgba(255,180,60,' + (zp * .7) + ')');
    fg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(-92, 0, 34 * zp, 0, 7); ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(-92, 0, 6, 0, 7); ctx.fill();
  ctx.restore();

  // --- zaměřovací čára: máš chvilku uhnout ---
  if (b.nabiti > 0 && b.stav === 'utoci'){
    const a = Math.floor(b.nabiti * (b.zivoty === 1 ? 44 : 22)) % 2 ? .9 : .3;
    ctx.strokeStyle = 'rgba(255,90,90,' + a + ')';
    ctx.lineWidth = 2.5; ctx.setLineDash([14, 10]);
    ctx.lineDashOffset = -hodiny * 120;
    ctx.beginPath(); ctx.moveTo(b.x - 90, b.miri); ctx.lineTo(0, b.miri); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.fillStyle = 'rgba(255,90,90,' + a + ')';
    ctx.beginPath(); ctx.arc(b.x - 96, b.miri, 5, 0, 7); ctx.fill();
  }

  // --- pilotka liška ---
  const hx = b.x - 12, hy = b.y - 40;
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(Math.sin(b.faze) * .05);
  // šála
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(6, 16);
  ctx.quadraticCurveTo(40, 10 + Math.sin(b.faze*3)*8, 74, 22 + Math.sin(b.faze*3+1)*10);
  ctx.quadraticCurveTo(42, 26 + Math.sin(b.faze*3)*8, 6, 26);
  ctx.closePath(); ctx.fill();
  // rohy v pekelné podobě
  if (b.demon){
    ctx.fillStyle = '#2b1116';
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s*14, -18);
      ctx.quadraticCurveTo(s*34, -34, s*26, -54);
      ctx.quadraticCurveTo(s*22, -36, s*8, -20);
      ctx.closePath(); ctx.fill();
    }
  }
  // uši
  for (const s of [-1, 1]){
    ctx.fillStyle = b.demon ? '#b8452a' : '#e07a3c';
    ctx.beginPath(); ctx.moveTo(s*7, -14); ctx.lineTo(s*20, -36); ctx.lineTo(s*22, -10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f9c5b0';
    ctx.beginPath(); ctx.moveTo(s*10, -15); ctx.lineTo(s*18, -29); ctx.lineTo(s*19, -13);
    ctx.closePath(); ctx.fill();
  }
  // hlava
  ctx.fillStyle = b.demon ? '#c9502c' : '#f0913f';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b4642a'; ctx.lineWidth = 2; ctx.stroke();
  // čumák
  ctx.fillStyle = '#fff6ea';
  ctx.beginPath(); ctx.ellipse(-14, 8, 15, 10, -.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a2a20';
  ctx.beginPath(); ctx.ellipse(-27, 5, 5, 4, -.2, 0, 7); ctx.fill();
  // pilotní brýle
  ctx.strokeStyle = '#5a4033'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(20, -6); ctx.stroke();
  for (const dx of [-11, 8]){
    ctx.fillStyle = '#3a2a20';
    ctx.beginPath(); ctx.arc(dx, -6, 10, 0, 7); ctx.fill();
    ctx.fillStyle = b.stav === 'zasazena' ? '#ffb3b3' : b.demon ? '#ff5d3a' : '#9ad9ff';
    ctx.beginPath(); ctx.arc(dx, -6, 7, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(dx - 2.5, -8.5, 2.4, 0, 7); ctx.fill();
  }
  // pusa
  ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (b.stav === 'zasazena'){ ctx.arc(-14, 14, 5, Math.PI, 0); }
  else { ctx.moveTo(-22, 12); ctx.quadraticCurveTo(-14, 18, -6, 11); }
  ctx.stroke();
  ctx.restore();

  // srdíčka nad bossem
  for (let i = 0; i < b.zivoty; i++)
    srdce(b.x - (b.zivoty - 1) * 15 + i * 30, b.y - 92, 11, '#ff5d73');
}

// ============ SLEPICE ============
function kresliSlepici(velikost = 1, kdeX = null, kdeY = null, kopie = false){
  const x = kdeX === null ? hrac.x : kdeX;
  const y = kdeY === null ? hrac.y : kdeY;

  if (kdeX === null){
    const d = omez(1 - (ZEM - y) / 500, .05, .3);
    stinPod(x, ZEM + 6, 22, d);
    if (hrac.nesmrt > 0 && turbo <= 0 && Math.floor(hrac.nesmrt * 12) % 2 === 0) return;
  }

  if (turbo > 0 && kdeX === null){
    const g = ctx.createRadialGradient(x, y, 6, x, y, 52);
    g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(140,200,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 52, 0, 7); ctx.fill();
    ctx.strokeStyle = DUHA[Math.floor(hodiny*16) % DUHA.length]; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 34 + Math.sin(hodiny*25)*3, 0, 7); ctx.stroke();
  }

  if (stit && kdeX === null){
    const bg = ctx.createRadialGradient(x, y, 14, x, y, 40);
    bg.addColorStop(0, 'rgba(116,212,255,.05)'); bg.addColorStop(.75, 'rgba(116,212,255,.22)');
    bg.addColorStop(1, 'rgba(214,242,255,.5)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, 40, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(180,235,255,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 39, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.ellipse(x - 15, y - 20, 6, 3.5, -.6, 0, 7); ctx.fill();
  }
  const m = (1 + hrac.puls * .16) * .92 * velikost * ((kdeX === null || kopie) && maly > 0 ? .6 : 1);
  const t = 1 - hrac.mavF;
  const uhelKridla = -1.25 * Math.sin(t * Math.PI) + Math.sin(hodiny*6) * .1;
  const mrka = Math.sin(hodiny * 2.7) > .955;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(m, m * (kdeX === null || kopie ? gravSmer : 1));   // obrácená gravitace = vzhůru nohama
  if (kdeX === null || kopie) ctx.rotate(hrac.uhel);
  else ctx.rotate(Math.sin(hodiny*1.6) * .06);

  const B = paleta();
  const obrys = B.obrys;
  ctx.lineJoin = 'round';

  // --- ocasní pera ---
  for (let i = 0; i < 3; i++){
    ctx.save(); ctx.translate(-22, -4); ctx.rotate(-.5 + i * .38 + Math.sin(hodiny*5)*.05);
    ctx.fillStyle = i === 1 ? B.pero : B.a;
    ctx.beginPath(); ctx.ellipse(-13, 0, 16, 6, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = obrys; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
  }

  // --- nohy ---
  ctx.strokeStyle = '#f08c1e'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  for (const dx of [-4, 5]){
    ctx.beginPath(); ctx.moveTo(dx, 15); ctx.lineTo(dx - 7, 25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dx - 7, 25); ctx.lineTo(dx - 13, 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dx - 7, 25); ctx.lineTo(dx - 12, 28); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  // --- tělo ---
  const gt = ctx.createLinearGradient(0, -20, 0, 20);
  gt.addColorStop(0, B.a); gt.addColorStop(.65, B.b); gt.addColorStop(1, B.c);
  ctx.fillStyle = gt;
  ctx.beginPath(); ctx.ellipse(0, 0, 25, 20, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = obrys; ctx.lineWidth = 2.6; ctx.stroke();

  // --- křídlo ---
  ctx.save(); ctx.translate(-3, -3); ctx.rotate(uhelKridla);
  const gk = ctx.createLinearGradient(0, -8, 0, 10);
  gk.addColorStop(0, B.k1); gk.addColorStop(1, B.k2);
  ctx.fillStyle = gk;
  ctx.beginPath(); ctx.ellipse(-2, 2, 16, 11, .15, 0, 7); ctx.fill();
  ctx.strokeStyle = obrys; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.strokeStyle = obrys; ctx.globalAlpha = .5; ctx.lineWidth = 1.6;
  for (let i = -1; i <= 1; i++){
    ctx.beginPath(); ctx.moveTo(-14 + i*5, 2 + i); ctx.lineTo(-3 + i*5, 9); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- hlava ---
  ctx.fillStyle = B.a;
  ctx.beginPath(); ctx.arc(16, -15, 13.5, 0, 7); ctx.fill();
  ctx.strokeStyle = obrys; ctx.lineWidth = 2.6; ctx.stroke();

  // zobák
  ctx.fillStyle = '#ffa726';
  ctx.beginPath(); ctx.moveTo(26, -19); ctx.lineTo(41, -13); ctx.lineTo(26, -7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = obrys; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(90,60,30,.7)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(26.5, -13); ctx.lineTo(40, -13); ctx.stroke();
  // lalok
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.arc(25, -4, 5, 0, 7); ctx.fill();
  ctx.strokeStyle = obrys; ctx.lineWidth = 1.8; ctx.stroke();

  // oko
  if (mrka){
    ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(16, -18); ctx.lineTo(24, -18); ctx.stroke();
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(20, -18, 5.4, 0, 7); ctx.fill();
    ctx.strokeStyle = obrys; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#241c14';
    ctx.beginPath(); ctx.arc(21.4, -18, 2.8, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(20.4, -19.2, 1.1, 0, 7); ctx.fill();
  }

  // --- HELMA ---
  const barvaHelmy = turbo > 0 ? '#ffc233' : '#e63946';
  const tmavaHelmy = turbo > 0 ? '#c78e14' : '#a8232e';
  ctx.save();
  ctx.beginPath(); ctx.arc(16, -17, 16.5, Math.PI, Math.PI*2); ctx.closePath();
  ctx.clip();
  const gh = ctx.createLinearGradient(0, -34, 0, -17);
  gh.addColorStop(0, turbo > 0 ? '#ffe08a' : '#ff6b6b'); gh.addColorStop(1, barvaHelmy);
  ctx.fillStyle = gh; ctx.fillRect(-2, -36, 40, 22);
  ctx.fillStyle = '#fff8e7'; ctx.fillRect(13, -36, 6.5, 22);      // bílý pruh
  ctx.restore();
  ctx.strokeStyle = tmavaHelmy; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(16, -17, 16.5, Math.PI, Math.PI*2); ctx.stroke();
  // kšilt
  ctx.fillStyle = barvaHelmy;
  ctx.beginPath(); ctx.roundRect(-1, -19.5, 40, 6, 3); ctx.fill();
  ctx.strokeStyle = tmavaHelmy; ctx.lineWidth = 2; ctx.stroke();
  // lesk
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(16, -17, 11, Math.PI*1.12, Math.PI*1.42); ctx.stroke();
  ctx.lineCap = 'butt';
  // pásek pod bradou
  ctx.strokeStyle = '#4a3428'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(3, -18); ctx.quadraticCurveTo(4, -4, 14, -2); ctx.stroke();

  ctx.restore();
}

// ============ DUCH REKORDU ============
function kresliDucha(){
  if (rekordUjeto <= 0 || rekordPrekonan) return;
  if (stav !== 'hra' && stav !== 'padam') return;
  const gx = hrac.x + (rekordUjeto - ujeto);
  if (gx < -140 || gx > Š + 140) return;
  ctx.save();
  ctx.setLineDash([13, 11]);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(gx, 52); ctx.lineTo(gx, ZEM); ctx.stroke();
  ctx.setLineDash([]);
  napis('TVŮJ REKORD', gx, 40, '#ffffff', 'bold 17px system-ui', 5);
  ctx.globalAlpha = .35;
  kresliSlepici(1, gx, 250 + Math.sin(hodiny * 2) * 30);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ============ DÉŠŤ A BLESK ============
function kresliCaryRychlosti(){
  if (zrychleniCas <= 0) return;
  ctx.strokeStyle = 'rgba(255,220,170,.35)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 16; i++){
    const y = (i * 37 + (hodiny * 900) % 37) % V;
    const x = (Š - ((hodiny * 1400 + i * 211) % (Š + 260)));
    ctx.moveTo(x, y); ctx.lineTo(x + 70, y);
  }
  ctx.stroke();
}

function kresliDest(dt){
  if (bourkaSila <= 0) return;
  ctx.strokeStyle = 'rgba(195,220,255,' + (.55 * bourkaSila) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const k of KAPKY){
    k.y += k.s * dt; k.x -= k.s * .32 * dt;
    if (k.y > V){ k.y = -25; k.x = nah(0, Š + 260); }
    if (k.x < -50) k.x = Š + 50;
    ctx.moveTo(k.x, k.y); ctx.lineTo(k.x - k.d * .32, k.y + k.d);
  }
  ctx.stroke();

  if (blesk > .35){
    ctx.strokeStyle = 'rgba(255,255,255,' + blesk + ')';
    ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(bleskX, 0);
    let x = bleskX;
    for (let i = 1; i <= 6; i++){ x += nah(-28, 28); ctx.lineTo(x, i * ZEM / 6); }
    ctx.stroke();
  }
}

// ============ KAMARÁD ============
function kresliHonice(h){
  const B = h.demon ? '255,150,90' : '226,244,255';
  const bob = Math.sin(h.faze * 1.4) * 6;
  ctx.save();
  ctx.translate(h.x, h.y + bob);
  // mlžný chvost
  for (let i = 4; i >= 1; i--){
    ctx.fillStyle = 'rgba(' + B + ',' + (.1 * i * .5) + ')';
    ctx.beginPath(); ctx.ellipse(-i * 13, i * 2, 18 - i * 2, 13 - i, 0, 0, 7); ctx.fill();
  }
  const zg = ctx.createRadialGradient(0, -4, 4, 0, 0, 46);
  zg.addColorStop(0, 'rgba(' + B + ',.4)'); zg.addColorStop(1, 'rgba(' + B + ',0)');
  ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill();
  // tělo
  ctx.fillStyle = 'rgba(' + B + ',.93)';
  ctx.beginPath();
  ctx.moveTo(-19, 12);
  ctx.quadraticCurveTo(-19, -28, 0, -28);
  ctx.quadraticCurveTo(19, -28, 19, 12);
  for (let i = 0; i < 4; i++){
    const x1 = 19 - i * 9.5, x2 = 19 - (i + .5) * 9.5;
    ctx.quadraticCurveTo(x2, 12 + (i % 2 ? -9 : 9) + Math.sin(h.faze * 3 + i) * 3, x1 - 9.5, 12);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = h.demon ? 'rgba(200,60,20,.65)' : 'rgba(120,170,210,.7)';
  ctx.lineWidth = 2.4; ctx.stroke();
  // strašidelná tvář
  ctx.fillStyle = h.demon ? 'rgba(70,10,10,.92)' : 'rgba(28,38,68,.92)';
  ctx.beginPath(); ctx.ellipse(-6.5, -10, 4, 5.5, 0, 0, 7); ctx.ellipse(6.5, -10, 4, 5.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 2, 5, 4.5, 0, 0, 7); ctx.fill();
  if (h.demon){
    ctx.fillStyle = '#ff7a2f';
    ctx.beginPath(); ctx.arc(-6.5, -10, 1.8, 0, 7); ctx.arc(6.5, -10, 1.8, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function kresliKostlivce(k){
  const skok = Math.sin(k.faze) * 3;
  const K = '#f4f0e4', T = '#2b1c20';
  ctx.save(); ctx.translate(k.x, k.y + skok);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // kostěná křidélka
  for (const sg of [-1, 1]){
    const m = Math.sin(k.faze) * 6;
    ctx.strokeStyle = T; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(sg * 6, -2); ctx.lineTo(sg * 20, -8 - m); ctx.stroke();
    ctx.strokeStyle = K; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.strokeStyle = T; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sg * 20, -8 - m); ctx.lineTo(sg * 27, 2 - m); ctx.stroke();
    ctx.strokeStyle = K; ctx.lineWidth = 2;  ctx.stroke();
  }
  // tělo se žebry
  ctx.fillStyle = T;
  ctx.beginPath(); ctx.ellipse(0, 2, 13, 12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = K;
  ctx.beginPath(); ctx.ellipse(0, 2, 10.5, 9.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(43,28,32,.45)'; ctx.lineWidth = 1.5;
  for (const rx of [-4, 0, 4]){ ctx.beginPath(); ctx.moveTo(rx, -5); ctx.lineTo(rx, 9); ctx.stroke(); }
  // lebka
  ctx.fillStyle = T;
  ctx.beginPath(); ctx.arc(-9, -13, 9, 0, 7); ctx.fill();
  ctx.fillStyle = K;
  ctx.beginPath(); ctx.arc(-9, -13, 7.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff9f43';
  ctx.beginPath(); ctx.arc(-12, -14, 2.3, 0, 7); ctx.arc(-6, -14, 2.1, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb347';
  ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(-25, -10); ctx.lineTo(-16, -8);
  ctx.closePath(); ctx.fill();
  // ocásek z kostičky
  ctx.strokeStyle = T; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(11, -3); ctx.lineTo(20, -9); ctx.stroke();
  ctx.strokeStyle = K; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.restore();
}

function kresliPoleOci(){
  for (const o of POLE_OCI){
    if (o.mrk < 0) continue;
    const bar = o.demon ? '255,120,40' : '255,225,120';

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x + ox, o.y, 15, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(' + bar + ',.95)';
      ctx.beginPath(); ctx.ellipse(o.x + ox, o.y, 3.8, 2.8, 0, 0, 7); ctx.fill();

function kresliKamarada(k){
  const mav = Math.sin(k.faze);

// ============ MEDAILE ============
function kresliMedaili(x, y, r, druh){
  const barvy = [['#e6ecf3','#b9c4d2','#8a95a6'], ['#f0b078','#cd7f32','#8c5522'],
                 ['#ffffff','#c8d0dc','#8d97a6'], ['#fff3b0','#ffd166','#c9901a']];
  const B = barvy[druh];
  // stuhy
  ctx.fillStyle = '#4a7fd4';
  ctx.beginPath(); ctx.moveTo(x - r*.72, y - r*.45); ctx.lineTo(x - r*.2, y - r*2.05);
  ctx.lineTo(x + r*.2, y - r*1.9); ctx.lineTo(x - r*.18, y - r*.35); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e05252';
  ctx.beginPath(); ctx.moveTo(x + r*.72, y - r*.45); ctx.lineTo(x + r*.2, y - r*2.05);
  ctx.lineTo(x - r*.2, y - r*1.9); ctx.lineTo(x + r*.18, y - r*.35); ctx.closePath(); ctx.fill();
  // kolečko
  const g = ctx.createRadialGradient(x - r*.35, y - r*.35, r*.1, x, y, r);
  g.addColorStop(0, B[0]); g.addColorStop(.55, B[1]); g.addColorStop(1, B[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = B[2]; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.arc(x, y, r*.74, 0, 7); ctx.fill();
  // hvězda
  ctx.fillStyle = B[2];
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i * Math.PI/5, rr = i % 2 ? r*.24 : r*.54;
    ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fill();
  if (druh === 3){
    for (let i = 0; i < 5; i++){
      const a = hodiny * 1.3 + i * 1.26, rr = r * 1.32 + Math.sin(hodiny*3 + i) * 5;
      ctx.fillStyle = 'rgba(255,255,220,.9)';
      ctx.beginPath(); ctx.arc(x + Math.cos(a)*rr, y + Math.sin(a)*rr, 2.8, 0, 7); ctx.fill();
    }
  }
}

  ctx.lineTo(x + 2, y + 11); ctx.lineTo(x - 4, y + 4); ctx.lineTo(x - 9, y + 4);

  ctx.lineWidth = 2.4; ctx.strokeStyle = '#ffffff';

    ctx.beginPath(); ctx.arc(x + 3, y, 8, -.9, .9); ctx.stroke();

  }
}

  if (stav === 'hra') krok(dt);
  else if (stav === 'padam') padamKrok(dt);
  else if (stav === 'konec') titulkyPosun += dt * 42;
  else {
    hrac.y = 250 + Math.sin(t/450) * 18;
    hrac.mavF = Math.max(0, hrac.mavF - dt * 3.2);
    if (hrac.mavF <= 0 && Math.random() < dt * 1.6) hrac.mavF = 1;   // slepice si mává
  }
  efektyKrok(dt);
  kresli(dt);
  requestAnimationFrame(smycka);
}
requestAnimationFrame(smycka);
</script>
