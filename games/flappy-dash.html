<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Dash</title>
<style>
  html,body{margin:0;height:100%;background:#12131c;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;}
  #obal{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{background:#6fc3e8;max-width:100%;max-height:100%;
    aspect-ratio:16/9;touch-action:none;display:block;border-radius:8px;}
</style>
</head>
<body>
<div id="obal"><canvas id="platno"></canvas></div>
<script>
// =====================================================================
//  FLAPPY DASH — slepice v helmě
//  Flappy létání + geometry dash překážky + turbo pírko + boss liška
// =====================================================================

// ============ ZÁKLAD ============
const Š = 960, V = 540;
const platno = document.getElementById('platno');
const ctx = platno.getContext('2d');

function zmenVelikost(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  platno.width  = Š * dpr;
  platno.height = V * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
}
addEventListener('resize', zmenVelikost);
zmenVelikost();

// ============ POMOCNÍCI ============
const nah   = (a,b) => a + Math.random()*(b-a);
const nahZ  = p => p[Math.floor(Math.random()*p.length)];
const omez  = (v,a,b) => Math.max(a, Math.min(b, v));

function emoji(znak, x, y, velikost=44, uhel=0, meritko=1){
  ctx.save();
  ctx.translate(x, y);
  if (uhel) ctx.rotate(uhel);
  if (meritko !== 1) ctx.scale(meritko, meritko);
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
  ctx.font = velikost + 'px serif';
  ctx.fillText(znak, 0, 0);
  ctx.restore();
}
function kruhBox(kx, ky, kr, x, y, š, v){
  const nx = omez(kx, x, x+š), ny = omez(ky, y, y+v);
  return Math.hypot(kx-nx, ky-ny) < kr;
}

// ============ ZVUK ============
const zvuk = (() => {
  let a = null, zapnuto = true, hudbaTimer = null;
  function audio(){
    if (!a) a = new (window.AudioContext || window.webkitAudioContext)();
    if (a.state === 'suspended') a.resume();
    return a;
  }
  function ton({f=440, f2=null, t=.15, typ='square', hlas=.15, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const o = c.createOscillator(), g = c.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f, z);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), z + t);
    g.gain.setValueAtTime(.0001, z);
    g.gain.exponentialRampToValueAtTime(hlas, z + .01);
    g.gain.exponentialRampToValueAtTime(.0001, z + t);
    o.connect(g); g.connect(c.destination);
    o.start(z); o.stop(z + t + .05);
  }
  function sum({t=.2, hlas=.2, filtr=1200, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const n = Math.max(1, Math.floor(c.sampleRate * t));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtr;
    const g = c.createGain(); g.gain.value = hlas;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(z);
  }
  function nota(jmeno){
    const z = {C:0, D:2, E:4, F:5, G:7, A:9, B:11, H:11};
    const m = /^([A-H])(#|b)?(-?\d)$/.exec(jmeno);
    if (!m) return 440;
    const p = z[m[1]] + (m[2]==='#' ? 1 : m[2]==='b' ? -1 : 0) + (+m[3]+1)*12;
    return 440 * Math.pow(2, (p - 69) / 12);
  }
  return {
    ton, sum, nota,
    get stav(){ return zapnuto; },
    prepni(){ zapnuto = !zapnuto; if (!zapnuto) this.hudbaStop(); return zapnuto; },
    mav:    () => { ton({f:nah(280,340), f2:nah(620,720), t:.09, typ:'square', hlas:.1});
                    sum({t:.06, hlas:.06, filtr:1600}); },
    kvok:   () => { ton({f:nah(750,900), f2:nah(420,520), t:.09, typ:'square', hlas:.1});
                    ton({f:nah(520,640), t:.06, typ:'square', hlas:.08, kdy:.08}); },
    bonus:  () => [784,988,1175,1568].forEach((f,i) =>
                    ton({f, t:.13, typ:'square', hlas:.16, kdy:i*.06})),
    bod:    () => { ton({f:880, t:.06, typ:'triangle', hlas:.14});
                    ton({f:1320, t:.09, typ:'triangle', hlas:.11, kdy:.05}); },
    zrno:   () => { ton({f:1046, t:.05, typ:'triangle', hlas:.16});
                    ton({f:1568, t:.08, typ:'triangle', hlas:.13, kdy:.05}); },
    tuk:    () => { ton({f:1400, f2:500, t:.12, typ:'square', hlas:.2});
                    sum({t:.14, hlas:.14, filtr:2400}); },
    pisk:   () => ton({f:1600, f2:900, t:.12, typ:'sawtooth', hlas:.1}),
    turbo:  () => [523,659,784,1047,1319].forEach((f,i) =>
                    ton({f, t:.12, typ:'square', hlas:.16, kdy:i*.05})),
    bam:    () => { sum({t:.22, hlas:.24, filtr:900});
                    ton({f:260, f2:70, t:.18, typ:'sawtooth', hlas:.16}); },
    dash:   () => [784,1047,1319,1568].forEach((f,i) =>
                    ton({f, t:.1, typ:'square', hlas:.16, kdy:i*.05})),
    vejce:  () => ton({f:700, f2:260, t:.16, typ:'triangle', hlas:.1}),
    plack:  () => sum({t:.16, hlas:.14, filtr:500}),
    vyhraDuha: () => [523,659,784,1047,1319,1568].forEach((f,i) =>
                    ton({f, t:.16, typ:'triangle', hlas:.14, kdy:i*.07})),
    portal: (nahoru) => {
      const n = nahoru ? [392,523,659,880,1175] : [1175,880,659,523,392];
      n.forEach((f,i) => ton({f, t:.11, typ:'square', hlas:.15, kdy:i*.05}));
      sum({t:.3, hlas:.12, filtr:1400});
    },
    vitr:   () => sum({t:1.5, hlas:.055, filtr:430}),
    cvrcek: () => { ton({f:2400, t:.03, typ:'square', hlas:.045});
                    ton({f:2400, t:.03, typ:'square', hlas:.045, kdy:.07}); },
    ptacek: () => { ton({f:1750, f2:2400, t:.08, typ:'sine', hlas:.055});
                    ton({f:2200, f2:1700, t:.07, typ:'sine', hlas:.045, kdy:.12}); },
    hrom:   () => { sum({t:1.1, hlas:.3, filtr:190});
                    ton({f:72, f2:38, t:.9, typ:'sine', hlas:.16}); },
    motor:  () => { ton({f:110, f2:150, t:.5, typ:'sawtooth', hlas:.08});
                    sum({t:.5, hlas:.06, filtr:300}); },
    nabij:  () => { ton({f:300, f2:900, t:.13, typ:'square', hlas:.07});
                    ton({f:600, f2:1200, t:.09, typ:'triangle', hlas:.05, kdy:.06}); },
    pukanec:() => { sum({t:.05, hlas:.16, filtr:2400});
                    ton({f:950, f2:380, t:.06, typ:'square', hlas:.1}); },
    buben:  () => { ton({f:150, f2:52, t:.32, typ:'sine', hlas:.3});
                    sum({t:.28, hlas:.2, filtr:420});
                    ton({f:300, f2:120, t:.12, typ:'triangle', hlas:.1, kdy:.02}); },
    pavouk: () => { ton({f:1500, f2:900, t:.05, typ:'square', hlas:.07});
                    ton({f:1200, f2:700, t:.05, typ:'square', hlas:.06, kdy:.07});
                    ton({f:1000, f2:600, t:.05, typ:'square', hlas:.05, kdy:.14}); },
    ohen:   () => { sum({t:.45, hlas:.2, filtr:1500});
                    ton({f:260, f2:900, t:.3, typ:'sawtooth', hlas:.09}); },
    rez:    () => { ton({f:2200, f2:600, t:.14, typ:'sawtooth', hlas:.13});
                    sum({t:.1, hlas:.1, filtr:2600}); },
    bossAu: () => { sum({t:.45, hlas:.32, filtr:700});
                    ton({f:180, f2:50, t:.4, typ:'sawtooth', hlas:.2});
                    ton({f:900, f2:300, t:.25, typ:'square', hlas:.12, kdy:.05}); },
    bossKonec: () => [392,523,659,784,1047].forEach((f,i) =>
                    ton({f, t:.2, typ:'triangle', hlas:.18, kdy:i*.12})),
    start:  () => [523,659,784].forEach((f,i) =>
                    ton({f, t:.1, typ:'triangle', hlas:.15, kdy:i*.08})),
    konec:  () => [784,659,523,392].forEach((f,i) =>
                    ton({f, t:.24, typ:'triangle', hlas:.16, kdy:i*.15})),
    hudbaHraj(noty, tempo = 120, typ = 'triangle', hlas = .04, bas = null, wob = false){
      this.hudbaStop();
      if (!zapnuto) return;
      const krok = 60 / tempo / 2;
      let i = 0;
      hudbaTimer = setInterval(() => {
        const n = noty[i % noty.length];
        if (n) ton({ f: typeof n === 'string' ? nota(n) : n, t: krok*.9, typ, hlas });
        if (bas){
          const b = bas[i % bas.length];
          if (b){
            const fb = nota(b);
            if (wob)                                        // vrčící „wobble" bas
              ton({ f: fb * (i % 2 ? 1 : 2), f2: fb * .5, t: krok * 1.9,
                    typ: 'sawtooth', hlas: hlas * 1.7 });
            else
              ton({ f: fb, t: krok * 1.7, typ: 'sawtooth', hlas: hlas * 1.15 });
          }
          if (i % 4 === 0) sum({ t: wob ? .09 : .05, hlas: wob ? .12 : .07, filtr: wob ? 190 : 260 });
          if (i % 4 === 2) sum({ t: .07, hlas: .05, filtr: 3200 });
          if (wob && i % 8 === 7) sum({ t: .13, hlas: .09, filtr: 5200 });   // rozjezd
        }
        i++;
      }, krok * 1000);
    },
    hudbaStop(){ if (hudbaTimer) { clearInterval(hudbaTimer); hudbaTimer = null; } }
  };
})();

let hudbaRezim = '';
function rezimHudby(){
  if (boss) return 'boss';
  if (bourka > 0) return 'bourka';
  if (zrychleniCas > 0) return 'rychlo';
  if (demonSila() > .45) return 'demon';
  if (nocSila() > .5) return 'noc';
  return 'den';
}
function hudbaTed(){
  hudbaRezim = rezimHudby();
  if (hudbaRezim === 'boss')        zvuk.hudbaHraj(HUDBA_BOSS, 140, 'square', .045);
  else if (hudbaRezim === 'bourka') zvuk.hudbaHraj(HUDBA_BOURKA, 116, 'triangle', .035);
  else if (hudbaRezim === 'rychlo') zvuk.hudbaHraj(HUDBA_LET, 250, 'square', .045, BAS_LET);
  else if (hudbaRezim === 'demon')  zvuk.hudbaHraj(HUDBA_DEMON, 212, 'square', .036, BAS_DEMON, true);
  else if (hudbaRezim === 'noc')    zvuk.hudbaHraj(HUDBA_NOC, 98, 'sine', .04, BAS_NOC);
  else                              zvuk.hudbaHraj(HUDBA_LET, 180, 'square', .045, BAS_LET);
}
// vlastní rychlá skladba ve stylu, co má rád — originál, nic okopírovaného
const HUDBA_LET = [
  'A4','C5','E5','C5','A4','C5','E5','G5',
  'F4','A4','C5','A4','F4','A4','C5','E5',
  'G4','H4','D5','H4','G4','H4','D5','F5',
  'E4','G4','H4','G4','E4','H4','E5','D5'];
const BAS_LET = [
  'A2',null,'A2','A2','A2',null,'A2',null,
  'F2',null,'F2','F2','F2',null,'F2',null,
  'G2',null,'G2','G2','G2',null,'G2',null,
  'E2',null,'E2','E2','E2',null,'E2','E2'];
// noc — tiché a tajemné
const HUDBA_NOC = ['A3',null,'C4',null,'E4',null,'D4',null,
                   'F4',null,'E4',null,'C4',null,'A3',null];
const BAS_NOC   = ['A1',null,null,null,'F1',null,null,null,
                   'G1',null,null,null,'E1',null,null,null];
// démonická oblast — vlastní temná skladba: vysoký strašidelný zpěv nad vrčícím basem
const HUDBA_DEMON = [
  'D5',null,'C5',null,'A#4',null,'C5',null,
  'D5',null,'F5',null,'D#5',null,'C5',null,
  'A#4',null,'G#4',null,'A#4',null,'C5',null,
  'D5',null,null,null,'A#4',null,'G#4',null,
  'F5',null,'D#5',null,'D5',null,'C5',null,
  'A#4',null,'C5',null,'D#5',null,'D5',null];
const BAS_DEMON = [
  'D2','D2','D2','D2','D2','D2','D2','D2',
  'D2','D2','A#1','A#1','C2','C2','C2','C2',
  'G#1','G#1','G#1','G#1','A#1','A#1','A#1','A#1',
  'D2','D2','D2','D2','C2','C2','A#1','A#1',
  'A#1','A#1','A#1','A#1','G#1','G#1','G#1','G#1',
  'F1','F1','F1','F1','D2','D2','D2','D2'];
const HUDBA_BOURKA = ['A3',null,'C4',null,'A3',null,'G3',null];
const HUDBA_BOSS = ['A3',null,'A3','C4','A3',null,'G3','A3',
                    'F3',null,'F3','A3','G3',null,'E3',null];

// ============ OVLÁDÁNÍ ============
// ============ TESTOVACÍ (ADMIN) REŽIM ============
const ADMIN_FAZE = [['Digit1', .04, 'DEN'], ['Digit2', .36, 'ZÁPAD SLUNCE'],
                    ['Digit3', .54, 'NOC'], ['Digit4', .72, 'DÉMONICKÁ OBLAST']];
const ADMIN_BOSS = [['Digit5', 'vlk'], ['Digit6', 'pavouk'], ['Digit7', 'kohout'], ['Digit8', 'liska']];

function adminTeleport(cil, jmeno){
  cyklPosun = cil * CYKLUS - (hodiny % CYKLUS);
  vDemonu = demonSila() > .5;
  hudbaTed();
  popisek(Š/2, 190, 'TELEPORT: ' + jmeno, '#a0ffc9');
  zablesk = .35; zvuk.portal(true);
}
function adminPrivolej(typ){
  boss = null;
  prekazky = prekazky.filter(p => !['vejce','vlna','pavoucek','sit','kruh'].includes(p.typ));
  bossRada = BOSSI.indexOf(typ);
  novyBoss();
}
function adminKlavesa(e){
  if (e.code === 'Backquote'){ adminPanel = !adminPanel; return true; }
  if (e.code === 'Escape'){ admin = false; nesmrtelny = false;
    popisek(Š/2, 150, 'TESTOVACÍ REŽIM VYPNUT', '#ffd166'); return true; }
  if (stav !== 'hra') return false;              // v menu admin klávesy nedělají nic

  for (const [kl, cil, jm] of ADMIN_FAZE)
    if (e.code === kl){ adminTeleport(cil, jm); return true; }
  for (const [kl, typ] of ADMIN_BOSS)
    if (e.code === kl){ adminPrivolej(typ); return true; }

  switch (e.code){
    case 'KeyT': turbo = 8; popisek(hrac.x, hrac.y - 44, 'TURBO', '#ffe066'); return true;
    case 'KeyS': stit = true; popisek(hrac.x, hrac.y - 44, 'ŠTÍT', '#74d4ff'); return true;
    case 'KeyG': magnet = 9; popisek(hrac.x, hrac.y - 44, 'MAGNET', '#ff9f9f'); return true;
    case 'KeyC': zpomaleni = 6; popisek(hrac.x, hrac.y - 44, 'ZPOMALENÍ', '#a5f3ff'); return true;
    case 'KeyH': hrac.zivoty = Math.min(hrac.zivoty + 1, 6);
                 popisek(hrac.x, hrac.y - 44, '+1 SRDÍČKO', '#ff9fb0'); return true;
    case 'KeyN': nesmrtelny = !nesmrtelny; hrac.nesmrt = 0;
                 popisek(Š/2, 190, nesmrtelny ? 'NESMRTELNOST ZAPNUTA' : 'NESMRTELNOST VYPNUTA',
                         nesmrtelny ? '#a0ffc9' : '#ffd166'); return true;
    case 'KeyP': novyPortal(); portalCas = 14; return true;
    case 'KeyB': if (bourka <= 0 && !boss){ bourka = 14; zvuk.hrom(); hudbaTed();
                   popisek(Š/2, 150, 'BOUŘKA!', '#cfe3ff'); } return true;
    case 'KeyO': prekazky = prekazky.filter(p => p.typ === 'pirko' || p.typ === 'zrno');
                 popisek(Š/2, 190, 'ÚKLID', '#ffffff'); return true;
    case 'Equal': case 'NumpadAdd':
      hodiny += 30; popisek(Š/2, 190, 'ČAS +30 s (těžší)', '#ffd166'); return true;
    case 'Minus': case 'NumpadSubtract':
      hodiny = Math.max(0, hodiny - 30); popisek(Š/2, 190, 'ČAS -30 s (lehčí)', '#ffd166'); return true;
  }
  return false;
}

function akce(){
  if (stav === 'padam') return;          // během pádu se nedá nic dělat
  if (stav !== 'hra') { zacniHru(); return; }
  mavni();
}
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Tab' && admin){             // testovací nesmrtelnost (jen po tajném kódu)
    nesmrtelny = !nesmrtelny;
    hrac.nesmrt = 0;
    popisek(hrac.x, hrac.y - 54,
            nesmrtelny ? 'NESMRTELNOST ZAP' : 'NESMRTELNOST VYP',
            nesmrtelny ? '#8ce99a' : '#ff9f9f');
    bum(hrac.x, hrac.y, nesmrtelny ? '#8ce99a' : '#ff9f9f', 20, 300);
    zvuk.bonus();
    return;
  }
  if (e.code === 'KeyM'){ zvuk.prepni(); return; }
  // ---- tajný kód: sleduje posledních pár písmen ----
  if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)){
    kodBuffer = (kodBuffer + e.key.toLowerCase()).slice(-TAJNY_KOD.length);
    if (kodBuffer === TAJNY_KOD && !admin){
      admin = true; adminBylo = true; adminPanel = true; kodBuffer = '';
      popisek(Š/2, 150, 'TESTOVACÍ REŽIM ZAPNUT', '#a0ffc9');
      zvuk.vyhraDuha();
      return;
    }
  }
  if (admin && adminKlavesa(e)) return;
  if (stav !== 'hra' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')){
    const k = pocetSlepic();
    barvaSlepice = (barvaSlepice + (e.code === 'ArrowLeft' ? k-1 : 1)) % k;
    zvuk.kvok(); return;
  }
  if (stav !== 'hra' && (e.code === 'ArrowUp' || e.code === 'ArrowDown')){
    rezim = omez(rezim + (e.code === 'ArrowUp' ? -1 : 1), 0, 2);
    zvuk.klik ? zvuk.klik() : zvuk.bod(); return;
  }
  akce();
});
platno.addEventListener('pointerdown', e => {
  const r = platno.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width  * Š;
  const my = (e.clientY - r.top ) / r.height * V;
  if (mx > Š-52 && my > 40 && my < 100){ zvuk.prepni(); return; }
  if (stav === 'menu' && Math.hypot(mx - Š/2, my - 96) < 95){
    barvaSlepice = (barvaSlepice + 1) % pocetSlepic();
    zvuk.kvok(); return;
  }
  akce();
});

// ============ ŠŤÁVA ============
let castice = [], popisky = [], otres = 0, zablesk = 0;

function bum(x, y, barva='#ffd166', kolik=14, sila=260){
  for (let i=0;i<kolik;i++){
    const a = nah(0, Math.PI*2), r = nah(60, sila);
    castice.push({x, y, vx:Math.cos(a)*r, vy:Math.sin(a)*r,
                  zivot:nah(.3,.8), max:.8, barva, vel:nah(3,6)});
  }
}
const zatres = s => otres = Math.max(otres, s);
const popisek = (x,y,text,barva='#fff') => popisky.push({x,y,text,barva,zivot:1});

function efektyKrok(dt){
  for (const c of castice){
    c.x += c.vx*dt; c.y += c.vy*dt;
    if (c.pero){ c.vy += 70*dt; c.vx += Math.sin(c.zivot*9) * 34 * dt; c.uhel += c.rot*dt; }
    else c.vy += 420*dt;
    c.zivot -= dt;
  }
  castice = castice.filter(c => c.zivot > 0);
  for (const p of popisky){ p.y -= 45*dt; p.zivot -= dt*1.3; }
  popisky = popisky.filter(p => p.zivot > 0);
  otres = Math.max(0, otres - dt*45);
  zablesk = Math.max(0, zablesk - dt*2.5);
}
function efektyKresli(){
  for (const c of castice){
    ctx.globalAlpha = Math.max(0, c.zivot / c.max);
    ctx.fillStyle = c.barva;
    if (c.pero){
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.uhel);
      ctx.beginPath(); ctx.ellipse(0, 0, c.vel, c.vel*.4, 0, 0, 7); ctx.fill();
      ctx.restore();
    } else ctx.fillRect(c.x - c.vel/2, c.y - c.vel/2, c.vel, c.vel);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 26px system-ui';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.5)';
  for (const p of popisky){
    ctx.globalAlpha = Math.min(1, p.zivot);
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.barva;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// ============ HERNÍ SVĚT ============

function honicKrok(h, dt, nocS, demS){

  const dx = hrac.x - h.x, dy = hrac.y - h.y;
  const d = Math.hypot(dx, dy) || 1;
  h.x += dx / d * rychl * dt;
  h.y += dy / d * rychl * dt + Math.sin(h.faze) * 26 * dt;

  // kostlivá slepice ho zahání
  if (kostlivec && Math.hypot(kostlivec.x - h.x, kostlivec.y - h.y) < 60){
    popisek(h.x, h.y - 40, 'KŠŠŠ!', '#f0ece0');
    bum(h.x, h.y, '#d6f2ff', 16, 280);
    zvuk.pisk();
    honic = null; honicCas = nah(16, 26);
    return;
  }
  if (Math.hypot(hrac.x - h.x, hrac.y - h.y) < hrac.r + 19){
    if (turbo > 0){
      bum(h.x, h.y, '#d6f2ff', 26, 340);
      popisek(h.x, h.y - 44, 'ZAHNAL JSI HO!', '#d6f2ff');

}

function kostlivecKrok(k, dt){
  k.faze += dt * 9;
  let cil = null, nejd = 340, idx = -1;
  for (let i = 0; i < prekazky.length; i++){
    const p = prekazky[i];
    if (p.typ !== 'zrno') continue;
    const d = Math.hypot(k.x - p.x, k.y - p.y);
    if (d < nejd){ nejd = d; cil = p; idx = i; }
  }
  const c = cil || (honic ? { x: honic.x, y: honic.y } : { x: hrac.x - 66, y: hrac.y + 46 });
  k.vx += ((c.x - k.x) * 4.6 - k.vx) * 5 * dt;
  k.vy += ((c.y - k.y) * 4.6 - k.vy) * 5 * dt;
  const sp = Math.hypot(k.vx, k.vy) || 1;
  if (sp > 560){ k.vx = k.vx / sp * 560; k.vy = k.vy / sp * 560; }
  k.x += k.vx * dt; k.y += k.vy * dt;
  if (cil && nejd < 28){
    prekazky.splice(idx, 1);
    zrnka++; skore += 3;
    bum(cil.x, cil.y, '#ffd166', 12, 200);
    popisek(cil.x, cil.y - 22, '+3', '#ffe066');
    zvuk.zrno();
  }
}

function kamaradKrok(k, dt){
  k.faze += dt * 14;

  // 1) nejdřív koukni, jestli na tebe neletí netopýr — toho jde odehnat
  let hrozba = null, hd = 999;
  for (const p of prekazky){
    if (p.typ !== 'netopyr' || p.odehnany || p.stav === 'zdrha') continue;
    if (p.stav !== 'utoci' && p.stav !== 'vsiml') continue;
    if (p.x > hrac.x + 560) continue;
    const d = Math.hypot(k.x - p.x, k.y - p.y);
    if (d < hd){ hd = d; hrozba = p; }
  }
  if (hrozba){
    k.vx += ((hrozba.x - k.x) * 6 - k.vx) * 6 * dt;
    k.vy += ((hrozba.y - k.y) * 6 - k.vy) * 6 * dt;
    const sp0 = Math.hypot(k.vx, k.vy) || 1;
    if (sp0 > 620){ k.vx = k.vx / sp0 * 620; k.vy = k.vy / sp0 * 620; }
    k.x += k.vx * dt; k.y += k.vy * dt;
    if (hd < 36){                                   // vyžene ho
      hrozba.stav = 'zdrha'; hrozba.vy = -320; hrozba.odehnany = true;
      popisek(hrozba.x, hrozba.y - 32, 'KŠŠŠ!', '#ffb3c6');
      bum(hrozba.x, hrozba.y, '#ffb3c6', 14, 240);
      zvuk.pisk(); zatres(4);
    }
    return;
  }

  // 2) jinak sbírá kukuřici
  let cil = null, nejd = 330, idx = -1;
  for (let i = 0; i < prekazky.length; i++){
    const p = prekazky[i];
    if (p.typ !== 'zrno') continue;
    const d = Math.hypot(k.x - p.x, k.y - p.y);
    if (d < nejd){ nejd = d; cil = p; idx = i; }
  }
  const c = cil || { x: hrac.x - 62, y: hrac.y - 52 };     // jinak lítá u tebe
  k.vx += ((c.x - k.x) * 4.5 - k.vx) * 5 * dt;
  k.vy += ((c.y - k.y) * 4.5 - k.vy) * 5 * dt;
  const sp = Math.hypot(k.vx, k.vy) || 1;
  if (sp > 540){ k.vx = k.vx / sp * 540; k.vy = k.vy / sp * 540; }
  k.x += k.vx * dt; k.y += k.vy * dt;
  if (cil && nejd < 28){
    prekazky.splice(idx, 1);
    zrnka++; skore += 3;
    bum(cil.x, cil.y, '#ffd166', 12, 200);
    popisek(cil.x, cil.y - 22, '+3', '#ffe066');
    zvuk.zrno();
  }
}

// ---------- mozek netopýra ----------
function netopyrKrok(n, dt){
  n.faze += dt * 12;
  const dx = n.x - hrac.x;
  switch (n.stav){
    case 'klid':
      n.zmena -= dt;
      if (n.zmena <= 0){ n.uhel += nah(-1.2, 1.2); n.zmena = nah(.5, 1.4); }
      n.vy += (Math.sin(n.uhel) * 90 - n.vy) * 3 * dt;
      if (dx < 420){ n.stav = 'vsiml'; n.timer = 1.1; zvuk.pisk(); }   // víc času na reakci
      break;
    case 'vsiml':
      n.timer -= dt;
      n.vy *= .9;
      if (n.timer <= 0){ n.stav = 'utoci'; n.utok = 2.1; }
      break;
    case 'utoci': {
      n.utok -= dt;
      const cil = hrac.y + hrac.vy * .08;                       // skoro nepředvídá
      n.vy += (Math.sign(cil - n.y) * 118 * Math.min(obtiznost, 1.5) - n.vy) * 1.7 * dt;
      if (n.utok <= 0){ n.stav = 'unava'; n.timer = 2.4; }      // zadýchá se a nechá tě být
      if (dx < -90) n.stav = 'zdrha';
      break;
    }
    case 'unava':
      n.timer -= dt;
      n.vy += (55 - n.vy) * 1.4 * dt;
      if (n.timer <= 0){ n.stav = 'klid'; n.zmena = 1; }
      break;
    case 'zdrha':
      n.vy += (-260 - n.vy) * 3 * dt;
      break;
  }
  n.y = omez(n.y + n.vy * dt, 40, ZEM - 30);
  if (n.y <= 40 || n.y >= ZEM - 30) n.vy *= -.6;
  n.x -= rychlost * .45 * dt;
}

// ---------- BOSS: liška v letadle ----------
const BOSSI = ['vlk','pavouk','kohout','liska'];
function jmenoBosse(t, dem){
  if (t === 'vlk')    return 'VLK S BUBNEM!';
  if (t === 'pavouk') return 'PAVOUČÍ KRÁLOVNA!';
  if (t === 'kohout') return 'KOHOUT-DRAK!';
  return dem ? 'DÉMONICKÁ LIŠKA!' : 'LIŠKA V LETADLE!';
}
function radaBosse(t){
  if (t === 'vlk')    return 'Sbírej kukuřici a slétni nad buben, až k tobě přiběhne!';
  if (t === 'pavouk') return 'S duhovým pírkem přeletěj její vlákna!';
  if (t === 'kohout') return 'S pírkem proleť dírou v ohnivém kruhu!';
  return 'Chytni duhové pírko a naleť do ní!';
}
function novyBoss(){
  const pekelna = demonSila() > .4;
  const typ = pekelna ? 'liska' : BOSSI[bossRada % 4];
  bossPocet++;
  if (!pekelna) bossRada++;                       // pekelná liška nepřeskočí frontu
  boss = { typ, x: Š + 240, y: 220, vy: 0, zivoty: 3, stav: 'prilet', timer: 0,
           vejceCas: 4, faze: 0, blik: 0, vrtule: 0, demon: pekelna, krok: 0,
           strelCas: 1.6, nabiti: 0, salva: 0, mezera: 0, miri: 260, zpetny: 0,
           bubenCas: 1.8, buch: 0, zrnoCas: .6,
           pavoucekCas: 1.4, sitCas: 2.2,
           kruhCas: 1.6, salva: 0, mezikruh: 0, chrl: 0 };
  if (typ === 'liska'){ boss.zivoty = pekelna ? 4 : 3; boss.vejceCas = nah(5, 8); }
  if (typ === 'vlk')    boss.y = ZEM - 56;
  if (typ === 'pavouk') boss.y = 120;
  if (typ === 'kohout') boss.y = ZEM - 100;
  naboje = 0;
  pirkoCas = Math.min(pirkoCas, 2.5);
  if (typ === 'liska') zvuk.motor();
  else if (typ === 'vlk') zvuk.buben();
  else if (typ === 'pavouk') zvuk.pavouk();
  else zvuk.ohen();
  popisek(Š/2, 130, jmenoBosse(typ, pekelna),
          typ === 'vlk' ? '#c9a0ff' : typ === 'pavouk' ? '#a0ffc9' : typ === 'kohout' ? '#ffb347'
          : pekelna ? '#ff5d5d' : '#ff9f9f');
  hudbaTed();
}

function bossKrok(b, dt){
  if (b.typ !== 'liska') return bossKrokNovy(b, dt);
  b.faze += dt * 3;
  b.vrtule += dt * 34;
  if (b.demon && Math.random() < .5)              // ohnivá stopa za letadlem
    castice.push({x: b.x + 44, y: b.y + nah(-8, 12), vx: nah(-260,-120), vy: nah(-50, 20),
                  zivot: nah(.3, .7), max: .7, barva: nahZ(['#ff7a2f','#ffd166','#e63946']), vel: nah(5, 10)});
  b.blik = Math.max(0, b.blik - dt);

  switch (b.stav){
    case 'prilet':
      b.x += (700 - b.x) * 1.6 * dt;
      b.y += (hrac.y - b.y) * 1.2 * dt;
      if (b.x < 760){ b.stav = 'utoci'; b.timer = 0; }
      break;

    case 'utoci': {
      b.timer += dt;
      b.x += (700 + Math.sin(b.faze) * 26 - b.x) * 2 * dt;
      if (b.zivoty === 1) b.x += Math.sin(hodiny * 46) * 2.2;      // zuřivě se třese
      if (b.nabiti > 0 || b.salva > 0){          // zamířila a drží výšku
        b.vy += (0 - b.vy) * 6 * dt;
      } else {
        const cil = omez(hrac.y + hrac.vy * .18, 110, ZEM - 110);
        b.vy += (Math.sign(cil - b.y) * 105 * obtiznost - b.vy) * 2.2 * dt;
      }
      b.y = omez(b.y + b.vy * dt, 100, ZEM - 100);
      // --- kukuřičný kanón: míří na tvoji výšku a střílí vodorovně ---
      if (b.salva > 0){
        b.mezera -= dt;
        if (b.mezera <= 0){
          b.salva--; b.mezera = .15; b.zpetny = 1;
          prekazky.push({ typ:'strela', x: b.x - 74, y: b.miri, r: 11,
                          vx: -(660 + rychlost * .35), faze: nah(0, 7), ohniva: !!b.demon });
          zvuk.pukanec();
        }
      } else if (b.nabiti > 0){
        b.nabiti -= dt;                          // chvilka na uhnutí + zaměřovací čára
        if (b.nabiti <= 0){ b.salva = b.zivoty === 1 ? (b.demon ? 6 : 5) : (b.demon ? 4 : 3); b.mezera = 0; }
      } else {
        b.strelCas -= dt;
        if (b.strelCas <= 0){
          b.strelCas = omez((b.demon ? 2.1 : 2.6) / obtiznost, 1.1, 2.6) * (b.zivoty === 1 ? .45 : 1);
          b.miri = b.y + 22;                     // střílí ze své vlastní hlavně
          b.nabiti = b.zivoty === 1 ? .3 : omez(.55 / obtiznost, .34, .55);
          zvuk.nabij();
        }
      }
      b.zpetny = Math.max(0, b.zpetny - dt * 4);

      // --- zlaté vejce jen občas, jako dárek ---
      b.vejceCas -= dt;
      if (b.vejceCas <= 0){
        hodVejce(b);
        b.vejceCas = nah(7, 11);
      }
      if (b.timer > 30) b.stav = 'odlet';     // po půl minutě to vzdá sama
      break;
    }

    case 'zasazena':
      b.timer -= dt;
      b.x += (880 - b.x) * 2.5 * dt;
      b.y += Math.sin(b.timer * 40) * 3;
      if (b.timer <= 0){ b.stav = 'utoci'; b.timer = 0; b.strelCas = .9; b.nabiti = 0; b.salva = 0; }
      break;

    case 'odlet':
      b.x += 420 * dt;
      b.y -= 90 * dt;
      if (b.x > Š + 260){
        boss = null;
        bossCas = demonSila() > .45 ? 4 : 22;
        hudbaTed();
      }
      break;
  }
}

// ---------- vlk s bubnem ----------
function vlkUtok(b, dt){
  b.y = ZEM - 56;
  b.krok += dt * 10;
  // pobíhá po dvoře: dobíhá až pod tebe a zase se vrací
  const cil = 520 + Math.sin(b.faze * .5) * 285;
  b.x += (cil - b.x) * 1.9 * dt;
  b.buch = Math.max(0, b.buch - dt * 3.2);
  b.bubenCas -= dt;
  if (b.bubenCas <= 0 && b.x > 470){
    b.bubenCas = omez(2.5 / obtiznost, 1.25, 2.5);
    b.buch = 1;
    const kde = nahZ(['zem','vzduch','zem']);
    prekazky.push({ typ:'vlna', kde, x: b.x - 46,
                    y: kde === 'zem' ? ZEM - 62 : nah(210, 340),
                    v: 124, faze: 0 });
    zvuk.buben(); zatres(8);
  }
  b.zrnoCas -= dt;                                   // musí být z čeho střílet
  if (b.zrnoCas <= 0){
    b.zrnoCas = nah(1.3, 2);
    prekazky.push({ typ:'zrno', x: Š + 40, y: nah(120, ZEM - 130), r: 15, faze: nah(0,7) });
  }
}

// ---------- pavoučí královna ----------
function pavoukUtok(b, dt){
  b.x += (690 + Math.sin(b.faze * .45) * 80 - b.x) * 1.7 * dt;
  b.y = 118 + Math.sin(b.faze) * 16;
  b.pavoucekCas -= dt;
  if (b.pavoucekCas <= 0){
    b.pavoucekCas = omez(2 / obtiznost, 1, 2);
    prekazky.push({ typ:'pavoucek', x: b.x + nah(-50, 50), y: b.y + 34, vy: 150, r: 13,
                    faze: nah(0,7), horni: b.y + 34, dolni: nah(300, ZEM - 40) });
    zvuk.pavouk();
  }
  b.sitCas -= dt;
  if (b.sitCas <= 0){
    b.sitCas = nah(2.8, 4.2);
    prekazky.push({ typ:'sit', x: Š + 60, y: nah(150, ZEM - 150), r: 40, faze: nah(0,7) });
  }
}

// ---------- kohout-drak ----------
function kohoutUtok(b, dt){
  b.y = ZEM - 100 + Math.sin(b.faze) * 7;
  b.x += (800 - b.x) * 2 * dt;
  b.chrl = Math.max(0, b.chrl - dt * 2.5);
  if (b.salva > 0){
    b.mezikruh -= dt;
    if (b.mezikruh <= 0){
      b.salva--; b.mezikruh = .8; b.chrl = 1;
      prekazky.push({ typ:'kruh', x: b.x - 76,
                      y: omez(hrac.y + nah(-70, 70), 140, ZEM - 140),
                      r: 76, dira: 42, vx: -(rychlost + 110), faze: nah(0,7), vraceno: false });
      zvuk.ohen();
    }
  } else {
    b.kruhCas -= dt;
    if (b.kruhCas <= 0){
      b.cyklus = (b.cyklus || 0) + 1;
      b.kruhCas = omez(5.2 / obtiznost, 3, 5.2);
      if (b.cyklus % 3 === 0){                 // každý třetí útok je jedna obří koule
        b.chrl = 1;
        prekazky.push({ typ:'koule', x: b.x - 80, y: omez(hrac.y, 150, ZEM - 150),
                        r: 46, vx: -(rychlost * .55 + 120), faze: nah(0, 7) });
        popisek(b.x - 90, b.y - 120, 'OHNIVÁ KOULE!', '#ff7a2f');
        zvuk.ohen(); zvuk.hrom(); zatres(8);
      } else { b.salva = 3; b.mezikruh = 0; }
    }
  }
}

function bossKrokNovy(b, dt){
  b.faze += dt * 3;
  b.blik = Math.max(0, b.blik - dt);
  const cilX = b.typ === 'vlk' ? 620 : b.typ === 'pavouk' ? 690 : 800;

  switch (b.stav){
    case 'prilet':
      b.x += (cilX - b.x) * 2.2 * dt;
      if (b.x < cilX + 50){ b.stav = 'utoci'; b.timer = 0; }
      break;

    case 'utoci':
      b.timer += dt;
      if (b.typ === 'vlk')    vlkUtok(b, dt);
      if (b.typ === 'pavouk') pavoukUtok(b, dt);
      if (b.typ === 'kohout') kohoutUtok(b, dt);
      if (b.timer > 36) b.stav = 'odlet';
      break;

    case 'zasazena':
      b.timer -= dt;
      b.x += (cilX + 110 - b.x) * 2.5 * dt;
      b.y += Math.sin(b.timer * 40) * 3;
      if (b.typ === 'vlk')    b.krok += dt * 4;
      if (b.timer <= 0){ b.stav = 'utoci'; b.timer = 0; }
      break;

    case 'odlet':
      b.x += 430 * dt;
      b.y += (b.typ === 'pavouk' ? -170 : -70) * dt;
      if (b.x > Š + 320){ boss = null; bossCas = demonSila() > .45 ? 4 : 22; hudbaTed(); }
      break;
  }
}

// liška už neháže obyčejná vejce — jen občas pustí zlaté jako dárek
function hodVejce(b){
  prekazky.push({ typ:'vejce', x: b.x - 60, y: b.y + 26, vx: -215 - nah(0, 50),
                  vy: nah(-90, 10), r: 16, uhel: 0, bod:false, zlate: true });
  popisek(b.x - 70, b.y - 4, 'ZLATÉ VEJCE!', '#ffd166');
  zvuk.bonus();
}

function bossZasah(b){
  b.zivoty--;
  b.blik = .5;
  b.stav = 'zasazena'; b.timer = 1.1;
  bum(b.x, b.y, '#ff9f9f', 22, 340);
  bum(b.x, b.y, '#ffd166', 14, 260);
  zatres(14); zablesk = .3;
  zvuk.bossAu();
  if (b.zivoty <= 0){
    b.stav = 'odlet';
    skore += 50; bossPorazeno++;
    if (!tajnaOdemcena){
      tajnaOdemcena = true;
      popisek(Š/2, 210, 'ODEMKNUTA DUHOVÁ SLEPICE!', '#c58cff');
    }
    popisek(b.x, b.y - 60, '+50  SESTŘELENA!', '#ffe066');
    bum(b.x, b.y, '#ffffff', 34, 420);
    zatres(18);
    zvuk.bossKonec();
  } else {
    popisek(b.x, b.y - 60, 'AUUU!', '#ffe066');
    if (b.typ === 'liska' && b.zivoty === 1){
      popisek(Š/2, 175, 'LIŠKA ZUŘÍ!', '#ff5d5d');
      zablesk = .3; zatres(10); zvuk.hrom();
    }
  }
}

// ============ KROK HRY ============
function krok(dt){
  hodiny += dt;
  obtiznost = Math.min(1 + hodiny * REZIMY[rezim].rust / 45, 2.4);
  turbo = Math.max(0, turbo - dt);
  netopyrCas = Math.max(0, netopyrCas - dt);
  duha = Math.max(0, duha - dt);
  if (rezimHudby() !== hudbaRezim) hudbaTed();        // hudba se mění s prostředím

  const dem = demonSila();
  if (dem > .5 && !vDemonu){
    vDemonu = true;
    popisek(Š/2, 190, 'DÉMONICKÁ OBLAST!', '#ff6b6b');
    zvuk.hrom(); zablesk = .4;
    if (!boss) bossCas = Math.min(bossCas, 3);      // v pekle na tebe hned čeká démonická liška
  } else if (dem < .25 && vDemonu){
    vDemonu = false; statPeklo++;
    popisek(Š/2, 190, 'PŘEŽIL JSI PEKLO!', '#ffd166');
    zvuk.vyhraDuha();
  }
  portalCas = Math.max(0, portalCas - dt);

  if (gravSmer === -1) statObracene += dt;
  statKombo = Math.max(statKombo, kombo);

  if (dvojce > 0){
    dvojce -= dt;
    const dy = hrac.y + DVOJCE_ODSTUP * gravSmer;
    if (dy > ZEM - hrac.r || dy < STROP + hrac.r) zasah('DVOJČE NARAZILO!', true);
    if (dvojce <= 0){
      popisek(hrac.x, hrac.y - 46, 'ZASE SÁM', '#ff8fb1');
      bum(hrac.x, hrac.y + DVOJCE_ODSTUP * gravSmer, '#ff8fb1', 14, 260);
    }
  }
  if (magnet > 0){                            // magnet přitáhne kukuřici
    magnet -= dt;
    for (const p of prekazky){
      if (p.typ !== 'zrno') continue;
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) > 320) continue;
      p.x += (hrac.x - p.x) * 3.4 * dt;
      p.y += (hrac.y - p.y) * 3.4 * dt;
    }
  }
  if (zpomaleni > 0) zpomaleni -= dt;
  if (lepkavy > 0) lepkavy -= dt;
  if (maly > 0){
    maly -= dt;
    if (maly <= 0){
      hrac.r = 15;
      popisek(hrac.x, hrac.y - 46, 'ZASE VELKÁ!', '#8ce99a');
      bum(hrac.x, hrac.y, '#8ce99a', 14, 260);
    }
  }
  if (zrychleniCas > 0){
    zrychleniCas -= dt;
    if (zrychleniCas <= 0) hudbaTed();
  }

  // zvuky okolí podle počasí a denní doby
  ambient -= dt;
  if (ambient <= 0){
    if (bourka > 0){ zvuk.vitr(); ambient = nah(1.1, 2.1); }
    else if (hodiny / 55 > .5){ zvuk.cvrcek(); ambient = nah(1.6, 3.4); }
    else { zvuk.ptacek(); ambient = nah(3, 6); }
  }
  if (barvaSlepice === 3 && Math.random() < dt * 22)   // duhová slepice nechává stopu pořád
    castice.push({x: hrac.x - 14, y: hrac.y + nah(-10, 10), vx: nah(-150,-50), vy: nah(-25, 25),
                  zivot: nah(.35, .7), max: .7, barva: paleta().b, vel: nah(4, 7)});
  if (duha > 0 && Math.random() < dt * 16)          // barevná stopa po bouřce
    castice.push({x: hrac.x - 16, y: hrac.y + nah(-9, 9), vx: nah(-170,-60), vy: nah(-30, 30),
                  zivot: nah(.3, .6), max: .6, barva: nahZ(DUHA), vel: nah(3, 6)});

  // --- bouřka ---
  if (bourka > 0){
    bourka -= dt;
    bourkaSila = omez(Math.min(bourka, 14 - bourka) / 1.6, 0, 1);
    hrac.vy += 290 * bourkaSila * dt;                 // vítr tlačí dolů
    blesk = Math.max(0, blesk - dt * 2.5);
    if (Math.random() < dt * .3){ blesk = 1; bleskX = nah(120, Š - 120); zablesk = .4; zvuk.hrom(); }
    if (bourka <= 0){
      bourkaSila = 0; bourkaCas = nah(30, 44); duha = 15;
      popisek(Š/2, 170, 'DUHA!', '#8ce99a');
      zvuk.vyhraDuha();
      hudbaTed();
    }
  } else if (!boss){
    bourkaCas -= dt;
    if (bourkaCas <= 0){
      bourka = 14;
      popisek(Š/2, 150, 'BOUŘKA!', '#cfe3ff');
      zvuk.hrom();
      hudbaTed();
    }
  }
  dashCas = Math.max(0, dashCas - dt);
  rozjezd = Math.max(0, rozjezd - dt);
  const rozlet = 1 - .45 * (rozjezd / 3);          // první tři vteřiny letíš pomaleji
  const peklo = demonSila();
  rychlost = 210 * obtiznost * REZIMY[rezim].rychlost * (1 + peklo * .26) *
             (turbo > 0 ? 1.5 : 1) * (zrychleniCas > 0 ? 1.45 : 1) *
             (zpomaleni > 0 ? .62 : 1) * rozlet;
  ujeto += rychlost * dt;

  // překonání vlastního rekordu
  if (rekordUjeto > 0 && !rekordPrekonan && ujeto >= rekordUjeto){
    rekordPrekonan = true;
    popisek(hrac.x, hrac.y - 58, 'NOVÝ REKORD!', '#ffe066');
    for (let i = 0; i < 3; i++) bum(hrac.x + nah(-40, 40), hrac.y + nah(-30, 30), nahZ(DUHA), 12, 300);
    zablesk = .35; zatres(7); zvuk.vyhraDuha();
  }

  // --- slepice ---
  hrac.vy += GRAVITACE * gravSmer * dt;
  hrac.y  += hrac.vy * dt;
  hrac.uhel = omez(hrac.vy * gravSmer / 800, -.55, 1.0);
  hrac.puls = Math.max(0, hrac.puls - dt * 3);
  hrac.mavF = Math.max(0, hrac.mavF - dt * 3.2);
  hrac.nesmrt = Math.max(0, hrac.nesmrt - dt);

  // v turbu se slepice rozjede dopředu (a po turbu se pomalu vrací + chvíli bliká)
  const cilX = turbo > 0 ? 620 : 230;
  hrac.x += omez((cilX - hrac.x) * 3, -210, 900) * dt;
  if (turboBylo && turbo <= 0){ hrac.nesmrt = Math.max(hrac.nesmrt, 1.2); }
  turboBylo = turbo > 0;

  if (turbo > 0)
    for (let i=0;i<2;i++)
      castice.push({x:hrac.x - nah(10,34), y:hrac.y + nah(-10,10), vx:nah(-260,-120), vy:nah(-40,40),
                    zivot:nah(.2,.45), max:.45, barva:nahZ(DUHA), vel:nah(4,8)});

  if (hrac.vy > 230 && Math.random() < dt * 5){
    const B = paleta();
    castice.push({x: hrac.x - 6, y: hrac.y + 6, vx: nah(-110,-20), vy: nah(-40, 20),
                  zivot: nah(.7, 1.3), max: 1.3, barva: nahZ([B.a, B.pero]),
                  vel: nah(6, 9), pero: true, uhel: nah(0, 7), rot: nah(-3.5, 3.5)});
  }
  if (hrac.y > ZEM - hrac.r){
    hrac.y = ZEM - hrac.r;
    if (gravSmer === 1){ hrac.vy = -140; zasah('AU, ZEM!', true); }
    else hrac.vy = -Math.abs(hrac.vy) * .3;
  }
  if (hrac.y < STROP + hrac.r){
    hrac.y = STROP + hrac.r;
    if (gravSmer === -1){ hrac.vy = 140; zasah('AU, STROP!', true); }
    else hrac.vy = 60;
  }

  // --- kukuřičné pole ---
  if (pole > 0){
    pole -= dt;
    poleSpawn -= dt;
    if (poleSpawn <= 0){
      poleSpawn = .19;
      poleFaze += .55;
      prekazky.push({ typ:'zrno', x: Š + 40, y: omez(V/2 - 40 + Math.sin(poleFaze) * 135, 90, ZEM - 70),
                      r: 15, faze: nah(0, 7) });
      if (Math.random() < .55)
        prekazky.push({ typ:'steblo', x: Š + 40 + nah(0, 70), v: nah(70, 105), faze: nah(0, 7) });
    }
    if (!poleStrasak && pole < 2.7){               // uprostřed pole stojí strašák
      poleStrasak = true;
      prekazky.push({ typ:'strasak', x: Š + 120, v: nah(140, 172), faze: nah(0, 7),
                      nejbliz: 9999, bod:false });
    }
    if (pole <= 0) poleCas = nah(40, 54);
  } else if (!boss && bourka <= 0){
    poleCas -= dt;
    if (poleCas <= 0){
      pole = 4.8; poleSpawn = 0; poleFaze = 0; poleStrasak = false;
      spawnCas = Math.max(spawnCas, 5.4);          // chvíli žádné překážky, jen kukuřice
      popisek(Š/2, 170, 'KUKUŘIČNÉ POLE!', '#ffe066');
      zvuk.bonus();
    }
  }

  // --- boss ---
  if (!boss && demonSila() > .5) bossCas = Math.min(bossCas, 4);   // v pekle jedna za druhou
  if (!boss){
    bossCas -= dt;
    if (bossCas <= 0) novyBoss();
  } else bossKrok(boss, dt);

  // --- výroba překážek (během bosse pauza) ---
  if (!boss){
    spawnCas -= dt;
    if (spawnCas <= 0){
      vyrobPrekazku();
      spawnCas = (omez(1.55 / obtiznost, .78, 1.55) + nah(0, .25)) * (1 - demonSila() * .3);
    }
  }
  // pírko lítá pořád, během bosse častěji
  pirkoCas -= dt;
  if (pirkoCas <= 0){ novyBonus(); pirkoCas = (boss ? 7 : nah(14, 20)) * (1 - demonSila() * .45); }

  // --- pohyb překážek ---
  for (const p of prekazky){
    if (p.typ === 'netopyr') netopyrKrok(p, dt);
    else if (p.typ === 'vejce'){
      p.vy += 300 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.uhel += dt * 4;
      if (p.y > ZEM - 8){                       // plesk o zem
        p.y = ZEM - 8; p.rozbite = true;
      }
    }
    else if (p.typ === 'vlna'){ p.x -= (rychlost + 165) * dt; p.faze += dt * 9; }
    else if (p.typ === 'pavoucek'){
      p.x -= rychlost * dt; p.y += p.vy * dt; p.faze += dt * 8;
      if (p.y > p.dolni){ p.y = p.dolni; p.vy = -Math.abs(p.vy) * .9; }
      if (p.y < p.horni){ p.y = p.horni; p.vy = Math.abs(p.vy); }
    }
    else if (p.typ === 'kruh'){ p.x += p.vx * dt; p.faze += dt * 5; }
    else if (p.typ === 'koule'){
      p.x += p.vx * dt; p.faze += dt * 4;
      p.y += Math.sin(p.faze * .8) * 22 * dt;
      if (Math.random() < .7)
        castice.push({x: p.x + nah(-14, 30), y: p.y + nah(-20, 20), vx: nah(30, 160), vy: nah(-60, 60),
                      zivot: nah(.25, .6), max: .6, barva: nahZ(['#ff7a2f','#ffd166','#e63946']), vel: nah(5, 11)});
    }
    else if (p.typ === 'strela'){
      p.x += p.vx * dt; p.faze += dt * 12;
      if (p.ohniva && Math.random() < .5)
        castice.push({x: p.x, y: p.y, vx: nah(-30, 90), vy: nah(-40, 40), zivot: nah(.15, .35),
                      max: .35, barva: nahZ(['#ff7a2f','#ffd166']), vel: nah(3, 5)});
    }
    else if (p.typ === 'sit'){ p.x -= rychlost * dt; p.faze += dt * 2; }
    else p.x -= rychlost * dt;
    if (p.typ === 'pila'){
      p.uhel += dt * 9;
      p.y = p.zaklad + Math.sin(hodiny * p.tempo * 2 + p.faze) * p.amp;
    }
    if (p.typ === 'zrno' || p.typ === 'pirko') p.faze += dt * 5;
  }

  if (kamarad) kamaradKrok(kamarad, dt);

  // --- kostlivá slepice se přidá tomu, kdo přežil tři pekla ---
  if (!kostlivec && statPeklo >= 3){
    kostlivec = { x: hrac.x - 70, y: hrac.y + 40, vx: 0, vy: 0, faze: 0 };
    popisek(Š/2, 210, 'KOSTLIVÁ SLEPICE SE PŘIDALA!', '#f0ece0');
    zvuk.vyhraDuha();
  }
  if (kostlivec) kostlivecKrok(kostlivec, dt);

  // --- duch, co se odlepí od kopce a jde po tobě ---
  const nocS = nocSila(), demS = demonSila();
  if (!honic && !boss && (nocS > .5 || demS > .5)){
    honicCas -= dt;
    if (honicCas <= 0){
      honic = { x: -60, y: hrac.y, faze: nah(0, 7), demon: demS > .5 };
      popisek(Š/2, 170, honic.demon ? 'PEKELNÝ DUCH TĚ HONÍ!' : 'BUHÚÚ! DUCH TĚ HONÍ!',
              honic.demon ? '#ff8f6b' : '#d6f2ff');
      zvuk.hrom();
    }
  }
  if (honic) honicKrok(honic, dt, nocS, demS);

  // --- svítící očka mezi kukuřicí ---
  if (pole > 0 && (nocS > .3 || demS > .3) && Math.random() < dt * 3.4)
    POLE_OCI.push({ x: Š + 40, y: nah(120, ZEM - 60), mrk: nah(.8, 2.6), demon: demS > .3 });
  for (let i = POLE_OCI.length - 1; i >= 0; i--){
    const o = POLE_OCI[i];
    o.x -= rychlost * dt;
    o.mrk -= dt;
    if (o.mrk < -.2) o.mrk = nah(1, 3);
    if (o.x < -60) POLE_OCI.splice(i, 1);
  }

  // --- srážky ---
  const r = hrac.r;
  for (let i = prekazky.length - 1; i >= 0; i--){
    const p = prekazky[i];

    if (p.typ === 'trubka'){
      const rt = r * .82;                       // o něco menší dotyk = těsné průlety projdou
      const dy = dvojceY();
      const doTrubky = (yy) => kruhBox(hrac.x, yy, rt, p.x, -20, p.š, p.mezeraY + 20) ||
                               kruhBox(hrac.x, yy, rt, p.x, p.mezeraY + p.mezeraV, p.š, ZEM);
      const trefa = doTrubky(hrac.y) || (dy !== null && doTrubky(dy));
      if (trefa){
        if (turbo > 0){ rozbij(p, i, {x:p.x + p.š/2, y:hrac.y}); continue; }
        zasah('TŘESK!', true);                  // do trubky = konec, jako v opravdovém Flappy
      }
      if (!p.bod && p.x + p.š < hrac.x){ p.bod = true; pripisBod(p.bonus ? 5 : 1, !!p.bonus); }

    } else if (p.typ === 'pila'){
      const dyP = dvojceY();
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r - 6 ||
          (dyP !== null && Math.hypot(hrac.x - p.x, dyP - p.y) < r + p.r - 6)){
        if (turbo > 0){ rozbij(p, i, p); continue; }
        zasah('PILA!');
      }
      if (!p.bod && p.x + p.r < hrac.x){ p.bod = true; pripisBod(1); }

    } else if (p.typ === 'ostny'){
      let trefa = false;
      if (p.kde !== 'nahore') trefa = trefa || kruhBox(hrac.x, hrac.y, r*.85, p.x, ZEM - p.v, p.š, p.v);
      if (p.kde !== 'dole')   trefa = trefa || kruhBox(hrac.x, hrac.y, r*.85, p.x, STROP, p.š, p.v);
      if (trefa){
        if (turbo > 0){ rozbij(p, i, {x:p.x + p.š/2, y:hrac.y}); continue; }
        zasah('OSTNY!');
      }
      if (!p.bod && p.x + p.š < hrac.x){ p.bod = true; pripisBod(1); }

    } else if (p.typ === 'netopyr'){
      if (p.stav !== 'zdrha' && Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r - 13){
        if (turbo > 0){ rozbij(p, i, p); continue; }
        zasah('NETOPÝR!');
        p.stav = 'zdrha'; p.vy = -300; p.ublizil = true;
      }
      if (!p.bod && p.x + p.r < hrac.x){
        p.bod = true; pripisBod(1);
        if (!p.ublizil){
          netopyrPresel++;
          if (netopyrPresel >= 3 && !kamarad){        // třetí přeletěný se přidá k tobě
            kamarad = { x: p.x, y: p.y, vx: 0, vy: 0, faze: 0 };
            prekazky.splice(i, 1);
            popisek(hrac.x, hrac.y - 52, 'KAMARÁD!', '#ffb3c6');
            bum(p.x, p.y, '#ffb3c6', 22, 280);
            zvuk.bossKonec();
            continue;
          }
        }
      }

    } else if (p.typ === 'vejce'){
      if (p.rozbite){
        bum(p.x, p.y, p.zlate ? '#ffd166' : '#fff8dc', p.zlate ? 16 : 10, 200);
        zvuk.plack();
        prekazky.splice(i, 1); continue;
      }
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r + (p.zlate ? 8 : -3)){
        if (p.zlate){                                  // zlaté vejce nikdy neublíží
          prekazky.splice(i, 1);
          bum(p.x, p.y, '#ffd166', 22, 320);
          if (turbo > 0 && hrac.zivoty < 3){
            hrac.zivoty++;
            popisek(hrac.x, hrac.y - 44, '+1 SRDÍČKO!', '#ff9fb0');
            zvuk.bossKonec();
          } else {
            skore += 10;
            popisek(hrac.x, hrac.y - 40, '+10 ZLATÉ!', '#ffd166');
            zvuk.bonus();
          }
          zatres(5);
          continue;
        }
        if (turbo > 0){ rozbij(p, i, p); continue; }
        zasah('VEJCE!');
        prekazky.splice(i, 1); continue;
      }
      if (!p.bod && p.x < hrac.x - 20 && !p.zlate){ p.bod = true; pripisBod(1); }

    } else if (p.typ === 'portal'){
      if (!p.bod && p.x < hrac.x){
        p.bod = true;
        if (p.druh === 'zmenseni'){
          maly = 9; hrac.r = 9;
          popisek(hrac.x, hrac.y - 54, 'MALÁ SLEPICE!', '#8ce99a');
          for (let q = 0; q < 3; q++) bum(hrac.x, hrac.y + nah(-25, 25), '#8ce99a', 12, 300);
          zvuk.portal(false);
        } else if (p.druh === 'dvojce'){
          dvojce = 9;
          popisek(hrac.x, hrac.y - 54, 'DVĚ SLEPICE!', '#ff8fb1');
          for (let q = 0; q < 3; q++) bum(hrac.x, hrac.y + nah(-25, 25), '#ff8fb1', 12, 320);
          zvuk.portal(true);
        } else if (p.druh === 'rychlost'){
          zrychleniCas = 5;
          popisek(hrac.x, hrac.y - 54, 'ZRYCHLENÍ!', '#ff9f1c');
          for (let q = 0; q < 3; q++) bum(hrac.x, hrac.y + nah(-25, 25), '#ff9f1c', 12, 340);
          zvuk.portal(true); hudbaTed();
        } else {
          gravSmer = -gravSmer;
          hrac.vy = MAV * gravSmer * .5;                // malé žduchnutí správným směrem
          popisek(hrac.x, hrac.y - 54,
                  gravSmer === -1 ? 'GRAVITACE NAHORU!' : 'GRAVITACE ZPÁTKY!',
                  gravSmer === -1 ? '#c58cff' : '#74d4ff');
          for (let q = 0; q < 3; q++)
            bum(hrac.x, hrac.y + nah(-30, 30), gravSmer === -1 ? '#c58cff' : '#74d4ff', 14, 320);
          zvuk.portal(gravSmer === -1);
        }
        zablesk = .3; zatres(8);
        statPortaly++;
        pripisBod(1);
      }

    } else if (p.typ === 'strasak'){
      const vrsek = ZEM - p.v;
      if (Math.abs(p.x - hrac.x) < 150)
        p.nejbliz = Math.min(p.nejbliz, Math.hypot(hrac.x - p.x, hrac.y - vrsek));
      if (kruhBox(hrac.x, hrac.y, r * .9, p.x - 15, vrsek, 30, p.v)){
        if (turbo > 0){ rozbij(p, i, {x: p.x, y: vrsek}); continue; }
        zasah('SLÁMA!');
      }
      if (!p.bod && p.x + 20 < hrac.x){
        p.bod = true;
        if (p.nejbliz < 78){                       // proletěl jsi mu těsně kolem klobouku
          skore += 5; kombo++;
          popisek(hrac.x, hrac.y - 48, 'TĚSNĚ! +5', '#ffd166');
          bum(p.x, vrsek, '#ffd166', 14, 240);
          zvuk.bonus();
        } else pripisBod(1);
      }

    } else if (p.typ === 'zrno'){
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r + 6){
        prekazky.splice(i, 1);
        zrnka++; skore += 3;
        bum(p.x, p.y, '#ffd166', 12, 200);
        if (boss && boss.typ === 'vlk' && naboje < 3){
          naboje++;
          popisek(p.x, p.y - 24, 'KUKUŘICE ' + naboje + '/3', '#ffe066');
        } else popisek(p.x, p.y - 22, '+3', '#ffe066');
        zvuk.zrno();
        continue;
      }

    } else if (p.typ === 'pirko'){
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r + 8){ seberPirko(p, i); continue; }

    } else if (p.typ === 'vlna'){
      const y0 = p.kde === 'zem' ? ZEM - p.v : p.y - p.v/2;
      if (kruhBox(hrac.x, hrac.y, r * .8, p.x - 24, y0, 48, p.v)){
        if (turbo > 0){ bum(p.x, hrac.y, '#c9a0ff', 20, 300); prekazky.splice(i, 1); continue; }
        zasah('ZVUKOVÁ VLNA!');
        bum(p.x, hrac.y, '#c9a0ff', 16, 280);
        prekazky.splice(i, 1); continue;
      }

    } else if (p.typ === 'pavoucek'){
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r - 6){
        if (turbo > 0){ rozbij(p, i, p); continue; }
        zasah('PAVOUČEK!');
        prekazky.splice(i, 1); continue;
      }

    } else if (p.typ === 'sit'){
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r - 10){
        prekazky.splice(i, 1);
        if (turbo > 0){ bum(p.x, p.y, '#e8f7ff', 18, 300); continue; }
        lepkavy = 2.4;
        popisek(hrac.x, hrac.y - 42, 'PAVUČINA!', '#d6f2ff');
        bum(p.x, p.y, '#e8f7ff', 16, 240);
        zvuk.tuk();
        continue;
      }

    } else if (p.typ === 'strela'){
      if (p.vraceno){                                   // letí zpátky na lišku
        if (boss && boss.typ === 'liska' && boss.stav === 'utoci' && p.x > boss.x - 84){
          bossZasah(boss);
          bum(boss.x - 60, boss.y, '#fff3c4', 24, 360);
          prekazky.splice(i, 1); continue;
        }
      } else if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r - 3){
        if (turbo > 0){                                 // s turbem ji odpálíš zpátky
          p.vraceno = true; p.vx = 720; p.faze = 0;
          bum(p.x, p.y, '#ffd166', 16, 300);
          popisek(p.x, p.y - 34, 'ODPÁLENO!', '#ffe066');
          zvuk.pukanec(); zatres(5);
          continue;
        }
        prekazky.splice(i, 1);
        bum(p.x, p.y, '#fff3c4', 14, 260);
        zasah(p.ohniva ? 'OHNIVÝ POPCORN!' : 'POPCORN!');
        continue;
      }

    } else if (p.typ === 'koule'){
      if (Math.hypot(hrac.x - p.x, hrac.y - p.y) < r + p.r - 8){
        if (turbo > 0){
          bum(p.x, p.y, '#ffd166', 34, 460); bum(p.x, p.y, '#ff7a2f', 24, 380);
          popisek(p.x, p.y - 50, 'ROZBITÁ!', '#ffe066');
          zatres(14); zvuk.bossAu();
          prekazky.splice(i, 1); continue;
        }
        zasah('OHNIVÁ KOULE!');
        prekazky.splice(i, 1); continue;
      }

    } else if (p.typ === 'kruh'){
      // kruh je jako obruč: vadí jen ve chvíli, kdy jeho rovinou prolétáš
      const dx = Math.abs(hrac.x - p.x), dy = Math.abs(hrac.y - p.y);
      if (!p.vraceno){
        if (dx < 18 + r){
          if (dy < p.dira - r * .5){                 // trefil jsi díru = projdeš
            if (turbo > 0 && boss && boss.typ === 'kohout' && boss.stav === 'utoci'){
              p.vraceno = true; p.vx = 660;
              popisek(p.x, p.y - 50, 'VRÁTIL JSI MU TO!', '#ffd166');
              bum(p.x, p.y, '#ffd166', 22, 340);
              zvuk.turbo(); zatres(7);
            }
          } else if (dy < p.r + r * .6){             // narazil jsi do ohnivé obruče
            if (turbo > 0){ bum(p.x, p.y, '#ff7a2f', 22, 320); prekazky.splice(i, 1); continue; }
            zasah('OHNIVÝ KRUH!');
            prekazky.splice(i, 1); continue;
          }
        }
      } else if (boss && boss.stav === 'utoci' && p.x > boss.x - 100){
        bossZasah(boss);
        bum(boss.x, boss.y, '#ff7a2f', 26, 380);
        prekazky.splice(i, 1); continue;
      }
    }

    if (p.x < -240 || p.x > Š + 420 || p.y > V + 120) prekazky.splice(i, 1);
  }

  // --- srážka s bossem ---
  if (boss && boss.stav !== 'odlet'){
    const b = boss;
    if (b.typ === 'liska'){
      if (kruhBox(hrac.x, hrac.y, r, b.x - 74, b.y - 40, 148, 80)){
        if (turbo > 0 && b.stav !== 'zasazena') bossZasah(b);
        else zasah('LETADLO!');
      }

    } else if (b.typ === 'vlk'){
      // shodíš mu kukuřici do bubnu — proleť těsně nad ním
      if (b.stav === 'utoci' && naboje > 0 &&
          Math.abs(hrac.x - (b.x - 26)) < 52 && hrac.y > b.y - 120 && hrac.y < b.y - 26){
        naboje--;
        popisek(b.x - 26, b.y - 70, 'KUKUŘICE DO BUBNU!', '#ffe066');
        bum(b.x - 26, b.y - 30, '#ffd166', 24, 320);
        bossZasah(b);
      }
      if (kruhBox(hrac.x, hrac.y, r * .9, b.x - 46, b.y - 26, 96, 62)){
        if (turbo > 0 && b.stav !== 'zasazena') bossZasah(b);
        else zasah('VLK!');
      }

    } else if (b.typ === 'pavouk'){
      // s turbem přeletíš její vlákna a přestřihneš je
      if (b.stav === 'utoci' && turbo > 0){
        for (let k = 0; k < b.zivoty; k++){
          const vx = b.x - 62 + k * 62;
          if (Math.abs(hrac.x - vx) < 18 && hrac.y > b.y + 20 && hrac.y < 350){
            popisek(vx, hrac.y - 40, 'PŘESTŘIŽENO!', '#a0ffc9');
            bum(vx, hrac.y, '#d6f2ff', 20, 300);
            zvuk.rez();
            bossZasah(b);
            break;
          }
        }
      }
      if (Math.hypot(hrac.x - b.x, hrac.y - b.y) < r + 42){
        if (turbo > 0 && b.stav !== 'zasazena') bossZasah(b);
        else zasah('PAVOUČÍ KRÁLOVNA!');
      }

    } else if (b.typ === 'kohout'){
      if (kruhBox(hrac.x, hrac.y, r * .9, b.x - 52, b.y - 74, 112, 150)){
        if (turbo > 0 && b.stav !== 'zasazena') bossZasah(b);
        else zasah('KOHOUT!');
      }
    }
  }
}

// ============ KRESLENÍ ============
// Všechno je kreslené tvary — žádné emoji, takže to vypadá stejně všude.

let posunHory = 0, posunStromy = 0;

// --- malé pomůcky ---
// stín, který se zmenšuje a světlá, jak je věc vysoko nad zemí
function stinLetu(x, y, r, sila = 1){
  const t = omez((ZEM - y) / (ZEM - 60), 0, 1);
  stinPod(x - 10, ZEM + 5, r * (1.15 - t * .45), (.26 - t * .16) * sila);
}
function stinPrekazky(p){
  switch (p.typ){
    case 'trubka':
      stinPod(p.x + p.š * .35, ZEM + 5, p.š * .8, p.bonus ? .16 : .2);
      break;
    case 'pila':    stinLetu(p.x, p.y, p.r * 1.05); break;
    case 'ostny':
      stinPod(p.x + p.š * .4, ZEM + 5, p.š * .55, p.kde === 'nahore' ? .1 : .16);
      break;
    case 'netopyr': stinLetu(p.x, p.y, 20, .9); break;
    case 'zrno':    stinLetu(p.x, p.y, 11, .8); break;
    case 'pirko':   stinLetu(p.x, p.y, 14, .8); break;
    case 'vejce':   stinLetu(p.x, p.y, 12, .8); break;
    case 'strela':  stinLetu(p.x, p.y, 10, .7); break;
    case 'koule':   stinLetu(p.x, p.y, 30, 1.1); break;
    case 'pavoucek':stinLetu(p.x, p.y, 12, .8); break;
    case 'strasak': stinPod(p.x + 6, ZEM + 5, 30, .22); break;
    case 'portal':  stinPod(p.x, ZEM + 5, 26, .14); break;
  }
}

function stinPod(x, y, rx, a = .22){
  ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
  ctx.beginPath(); ctx.ellipse(x, y, rx, rx*.3, 0, 0, 7); ctx.fill();
}
function srdce(x, y, s, barva){
  ctx.fillStyle = barva;
  ctx.beginPath();
  ctx.moveTo(x, y + s*.85);
  ctx.bezierCurveTo(x - s*1.35, y - s*.25, x - s*.55, y - s*1.15, x, y - s*.35);
  ctx.bezierCurveTo(x + s*.55, y - s*1.15, x + s*1.35, y - s*.25, x, y + s*.85);
  ctx.fill();
}
function napis(text, x, y, barva, font, obrys = 5, obrysBarva = 'rgba(20,20,30,.62)'){
  ctx.font = font;
  ctx.globalAlpha = 1;
  if (obrys){ ctx.lineWidth = obrys; ctx.strokeStyle = obrysBarva; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y); }
  ctx.fillStyle = barva;
  ctx.fillText(text, x, y);
}
function obdelnikR(x, y, š, v, r, vypln, obrys = null, sila = 2){

const KOPCE_STROMY = [
  {m:1.00, jehl:false}, {m:.78, jehl:true},  {m:1.15, jehl:false},
  {m:.85, jehl:false},  {m:1.05, jehl:true}, {m:.72, jehl:false}, {m:.95, jehl:true}
];
const TRSY = [4, 9, 6, 12, 5, 8, 14, 7, 10, 6];
const CYKLUS = 130;                     // den → západ → noc → peklo → svítání → den
const NEBE_FAZE = [
  {t:0,   a:'#3f9bd6', b:'#7cc6ea', c:'#c6ecf8', tma:0},
  {t:.26, a:'#3f9bd6', b:'#7cc6ea', c:'#c6ecf8', tma:0},
  {t:.38, a:'#33407e', b:'#ff8c5a', c:'#ffd6a5', tma:.25},
  {t:.52, a:'#070c22', b:'#141f45', c:'#293a68', tma:.6},
  {t:.66, a:'#12000a', b:'#3d0410', c:'#6b0f16', tma:.62},
  {t:.78, a:'#20010c', b:'#6e0c18', c:'#c4381c', tma:.5},
  {t:.88, a:'#3a3a7a', b:'#c96a6a', c:'#ffc38a', tma:.22},
  {t:1,   a:'#3f9bd6', b:'#7cc6ea', c:'#c6ecf8', tma:0}
];
function cyklFaze(){
  if (stav === 'menu') return 0;
  const f = (((hodiny + cyklPosun) % CYKLUS) + CYKLUS) % CYKLUS;
  return f / CYKLUS;
}
function nocSila(){   return omez(1 - Math.abs(cyklFaze() - .54) / .16, 0, 1); }
function demonSila(){ return omez(1 - Math.abs(cyklFaze() - .72) / .13, 0, 1); }
function nebeTed(){
  const f = cyklFaze();
  let i = 0;
  while (i < NEBE_FAZE.length - 2 && f > NEBE_FAZE[i+1].t) i++;
  const A = NEBE_FAZE[i], B = NEBE_FAZE[i+1];
  const t = omez((f - A.t) / (B.t - A.t), 0, 1);
  return { a: mixBarev(A.a, B.a, t), b: mixBarev(A.b, B.b, t), c: mixBarev(A.c, B.c, t),
           tma: A.tma + (B.tma - A.tma) * t };
}

}

function kresliStrasidlo(st, y, sila, demon){
  ctx.save();
  ctx.globalAlpha = sila * .92;
  ctx.translate(st.x, y);
  ctx.scale(st.vel, st.vel);

  if (st.druh === 'kostlivec'){                  // --- kostlivá slepice, běží jen v pekle ---
    const skok = Math.abs(Math.sin(st.faze * 2.4)) * 6;
    ctx.translate(0, -skok);
    const K = 'rgba(240,236,224,.95)', T = 'rgba(40,20,24,.9)';
    ctx.strokeStyle = T; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    for (const sg of [-1, 1]){                                        // běžící nožky
      const f = Math.sin(st.faze * 5 + (sg > 0 ? 3.14 : 0)) * 8;
      ctx.beginPath(); ctx.moveTo(sg * 3, -6); ctx.lineTo(sg * 3 + f, 8); ctx.stroke();
      ctx.strokeStyle = K; ctx.lineWidth = 2.6; ctx.stroke();

    }
    ctx.fillStyle = T;                                                // tělo (obrys)
    ctx.beginPath(); ctx.ellipse(0, -18, 15, 12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = K;
    ctx.beginPath(); ctx.ellipse(0, -18, 12.5, 9.5, 0, 0, 7); ctx.fill();

    ctx.fillStyle = K;
    ctx.beginPath(); ctx.arc(-13, -32, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff7a2f';                                        // svítící oční jamky
    ctx.beginPath(); ctx.arc(-16, -33, 2.6, 0, 7); ctx.arc(-9, -33, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb347';                                        // zobák
    ctx.beginPath(); ctx.moveTo(-21, -31); ctx.lineTo(-31, -28); ctx.lineTo(-21, -26);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = K; ctx.lineWidth = 3;                           // kostěný ocásek
    ctx.beginPath(); ctx.moveTo(13, -22); ctx.lineTo(24, -30); ctx.stroke();

  } else if (st.druh === 'duch'){                // --- duch ---
    const bob = Math.sin(st.faze * .9) * 7;
    ctx.translate(0, bob - 26);
    const g = ctx.createRadialGradient(0, -4, 3, 0, 0, 30);
    g.addColorStop(0, 'rgba(220,240,255,.32)'); g.addColorStop(1, 'rgba(220,240,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(244,252,255,.95)';
    ctx.beginPath();
    ctx.moveTo(-13, 6);
    ctx.quadraticCurveTo(-13, -20, 0, -20);
    ctx.quadraticCurveTo(13, -20, 13, 6);
    for (let i = 0; i < 4; i++){                 // vlnitý spodek
      const x1 = 13 - i * 6.5, x2 = 13 - (i + .5) * 6.5;
      ctx.quadraticCurveTo(x2, 6 + (i % 2 ? -6 : 6) + Math.sin(st.faze * 3 + i) * 2, x1 - 6.5, 6);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,170,210,.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(30,40,70,.9)';         // očka a pusa
    ctx.beginPath(); ctx.ellipse(-4.5, -7, 2.6, 3.4, 0, 0, 7); ctx.ellipse(4.5, -7, 2.6, 3.4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 3, 2.4, 0, 0, 7); ctx.fill();

  } else if (st.druh === 'certik'){              // --- čertík s vidlemi ---
    const skok = Math.abs(Math.sin(st.faze * 2)) * 5;
    ctx.translate(0, -skok);
    const zg = ctx.createRadialGradient(0, -22, 4, 0, -22, 34);              // rudá aura
    zg.addColorStop(0, 'rgba(255,80,30,.28)'); zg.addColorStop(1, 'rgba(255,80,30,0)');
    ctx.fillStyle = zg; ctx.beginPath(); ctx.arc(0, -22, 34, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(28,4,8,.96)';
    ctx.beginPath(); ctx.ellipse(0, -14, 10, 13, 0, 0, 7); ctx.fill();         // tělo
    ctx.beginPath(); ctx.arc(0, -28, 9, 0, 7); ctx.fill();                     // hlava
    for (const sg of [-1, 1]){                                                 // rohy
      ctx.beginPath(); ctx.moveTo(sg*3, -34); ctx.lineTo(sg*8, -45); ctx.lineTo(sg*9, -32);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(24,6,10,.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const sg of [-1, 1]){                                                 // běžící nohy
      const f = Math.sin(st.faze * 4 + (sg > 0 ? 3.14 : 0)) * 6;
      ctx.beginPath(); ctx.moveTo(sg * 3, -4); ctx.lineTo(sg * 3 + f, 6); ctx.stroke();
    }
    ctx.beginPath();                                                            // ocásek
    ctx.moveTo(8, -16); ctx.quadraticCurveTo(20, -14 + Math.sin(st.faze*3)*4, 16, -26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, -18); ctx.lineTo(-19, -34); ctx.stroke();   // vidle
    ctx.beginPath(); ctx.moveTo(-23, -30); ctx.lineTo(-16, -38); ctx.moveTo(-19, -28); ctx.lineTo(-12, -36);
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ff7a2f';                                                  // svítící očka
    ctx.beginPath(); ctx.arc(-3, -29, 2.2, 0, 7); ctx.arc(3.5, -29, 2.2, 0, 7); ctx.fill();

  } else if (st.druh === 'ocka'){                // --- očka v křoví ---
    const otev = omez(st.mrk < 0 ? 0 : 1, 0, 1);
    if (otev <= 0){ ctx.restore(); return; }
    const bar = demon > .4 ? '255,120,40' : '255,225,120';
    for (const ox of [-6, 6]){
      const g = ctx.createRadialGradient(ox, -6, 0, ox, -6, 13);
      g.addColorStop(0, 'rgba(' + bar + ',.85)'); g.addColorStop(1, 'rgba(' + bar + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, -6, 13, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(' + bar + ',.95)';
      ctx.beginPath(); ctx.ellipse(ox, -6, 3.4, 2.6, 0, 0, 7); ctx.fill();
    }

  } else {                                       // --- bludička ---
    const bob = Math.sin(st.faze * 1.3) * 16;
    const bar = demon > .4 ? '255,140,60' : '150,230,255';
    ctx.translate(0, bob - 40);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 22);

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(' + bar + ',.28)';

      ctx.beginPath();
      ctx.arc(i * 5, -Math.sin(st.faze * 1.3 - i * .4) * 8 + bob * .2, 3.4 - i * .8, 0, 7);
      ctx.fill();
    }
  }
  ctx.restore();
}

function tvarKopce(vyska, vlna, delitel, posun, absolutni, faze = 0){
  ctx.beginPath(); ctx.moveTo(-140, ZEM);
  for (let x = -140; x <= Š + 380; x += 16){
    const sn = Math.sin(x / delitel + faze);
    ctx.lineTo(x - posun, ZEM - vyska - (absolutni ? Math.abs(sn) : sn) * vlna);
  }
  ctx.lineTo(Š + 380, ZEM); ctx.closePath();
}
