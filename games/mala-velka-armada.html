function kresliPozadi(dt){
  // obloha
  const o = ctx.createLinearGradient(0, 0, 0, V);
  for (const [barva, kde] of PZ.nebe) o.addColorStop(kde, barva);
  ctx.fillStyle = o; ctx.fillRect(-200, -200, Š+400, V+400);

  // polární záře / nebula
  if (PZ.zare){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++){
      const g = ctx.createLinearGradient(0, 20+i*26, 0, 150+i*26);
      g.addColorStop(0, ['rgba(70,220,180,.16)','rgba(120,140,255,.13)','rgba(230,120,220,.10)'][i]);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, 150+i*26);
      for (let x = 0; x <= Š; x += 40)
        ctx.lineTo(x, 40 + i*24 + Math.sin(x/150 + cas*.35 + i)*22);
      ctx.lineTo(Š, 150+i*26); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // hvězdy
  if (PZ.hvezdy){
    for (const h of hvezdy){
      ctx.globalAlpha = .2 + Math.abs(Math.sin(cas*2 + h.f))*.6;
      ctx.fillStyle = '#dfeaff';
      ctx.fillRect(h.x, h.y + (ujeto*.008 % 200), h.r, h.r);
    }
    ctx.globalAlpha = 1;
    const ph = padajiciHvezda;
    if (!ph.aktivni){
      ph.cd -= dt;
      if (ph.cd <= 0){ ph.aktivni = true; ph.x = nah(100, Š-100); ph.y = nah(10, 60);
                       ph.vx = nah(-260,-120); ph.vy = nah(60,120); ph.t = 1; }
    } else {
      ph.x += ph.vx*dt; ph.y += ph.vy*dt; ph.t -= dt*.8;
      ctx.globalAlpha = Math.max(0, ph.t);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ph.x, ph.y);
      ctx.lineTo(ph.x - ph.vx*.14, ph.y - ph.vy*.14); ctx.stroke();
      ctx.globalAlpha = 1;
      if (ph.t <= 0){ ph.aktivni = false; ph.cd = nah(5, 14); }
    }
  }
  // těleso na nebi
  if (PZ.telo === 'mesic'){
    const mg = ctx.createRadialGradient(824, 62, 4, 832, 72, 34);
    mg.addColorStop(0, '#fffdf0'); mg.addColorStop(1, '#c3cfe6');
    ctx.beginPath(); ctx.arc(832, 72, 28, 0, TAU); ctx.fillStyle = mg; ctx.fill();
    ctx.fillStyle = 'rgba(150,160,185,.35)';
    ctx.beginPath(); ctx.arc(824, 66, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(840, 80, 4.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = .1; ctx.fillStyle = '#cfe0ff';
    ctx.beginPath(); ctx.arc(832, 72, 62, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (PZ.telo === 'slunce'){
    ctx.globalCompositeOperation = 'lighter';
    const sg = ctx.createRadialGradient(830, 68, 6, 830, 68, 90);
    sg.addColorStop(0, 'rgba(255,255,230,.95)');
    sg.addColorStop(.35, 'rgba(255,225,140,.55)');
    sg.addColorStop(1, 'rgba(255,200,90,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(830, 68, 90, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath(); ctx.arc(830, 68, 30, 0, TAU);
    ctx.fillStyle = '#fff6c9'; ctx.fill();
  } else if (PZ.telo === 'planeta'){
    const pg = ctx.createRadialGradient(816, 58, 8, 830, 70, 46);
    pg.addColorStop(0, '#ffb27a'); pg.addColorStop(.6, '#c9603a'); pg.addColorStop(1, '#5c2418');
    ctx.beginPath(); ctx.arc(830, 70, 40, 0, TAU); ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,180,.5)'; ctx.lineWidth = 6;
    ctx.save(); ctx.translate(830, 70); ctx.rotate(-.4); ctx.scale(1, .28);
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // mraky
  if (PZ.id !== 'vesmir'){
    for (const m of mraky){
      m.x += m.s*dt;
      if (m.x > Š+120) m.x = -140;
      ctx.globalAlpha = PZ.id === 'den' ? .5 : .16;
      ctx.fillStyle = PZ.id === 'lava' ? '#5c3020' : (PZ.id === 'den' ? '#ffffff' : '#8fa4d0');
      for (let i = 0; i < 4; i++){
        ctx.beginPath();
        ctx.ellipse(m.x + i*m.š*.22, m.y + Math.sin(i)*4, m.š*.3, m.v, 0, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  // vzdálené hory
  const p1 = (ujeto*.014) % 30;
  ctx.fillStyle = PZ.hory1;
  ctx.beginPath(); ctx.moveTo(0, 210+p1);
  for (const h of horyDaleke){ ctx.lineTo(h.x, 210+p1-h.v); ctx.lineTo(h.x + h.š/2, 210+p1); }
  ctx.lineTo(Š, 210+p1); ctx.lineTo(Š, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  // bližší kopce
  const p2 = (ujeto*.05) % 40;
  const kg = ctx.createLinearGradient(0, 150, 0, 240);
  kg.addColorStop(0, PZ.hory2a); kg.addColorStop(1, PZ.hory2b);
  ctx.fillStyle = kg;
  ctx.beginPath(); ctx.moveTo(0, 238+p2);
  for (const h of horyBlizke){ ctx.lineTo(h.x, 238+p2-h.v); ctx.lineTo(h.x + h.š/2, 238+p2); }
  ctx.lineTo(Š, 238+p2); ctx.lineTo(Š, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  // voda / písek / láva okolo trati
  const vg = ctx.createLinearGradient(0, 200, 0, V);
  vg.addColorStop(0, PZ.voda1); vg.addColorStop(1, PZ.voda2);
  ctx.fillStyle = vg; ctx.fillRect(-200, 200, Š+400, V+200);
  if (PZ.odraz){
    ctx.globalAlpha = .12; ctx.fillStyle = '#cfe0ff';
    for (let i = 0; i < 7; i++){
      const y = 230 + i*36 + Math.sin(cas*2 + i)*4, š = 44 - i*4;
      ctx.fillRect(832 - š/2, y, š, 4);
    }
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = PZ.vlnka; ctx.lineWidth = 2;
  for (let i = 0; i < 20; i++){
    const y = ((ujeto*.55 + i*62) % (V+140)) + 190;
    const š = 34 + Math.sin(i*2 + cas)*16;
    ctx.beginPath(); ctx.moveTo(18 + Math.sin(i+cas)*8, y); ctx.lineTo(18+š, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(Š-18-š, y); ctx.lineTo(Š-18 + Math.sin(i+cas)*8, y); ctx.stroke();
  }
  // poletující drobnosti podle světa
  const typ = PZ.prach;
  if (typ){
    if (typ === 'svetlusky' || typ === 'jiskry' || typ === 'motyli') ctx.globalCompositeOperation = 'lighter';
    for (const d of drobnosti){
      const bl = (Math.sin(cas*2.4 + d.f)+1)/2;
      if (typ === 'snih'){
        const x = (d.x + Math.sin(cas*.6 + d.f)*26) % Š;
        const y = (d.y + ujeto*.5 + cas*40*d.v) % (V+30) - 15;
        ctx.globalAlpha = .75;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, d.r, 0, TAU); ctx.fill();
      } else if (typ === 'pisek'){
        const x = (d.x + cas*90*d.v) % (Š+40) - 20;
        const y = d.y*.6 + 200 + Math.sin(cas*2 + d.f)*8;
        ctx.globalAlpha = .25;
        ctx.fillStyle = '#fff0cc';
        ctx.fillRect(x, y, d.r*4, 1.6);
      } else if (typ === 'jiskry'){
        const x = (d.x + Math.sin(cas + d.f)*20) % Š;
        const y = (V - (d.y + cas*70*d.v) % (V+40));
        ctx.globalAlpha = .25 + bl*.5;
        ctx.fillStyle = '#ffb03a';
        ctx.beginPath(); ctx.arc(x, y, d.r*.9, 0, TAU); ctx.fill();
      } else if (typ === 'motyli'){
        const x = (d.x*.15 + 14 + Math.sin(cas*1.4 + d.f)*20);
        const y = (d.y + ujeto*.12) % (V+40) - 20;
        ctx.globalAlpha = .5;
        ctx.fillStyle = '#fff3a0';
        ctx.beginPath(); ctx.ellipse(x, y, d.r*1.6, d.r*.8, Math.sin(cas*8+d.f), 0, TAU); ctx.fill();
        const x2 = Š - x;
        ctx.beginPath(); ctx.ellipse(x2, y, d.r*1.6, d.r*.8, -Math.sin(cas*8+d.f), 0, TAU); ctx.fill();
      } else {
        ctx.globalAlpha = .15 + bl*.55;
        ctx.fillStyle = PZ.svetluska || '#c8ff9b';
        const x = d.x < Š/2 ? d.x*.13 + 10 : Š - 10 - (Š - d.x)*.13;
        const y = (d.y + ujeto*.12 + Math.sin(cas + d.f)*14) % (V+40) - 20;
        ctx.beginPath(); ctx.arc(x + Math.sin(cas*.8+d.f)*12, y, d.r, 0, TAU); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
}

// =====================================================================
//  PERSPEKTIVA — logika běží v rovné soustavě (ly), kreslí se do 3D
//  ly = PY  ... přímo u party      ly = hodně malé ... daleko vepředu
// =====================================================================
const POHLEDY = [
  { id:'zezadu', jmeno:'3D ZEZADU', horizont:162, ohnisko:880,   vpx:0,    kopce:1 },
  { id:'zleva',  jmeno:'3D ZLEVA',  horizont:180, ohnisko:820,   vpx:-250, kopce:1 },
  { id:'zprava', jmeno:'3D ZPRAVA', horizont:180, ohnisko:820,   vpx:250,  kopce:1 },
  { id:'shora',  jmeno:'SHORA (2D)',horizont:-60, ohnisko:99999, vpx:0,    kopce:0, ortho:true }
];
let pohledIndex = 0;
let HORIZONT = 162, OHNISKO = 880, VPX = 0, ORTHO = false, KAMKOPCE = 1;
function nastavPohled(){
  const k = POHLEDY[pohledIndex];
  HORIZONT = k.horizont; OHNISKO = k.ohnisko; VPX = k.vpx;
  ORTHO = !!k.ortho; KAMKOPCE = k.kopce;
}
let kamX = 0, kamNaklon = 0;      // kamera se posouvá a naklání s partou
function skala(ly){ return OHNISKO / (PY - ly + OHNISKO); }
// kopce: trať se vlní nahoru a dolů
function terenVys(ly){
  const a = (PZ && PZ.kopce !== undefined) ? PZ.kopce : 1;
  if (!a) return 0;
  const wy = ujeto + (PY - ly);
  return (Math.sin(wy*.0016)*30 + Math.sin(wy*.00068 + 1.3)*18) * a;
}
function proj(x, ly){
  if (ORTHO) return { x, y: ly, s: 1 };
  const s = skala(ly);
  const h = (terenVys(ly) - terenVys(PY)) * s * KAMKOPCE;
  return { x: Š/2 + VPX*(1 - s) + (x - Š/2 - kamX)*s,
           y: PY - (PY - HORIZONT)*(1 - s) - h, s };
}
function projY(ly){ return proj(0, ly).y; }
// pomocník: čtyřúhelník mezi dvěma hloubkami
function pruhTrate(x1, x2, lyA, lyB, barva){
  const a1 = proj(x1, lyA), a2 = proj(x2, lyA);
  const b1 = proj(x1, lyB), b2 = proj(x2, lyB);
  ctx.beginPath();
  ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y);
  ctx.lineTo(b2.x, b2.y); ctx.lineTo(b1.x, b1.y);
  ctx.closePath();
  ctx.fillStyle = barva; ctx.fill();
}

function kresliStrom(x, y, druh, faze, m){
  const co = PZ.dekor[druh] || 'kamen';
  ctx.save();
  ctx.translate(x, y);
  if (m !== 1) ctx.scale(m, m);
  x = 0; y = 0;
  stin(x, y+12, 15, 5);
  if (co === 'jehlicnan'){
    ctx.fillStyle = PZ.kmen; ctx.fillRect(x-3, y, 6, 13);
    const ohyb = Math.sin(faze)*2;
    for (let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(x + ohyb*(3-i)*.3, y-36+i*12);
      ctx.lineTo(x-17+i*2, y-6+i*6);
      ctx.lineTo(x+17-i*2, y-6+i*6);
      ctx.closePath(); ctx.fillStyle = PZ.listy[i]; ctx.fill();
    }
    if (PZ.id === 'ledova'){
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 3; i++){
        ctx.beginPath();
        ctx.moveTo(x, y-34+i*12); ctx.lineTo(x-11+i*2, y-16+i*6); ctx.lineTo(x+11-i*2, y-16+i*6);
        ctx.closePath(); ctx.fill();
      }
    }
  } else if (co === 'listnac'){
    ctx.fillStyle = PZ.kmen; ctx.fillRect(x-3.5, y-6, 7, 18);
    const ohyb = Math.sin(faze)*2;
    for (const k of [[-9,-16,11],[9,-15,10],[0,-25,13],[0,-12,11]]){
      ctx.beginPath();
      ctx.arc(x + k[0] + ohyb*.4, y + k[1], k[2], 0, TAU);
      ctx.fillStyle = PZ.listy[k[2] % 3]; ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.arc(x-6, y-28, 5, 0, TAU); ctx.fill();
  } else if (co === 'kaktus'){
    const g = ctx.createLinearGradient(x-10, 0, x+10, 0);
    g.addColorStop(0, PZ.listy[2]); g.addColorStop(1, PZ.listy[0]);
    ctx.fillStyle = g;
    zaobleny(ctx, x-8, y-34, 16, 46, 8); ctx.fill();
    zaobleny(ctx, x-20, y-20, 12, 9, 4); ctx.fill();
    zaobleny(ctx, x-20, y-24, 8, 16, 4); ctx.fill();
    zaobleny(ctx, x+8, y-28, 12, 9, 4); ctx.fill();
    zaobleny(ctx, x+12, y-34, 8, 16, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 4; i++){
      ctx.beginPath(); ctx.moveTo(x-4, y-28+i*10); ctx.lineTo(x+4, y-28+i*10); ctx.stroke();
    }
  } else if (co === 'suchy'){
    ctx.strokeStyle = PZ.listy[0]; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y+10); ctx.lineTo(x, y-26); ctx.stroke();
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(x, y-10); ctx.lineTo(x-13, y-22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y-18); ctx.lineTo(x+12, y-30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y-4); ctx.lineTo(x+10, y-12); ctx.stroke();
  } else if (co === 'led'){
    const g = ctx.createLinearGradient(x, y-32, x, y+10);
    g.addColorStop(0, PZ.krystal[0]); g.addColorStop(1, PZ.krystal[1]);
    ctx.beginPath();
    ctx.moveTo(x, y-34); ctx.lineTo(x+9, y-6); ctx.lineTo(x+2, y+10);
    ctx.lineTo(x-7, y+8); ctx.lineTo(x-10, y-8);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.globalAlpha = .5; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(x, y-34); ctx.lineTo(x+3, y-6); ctx.lineTo(x, y+9); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (co === 'asteroid'){
    const g = ctx.createLinearGradient(x-16, y-16, x+16, y+12);
    g.addColorStop(0, PZ.kamen[0]); g.addColorStop(1, PZ.kamen[1]);
    ctx.beginPath();
    ctx.moveTo(x-16, y+6); ctx.lineTo(x-14, y-10); ctx.lineTo(x-2, y-18);
    ctx.lineTo(x+13, y-12); ctx.lineTo(x+16, y+2); ctx.lineTo(x+6, y+11);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    for (const k of [[-6,-6,4],[5,0,3],[-2,5,2.4]]){
      ctx.beginPath(); ctx.arc(x+k[0], y+k[1], k[2], 0, TAU); ctx.fill();
    }
  } else if (co === 'kvetina'){
    ctx.strokeStyle = '#3f9448'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y+10); ctx.lineTo(x + Math.sin(faze)*3, y-14); ctx.stroke();
    const cx = x + Math.sin(faze)*3, cy = y-18;
    for (let i = 0; i < 6; i++){
      const a = i/6*TAU + faze*.2;
      ctx.beginPath(); ctx.ellipse(cx + Math.cos(a)*7, cy + Math.sin(a)*7, 5, 4, a, 0, TAU);
      ctx.fillStyle = PZ.krystal[0]; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, TAU);
    ctx.fillStyle = '#ffd166'; ctx.fill();
  } else {
    const g = ctx.createLinearGradient(x-16, y-14, x+16, y+10);
    g.addColorStop(0, PZ.kamen[0]); g.addColorStop(1, PZ.kamen[1]);
    ctx.beginPath();
    ctx.moveTo(x-16, y+10); ctx.lineTo(x-12, y-8); ctx.lineTo(x+2, y-15);
    ctx.lineTo(x+15, y-4); ctx.lineTo(x+13, y+10);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.moveTo(x-12, y-8); ctx.lineTo(x+2, y-15); ctx.lineTo(x, y-3); ctx.fill();
  }
  ctx.restore();
}

function kresliCestu(){
  const KROK = 70, DALEKO = 3400;
  // cesta po segmentech, aby se vlnila přes kopce
  for (let d = -140; d < DALEKO; d += KROK){
    const lyA = PY - d, lyB = PY - (d + KROK);
    if (skala(lyB) < .045) break;
    pruhTrate(TRAT_L - 8, TRAT_R + 8, lyA, lyB, PZ.cesta[0]);
    pruhTrate(TRAT_L + 55, TRAT_R - 55, lyA, lyB, PZ.cesta[1]);
    pruhTrate(TRAT_L + 165, TRAT_R - 165, lyA, lyB, PZ.cesta[2]);
    if (Math.floor((d + ujeto) / KROK) % 2 === 0)
      pruhTrate(TRAT_L, TRAT_R, lyA, lyB, 'rgba(0,0,0,.05)');
  }
  // šipky na cestě
  for (let d = (ujeto % 200); d < 2800; d += 200){
    const ly = PY - d, sk = skala(ly);
    if (sk < .08) continue;
    const a = proj(STRED-42, ly + 32), b = proj(STRED, ly - 12), c = proj(STRED+42, ly + 32);
    ctx.strokeStyle = PZ.sipky; ctx.lineWidth = Math.max(1.5, 9*sk); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.stroke();
  }
  // zábradlí po segmentech
  for (let d = -140; d < 2600; d += KROK){
    const lyA = PY - d, lyB = PY - (d + KROK);
    if (skala(lyB) < .06) break;
    for (const kx of [TRAT_L - 22, TRAT_R + 10]){
      pruhTrate(kx, kx + 12, lyA, lyB, PZ.zabradli[1]);
      pruhTrate(kx, kx + 4, lyA, lyB, PZ.zabradli[0]);
    }
  }
  for (let d = (ujeto % 48); d < 2200; d += 48){
    const ly = PY - d, sk = skala(ly);
    if (sk < .1) continue;
    for (const kx of [TRAT_L - 26, TRAT_R + 8]){
      const q = proj(kx, ly);
      ctx.fillStyle = PZ.zabradli[2];
      ctx.fillRect(q.x, q.y - 22*sk, 20*sk, 11*sk);
    }
  }
  // lampy
  if (PZ.lampy) for (const l of lampy){
    const ly = PY - (l.wy - ujeto);
    const sk = skala(ly);
    if (sk < .12 || ly > V + 80) continue;
    const px = l.vpravo ? TRAT_R + 22 : TRAT_L - 22;
    const dir = l.vpravo ? -1 : 1;
    const p = proj(px, ly), kaluz = proj(px + dir*90, ly);
    const gl = ctx.createRadialGradient(kaluz.x, kaluz.y, 4, kaluz.x, kaluz.y, 160*sk);
    gl.addColorStop(0, 'rgba(' + PZ.lampaSvit + ',.32)');
    gl.addColorStop(1, 'rgba(' + PZ.lampaSvit + ',0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.ellipse(kaluz.x, kaluz.y, 160*sk, 60*sk, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#333c49';
    ctx.fillRect(p.x - 4*sk, p.y - 104*sk, 8*sk, 104*sk);
    ctx.strokeStyle = '#333c49'; ctx.lineWidth = Math.max(1, 6*sk);
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 100*sk);
    ctx.quadraticCurveTo(p.x + dir*28*sk, p.y - 108*sk, p.x + dir*38*sk, p.y - 90*sk);
    ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(' + PZ.lampaSvit + ',.9)';
    ctx.beginPath(); ctx.ellipse(p.x + dir*38*sk, p.y - 86*sk, 10*sk, 7*sk, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = .3;
    ctx.beginPath(); ctx.arc(p.x + dir*38*sk, p.y - 86*sk, 22*sk, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // budovy, mosty, stromy — všechno odzadu dopředu
  const okoli = [];
  for (const b of budovy){
    const ly = PY - (b.wy - ujeto);
    const sk = skala(ly);
    if (sk < .11 || ly > V + 120) continue;
    okoli.push({ sk, f: () => kresliBudovu(b, ly, sk) });
  }
  for (const m of mosty){
    const ly = PY - (m.wy - ujeto);
    const sk = skala(ly);
    if (sk < .06 || ly > V + 160) continue;
    okoli.push({ sk, f: () => kresliMost(m, ly, sk) });
  }
  for (const st of stromy){
    const ly = PY - (st.wy - ujeto);
    const sk = skala(ly);
    if (sk < .1 || ly > V + 80) continue;
    okoli.push({ sk, f: () => { const p = proj(st.x, ly);
      kresliStrom(p.x, p.y, st.druh, cas*1.5 + st.faze, sk); } });
  }
  okoli.sort((a, b) => a.sk - b.sk);
  for (const it of okoli) it.f();
  // mlha u horizontu
  const mlha = ctx.createLinearGradient(0, HORIZONT - 60, 0, HORIZONT + 130);
  mlha.addColorStop(0, PZ.mlhaPrefix + '.96)');
  mlha.addColorStop(1, PZ.mlhaPrefix + '0)');
  ctx.fillStyle = mlha; ctx.fillRect(0, HORIZONT - 60, Š, 190);
}

// ---------- budovy po stranách ----------
function kresliBudovu(b, ly, sk){
  ctx.globalAlpha = omez(sk*3.2, .25, 1);
  const px = b.strana < 0 ? TRAT_L - 90 - b.odsazeni : TRAT_R + 90 + b.odsazeni;
  const p = proj(px, ly);
  const š = b.sirka * sk, v = b.vyska * sk;
  const x = p.x - š/2, y = p.y - v;
  if (b.typ === 'mrakodrap'){
    const g = ctx.createLinearGradient(x, 0, x + š, 0);
    g.addColorStop(0, PZ.kamen[1]); g.addColorStop(.45, PZ.kamen[0]); g.addColorStop(1, PZ.kamen[1]);
    ctx.fillStyle = g; ctx.fillRect(x, y, š, v);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, 2*sk);
    ctx.strokeRect(x, y, š, v);
    // okna
    const ow = Math.max(2, š/7), oh = Math.max(2.5, v/16);
    for (let i = 0; i < 5; i++)
      for (let j = 0; j < 12; j++){
        if ((i*7 + j*13 + b.seed) % 5 === 0) continue;
        ctx.fillStyle = ((i + j + b.seed) % 3 === 0) ? 'rgba(255,224,150,.85)' : 'rgba(140,180,230,.25)';
        ctx.fillRect(x + 6*sk + i*(ow*1.35), y + 8*sk + j*(oh*1.5), ow*.8, oh*.8);
      }
    // střešní blikačka
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .5 + Math.abs(Math.sin(cas*3 + b.seed))*.5;
    ctx.fillStyle = '#ff5c7a';
    ctx.beginPath(); ctx.arc(p.x, y - 4*sk, Math.max(1.5, 4*sk), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  } else if (b.typ === 'pyramida'){
    const g = ctx.createLinearGradient(x, 0, x + š, 0);
    g.addColorStop(0, PZ.kamen[0]); g.addColorStop(1, PZ.kamen[1]);
    ctx.beginPath();
    ctx.moveTo(p.x, y); ctx.lineTo(x + š, p.y); ctx.lineTo(x, p.y);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.moveTo(p.x, y); ctx.lineTo(p.x, p.y); ctx.lineTo(x, p.y); ctx.closePath(); ctx.fill();
  } else if (b.typ === 'vez'){
    const g = ctx.createLinearGradient(x, 0, x + š, 0);
    g.addColorStop(0, PZ.zabradli[2]); g.addColorStop(.4, PZ.zabradli[0]); g.addColorStop(1, PZ.zabradli[2]);
    ctx.fillStyle = g; ctx.fillRect(x, y, š, v);
    // cimbuří
    for (let i = 0; i < 4; i++)
      ctx.fillRect(x + i*(š/4), y - 6*sk, š/6, 7*sk);
    // okénka
    ctx.fillStyle = 'rgba(255,214,140,.85)';
    for (let j = 0; j < 4; j++)
      ctx.fillRect(p.x - 3*sk, y + (12 + j*26)*sk, 6*sk, 9*sk);
  } else {   // domek
    ctx.fillStyle = PZ.kamen[0];
    ctx.fillRect(x, y + v*.35, š, v*.65);
    ctx.fillStyle = PZ.krystal[1];
    ctx.beginPath();
    ctx.moveTo(x - 4*sk, y + v*.35); ctx.lineTo(p.x, y); ctx.lineTo(x + š + 4*sk, y + v*.35);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,224,150,.85)';
    ctx.fillRect(p.x - 4*sk, y + v*.6, 8*sk, 9*sk);
  }
  ctx.globalAlpha = 1;
}

// ---------- most přes trať ----------
function kresliMost(m, ly, sk){
  const l = proj(TRAT_L - 70, ly), r = proj(TRAT_R + 70, ly);
  const vys = 150*sk, tl = 34*sk;
  // pilíře
  ctx.fillStyle = PZ.zabradli[2];
  ctx.fillRect(l.x - 14*sk, l.y - vys, 26*sk, vys + 10*sk);
  ctx.fillRect(r.x - 12*sk, r.y - vys, 26*sk, vys + 10*sk);
  // deska
  const g = ctx.createLinearGradient(0, l.y - vys - tl, 0, l.y - vys);
  g.addColorStop(0, PZ.zabradli[0]); g.addColorStop(1, PZ.zabradli[2]);
  ctx.fillStyle = g;
  ctx.fillRect(l.x - 14*sk, l.y - vys - tl, (r.x - l.x) + 40*sk, tl);
  // zábradlíčko na mostě
  ctx.fillStyle = PZ.zabradli[1];
  ctx.fillRect(l.x - 14*sk, l.y - vys - tl - 8*sk, (r.x - l.x) + 40*sk, 6*sk);
  // světla pod mostem
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i <= 4; i++){
    const x = l.x + ((r.x - l.x)/4)*i;
    ctx.globalAlpha = .35;
    ctx.fillStyle = 'rgba(' + PZ.lampaSvit + ',1)';
    ctx.beginPath(); ctx.arc(x, l.y - vys + 6*sk, Math.max(1.5, 6*sk), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // nápis na mostě
  if (sk > .35) napis(m.nadpis, (l.x + r.x)/2, l.y - vys - tl/2, Math.max(9, 20*sk), '#e8edf7');
}

function kresliSrazky(){
  if (!PZ.srazky) return;
  if (PZ.srazky === 'snih'){
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const k of kapky){
      const x = (k.x + Math.sin(cas*.7 + k.f)*30 + Š) % Š;
      const y = (k.y + cas*k.v*1.6 + ujeto*.35) % (V+30) - 15;
      ctx.beginPath(); ctx.arc(x, y, k.r*.75, 0, TAU); ctx.fill();
    }
  } else {
    ctx.globalCompositeOperation = 'lighter';
    for (const k of kapky){
      const x = (k.x + Math.sin(cas*1.2 + k.f)*24 + Š) % Š;
      const y = V - ((k.y + cas*k.v*1.3) % (V+40));
      ctx.globalAlpha = .3 + Math.abs(Math.sin(cas*3 + k.f))*.45;
      ctx.fillStyle = '#ffb03a';
      ctx.beginPath(); ctx.arc(x, y, k.r*.7, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}

// ---------- branky ----------
function kresliBranku(g){
  const ly = PY - (g.y - ujeto);
  const s = skala(ly);
  if (s < .1 || ly > V + 60) return;
  for (const p of [g.levo, g.pravo]){
    const zb = p.op.typ === 'zbran';
    const b  = zb ? '#8b6bff' : (p.op.dobra ? '#27b866' : '#ff4257');
    const b2 = zb ? '#d9caff' : (p.op.dobra ? '#8bf3b6' : '#ffa1ae');
    const l = proj(p.x1, ly), r = proj(p.x2, ly);
    const vys = 92*s;
    // světelná stěna
    const gr = ctx.createLinearGradient(0, l.y - vys, 0, l.y);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, b);
    ctx.globalAlpha = g.prosla ? .05 : .22;
    ctx.fillStyle = gr;
    ctx.fillRect(l.x + 4*s, l.y - vys, (r.x - l.x) - 8*s, vys);
    ctx.globalAlpha = 1;
    // rám dole
    const rg = ctx.createLinearGradient(0, l.y - 14*s, 0, l.y + 6*s);
    rg.addColorStop(0, b2); rg.addColorStop(.45, b); rg.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = rg;
    ctx.fillRect(l.x, l.y - 13*s, r.x - l.x, 20*s);
    // sloupky
    ctx.fillStyle = b2;
    ctx.fillRect(l.x + 2*s, l.y - vys, 10*s, vys);
    ctx.fillRect(r.x - 12*s, l.y - vys, 10*s, vys);
    if (!g.prosla){
      const cx = (l.x + r.x)/2;
      const št = 180*s, vt = 50*s;
      ctx.fillStyle = 'rgba(6,10,20,.6)';
      zaobleny(ctx, cx - št/2, l.y - vys + 14*s, št, vt, 10*s); ctx.fill();
      ctx.strokeStyle = b2; ctx.lineWidth = Math.max(1, 2.5*s);
      zaobleny(ctx, cx - št/2, l.y - vys + 14*s, št, vt, 10*s); ctx.stroke();
      napis(p.op.text, cx, l.y - vys + 14*s + vt/2, Math.max(9, (zb ? 26 : 42)*s), '#fff');
    }
  }
}

function kresliRadu(r){
  const ly = PY - (r.y - ujeto);
  const s = skala(ly);
  if (s < .1 || ly > V + 60) return;
  const l = proj(r.x1, ly), q = proj(r.x2, ly);
  ctx.globalAlpha = r.prosla ? .13 : 1;
  const g = ctx.createLinearGradient(0, l.y - 26*s, 0, l.y + 16*s);
  g.addColorStop(0, '#ffd479'); g.addColorStop(.5, '#f0a02a'); g.addColorStop(1, '#b46a10');
  ctx.fillStyle = g;
  zaobleny(ctx, l.x, l.y - 26*s, q.x - l.x, 42*s, 8*s); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(l.x + 6*s, l.y - 22*s, (q.x - l.x) - 12*s, 5*s);
  napis(r.op.text, (l.x + q.x)/2, l.y - 4*s, Math.max(9, 25*s), '#fff');
  ctx.globalAlpha = 1;
}

function kresliZed(z){
  if (z.hotovo) return;
  const ly = PY - (z.wy - ujeto);
  const s = skala(ly);
  if (s < .1 || ly > V + 60) return;
  const podil = omez(z.hp/z.plny, 0, 1);
  const l = proj(z.x - z.sirka/2, ly), r = proj(z.x + z.sirka/2, ly);
  const š = r.x - l.x, vys = 58*s;
  stin((l.x+r.x)/2, l.y + 16*s, š/2, 9*s, .3);
  const g = ctx.createLinearGradient(0, l.y - vys, 0, l.y + 14*s);
  g.addColorStop(0, z.blik > 0 ? '#ffffff' : '#b9b2a4');
  g.addColorStop(1, z.blik > 0 ? '#e8e8e8' : '#6e6659');
  ctx.fillStyle = g;
  zaobleny(ctx, l.x, l.y - vys, š, vys + 14*s, 7*s); ctx.fill();
  ctx.strokeStyle = 'rgba(30,26,20,.55)'; ctx.lineWidth = Math.max(1, 3*s);
  zaobleny(ctx, l.x, l.y - vys, š, vys + 14*s, 7*s); ctx.stroke();
  // kamenné spáry
  ctx.strokeStyle = 'rgba(40,34,26,.35)'; ctx.lineWidth = Math.max(.8, 2*s);
  for (let i = 1; i < 3; i++){
    const y = l.y - vys + i*(vys/3);
    ctx.beginPath(); ctx.moveTo(l.x + 2*s, y); ctx.lineTo(r.x - 2*s, y); ctx.stroke();
  }
  for (let x = l.x + 20*s; x < r.x - 10*s; x += 42*s){
    ctx.beginPath(); ctx.moveTo(x, l.y - vys); ctx.lineTo(x, l.y + 10*s); ctx.stroke();
  }
  // trám
  ctx.fillStyle = '#7d5a34';
  ctx.fillRect(l.x + 5*s, l.y - vys*.6, š - 10*s, 9*s);
  // praskliny
  ctx.strokeStyle = 'rgba(20,16,12,.6)'; ctx.lineWidth = Math.max(1, 3*s);
  const kolik = Math.floor((1-podil)*8);
  for (let i = 0; i < kolik; i++){
    const k = z.kameny[i];
    const px = (l.x+r.x)/2 + k.x*š*.8, py = l.y - vys + k.y*vys;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + 12*s*k.s, py + 14*s*k.s);
    ctx.lineTo(px - 6*s*k.s, py + 26*s*k.s);
    ctx.stroke();
  }
  // život
  const bš = 96*s;
  ctx.fillStyle = 'rgba(20,16,10,.8)';
  zaobleny(ctx, (l.x+r.x)/2 - bš/2, l.y - vys - 34*s, bš, 30*s, 8*s); ctx.fill();
  ctx.fillStyle = '#c8b88f';
  zaobleny(ctx, (l.x+r.x)/2 - bš/2 + 5*s, l.y - vys - 24*s, (bš-10*s)*podil, 5*s, 2*s); ctx.fill();
  napis(cislo(Math.max(0, z.hp)), (l.x+r.x)/2, l.y - vys - 20*s, Math.max(9, 19*s), '#f0e6cf');
}

function kresliSud(b){
  if (b.hotovo) return;
  const ly = PY - (b.wy - ujeto);
  const s = skala(ly);
  if (s < .1 || ly > V + 60) return;
  const zbranovy = b.typ === 'zbran', stitovy = b.typ === 'stit', vezovy = b.typ === 'vez';
  const p = proj(b.x, ly);
  const hop = Math.sin(cas*3 + b.faze)*3*s;
  const y = p.y + hop, x = p.x;
  stin(x, p.y + 18*s, 20*s, 7*s, .3);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .2 + Math.abs(Math.sin(cas*3 + b.faze))*.15;
  ctx.fillStyle = zbranovy ? '#a78bfa' : stitovy ? '#7fe7ff' : vezovy ? '#ffd166' : '#ff7a3c';
  ctx.beginPath(); ctx.ellipse(x, y, 34*s, 24*s, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createLinearGradient(x - 20*s, 0, x + 20*s, 0);
  if (zbranovy){ g.addColorStop(0, '#8f7de0'); g.addColorStop(.4, '#cfc3ff'); g.addColorStop(1, '#5b4aa8'); }
  else if (stitovy){ g.addColorStop(0, '#2f8fb5'); g.addColorStop(.4, '#bff2ff'); g.addColorStop(1, '#1c5f80'); }
  else if (vezovy){ g.addColorStop(0, '#b98a1e'); g.addColorStop(.4, '#ffe08a'); g.addColorStop(1, '#7d5a10'); }
  else { g.addColorStop(0, '#c0421f'); g.addColorStop(.4, '#ff8c5a'); g.addColorStop(1, '#8a2a10'); }
  zaobleny(ctx, x - 20*s, y - 26*s, 40*s, 50*s, 9*s); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(20,14,10,.6)'; ctx.lineWidth = Math.max(1, 2.5*s);
  zaobleny(ctx, x - 20*s, y - 26*s, 40*s, 50*s, 9*s); ctx.stroke();
  ctx.fillStyle = 'rgba(240,240,255,.35)';
  ctx.fillRect(x - 20*s, y - 16*s, 40*s, 5*s);
  ctx.fillRect(x - 20*s, y + 8*s, 40*s, 5*s);
  ctx.fillStyle = zbranovy ? '#e0d8ff' : stitovy ? '#dff6ff' : vezovy ? '#fff1c4' : '#ffd2b0';
  ctx.beginPath(); ctx.ellipse(x, y - 26*s, 20*s, 7*s, 0, 0, TAU); ctx.fill();
  const vel = Math.max(8, 14*s);
  if (stitovy){
    ctx.fillStyle = '#dff6ff';
    ctx.beginPath();
    ctx.moveTo(x, y - 14*s); ctx.lineTo(x + 11*s, y - 9*s); ctx.lineTo(x + 11*s, y + 3*s);
    ctx.quadraticCurveTo(x, y + 14*s, x - 11*s, y + 3*s);
    ctx.lineTo(x - 11*s, y - 9*s); ctx.closePath(); ctx.fill();
    napis('ŠTÍT', x, y + 34*s, vel, '#bff2ff');
  } else if (vezovy){
    ctx.fillStyle = '#5b6675';
    ctx.fillRect(x - 9*s, y - 4*s, 18*s, 12*s);
    ctx.fillRect(x - 3*s, y - 18*s, 6*s, 16*s);
    napis('VĚŽ', x, y + 34*s, vel, '#ffe08a');
  } else if (zbranovy){
    ctx.fillStyle = '#2f3745'; ctx.fillRect(x - 2*s, y - 12*s, 4*s, 16*s);
    ctx.fillStyle = '#7d5a34'; ctx.fillRect(x - 6*s, y + 2*s, 12*s, 6*s);
    napis('ZBRAŇ', x, y + 34*s, vel, '#d9caff');
  } else {
    ctx.fillStyle = 'rgba(30,20,10,.55)';
    for (let i = -1; i < 2; i++) ctx.fillRect(x - 18*s + i*13*s, y - 8*s, 6*s, 26*s);
    ctx.strokeStyle = '#6b5030'; ctx.lineWidth = Math.max(1, 3*s);
    ctx.beginPath(); ctx.moveTo(x + 6*s, y - 28*s);
    ctx.quadraticCurveTo(x + 18*s, y - 40*s, x + 12*s, y - 48*s); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .6 + Math.abs(Math.sin(cas*14 + b.faze))*.4;
    ctx.fillStyle = '#ffdf8a';
    ctx.beginPath(); ctx.arc(x + 12*s, y - 50*s, 5*s, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    napis('BUM', x, y + 34*s, vel, '#ffb98a');
  }
}

function kresliHordu(g){
  const f = hordaFront(g);
  if (!f) return;
  const spN = g.blik > 0 ? SP.potvoryBlik[g.druh] : SP.potvory[g.druh];
  const spV = g.blik > 0 ? SP.velkeBlik[g.druh]  : SP.velke[g.druh];
  // od nejzadnějších dopředu, ať se správně překrývají
  for (let i = g.jed.length - 1; i >= f.i0; i--){
    const j = g.jed[i];
    const ly = f.gy + j.fy;
    const s = skala(ly);
    if (s < .08 || ly > V + 50) continue;
    const p = proj(g.x + j.fx, ly);
    const bob = Math.sin(cas*7 + j.faze)*2.5*s;
    stin(p.x, p.y + 14*s, 11*s, 4*s, .26);
    const velky = g.velitel && i === g.jed.length-1;
    dejSprite(velky ? spV : spN, p.x, p.y + bob, (velky ? 1.25 : 1) * s);
  }
  // počítadlo nad hordou
  const s0 = skala(f.y);
  if (s0 > .12){
    const p = proj(g.x, f.y);
    const bš = Math.max(56, 104*s0), bv = Math.max(22, 40*s0);
    const cy = omez(p.y - 46*s0, 62, V-42);
    ctx.fillStyle = 'rgba(44,6,16,.85)';
    zaobleny(ctx, p.x - bš/2, cy - bv/2, bš, bv, 9); ctx.fill();
    ctx.strokeStyle = '#ff5c6f'; ctx.lineWidth = 2.2;
    zaobleny(ctx, p.x - bš/2, cy - bv/2, bš, bv, 9); ctx.stroke();
    napis(cislo(Math.max(0, g.pocet)), p.x, cy, Math.max(13, 24*s0), '#ffd6de');
  }
}

function kresliObra(){
  if (!boss || boss.padl || boss.dorazil) return;
  const ly = bossNohy();
  const s = skala(ly);
  if (s < .07) return;
  const podil = boss.plny > 0 ? omez(boss.hp/boss.plny, 0, 1) : 1;
  const zly = podil < .45;
  const sp = dejObra(boss.typ, zly, false);
  const spBlik = boss.puls > .05 ? dejObra(boss.typ, zly, true) : null;
  const dych = 1 + Math.sin(cas*2.2)*.015;
  const dup = Math.abs(Math.sin(cas*5.2))*4*s;
  const p = proj(Š/2 + Math.sin(cas*1.3)*8, ly);
  const m = dych * 0.86 * s;

  stin(p.x, p.y + 4*s, 190*m, 26*m, .38);
  ctx.save();
  if (boss.puls > 0) ctx.translate(nah(-4,4)*boss.puls*s, nah(-4,4)*boss.puls*s);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .05 + (zly ? .04 : 0);
  ctx.fillStyle = boss.def.svit;
  ctx.beginPath(); ctx.ellipse(p.x, p.y - 200*m, 190*m, 170*m, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  dejSprite(sp, p.x, p.y - dup, m);
  if (spBlik){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(.4, boss.puls*.4);
    dejSprite(spBlik, p.x, p.y - dup, m);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  for (const e of boss.def.oci){
    const ox = omez((vudce.x - Š/2)/14, -e.r*.45, e.r*.45)*m;
    const ex = p.x + e.x*m + ox, ey = p.y - dup + e.y*m, er = Math.max(2, e.r*m);
    ctx.beginPath(); ctx.arc(ex, ey + 2*m, er*.55, 0, TAU);
    const zg = ctx.createRadialGradient(ex-3*m, ey, 1, ex, ey, er*.7);
    zg.addColorStop(0, '#fff');
    zg.addColorStop(.4, zly ? '#ff4d5f' : boss.def.zornice);
    zg.addColorStop(1, 'rgba(0,0,0,.8)');
    ctx.fillStyle = zg; ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .35 + Math.sin(cas*4)*.1;
    ctx.fillStyle = zly ? '#ff5c6f' : boss.def.zornice;
    ctx.beginPath(); ctx.arc(ex, ey, er*1.15, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  // pruh života dole (až když už na něj vidíš)
  if (!boss.viden) return;
  const barY = V - 32, š = 430, x0 = Š/2 - š/2;
  ctx.fillStyle = 'rgba(6,10,20,.88)';
  zaobleny(ctx, x0-8, barY-22, š+16, 44, 11); ctx.fill();
  const zakl = podil > .5 ? ['#6dffa8','#1f9d55'] : podil > .2 ? ['#ffe08a','#d99b12'] : ['#ff8a9c','#c01f38'];
  const pg = ctx.createLinearGradient(x0, barY-14, x0, barY+14);
  pg.addColorStop(0, zakl[0]); pg.addColorStop(1, zakl[1]);
  ctx.fillStyle = pg;
  zaobleny(ctx, x0, barY-14, Math.max(0, š*podil), 28, 7); ctx.fill();
  ctx.globalAlpha = .25; ctx.fillStyle = '#fff';
  zaobleny(ctx, x0, barY-14, Math.max(0, š*podil), 10, 5); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2;
  for (let i = 1; i < 10; i++){
    ctx.beginPath(); ctx.moveTo(x0 + š/10*i, barY-14); ctx.lineTo(x0 + š/10*i, barY+14); ctx.stroke();
  }
  napis(cislo(Math.max(0, boss.hp)), Š/2, barY, 25, '#fff');
  napis(boss.def.jmeno, Š/2, barY-34, 20, boss.def.svit);
}

function kresliArmadu(){
  const sp = spriteArmady();
  const sk = aktivniSkin();
  // seřadit odzadu, ať se správně překrývají
  const par = jednotky.map(j => ({ j, ly: j.y, s: skala(j.y) }))
                      .sort((a,b) => a.s - b.s);
  if (sk.efekt === 'svit'){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .18 + Math.abs(Math.sin(cas*3))*.08;
    ctx.fillStyle = sk.barva === 'duha' ? '#fff' : sk.barva;
    for (const it of par){
      const p = proj(it.j.x, it.ly);
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 22*it.s, 20*it.s, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (Math.random() < .3 && jednotky.length){
      const j = nahZ(jednotky), p = proj(j.x, j.y);
      pridej({typ:'iskra', x:p.x, y:p.y-10, vx:nah(-30,30), vy:nah(-70,-20),
              zivot:.35, max:.35, barva: sk.barva === 'duha' ? '#fff' : sk.barva});
    }
  }
  for (const it of par){
    const p = proj(it.j.x, it.ly);
    stin(p.x, p.y + 15*it.s, 12*it.s, 4.5*it.s, .3);
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .16; ctx.fillStyle = armadaTyp.akcent;
  for (const it of par){
    const p = proj(it.j.x, it.ly);
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 9*it.s, 20*it.s, 8*it.s, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(30,20,10,.85)'; ctx.lineCap = 'round';
  for (const it of par){
    const p = proj(it.j.x, it.ly), s = it.s;
    const k = Math.sin(it.j.faze)*3*s;
    ctx.lineWidth = 3*s;
    ctx.beginPath(); ctx.moveTo(p.x-4*s, p.y+7*s); ctx.lineTo(p.x-5*s+k, p.y+15*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x+4*s, p.y+7*s); ctx.lineTo(p.x+5*s-k, p.y+15*s); ctx.stroke();
  }
  if (sk.efekt === 'duch') ctx.globalAlpha = .62;
  for (const it of par){
    const p = proj(it.j.x, it.ly);
    dejSprite(it.j.blik > 0 ? sp.blik : sp.normal, p.x,
              p.y + Math.sin(it.j.faze)*2.5*it.s,
              (1 + it.j.puls*.28) * it.s, Math.sin(it.j.faze*.5)*.05);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const it of par){
    if (it.j.zaseh <= 0) continue;
    const p = proj(it.j.x, it.ly);
    ctx.globalAlpha = it.j.zaseh/.07;
    ctx.fillStyle = armadaTyp.strela;
    ctx.beginPath(); ctx.arc(p.x + 9*it.s, p.y - 19*it.s, 7*it.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // vlaječka a počítadlo (u party, skoro 1:1)
  const pv = proj(vudce.x, PY);
  ctx.strokeStyle = '#e6e9f2'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(pv.x+26, pv.y-8); ctx.lineTo(pv.x+26, pv.y-58); ctx.stroke();
  ctx.fillStyle = armadaTyp.akcent;
  ctx.beginPath();
  ctx.moveTo(pv.x+26, pv.y-58);
  ctx.lineTo(pv.x+26 + 28 + Math.sin(cas*7)*4, pv.y-50);
  ctx.lineTo(pv.x+26, pv.y-40); ctx.fill();
  ctx.fillStyle = 'rgba(6,12,26,.86)';
  zaobleny(ctx, pv.x-76, pv.y-120, 152, 46, 13); ctx.fill();
  ctx.strokeStyle = armadaTyp.akcent; ctx.lineWidth = 2.5;
  zaobleny(ctx, pv.x-76, pv.y-120, 152, 46, 13); ctx.stroke();
  dejSprite(sp.normal, pv.x-52, pv.y-95, .62);
  napis(cislo(armada), pv.x+14, pv.y-97, 26, '#ffd166');
}

function kresliStrely(){
  ctx.globalCompositeOperation = 'lighter';
  for (const st of strely){
    const s = skala(st.y);
    if (s < .06) continue;
    const p = proj(st.x, st.y);
    const p2 = proj(st.x - st.vx*.03, st.y - st.vy*.03);
    const r = Math.max(1.2, st.r*s);
    ctx.strokeStyle = st.velka ? '#ffd166' : armadaTyp.akcent;
    ctx.globalAlpha = .32; ctx.lineWidth = r*1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    ctx.globalAlpha = .9;
    ctx.strokeStyle = st.velka ? '#fff6d0' : armadaTyp.strela;
    ctx.lineWidth = r*.8;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + (p2.x-p.x)*.5, p.y + (p2.y-p.y)*.5); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, r*.38, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

function kresliBossStrely(){
  for (const q of bossStrely){
    const s = skala(q.y);
    if (s < .07) continue;
    const p = proj(q.x, q.y);

    ctx.globalAlpha = .35 + (1-zbyva)*.5;
    ctx.beginPath(); ctx.ellipse(cil.x, cil.y+6, 46 + zbyva*40, 16 + zbyva*12, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = .12; ctx.fillStyle = q.barva;

function vObdelniku(k){ return mys.x > k.x && mys.x < k.x+k.š && mys.y > k.y && mys.y < k.y+k.v; }

  return { x: Š/2 - celkem/2 + i*(š+mez), y: 74, š, v };
}
function armadaKarta(i){
  const š = 138, v = 32, mez = 8, celkem = 6*š + 5*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: 122, š, v };
}
function skinKarta(i){
  const š = 130, v = 94, mez = 8, celkem = 6*š + 5*mez;

  return { x: Š/2 - celkem/2 + sl*(š+mez), y: 166 + rd*(v+8), š, v };
}

}

  const sl = i % 4, rd = Math.floor(i/4);
  return { x: Š/2 - celkem/2 + sl*(š+mez), y: 138 + rd*(v+14), š, v };
}

function koupSkin(i){
  const sk = SKINY[i], a = ARMADY[vybranyIndex].id;
  if (mamSkin(a, sk)){ vybraneSkiny[a] = sk.id; zvuk.sber(); return; }
  if (penize >= sk.cena){
    penize -= sk.cena; mameSkin[klicSkinu(a, sk.id)] = true; vybraneSkiny[a] = sk.id;
    zvuk.vyhra(); konfety(30);
  } else zvuk.chyba();
}
function koupVylepseni(i){
  const d = VYLEPSENI[i];
  if (vyl(d.id) >= d.max){ zvuk.klik(); return; }
  if (nejlepsiKolo < d.odKola){ zvuk.chyba(); return; }
  const c = cenaVylepseni(d);
  if (penize >= c){
    penize -= c; urovneVylepseni[d.id] = vyl(d.id) + 1;
    zvuk.zbranUp(); konfety(20);
  } else zvuk.chyba();
}
function koupBalicek(i){
  const b = BALICKY[i];
  if (znamky < b.znamky){ zvuk.chyba(); return; }
  znamky -= b.znamky; penize += b.mince;
  zvuk.vyhra(); konfety(60);
}
function koupPozadi(i){
  const z = POZADI[i];
  if (mamePozadi[z.id]){ vybranePozadi = z.id; nastavPozadi(); zvuk.sber(); return; }
  if (penize >= z.cena){
    penize -= z.cena; mamePozadi[z.id] = true; vybranePozadi = z.id;
    nastavPozadi(); zvuk.vyhra(); konfety(30);
  } else zvuk.chyba();
}

  if (obchodZalozka === 'skiny'){

      const k = armadaKarta(i), a = ARMADY[i], akt = i === vybranyIndex;
      ctx.fillStyle = akt ? 'rgba(36,52,84,.98)' : 'rgba(12,18,34,.9)';
      zaobleny(ctx, k.x, k.y, k.š, k.v, 9); ctx.fill();
      ctx.lineWidth = akt ? 3 : 1.5;
      ctx.strokeStyle = akt ? a.akcent : (vObdelniku(k) ? '#9fb0cc' : 'rgba(150,170,200,.28)');

      dejSprite(nahledSkinu(a.id, skinArmady(a.id)), k.x + 22, k.y + 17, .58);
      napis(a.jmeno, k.x + k.š/2 + 14, k.y + 17, 14, akt ? a.akcent : '#a9b7cf');
    }
    const aid = ARMADY[vybranyIndex].id;
    let mamKolik = 0;
    for (const sk of SKINY) if (mamSkin(aid, sk)) mamKolik++;
    for (let i = 0; i < SKINY.length; i++){
      const k = skinKarta(i), sk = SKINY[i];

      const hov = vObdelniku(k), tb = BARVA_TRIDY[sk.trida];
      ctx.fillStyle = vyb ? 'rgba(36,54,86,.98)' : 'rgba(13,19,34,.94)';
      zaobleny(ctx, k.x, k.y, k.š, k.v, 11); ctx.fill();
      ctx.lineWidth = vyb ? 3.2 : 1.6;
      ctx.strokeStyle = vyb ? '#ffd166' : (hov ? '#cfd8e6' : tb + '66');
      zaobleny(ctx, k.x, k.y, k.š, k.v, 11); ctx.stroke();
      ctx.fillStyle = tb;

      if (sk.efekt === 'svit'){

        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

      else if (mam) napis('mám', k.x + k.š/2, k.y + 84, 12, '#7ee081');

                 '  ·  celkem ve hře ' + (SKINY.length*ARMADY.length) + ' skinů', Š/2, V-24);
  }

  if (obchodZalozka === 'vylepseni'){
    for (let i = 0; i < VYLEPSENI.length; i++){
      const k = vylKarta(i), d = VYLEPSENI[i];
      const u = vyl(d.id), plne = u >= d.max, zamek = nejlepsiKolo < d.odKola;

      ctx.lineWidth = hov && !plne && !zamek ? 3 : 1.8;

      zaobleny(ctx, k.x, k.y, k.š, k.v, 12); ctx.stroke();

        for (let j = 0; j < u; j++) kresliSrdce(k.x + k.š - 150 + j*17, k.y + 42, 7, '#ff5c8a');

  if (obchodZalozka === 'pozadi'){
    for (let i = 0; i < POZADI.length; i++){

      zaobleny(ctx, k.x, k.y, k.š, k.v, 14); ctx.clip();

      for (let j = 0; j < 6; j++){
        ctx.lineTo(k.x + j*k.š/5 - k.š/12, k.y + k.v*.62 - 16 - (j%2)*10);

      }
      ctx.lineTo(k.x+k.š, k.y+k.v*.62); ctx.lineTo(k.x+k.š, k.y+k.v); ctx.lineTo(k.x, k.y+k.v);

      ctx.fillStyle = cg2;
      ctx.fillRect(k.x+k.š*.28, k.y+k.v*.55, k.š*.44, k.v*.45);
      dejSprite(nahledSkinu(armadaTyp.id, skinArmady(armadaTyp.id)), k.x+k.š/2, k.y+k.v-22, .75);

      else if (mam) napis('mám', k.x + k.š/2, k.y + k.v - 12, 13, '#7ee081');

        napis(cislo(z.cena), k.x + k.š/2 + 12, k.y + k.v - 12, 15,
              penize >= z.cena ? '#ffd166' : '#ff8a8a');

    ctx.font = '13px system-ui'; ctx.fillStyle = '#8fa0bd'; ctx.textAlign = 'center';
    ctx.fillText('MÍCHANÉ = každé kolo jiný svět z těch, které máš', Š/2, V-24);
  }

  if (obchodZalozka === 'balicky'){
    for (let i = 0; i < BALICKY.length; i++){

      for (let j = 0; j < 3 + i*3; j++)

function levelKarta(i){
  const š = 74, v = 34, mez = 5, sl = 10;
  const celkem = sl*š + (sl-1)*mez;
  return { x: Š/2 - celkem/2 + (i % sl)*(š+mez), y: 86 + Math.floor(i/sl)*(v+4), š, v };
}
function levelTlacitko(){ return { x: Š/2 + 8, y: 304, š: 224, v: 42 }; }
function levelZpet(){ return { x: 24, y: V-52, š: 150, v: 40 }; }

function kresliLevely(){
  ctx.fillStyle = 'rgba(4,8,18,.95)'; ctx.fillRect(0, 0, Š, V);
  napis('LEVELY 1 – ' + LEVELU, Š/2, 30, 28, '#ffd166');
  ctx.font = '13px system-ui'; ctx.fillStyle = '#b9c6de'; ctx.textAlign = 'center';
  ctx.fillText('každý level je jedno kolo a je o kousek těžší · zelené 1-25 lehké, modré 26-50, oranžové 51-75, červené 76-100',
               Š/2, 62);
  for (let i = 0; i < LEVELU; i++){
    const n = i + 1, k = levelKarta(i);
    const mam = n <= odemknuto, hotovo = !!splneno[n], hov = vObdelniku(k);
    const b = barvaLevelu(n);
    ctx.fillStyle = hotovo ? 'rgba(30,60,44,.95)' : (mam ? 'rgba(18,26,46,.95)' : 'rgba(10,14,26,.9)');
    zaobleny(ctx, k.x, k.y, k.š, k.v, 8); ctx.fill();
    ctx.lineWidth = (mam && hov) ? 3 : 1.5;
    ctx.strokeStyle = hotovo ? '#7ee081' : (mam ? b : 'rgba(120,140,170,.25)');
    zaobleny(ctx, k.x, k.y, k.š, k.v, 8); ctx.stroke();
    if (n % 10 === 0 && mam){                     // super boss
      ctx.fillStyle = 'rgba(255,209,102,.18)';
      zaobleny(ctx, k.x, k.y, k.š, k.v, 8); ctx.fill();
    }
    napis('' + n, k.x + k.š/2 - (hotovo ? 8 : 0), k.y + 18, 17,
          mam ? (hotovo ? '#c9ffd9' : b) : '#5a6478');
    if (hotovo) napis('✔', k.x + k.š - 16, k.y + 18, 14, '#7ee081');
    if (!mam){
      ctx.fillStyle = '#5a6478';
      ctx.fillRect(k.x + k.š - 22, k.y + 14, 10, 9);
      ctx.strokeStyle = '#5a6478'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(k.x + k.š - 17, k.y + 14, 4, Math.PI, TAU); ctx.stroke();
    }
  }
  const hotovoKolik = Object.keys(splneno).length;
  ctx.font = 'bold 15px system-ui'; ctx.fillStyle = '#ffd166'; ctx.textAlign = 'center';
  ctx.fillText('splněno ' + hotovoKolik + ' ze ' + LEVELU + '   ·   odemčeno až po level ' + odemknuto, Š/2, V-24);
  const z = levelZpet();
  ctx.fillStyle = vObdelniku(z) ? 'rgba(60,80,120,.95)' : 'rgba(20,28,48,.9)';
  zaobleny(ctx, z.x, z.y, z.š, z.v, 11); ctx.fill();
  ctx.strokeStyle = '#9fb0cc'; ctx.lineWidth = 2;
  zaobleny(ctx, z.x, z.y, z.š, z.v, 11); ctx.stroke();
  napis('◀ ZPĚT', z.x + z.š/2, z.y + 20, 19, '#e8edf7');
}

  napis('MOJE PÍSNIČKA', Š/2, 30, 30, '#9ceaff');
  ctx.font = '14px system-ui'; ctx.fillStyle = '#b9c6de'; ctx.textAlign = 'center';
  ctx.fillText('tři stopy: MELODIE (modrá), BASA (fialová), BICÍ (oranžová) — klikej do mřížky, hraje to všechno spolu', Š/2, 58);
  const aktKrok = prehravam
    ? Math.floor((cas - prehravamOd) * (mojeTempo/60*2)) % KROKU : -1;
  for (let r = 0; r < RADKU; r++){
    const d = radekPopis(r);
    for (let k = 0; k < KROKU; k++){
      const b = bunkaObdelnik(k, r);
      const zapnuto = bunkaZapnuta(k, r);
      const hov = vObdelniku(b);
      const takt = Math.floor(k/4) % 2 === 0;
      ctx.fillStyle = zapnuto ? d.barva
                    : (k === aktKrok ? 'rgba(200,220,255,.2)'
                    : (hov ? 'rgba(120,150,200,.35)'
                    : (takt ? 'rgba(26,36,60,.9)' : 'rgba(18,26,46,.9)')));
      zaobleny(ctx, b.x, b.y, b.š, b.v, 5); ctx.fill();
      if (zapnuto){
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        zaobleny(ctx, b.x+4, b.y+3, b.š-8, 5, 2); ctx.fill();
      }
    }
    const b0 = bunkaObdelnik(0, r);
    ctx.textAlign = 'right'; ctx.font = 'bold 12px system-ui'; ctx.fillStyle = d.barva;
    ctx.fillText(d.text, b0.x - 8, b0.y + b0.v/2 + 4);
    ctx.textAlign = 'center';
  }
  // popisky stop vpravo
  const bMel = bunkaObdelnik(KROKU-1, 0), bBas = bunkaObdelnik(KROKU-1, STUPNICE.length);
  const bBic = bunkaObdelnik(KROKU-1, STUPNICE.length + BASY.length);
  ctx.textAlign = 'left'; ctx.font = 'bold 12px system-ui';
  ctx.fillStyle = '#9ceaff'; ctx.fillText('MELODIE', bMel.x + bMel.š + 10, bMel.y + 10);
  ctx.fillStyle = '#c9b6ff'; ctx.fillText('BASA', bBas.x + bBas.š + 10, bBas.y + 10);
  ctx.fillStyle = '#ffb347'; ctx.fillText('BICÍ', bBic.x + bBic.š + 10, bBic.y + 10);
  ctx.textAlign = 'center';
  napis(mojeTempo + ' BPM', Š/2, 456, 21, '#ffd166');
  for (let i = 0; i < 2; i++){
    const t = tempoTl(i);
    ctx.fillStyle = vObdelniku(t) ? 'rgba(60,80,120,.95)' : 'rgba(20,28,48,.92)';
    zaobleny(ctx, t.x, t.y, t.š, t.v, 10); ctx.fill();
    ctx.strokeStyle = '#9fb0cc'; ctx.lineWidth = 2;
    zaobleny(ctx, t.x, t.y, t.š, t.v, 10); ctx.stroke();
    napis(i === 0 ? '−' : '+', t.x + t.š/2, t.y + 21, 26, '#e8edf7');
  }
  napis('TEMPO', Š/2, 476, 14, '#c9d4e6');
  const popisy = [prehravam ? '■ STOP' : '▶ PŘEHRÁT', 'NÁHODNĚ', 'SMAZAT',
                  'MŮJ SOUBOR', 'HRÁT S TÍMHLE', '◀ ZPĚT'];
  for (let i = 0; i < popisy.length; i++){
    const t = sklTl(i), hov = vObdelniku(t);
    const zvyraznit = (i === 0 && prehravam) || (i === 4);
    ctx.fillStyle = zvyraznit ? 'rgba(40,60,96,.98)' : (hov ? 'rgba(50,66,104,.95)' : 'rgba(16,24,42,.92)');
    zaobleny(ctx, t.x, t.y, t.š, t.v, 11); ctx.fill();
    ctx.lineWidth = zvyraznit ? 3 : 1.8;
    ctx.strokeStyle = i === 4 ? '#7ee081' : (i === 5 ? '#9fb0cc' : '#9ceaff');
    zaobleny(ctx, t.x, t.y, t.š, t.v, 11); ctx.stroke();
    napis(popisy[i], t.x + t.š/2, t.y + 22, 16,
          i === 4 ? '#7ee081' : (i === 5 ? '#e8edf7' : '#9ceaff'));
  }
  ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = vlastniJmeno ? '#7ee081' : '#7d8ba3';
  ctx.fillText(vlastniJmeno ? ('nahráno: ' + vlastniJmeno)
    : '„MŮJ SOUBOR" = vyber si vlastní mp3 z počítače · klávesa R = náhodná skladba', Š/2, 532);
}

function prekryv(nadpis, radky2){
  ctx.fillStyle = 'rgba(4,8,18,.8)'; ctx.fillRect(0, 0, Š, V);
  napis(nadpis, Š/2, V/2-110, 48, '#ffd166');
  ctx.fillStyle = '#e8edf7'; ctx.font = '21px system-ui'; ctx.textAlign = 'center';
  radky2.forEach((r, i) => ctx.fillText(r, Š/2, V/2-46 + i*32));
}

function kresli(dt){
  ctx.clearRect(0, 0, Š, V);
  ctx.save();
  if (otres > 0) ctx.translate(nah(-otres, otres), nah(-otres, otres));
  if (kamNaklon && !ORTHO){
    ctx.translate(Š/2, V*1.55);
    ctx.rotate(kamNaklon);
    ctx.translate(-Š/2, -V*1.55);
  }
  kresliPozadi(dt);
  kresliCestu();
  kresliSrazky();
  // všechno na trati vykreslíme odzadu dopředu
  const scena = [];
  for (const r of radky) scena.push({ ly: PY - (r.y - ujeto), f: () => kresliRadu(r) });
  for (const g of branky) scena.push({ ly: PY - (g.y - ujeto), f: () => kresliBranku(g) });
  for (const z of zdi) if (!z.hotovo) scena.push({ ly: PY - (z.wy - ujeto), f: () => kresliZed(z) });
  for (const b of sudy) if (!b.hotovo) scena.push({ ly: PY - (b.wy - ujeto), f: () => kresliSud(b) });
  if (boss && !boss.padl && !boss.dorazil) scena.push({ ly: bossNohy(), f: kresliObra });
  for (const g of skupiny){
    const fr = hordaFront(g);
    if (fr) scena.push({ ly: fr.y, f: () => kresliHordu(g) });
  }
  for (const z of zlodeji) scena.push({ ly: z.y, f: () => kresliLisaka(z) });
  scena.sort((a, b) => a.ly - b.ly);
  for (const it of scena) it.f();
  if (stav === 'hra' || stav === 'konec'){ kresliArmadu(); kresliVeze(); kresliStit(); }
  kresliStrely();
  kresliBossStrely();
  kresliMince();
  efektyKresli();
  ctx.restore();
  vinetace();
  if (blesk > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(.5, blesk*.5) + ')';
    ctx.fillRect(0, 0, Š, V);
  }
  if (stav === 'hra' || stav === 'konec') kresliHUD();
  if (zpravaCas > 0 && stav === 'hra'){
    const m = 1 + Math.max(0, zpravaCas-1.25)*2.5;
    ctx.save();
    ctx.translate(Š/2, 132); ctx.scale(m, m);
    ctx.globalAlpha = Math.min(1, zpravaCas*1.6);
    napis(zprava, 0, 0, 44, '#fff');
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (stav === 'vyber') kresliVyber();
  if (stav === 'obchod') kresliObchod();
  if (stav === 'skladatel') kresliSkladatele();
  if (stav === 'hudba') kresliHudbu();
  if (stav === 'levely') kresliLevely();
  if (stav === 'vyhra') kresliVyhru();
  if (stav === 'konec'){
    prekryv('Konec šturmu!', [
      pricinaKonce,
      rezim === 'kampan'
        ? ('LEVEL ' + kampanLevel + ' nedopadl dobře — zmáčkni cokoliv a zkus ho znovu.')
        : ('Obtížnost ' + OB.jmeno + ', dorazil jsi do kola ' + uroven + '.'),
      'Body: ' + cislo(skore) + '   (nejvíc: ' + cislo(nejlepsi) + ')',
      'Nasbíral jsi ' + cislo(minceZaBeh) + ' mincí — máš ' + cislo(penize) +
        ' a ' + znamky + ' dárkových známek',
      'Zmáčkni cokoliv a hraj znovu'
    ]);
    // tlačítko do obchodu
    const ob = { x: Š/2-110, y: V/2+86, š: 220, v: 44 };
    ctx.fillStyle = vObdelniku(ob) ? 'rgba(70,58,120,.98)' : 'rgba(30,26,60,.92)';
    zaobleny(ctx, ob.x, ob.y, ob.š, ob.v, 12); ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5;
    zaobleny(ctx, ob.x, ob.y, ob.š, ob.v, 12); ctx.stroke();
    ikonaMince(ob.x + 28, ob.y + 22, 12);
    napis('DO OBCHODU', ob.x + ob.š/2 + 14, ob.y + 23, 19, '#ffd166');
    ctx.font = '18px system-ui'; ctx.fillStyle = '#9fb0cc'; ctx.textAlign = 'center';
    ctx.fillText('chceš jinou armádu? zmáčkni V nebo klikni sem dolů', Š/2, V-40);
  }
}

// ============ SMYČKA ============
let posledni = performance.now();
function smycka(t){
  const dt = Math.max(0, Math.min((t - posledni)/1000, .05));
  posledni = t;
  const dtHra = dt * (zpomaleni > 0 ? .35 : 1);
  if (stav === 'hra') krok(dtHra); else cas += dt;
  efektyKrok(dtHra);
  kresli(dt);
  requestAnimationFrame(smycka);
}
vyrobUroven();
requestAnimationFrame(smycka);
</script>
