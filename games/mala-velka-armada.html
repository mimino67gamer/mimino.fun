<html lang="cs">

  #obal{position:fixed;inset:0;display:grid;place-items:center;}

<script>
// =====================================================================
//  MALÁ VELKÁ ARMÁDA — verze 5
//  Vybereš si armádu, kosíš hordy a na konci každého kola čeká OBR.
//  Všechno nakreslené kódem, postavy i obři se předkreslí do paměti.
// =====================================================================

const Š = 960, V = 540;
const platno = document.getElementById('platno');
const ctx = platno.getContext('2d');
function zmenVelikost(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  platno.width = Š*dpr; platno.height = V*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
}
addEventListener('resize', zmenVelikost);
zmenVelikost();

// ============ POMOCNÍCI ============
const nah  = (a,b) => a + Math.random()*(b-a);
const nahC = (a,b) => Math.floor(nah(a,b+1));
const nahZ = p => p[Math.floor(Math.random()*p.length)];
const omez = (v,a,b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI*2;

function napis(text, x, y, velikost, barva, tah='rgba(0,0,0,.65)'){
  ctx.font = 'bold ' + velikost + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, velikost/5); ctx.strokeStyle = tah;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = barva; ctx.fillText(text, x, y);
}
function cislo(n){
  n = Math.round(n);
  if (n >= 1000000) return (n/1000000).toFixed(1).replace('.',',') + 'M';
  if (n >= 100000)  return Math.round(n/1000) + 'k';
  if (n >= 10000)   return (n/1000).toFixed(1).replace('.',',') + 'k';
  return '' + n;
}
function zaobleny(g, x, y, š, v, r){
  g.beginPath(); g.moveTo(x+r, y);
  g.arcTo(x+š, y, x+š, y+v, r); g.arcTo(x+š, y+v, x, y+v, r);
  g.arcTo(x, y+v, x, y, r);     g.arcTo(x, y, x+š, y, r);
  g.closePath();
}
function stin(x, y, rx, ry, a=.32){
  ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();
}
// koule se stínováním – základní stavební kámen všech postav
function bulka(g, x, y, rx, ry, svetla, tmava, obrys, lw=4){
  const gr = g.createRadialGradient(x-rx*.35, y-ry*.45, rx*.1, x, y, rx*1.2);
  gr.addColorStop(0, svetla); gr.addColorStop(1, tmava);
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU);
  g.fillStyle = gr; g.fill();
  if (obrys){ g.lineWidth = lw; g.strokeStyle = obrys; g.stroke(); }
}

// ============ ZVUK ============
const zvuk = (() => {
  let a = null, zapnuto = true, hudbaTimer = null, biciTimer = null;
  function audio(){
    if (!a) a = new (window.AudioContext || window.webkitAudioContext)();
    if (a.state === 'suspended') a.resume();
    return a;
  }
  function ton({f=440, f2=null, t=.15, typ='square', hlas=.15, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const o = c.createOscillator(), g = c.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f, z);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), z+t);
    g.gain.setValueAtTime(.0001, z);
    g.gain.exponentialRampToValueAtTime(hlas, z+.01);
    g.gain.exponentialRampToValueAtTime(.0001, z+t);
    o.connect(g); g.connect(c.destination);
    o.start(z); o.stop(z+t+.05);
  }
  function sum({t=.2, hlas=.2, filtr=1200, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const n = Math.max(1, Math.floor(c.sampleRate*t));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filtr;
    const g = c.createGain(); g.gain.value = hlas;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(z);
  }
  function nota(j){
    const z = {C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
    const m = /^([A-H])(#|b)?(-?\d)$/.exec(j);
    if (!m) return 440;
    const p = z[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0) + (+m[3]+1)*12;
    return 440*Math.pow(2,(p-69)/12);
  }
  return { ton, sum, nota,
    tichoZapni(){ zapnuto = !zapnuto; if (!zapnuto) this.hudbaStop(); return zapnuto; },
    klik:   () => ton({f:600,f2:900,t:.05,hlas:.1}),
    sber:   () => { ton({f:880,t:.07,typ:'triangle',hlas:.18});
                    ton({f:1320,t:.09,typ:'triangle',hlas:.14,kdy:.06}); },
    cink:   () => ton({f:1600,t:.045,typ:'triangle',hlas:.1}),
    pif:    () => { ton({f:1700,f2:520,t:.03,typ:'square',hlas:.045});
                    sum({t:.035,hlas:.045,filtr:2600}); },
    zasah:  () => { ton({f:200,f2:60,t:.2,typ:'sawtooth',hlas:.2}); sum({t:.15,filtr:800}); },
    prask:  () => { sum({t:.12,hlas:.14,filtr:1500});
                    ton({f:280,f2:90,t:.1,typ:'sawtooth',hlas:.09}); },
    vybuch: () => { sum({t:.5,hlas:.35,filtr:600});
                    ton({f:120,f2:30,t:.4,typ:'sawtooth',hlas:.2}); },
    rev:    () => { ton({f:150,f2:60,t:.8,typ:'sawtooth',hlas:.22});
                    ton({f:90,f2:45,t:.9,typ:'square',hlas:.16,kdy:.05});
                    sum({t:.7,hlas:.14,filtr:500}); },
    dupnuti:() => { sum({t:.3,hlas:.28,filtr:300});
                    ton({f:70,f2:40,t:.3,typ:'sine',hlas:.25}); },
    chyba:  () => { ton({f:180,t:.1,typ:'square',hlas:.15});
                    ton({f:130,t:.2,typ:'square',hlas:.15,kdy:.1}); },
    zbranUp:() => [700,1000,1400].forEach((f,i)=>ton({f,t:.12,typ:'square',hlas:.16,kdy:i*.07})),
    start:  () => [523,659,784].forEach((f,i)=>ton({f,t:.1,typ:'triangle',hlas:.15,kdy:i*.08})),
    vyhra:  () => [523,659,784,1047].forEach((f,i)=>ton({f,t:.18,typ:'triangle',hlas:.18,kdy:i*.11})),
    konec:  () => [523,415,330,262].forEach((f,i)=>ton({f,t:.22,typ:'triangle',hlas:.16,kdy:i*.14})),
    prd:    () => { ton({f:90,f2:55,t:.28,typ:'sawtooth',hlas:.22}); sum({t:.25,hlas:.12,filtr:300}); },
    krik:   () => { ton({f:420,f2:120,t:.35,typ:'sawtooth',hlas:.2}); sum({t:.3,hlas:.18,filtr:900}); },
    hudbaHraj(noty, tempo=120, typ='triangle', hlas=.05){
      this.hudbaStop();
      if (!zapnuto) return;
      const krok = 60/tempo/2; let i = 0;
      hudbaTimer = setInterval(() => {
        const n = noty[i % noty.length];
        if (n) ton({f: typeof n === 'string' ? nota(n) : n, t: krok*.9, typ, hlas});
        i++;
      }, krok*1000);
    },
    skladbaHraj(mel, bas, bic, tempo){
      this.hudbaStop();
      if (!zapnuto) return;
      const krok = 60/tempo/2;
      let i = 0;
      hudbaTimer = setInterval(() => {
        const k = i % mel.length;
        if (mel[k]) ton({ f: nota(mel[k]), t: krok*.9, typ:'triangle', hlas:.055 });
        if (bas[k]) ton({ f: nota(bas[k]), t: krok*1.1, typ:'square', hlas:.05 });
        if (bic[k][0]){ sum({t:.12, hlas:.17, filtr:200}); ton({f:72, f2:44, t:.12, typ:'sine', hlas:.15}); }
        if (bic[k][1]) sum({t:.07, hlas:.11, filtr:2600});
        if (bic[k][2]) sum({t:.04, hlas:.06, filtr:6000});
        i++;
      }, krok*1000);
    },
    hudbaBiciHraj(tempo){
      this.hudbaBiciStop();
      if (!zapnuto) return;
      const krok = 60/tempo/2;
      let i = 0;
      biciTimer = setInterval(() => {
        const k = i % 8;
        if (k === 0 || k === 4){
          sum({t:.12, hlas:.16, filtr:200});
          ton({f:72, f2:44, t:.12, typ:'sine', hlas:.15});
        }
        if (k === 2 || k === 6) sum({t:.06, hlas:.09, filtr:3200});
        if (k === 7) sum({t:.04, hlas:.05, filtr:5000});
        i++;
      }, krok*1000);
    },
    hudbaBiciStop(){ if (biciTimer){ clearInterval(biciTimer); biciTimer = null; } },
    hudbaStop(){
      if (hudbaTimer){ clearInterval(hudbaTimer); hudbaTimer = null; }
      this.hudbaBiciStop();
    } };
})();
let zvukZapnut = true;

// ============ VLASTNÍ HUDBA ZE SOUBORU ============
const poleSouboru = document.getElementById('hudbaSoubor');
function vyberSoubor(){ if (poleSouboru) poleSouboru.click(); }
if (poleSouboru) poleSouboru.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    if (vlastniAudio) vlastniAudio.pause();
    vlastniAudio = new Audio(URL.createObjectURL(f));
    vlastniAudio.loop = true;
    vlastniAudio.volume = .45;
    vlastniJmeno = f.name.replace(/\.[^.]+$/, '').slice(0, 16);
    hudbaIndex = HUDBY.findIndex(h => h.soubor);
    spustHudbu();
  } catch (err){ /* nic, jen se nepustí */ }
});

// ============ ČÁSTICE ============
let castice = [], popisky = [], otres = 0, blesk = 0, zpomaleni = 0;
const MAX_CASTIC = 900;
function pridej(c){ if (castice.length < MAX_CASTIC) castice.push(c); }
function iskry(x,y,barva,n=10,sila=300){
  for (let i=0;i<n;i++){
    const a = nah(0,TAU), r = nah(sila*.3, sila);
    pridej({typ:'iskra', x, y, vx:Math.cos(a)*r, vy:Math.sin(a)*r,
            zivot:nah(.15,.4), max:.4, barva, g:200});
  }
}
function kour(x,y,n=5,barva='rgba(215,210,220,'){
  for (let i=0;i<n;i++)
    pridej({typ:'kour', x:x+nah(-8,8), y:y+nah(-8,8), vx:nah(-30,30), vy:nah(-70,-20),
            zivot:nah(.4,.9), max:.9, r:nah(4,10), rr:nah(18,34), barva});
}
function kusy(x,y,barva,n=8){
  for (let i=0;i<n;i++){
    const a = nah(0,TAU), r = nah(80,300);
    pridej({typ:'kus', x, y, vx:Math.cos(a)*r, vy:Math.sin(a)*r-120,
            zivot:nah(.5,1.1), max:1.1, barva, vel:nah(3,7),
            uhel:nah(0,TAU), rot:nah(-9,9), g:620});
  }
}
function kruh(x,y,barva,r1=120,t=.4){ pridej({typ:'kruh', x, y, zivot:t, max:t, barva, r0:6, r1}); }
function konfety(n=60){
  const b = ['#ffd166','#ff5c7a','#3ddc84','#4fd2ff','#c9a0ff','#fff'];
  for (let i=0;i<n;i++)
    pridej({typ:'kus', x:nah(0,Š), y:nah(-40,V*.4), vx:nah(-90,90), vy:nah(-60,120),
            zivot:nah(1,1.8), max:1.8, barva:nahZ(b), vel:nah(4,9),
            uhel:nah(0,TAU), rot:nah(-8,8), g:260});
}
function zatres(s){ otres = Math.max(otres, s); }
function popisek(x,y,text,barva='#fff',vel=30){ popisky.push({x,y,text,barva,zivot:1.1,vel}); }
function efektyKrok(dt){
  for (const c of castice){
    c.zivot -= dt;
    if (c.typ === 'kruh') continue;
    c.x += c.vx*dt; c.y += c.vy*dt;
    if (c.g) c.vy += c.g*dt;
    if (c.typ === 'iskra'){ c.vx *= .93; c.vy *= .93; }
    if (c.typ === 'kour'){ c.vx *= .96; c.vy *= .96; }
    if (c.typ === 'kus') c.uhel += c.rot*dt;
  }
  castice = castice.filter(c => c.zivot > 0);
  for (const p of popisky){ p.y -= 55*dt; p.zivot -= dt; }
  popisky = popisky.filter(p => p.zivot > 0);
  otres = Math.max(0, otres - dt*40);
  blesk = Math.max(0, blesk - dt*3);
  zpomaleni = Math.max(0, zpomaleni - dt);
}
function efektyKresli(){
  for (const c of castice){
    if (c.typ !== 'kour') continue;
    const p = 1 - c.zivot/c.max;
    ctx.globalAlpha = (1-p)*.32; ctx.fillStyle = c.barva + '1)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + (c.rr-c.r)*p, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const c of castice){
    if (c.typ !== 'kruh') continue;
    const p = 1 - c.zivot/c.max;
    ctx.globalAlpha = 1-p; ctx.strokeStyle = c.barva; ctx.lineWidth = 7*(1-p)+1;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r0 + (c.r1-c.r0)*p, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const c of castice){
    if (c.typ !== 'kus') continue;
    ctx.globalAlpha = Math.min(1, c.zivot/c.max*1.6);
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.uhel);
    ctx.fillStyle = c.barva; ctx.fillRect(-c.vel/2, -c.vel/2, c.vel, c.vel*.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const c of castice){
    if (c.typ !== 'iskra') continue;
    ctx.globalAlpha = Math.min(1, c.zivot/c.max);
    ctx.strokeStyle = c.barva; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x - c.vx*.025, c.y - c.vy*.025); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  for (const p of popisky){
    ctx.globalAlpha = Math.min(1, p.zivot);
    napis(p.text, p.x, p.y, p.vel, p.barva);
  }
  ctx.globalAlpha = 1;
}

// =====================================================================
//  SPRITY
// =====================================================================
function novySprite(w, h, ax, ay, kresl){
  const c = document.createElement('canvas');
  c.width = w*2; c.height = h*2;
  const g = c.getContext('2d');
  g.scale(2,2); g.translate(ax, ay);
  g.lineJoin = 'round'; g.lineCap = 'round';
  kresl(g);
  return { c, ax, ay, w, h };
}
function spriteBlik(sp){
  const c = document.createElement('canvas');
  c.width = sp.c.width; c.height = sp.c.height;
  const g = c.getContext('2d');
  g.drawImage(sp.c, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  return { c, ax: sp.ax, ay: sp.ay, w: sp.w, h: sp.h };
}
function spriteTon(sp, barva, sila){
  const c = document.createElement('canvas');
  c.width = sp.c.width; c.height = sp.c.height;
  const g = c.getContext('2d');
  g.drawImage(sp.c, 0, 0);
  g.globalCompositeOperation = 'color';
  g.globalAlpha = sila;
  g.fillStyle = barva;
  g.fillRect(0, 0, c.width, c.height);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(sp.c, 0, 0);
  return { c, ax: sp.ax, ay: sp.ay, w: sp.w, h: sp.h };
}
const DUHA = ['#ff4d6d','#ff9f1c','#ffd166','#3ddc84','#4fd2ff','#a78bfa'];
const skinCache = {};
function dejSkin(armadaId, skinId){
  const k = armadaId + '_' + skinId;
  if (skinCache[k]) return skinCache[k];
  const zaklad = SP.armady[armadaId];
  const sk = SKINY.find(x => x.id === skinId) || SKINY[0];
  let v;
  if (!sk.barva) v = { normal: zaklad.normal, blik: zaklad.blik };
  else if (sk.barva === 'duha')
    v = { duha: DUHA.map(b => spriteTon(zaklad.normal, b, .95)),
          normal: spriteTon(zaklad.normal, DUHA[0], .95), blik: zaklad.blik };
  else v = { normal: spriteTon(zaklad.normal, sk.barva, sk.sila), blik: zaklad.blik };
  v.def = sk;
  skinCache[k] = v;
  return v;
}
function spriteArmady(){
  const v = dejSkin(armadaTyp.id, skinArmady(armadaTyp.id));
  if (v.duha) return { normal: v.duha[Math.floor(cas*7) % v.duha.length], blik: v.blik };
  return v;
}
function nahledSkinu(armadaId, skinId){
  const v = dejSkin(armadaId, skinId);
  return v.duha ? v.duha[Math.floor(cas*7) % v.duha.length] : v.normal;
}
function dejSprite(sp, x, y, m=1, uhel=0, mx=1){
  ctx.save(); ctx.translate(x, y);
  if (uhel) ctx.rotate(uhel);
  if (m !== 1 || mx !== 1) ctx.scale(m*mx, m);
  ctx.drawImage(sp.c, -sp.ax, -sp.ay, sp.w, sp.h);
  ctx.restore();
}

// --- malé postavičky: 52x64, kotva ve středu těla ---
const SP_Š = 52, SP_V = 64, SP_AY = 36;
const maluj = kresl => novySprite(SP_Š, SP_V, SP_Š/2, SP_AY, kresl);

function oci(g, y, rozestup, zornice='#20130a', vel=1){
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(s*rozestup, y, 3*vel, 3.3*vel, 0, 0, TAU);
    g.fillStyle = '#fff'; g.fill();
    g.beginPath(); g.arc(s*rozestup+.5, y+.4, 1.5*vel, 0, TAU);
    g.fillStyle = zornice; g.fill();
    g.beginPath(); g.arc(s*rozestup-.8, y-1.2, .7*vel, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
  }
}
function puska(g, delka=16){
  g.fillStyle = '#2f3745'; g.fillRect(7, -delka-2, 4.2, delka);
  g.fillStyle = '#4a5566'; g.fillRect(7, -delka-2, 1.6, delka);
  g.fillStyle = '#7d5a34'; g.fillRect(5.6, -4, 6.4, 5.5);
  g.fillStyle = '#5e4326'; g.fillRect(5.6, -4, 6.4, 1.6);
}

const ARMADY = [
  { id:'brambory', jmeno:'BRAMBORY', hlaska:'kulaté a tvrdé',
    akcent:'#5ad2ff', strela:'#9ceaff',
    kresli(g){
      puska(g, 15);
      bulka(g, 0, 0, 13, 12, '#ffdf9a', '#a9691f', '#4b2b09', 2.2);
      g.beginPath(); g.ellipse(-5, -4.5, 4.4, 2.8, .5, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.5)'; g.fill();
      g.fillStyle = 'rgba(75,43,9,.42)';
      g.beginPath(); g.arc(5.5, 3.5, 1.9, 0, TAU); g.fill();
      g.beginPath(); g.arc(-6.5, 4.5, 1.3, 0, TAU); g.fill();
      oci(g, 0, 3.8);
      const h = g.createLinearGradient(0, -14, 0, -3);
      h.addColorStop(0, '#5aa4e8'); h.addColorStop(1, '#1f4f8a');
      g.beginPath(); g.ellipse(0, -4.5, 12.4, 9, 0, Math.PI, TAU);
      g.fillStyle = h; g.fill();
      g.fillStyle = '#193f6f'; g.fillRect(-13, -5.6, 26, 3.4);
      g.beginPath(); g.ellipse(-4.5, -9.5, 3.6, 1.9, -.3, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.55)'; g.fill();
    } },
  { id:'vojaci', jmeno:'VOJÁCI', hlaska:'plná disciplína',
    akcent:'#8ce88f', strela:'#d8ff9c',
    kresli(g){
      puska(g, 18);
      g.fillStyle = '#3f4a2a'; zaobleny(g, -14, -4, 8, 13, 3); g.fill();
      const t = g.createLinearGradient(-8, -8, 8, 10);
      t.addColorStop(0, '#7fa257'); t.addColorStop(1, '#3d5a2a');
      zaobleny(g, -10, -3, 20, 16, 6); g.fillStyle = t; g.fill();
      g.lineWidth = 2; g.strokeStyle = '#22351a'; g.stroke();

    const r = velky ? 14.5 : 11.5;
    g.fillStyle = d.roh;
    g.beginPath(); g.moveTo(-r*.72, -r*.7); g.lineTo(-r*1.15, -r*1.65); g.lineTo(-r*.32, -r*.95); g.fill();
    g.beginPath(); g.moveTo(r*.72, -r*.7); g.lineTo(r*1.15, -r*1.65); g.lineTo(r*.32, -r*.95); g.fill();
    bulka(g, 0, 0, r, r*.95, d.svetla, d.tmava, d.obrys, 2.2);
    g.beginPath(); g.ellipse(-r*.38, -r*.42, r*.3, r*.18, .5, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fill();

      g.beginPath(); g.ellipse(s*r*.32, -r*.1, r*.26, r*.23, 0, 0, TAU);
      g.fillStyle = '#fff'; g.fill();
      g.beginPath(); g.arc(s*r*.34, -r*.05, r*.13, 0, TAU);
      g.fillStyle = '#1c0208'; g.fill();
    }
    g.strokeStyle = d.obrys; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-r*.62, -r*.52); g.lineTo(-r*.1, -r*.3); g.stroke();
    g.beginPath(); g.moveTo(r*.62, -r*.52); g.lineTo(r*.1, -r*.3); g.stroke();
    g.strokeStyle = '#fff'; g.lineWidth = 1.7;
    g.beginPath();
    g.moveTo(-r*.45, r*.42); g.lineTo(-r*.22, r*.68); g.lineTo(0, r*.42);
    g.lineTo(r*.22, r*.68); g.lineTo(r*.45, r*.42); g.stroke();
    if (velky){
      g.fillStyle = '#8b93a6'; zaobleny(g, r*.55, -r*.5, 7, 15, 3); g.fill();
      g.fillStyle = '#c2c9d6'; g.fillRect(r*.55+2, -r*.5+2, 3, 11);
    }
  });
}

let SP = { armady: {}, potvory: [], potvoryBlik: [], velke: [], velkeBlik: [] };
const obriCache = {};
function dejObra(i, zly, blik){
  const k = i + '_' + (zly?1:0);
  if (!obriCache[k]) obriCache[k] = { normal: malujObra(g => OBRI[i].kresli(g, zly)) };
  if (blik && !obriCache[k].blik) obriCache[k].blik = spriteBlik(obriCache[k].normal);
  return blik ? obriCache[k].blik : obriCache[k].normal;
}

// ============ MINCE ============
let mince = [];
function hodnotaMince(zaklad){
  const nas = (1 + (OB.body-1)*.5) * (1 + vyl('magnet')*.3) * .5;
  return Math.max(1, Math.round(zaklad * nas));
}
function pustMince(x, y, kolikKusu, zakladHodnoty){
  if (mince.length > 70) return;
  for (let i = 0; i < kolikKusu; i++){
    const a = nah(0, TAU), r = nah(40, 170);
    mince.push({ x, y, vx: Math.cos(a)*r, vy: Math.sin(a)*r - 60,
                 hodnota: hodnotaMince(zakladHodnoty), faze: nah(0,7), cas: 0 });
  }
}
function minceKrok(dt){
  for (const m of mince){
    m.cas += dt; m.faze += dt*6;
    if (m.cas < .35){ m.x += m.vx*dt; m.y += m.vy*dt; m.vy += 520*dt; }
    else {
      // magnet: letí k partě
      const dx = vudce.x - m.x, dy = PY - m.y;
      const d = Math.hypot(dx, dy) || 1;
      const v = 520 + m.cas*400;
      m.x += dx/d*v*dt; m.y += dy/d*v*dt;
      if (d < 26){
        m.sebrano = true;
        penize += m.hodnota; minceZaBeh += m.hodnota;
        if (Math.random() < .25){
          zvuk.cink();
          popisek(m.x, m.y-20, '+' + m.hodnota, '#ffd166', 20);
        }
      }
    }
    if (m.y > V + 60) m.sebrano = true;
  }
  mince = mince.filter(m => !m.sebrano);
}
function kresliMince(){
  for (const m of mince){
    const š = Math.abs(Math.cos(m.faze))*9 + 2;
    stin(m.x, m.y + 10, 7, 3, .25);
    const g = ctx.createLinearGradient(m.x-š, m.y-10, m.x+š, m.y+10);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(.5, '#ffc832'); g.addColorStop(1, '#b57d0a');
    ctx.beginPath(); ctx.ellipse(m.x, m.y, š, 10, 0, 0, TAU);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#8a5c05'; ctx.stroke();
    if (š > 6){
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.ellipse(m.x - š*.3, m.y - 3, š*.28, 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a5c05';
      napis('K', m.x, m.y+1, 11, '#ffe9a8', 'rgba(0,0,0,0)');
    }
  }
}
function ikonaMince(x, y, r){
  const g = ctx.createLinearGradient(x-r, y-r, x+r, y+r);
  g.addColorStop(0, '#fff3b0'); g.addColorStop(.5, '#ffc832'); g.addColorStop(1, '#b57d0a');
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#8a5c05'; ctx.stroke();
  napis('K', x, y+1, r*1.3, '#ffe9a8', 'rgba(0,0,0,0)');
}

const klavesy = {};
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  klavesy[e.code] = true;
  if (e.code === 'KeyM'){
    zvukZapnut = zvuk.tichoZapni();
    if (!zvukZapnut && vlastniAudio){ try { vlastniAudio.pause(); } catch(err){} }
    else if (stav === 'hra') spustHudbu();
    return;
  }
  if (stav === 'obchod'){
    if (e.code === 'Escape' || e.code === 'KeyB' || e.code === 'Backspace') stav = 'vyber';
    return;
  }
  if (stav === 'levely'){
    if (e.code === 'Escape' || e.code === 'Backspace') stav = 'vyber';
    return;
  }
  if (stav === 'vyhra'){
    if (e.code === 'Escape') { stav = 'levely'; return; }
    kampanLevel = Math.min(LEVELU, kampanLevel + 1); zacniHru(true);
    return;
  }
  if (stav === 'hudba'){
    if (e.code === 'Escape' || e.code === 'Backspace') stav = 'vyber';
    if (e.code === 'ArrowRight' || e.code === 'ArrowDown'){
      hudbaIndex = (hudbaIndex+1) % HUDBY.length; spustHudbu(); }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp'){
      hudbaIndex = (hudbaIndex+HUDBY.length-1) % HUDBY.length; spustHudbu(); }
    return;
  }
  if (stav === 'skladatel'){
    if (e.code === 'Escape' || e.code === 'Backspace'){ prehravam = false; zvuk.hudbaStop(); stav = 'vyber'; }
    if (e.code === 'KeyR') nahodnaMelodie();
    return;
  }
  if (stav === 'vyber'){
    if (e.code === 'KeyB'){ stav = 'obchod'; zvuk.klik(); return; }
    if (e.code === 'KeyN'){ stav = 'skladatel'; zvuk.klik(); return; }
    if (e.code === 'KeyJ'){ stav = 'hudba'; zvuk.klik(); return; }
    if (e.code === 'KeyL'){ stav = 'levely'; zvuk.klik(); return; }
    if (e.code === 'KeyO'){ pohledIndex = (pohledIndex+1) % POHLEDY.length; nastavPohled(); zvuk.klik(); return; }
    const c = { Digit1:0, Digit2:1, Digit3:2, Digit4:3, Digit5:4, Digit6:5 }[e.code];
    if (c !== undefined){ vybranyIndex = c; zvuk.klik(); zacniHru(); return; }
    if (e.code === 'ArrowLeft'){ vybranyIndex = (vybranyIndex+ARMADY.length-1)%ARMADY.length; zvuk.klik(); return; }
    if (e.code === 'ArrowRight'){ vybranyIndex = (vybranyIndex+1)%ARMADY.length; zvuk.klik(); return; }
    if (e.code === 'ArrowUp'){
      obtiznostIndex = (obtiznostIndex+OBTIZNOSTI.length-1)%OBTIZNOSTI.length; zvuk.klik(); return; }
    if (e.code === 'ArrowDown'){
      obtiznostIndex = (obtiznostIndex+1)%OBTIZNOSTI.length; zvuk.klik(); return; }
    if (e.code === 'Digit7'){ obtiznostIndex = 0; zvuk.klik(); return; }
    if (e.code === 'Digit8'){ obtiznostIndex = 1; zvuk.klik(); return; }
    if (e.code === 'Digit9'){ obtiznostIndex = 2; zvuk.klik(); return; }
    if (e.code === 'Digit0'){ obtiznostIndex = 3; zvuk.klik(); return; }
    zacniHru(); return;
  }
  if (stav === 'konec'){
    if (e.code === 'KeyV'){ stav = 'vyber'; return; }
    if (e.code === 'KeyB'){ stav = 'obchod'; return; }
    if (e.code === 'KeyL'){ stav = 'levely'; return; }
    zacniHru(rezim === 'kampan'); return;
  }
  if (e.code === 'KeyP'){
    const mam = POZADI.filter(z => mamePozadi[z.id]);
    if (mam.length > 1){
      const i = mam.findIndex(z => z.id === vybranePozadi);
      vybranePozadi = mam[(i+1) % mam.length].id;
      zvuk.klik(); hlaska('POZADÍ: ' + P().jmeno);
    } else hlaska('Další pozadí koupíš v obchodě!');
    return;
  }
  if (e.code === 'KeyO'){
    pohledIndex = (pohledIndex+1) % POHLEDY.length;
    nastavPohled();
    if (stav === 'hra') hlaska('POHLED: ' + POHLEDY[pohledIndex].jmeno);
    return;
  }
  if (e.code === 'KeyH'){
    hudbaIndex = (hudbaIndex+1) % HUDBY.length;
    spustHudbu();
    hlaska('HUDBA: ' + HUDBY[hudbaIndex].jmeno);
    return;
  }
  if (e.code === 'Space') zakric();
});
addEventListener('keyup', e => klavesy[e.code] = false);

const mys = { x: Š/2, y: V/2, drzi: false };
function bodZUdalosti(e){
  const r = platno.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  mys.x = (t.clientX - r.left)/r.width*Š;
  mys.y = (t.clientY - r.top )/r.height*V;
}
function kartaObdelnik(i){
  const š = 150, v = 144, mez = 7;
  const celkem = 6*š + 5*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: 76, š, v };
}
function hudbaKarta(i){
  const š = 200, v = 56, mez = 12, sl = 4;
  const celkem = sl*š + (sl-1)*mez;
  return { x: Š/2 - celkem/2 + (i % sl)*(š+mez), y: 92 + Math.floor(i/sl)*(v+8), š, v };
}
function hudbaTl(i){
  const š = 230, v = 44, mez = 14, celkem = 3*š + 2*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: V-70, š, v };
}
// --- skladatel ---
const RADKU = STUPNICE.length + BASY.length + BICI.length;   // 8 + 4 + 3
function bunkaObdelnik(krok, radek){
  const š = 44, v = 20, mx = 2, my = 2;
  const celkem = KROKU*(š+mx) - mx;
  const mezera = radek >= STUPNICE.length + BASY.length ? 10
               : radek >= STUPNICE.length ? 5 : 0;
  return { x: Š/2 - celkem/2 + krok*(š+mx), y: 76 + radek*(v+my) + mezera, š, v };
}
function radekPopis(r){
  if (r < STUPNICE.length) return { typ:'mel', text: STUPNICE[r].replace('4','').replace('5','^'), barva:'#9ceaff' };
  if (r < STUPNICE.length + BASY.length)
    return { typ:'bas', text: BASY[r - STUPNICE.length].replace('3',''), barva:'#c9b6ff' };
  return { typ:'bic', text: BICI[r - STUPNICE.length - BASY.length][0], barva:'#ffb347' };
}
function bunkaZapnuta(k, r){
  const d = radekPopis(r);
  if (d.typ === 'mel') return mojeNoty[k] === STUPNICE[r];
  if (d.typ === 'bas') return mojeBas[k] === BASY[r - STUPNICE.length];
  return mojeBici[k][r - STUPNICE.length - BASY.length];
}
function prepniBunku(k, r){
  const d = radekPopis(r);
  if (d.typ === 'mel'){
    const n = STUPNICE[r];
    mojeNoty[k] = (mojeNoty[k] === n) ? null : n;
    if (mojeNoty[k]) zvuk.ton({f: zvuk.nota(n), t:.16, typ:'triangle', hlas:.16});
    else zvuk.klik();
  } else if (d.typ === 'bas'){
    const n = BASY[r - STUPNICE.length];
    mojeBas[k] = (mojeBas[k] === n) ? null : n;
    if (mojeBas[k]) zvuk.ton({f: zvuk.nota(n), t:.2, typ:'square', hlas:.16});
    else zvuk.klik();
  } else {
    const i = r - STUPNICE.length - BASY.length;
    mojeBici[k][i] = !mojeBici[k][i];
    if (mojeBici[k][i]){
      if (i === 0){ zvuk.sum({t:.12, hlas:.2, filtr:200}); zvuk.ton({f:72, f2:44, t:.12, typ:'sine', hlas:.18}); }
      if (i === 1) zvuk.sum({t:.07, hlas:.14, filtr:2600});
      if (i === 2) zvuk.sum({t:.04, hlas:.08, filtr:6000});
    } else zvuk.klik();
  }
}
function skladatelTlacitko(){ return { x: Š/2 + 240, y: 304, š: 224, v: 42 }; }
function pohledObdelnik(i){
  const š = 156, v = 30, mez = 8, celkem = POHLEDY.length*š + (POHLEDY.length-1)*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: 402, š, v };
}
function pozadiObdelnik(i){
  const š = 118, v = 34, mez = 6, celkem = POZADI.length*š + (POZADI.length-1)*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: 360, š, v };
}
function sklTl(i){
  const popisy = 6;
  const š = 148, v = 40, mez = 10, celkem = popisy*š + (popisy-1)*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: 486, š, v };
}
function tempoTl(i){ return { x: Š/2 - 150 + i*220, y: 438, š: 60, v: 36 }; }
function obtiznostObdelnik(i){
  const š = 190, v = 50, mez = 14, celkem = 4*š + 3*mez;
  return { x: Š/2 - celkem/2 + i*(š+mez), y: 244, š, v };
}
function obtiznostPodMysi(){
  for (let i = 0; i < OBTIZNOSTI.length; i++){
    const k = obtiznostObdelnik(i);
    if (mys.x > k.x && mys.x < k.x+k.š && mys.y > k.y && mys.y < k.y+k.v) return i;
  }
  return -1;
}
function kartaPodMysi(){
  for (let i = 0; i < ARMADY.length; i++){
    const k = kartaObdelnik(i);
    if (mys.x > k.x && mys.x < k.x+k.š && mys.y > k.y-14 && mys.y < k.y+k.v) return i;
  }
  return -1;
}
platno.addEventListener('pointerdown', e => {
  bodZUdalosti(e);
  if (mys.x > Š-56 && mys.y < 56){
    zvukZapnut = zvuk.tichoZapni();
    if (!zvukZapnut && vlastniAudio){ try { vlastniAudio.pause(); } catch(err){} }
    else if (stav === 'hra') spustHudbu();
    return;
  }
  if (stav === 'levely'){
    if (vObdelniku(levelZpet())){ stav = 'vyber'; zvuk.klik(); return; }
    for (let i = 0; i < LEVELU; i++)
      if (vObdelniku(levelKarta(i))){
        const n = i + 1;
        if (n <= odemknuto){ kampanLevel = n; zvuk.start(); zacniHru(true); }
        else zvuk.chyba();
        return;
      }
    return;
  }
  if (stav === 'vyhra'){
    for (let i = 0; i < 3; i++)
      if (vObdelniku({ x: Š/2 - 130, y: 250 + i*62, š: 260, v: 50 })){
        if (i === 0){ kampanLevel = Math.min(LEVELU, kampanLevel + 1); zacniHru(true); }
        if (i === 1) zacniHru(true);
        if (i === 2){ stav = 'levely'; zvuk.klik(); }
        return;
      }
    return;
  }
  if (stav === 'hudba'){
    for (let i = 0; i < HUDBY.length; i++)
      if (vObdelniku(hudbaKarta(i))){
        hudbaIndex = i; zvuk.klik(); spustHudbu(); return;
      }
    if (vObdelniku(hudbaTl(0))){ stav = 'skladatel'; zvuk.klik(); return; }
    if (vObdelniku(hudbaTl(1))){ vyberSoubor(); return; }
    if (vObdelniku(hudbaTl(2))){ stav = 'vyber'; zvuk.klik(); return; }
    return;
  }
  if (stav === 'skladatel'){
    for (let r = 0; r < RADKU; r++)
      for (let k = 0; k < KROKU; k++)
        if (vObdelniku(bunkaObdelnik(k, r))){
          prepniBunku(k, r);
          if (prehravam) zvuk.skladbaHraj(mojeNoty, mojeBas, mojeBici, mojeTempo);
          return;
        }
    for (let i = 0; i < 2; i++)
      if (vObdelniku(tempoTl(i))){
        mojeTempo = omez(mojeTempo + (i === 0 ? -10 : 10), 70, 230);
        zvuk.klik();
        if (prehravam){ prehravamOd = cas; zvuk.skladbaHraj(mojeNoty, mojeBas, mojeBici, mojeTempo); }
        return;
      }
    if (vObdelniku(sklTl(0))){          // přehrát / stop
      prehravam = !prehravam;
      if (prehravam){
        prehravamOd = cas;
        if (jePrazdna()) nahodnaMelodie();
        zvuk.skladbaHraj(mojeNoty, mojeBas, mojeBici, mojeTempo);
      } else zvuk.hudbaStop();
      return;
    }
    if (vObdelniku(sklTl(1))){          // náhodně
      nahodnaMelodie(); zvuk.sber();
      if (prehravam){ prehravamOd = cas; zvuk.skladbaHraj(mojeNoty, mojeBas, mojeBici, mojeTempo); }
      return;
    }
    if (vObdelniku(sklTl(2))){          // smazat
      mojeNoty = new Array(KROKU).fill(null);
      mojeBas = new Array(KROKU).fill(null);
      mojeBici = Array.from({length: KROKU}, () => [false, false, false]);
      zvuk.chyba(); zvuk.hudbaStop(); prehravam = false;
      return;
    }
    if (vObdelniku(sklTl(3))){ vyberSoubor(); return; }
    if (vObdelniku(sklTl(4))){          // hrát s touhle písničkou
      hudbaIndex = HUDBY.findIndex(h => h.vlastni);
      if (jePrazdna()) nahodnaMelodie();
      prehravam = false;
      stav = 'vyber'; zvuk.vyhra();
      return;
    }
    if (vObdelniku(sklTl(5))){
      prehravam = false; zvuk.hudbaStop();
      stav = 'vyber'; zvuk.klik(); return;
    }
    return;
  }
  if (stav === 'obchod'){
    if (vObdelniku(zpetTlacitko())){ stav = 'vyber'; zvuk.klik(); return; }
    const zal = ['skiny','pozadi','vylepseni','balicky'];
    for (let i = 0; i < zal.length; i++)
      if (vObdelniku(zalozkaKarta(i))){ obchodZalozka = zal[i]; zvuk.klik(); return; }
    if (obchodZalozka === 'pozadi')
      for (let i = 0; i < POZADI.length; i++)
        if (vObdelniku(pozadiKarta(i))){ koupPozadi(i); return; }
    if (obchodZalozka === 'skiny'){
      for (let i = 0; i < ARMADY.length; i++)
        if (vObdelniku(armadaKarta(i))){ vybranyIndex = i; zvuk.klik(); return; }
      for (let i = 0; i < SKINY.length; i++)
        if (vObdelniku(skinKarta(i))){ koupSkin(i); return; }
    }
    if (obchodZalozka === 'vylepseni')
      for (let i = 0; i < VYLEPSENI.length; i++)
        if (vObdelniku(vylKarta(i))){ koupVylepseni(i); return; }
    if (obchodZalozka === 'balicky')
      for (let i = 0; i < BALICKY.length; i++)
        if (vObdelniku(balicekKarta(i))){ koupBalicek(i); return; }
    return;
  }
  if (stav === 'vyber'){
    if (vObdelniku(obchodTlacitko())){ stav = 'obchod'; zvuk.klik(); return; }
    if (vObdelniku(skladatelTlacitko())){ stav = 'skladatel'; zvuk.klik(); return; }
    for (let i = 0; i < POHLEDY.length; i++)
      if (vObdelniku(pohledObdelnik(i))){
        pohledIndex = i; nastavPohled(); zvuk.klik(); return;
      }
    for (let i = 0; i < POZADI.length; i++)
      if (vObdelniku(pozadiObdelnik(i))){
        const z = POZADI[i];
        if (mamePozadi[z.id]){ vybranePozadi = z.id; nastavPozadi(); zvuk.klik(); }
        else zvuk.chyba();
        return;
      }
    if (vObdelniku(hudbaTlacitko())){ stav = 'hudba'; zvuk.klik(); return; }
    if (vObdelniku(levelTlacitko())){ stav = 'levely'; zvuk.klik(); return; }
    const o = obtiznostPodMysi();
    if (o >= 0){ obtiznostIndex = o; zvuk.klik(); return; }
    const i = kartaPodMysi();
    if (i >= 0){ vybranyIndex = i; zvuk.klik(); zacniHru(); }
    return;
  }
  if (stav === 'konec'){
    if (mys.y > V-90){ stav = rezim === 'kampan' ? 'levely' : 'vyber'; return; }
    if (vObdelniku({x: Š/2-110, y: V/2+86, š: 220, v: 44})){ stav = 'obchod'; zvuk.klik(); return; }
    zacniHru(rezim === 'kampan'); return;
  }
  if (mys.x > Š-125 && mys.y > V-125){ zakric(); return; }
  mys.drzi = true;
});

// ============ PARTA ============
function nastavJednotky(){
  const kolik = omez(armada, 0, 60);
  while (jednotky.length < kolik)
    jednotky.push({ x: vudce.x + nah(-40,40), y: PY + nah(-30,30),
                    faze: nah(0,7), puls: 1, blik: 0, zaseh: 0 });
  while (jednotky.length > kolik) jednotky.pop();
  for (let i = 0; i < jednotky.length; i++){
    const a = i*2.3999, r = 15*Math.sqrt(i);
    jednotky[i].fx = Math.cos(a)*r;
    jednotky[i].fy = Math.sin(a)*r*.55;
  }
}
function armadaZmen(n){
  armada = omez(Math.round(n), 0, 99999999);
  if (armada > armadaVrchol) armadaVrchol = armada;
  nastavJednotky();
}
function krokJednotek(dt){
  for (const j of jednotky){
    const tx = vudce.x + j.fx, ty = PY + j.fy;
    j.x += (tx - j.x)*Math.min(1, 9*dt);
    j.y += (ty - j.y)*Math.min(1, 7*dt);
    j.faze += dt*13;
    j.puls = Math.max(0, j.puls - dt*3);
    j.blik = Math.max(0, j.blik - dt*6);
    j.zaseh = Math.max(0, j.zaseh - dt);
  }
  prachTimer -= dt;
  if (prachTimer <= 0 && jednotky.length){
    prachTimer = .05;
    const j = nahZ(jednotky);
    pridej({typ:'kour', x:j.x+nah(-6,6), y:j.y+16, vx:nah(-20,20), vy:nah(40,90),
            zivot:.5, max:.5, r:3, rr:12, barva:'rgba(215,205,190,'});
  }
}
function pulsAll(){ for (const j of jednotky){ j.puls = 1; j.blik = 1; } }

// ============ STŘÍLENÍ ============
function silaStrely(){
  return Math.max(1, Math.sqrt(armada)*.75) * (1 + (zbran-1)*.8) * (1 + vyl('palba')*.18);
}
function rychlostPalby(){ return Math.min(38, 6 + Math.sqrt(armada)*1.9) * (1 + (zbran-1)*.3); }

function hordaFront(g){
  if (g.hotovo || g.pocet === null || g.pocet <= 0) return null;
  const gy = PY - (g.wy - ujeto);
  const len = g.jed.length;
  const zbylo = Math.max(1, Math.round(len*omez(g.pocet/g.plny, 0, 1)));
  const i0 = len - zbylo;
  return { gy, i0, y: gy + g.jed[i0].fy };
}
function bossNohy(){ return boss ? PY - (boss.y - ujeto) : -9999; }
function najdiCil(){
  let nej = null, nejd = 1e9;
  const zkus = (x, y, r) => {
    if (y < -560 || y > PY + 30) return;
    const d = PY - y;
    if (d < nejd){ nejd = d; nej = { x, y, r }; }
  };
  for (const g of skupiny){
    const f = hordaFront(g);
    if (f) zkus(g.x, f.y, g.sirka/2);
  }
  for (const z of zdi){
    if (!z.hotovo && z.hp > 0) zkus(z.x, PY - (z.wy - ujeto), z.sirka/2 - 10);
  }
  for (const s of sudy){
    if (!s.hotovo && s.typ === 'vybuch') zkus(s.x, PY - (s.wy - ujeto), 12);
  }
  if (nej) return nej;
  if (boss && !boss.padl && !boss.dorazil){
    const by = bossNohy();
    if (by > -220 && boss.viden && boss.plny > 0) return { x: Š/2, y: by - 140, r: 100 };
  }
  return null;
}
function vystrel(){
  const cil = najdiCil();
  if (!cil) return;                 // dokud není koho, nestřílíme
  const dmg = silaStrely();
  for (let i = 0; i < zbran; i++){
    const j = jednotky.length ? nahZ(jednotky) : { x: vudce.x, y: PY, zaseh: 0 };
    j.zaseh = .07;
    const x = j.x, y = j.y - 16;
    let dx = 0, dy = -1;
    if (cil){
      dx = (cil.x + nah(-cil.r, cil.r)) - x;
      dy = (cil.y + nah(-14, 14)) - y;
      const d = Math.hypot(dx, dy) || 1;
      dx /= d; dy /= d;
    } else dx = nah(-.06, .06);
    strely.push({ x, y, vx: dx*1000, vy: dy*1000, dmg, r: 4.5 + zbran*.9, zivot: 1.4 });
    pridej({typ:'iskra', x, y, vx:dx*nah(60,200), vy:dy*nah(60,200),
            zivot:.1, max:.1, barva:armadaTyp.strela});
  }
  if (zvukStrelby <= 0){ zvuk.pif(); zvukStrelby = .07; }
}
function zasahniSkupinu(g, s){
  g.pocet -= s.dmg; g.blik = .12;
  iskry(s.x, s.y, '#ffe08a', 4, 220);
  if (Math.random() < .5) kusy(s.x, s.y, POTVORY_DEF[g.druh].tmava, 1);
  if (g.pocet <= 0) znicSkupinu(g);
}
function vystrelVeze(v){
  const cil = najdiCil();
  const zx = vudce.x + v.slot*72, y = PY - 26;
  let dx = 0, dy = -1;
  if (cil){
    dx = cil.x - zx; dy = cil.y - y;
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  }
  const kolik = v.hlavne || 1;
  for (let i = 0; i < kolik; i++){
    const bok = (i - (kolik-1)/2) * 16;
    strely.push({ x: zx + bok, y, vx: dx*950, vy: dy*950,
                  dmg: silaStrely()*3.6*(kolik === 2 ? 1.25 : 1), r: 10, zivot: 1.4, velka: true });
  }
  iskry(zx + dx*20, y + dy*20, '#ffe08a', 8, 260);
  zvuk.prask();
  v.uhelHlavne = Math.atan2(dy, dx);
}
function strelbaKrok(dt){
  zvukStrelby -= dt;
  for (const v of veze){
    v.cd -= dt;
    if (v.cd <= 0){ v.cd = .45; vystrelVeze(v); }
  }
  strelaTimer += dt*rychlostPalby();
  let p = 0;
  while (strelaTimer >= 1 && p++ < 10){ strelaTimer -= 1; vystrel(); }
  if (strelaTimer > 3) strelaTimer = 0;
  if (strely.length > 500) strely.splice(0, strely.length - 500);

  for (const s of strely){
    s.x += s.vx*dt; s.y += s.vy*dt; s.zivot -= dt;
    if (s.y < -1000 || s.x < -400 || s.x > Š+400 || s.zivot <= 0) s.pryc = true;
  }
  for (const s of strely){
    if (s.pryc) continue;
    for (const g of skupiny){
      const f = hordaFront(g);
      if (!f) continue;
      if (Math.abs(s.x - g.x) > g.sirka/2 + 20 + s.r) continue;
      if (s.y < f.y + 20 && s.y > f.y - 70){ s.pryc = true; zasahniSkupinu(g, s); break; }
    }
    if (s.pryc) continue;
    // zdi
    for (const z of zdi){
      if (z.hotovo || z.hp <= 0) continue;
      const zy = PY - (z.wy - ujeto);
      if (zy < -900) continue;
      if (Math.abs(s.x - z.x) > z.sirka/2 + 8) continue;
      if (s.y < zy + 22 && s.y > zy - 46){
        s.pryc = true; z.hp -= s.dmg; z.blik = .12;
        iskry(s.x, s.y, '#e8d9b0', 4, 200);
        if (Math.random() < .4) kusy(s.x, s.y, '#8b8172', 1);
        if (z.hp <= 0) prorazZed(z);
        break;
      }
    }
    if (s.pryc) continue;
    // výbušné sudy
    for (const b of sudy){
      if (b.hotovo || b.typ !== 'vybuch') continue;
      const byy = PY - (b.wy - ujeto);
      if (byy < -900) continue;
      if (Math.hypot(s.x - b.x, s.y - byy) < 26){ s.pryc = true; bouchniSud(b, byy); break; }
    }
    if (s.pryc) continue;
    if (boss && boss.viden && boss.plny > 0 && !boss.padl && !boss.dorazil){
      const by = bossNohy();
      if (by > -220 && s.y < by - 4 && s.y > by - 430 && Math.abs(s.x - Š/2) < 220){
        s.pryc = true;
        boss.hp -= s.dmg * 1.6;
        boss.puls = 1;
        boss.dmgSoucet = (boss.dmgSoucet || 0) + s.dmg*1.6;
        iskry(s.x, s.y, '#ffd166', 6, 300);
        if (Math.random() < .25) kour(s.x, s.y, 1);
        if (boss.hp <= 0) znicBosse();
      }
    }
  }
  strely = strely.filter(s => !s.pryc);
}

// ============ ÚROVEŇ ============
function operace(typ, v){
  if (typ === 'zbran') return { typ, v, text:'ZBRAŇ +1', dobra:true };
  const zn = { krat:'×', plus:'+', minus:'−', deleno:'÷' }[typ];
  return { typ, v, text: zn+v, dobra: (typ === 'krat' || typ === 'plus') };
}
function vyrobBranku(y, u, zaklad){
  const velkePlus = Math.max(15, Math.round(zaklad*nah(.5,1)));
  const maleMinus = Math.max(4, Math.round(zaklad*nah(.2,.4)*OB.zlaBranka));
  let dobra = nahZ([ operace('krat',2), operace('krat',2), operace('krat',3),
                     operace('plus', velkePlus) ]);
  if (zbran < 4 && Math.random() < .12) dobra = operace('zbran', 1);
  let druha;
  if (Math.random() < .2) druha = operace('plus', Math.max(4, Math.round(zaklad*.15)));
  else if (OB.zlaBranka < .8)
    druha = nahZ([ operace('deleno',2), operace('minus', maleMinus), operace('minus', maleMinus) ]);
  else druha = nahZ([ operace('deleno',2), operace('deleno',2), operace('deleno',3),
                      operace('minus', maleMinus) ]);
  const vlevo = Math.random() < .5;
  return { y,
    levo:  { x1: TRAT_L, x2: STRED, op: vlevo ? dobra : druha },
    pravo: { x1: STRED, x2: TRAT_R, op: vlevo ? druha : dobra },
    prosla: false };
}
function vyrobRadu(y, zaklad){
  const vpravo = Math.random() < .5;
  const hodnota = Math.max(3, Math.round(zaklad*.09));
  const kolik = nahC(7,11);
  for (let i = 0; i < kolik; i++)
    radky.push({ y: y+i*66,
      x1: vpravo ? TRAT_R-170 : TRAT_L,
      x2: vpravo ? TRAT_R : TRAT_L+170,
      op: operace('plus', hodnota), prosla:false });
}
function vyrobHordu(wy){
  const sirka = nah(.45,.95)*(TRAT_R-TRAT_L);
  const x = omez(nah(TRAT_L+sirka/2, TRAT_R-sirka/2), TRAT_L+sirka/2, TRAT_R-sirka/2);
  return { wy, x, sirka, pocet:null, plny:0, hotovo:false, jed:[], blik:0,
           druh: nahC(0, POTVORY_DEF.length-1), velitel: Math.random() < .5 };
}
function vyrobZed(wy){
  const sirka = nah(.35, .62)*(TRAT_R-TRAT_L);
  const x = omez(nah(TRAT_L+sirka/2, TRAT_R-sirka/2), TRAT_L+sirka/2, TRAT_R-sirka/2);
  const plny = Math.max(6, Math.round(armada*nah(.5, .95)*OB.horda*(uroven === 1 ? .6 : 1)));
  return { wy, x, sirka, plny, hp: plny, hotovo:false, blik:0,
           kameny: Array.from({length: 26}, () => ({x:nah(-.5,.5), y:nah(0,1), s:nah(.7,1.2)})) };
}
function vyrobSud(wy, typ){
  return { wy, x: nah(TRAT_L+60, TRAT_R-60), typ, hotovo:false, faze:nah(0,7) };
}
// budovy a mosty po stranách trati
function vyrobOkoli(delka){
  const typy = { nocni:['mrakodrap','mrakodrap','vez'], den:['domek','domek','vez'],
                 zapad:['pyramida','domek','pyramida'], ledova:['vez','domek','vez'],
                 lava:['vez','mrakodrap','vez'], vesmir:['mrakodrap','vez','mrakodrap'],
                 michane:['mrakodrap','domek','vez'] };
  const sada = typy[PZ.id] || typy.nocni;
  for (let y = 300; y < delka; y += nah(300, 560)){
    for (const strana of [-1, 1]){
      if (Math.random() < .45) continue;
      budovy.push({ wy: y + nah(-90, 90), strana, typ: nahZ(sada),
                    sirka: nah(60, 120), vyska: nah(90, 260),
                    odsazeni: nah(40, 330), seed: nahC(0, 9) });
    }
  }
  const hlasky = ['TRAŤ 1', 'POZOR OBR', 'JEĎ!', 'BRAMBOROVÝ MOST', 'KILOMETR 3', 'SEM DÁL'];
  for (let y = 900; y < delka; y += nah(1100, 1800))
    mosty.push({ wy: y, nadpis: nahZ(hlasky) });
}
function vyrobUroven(){
  nastavPozadi();
  branky = []; radky = []; skupiny = []; zlodeji = []; stromy = []; lampy = []; strely = [];
  zdi = []; sudy = []; bossStrely = []; budovy = []; mosty = [];
  ujeto = 0; strelaTimer = 0;
  bonusKolo = rezim === 'nekonecny' && (uroven % 4 === 0) && (uroven % 5 !== 0);
  if (bonusKolo){
    boss = null;
    konecKola = 4400;
    for (let y = 360; y < konecKola - 260; y += 210) skupiny.push(vyrobHordu(y));
    for (let y = 480; y < konecKola - 300; y += 430)
      sudy.push(vyrobSud(y, nahZ(['zbran','stit','vez','vez','vybuch','vybuch'])));
    for (let sy = 0; sy < konecKola + 400; sy += 120){
      stromy.push({ wy: sy, x: nah(26, TRAT_L-40), druh: nahC(0,2), faze: nah(0,7) });
      stromy.push({ wy: sy+60, x: nah(TRAT_R+40, Š-26), druh: nahC(0,2), faze: nah(0,7) });
    }
    for (let sy = 200; sy < konecKola + 300; sy += 340)
      lampy.push({ wy: sy, vpravo: Math.random() < .5 });
    vyrobOkoli(konecKola + 500);
    zlodejTimer = 999;
    return;
  }
  const pocetBranek = 4 + Math.min(4, Math.floor(uroven/2));
  skupiny.push(vyrobHordu(400));
  let y = 640;
  for (let i = 0; i < pocetBranek; i++){
    branky.push(vyrobBranku(y, uroven, armada));
    if (i < pocetBranek-1){
      skupiny.push(vyrobHordu(y+260));
      skupiny.push(vyrobHordu(y+480));
      if (uroven >= 3) skupiny.push(vyrobHordu(y+130));
    }
    if (i === 1 || (i === pocetBranek-2 && Math.random() < .7)) vyrobRadu(y+120, armada);
    // zeď na proražení
    if (i > 0 && Math.random() < .7) zdi.push(vyrobZed(y + 390));
    // sudy: se zbraní i výbušné
    if (zbran < 4 || Math.random() < .4) sudy.push(vyrobSud(y + 200, 'zbran'));
    else sudy.push(vyrobSud(y + 200, nahZ(['stit','vez'])));
    sudy.push(vyrobSud(y + 560, 'vybuch'));
    if (uroven >= 2) sudy.push(vyrobSud(y + 350, 'vybuch'));
    if (i % 2 === 0) sudy.push(vyrobSud(y + 620, nahZ(['stit','vez','vez'])));
    y += 660;
  }
  const superKolo = rezim === 'kampan' ? (kampanLevel % 10 === 0) : (uroven % 5 === 0);
  const bezneObry = OBRI.length - 2;         // poslední dva jsou super bossové
  const typObra = superKolo
    ? bezneObry + ((rezim === 'kampan' ? Math.floor(kampanLevel/10) : Math.floor(uroven/5)) - 1) % 2
    : (rezim === 'kampan' ? (kampanLevel-1) % bezneObry
                          : (uroven-1 - Math.floor((uroven-1)/5)) % bezneObry);
  boss = { typ: typObra, def: OBRI[typObra], y: y+300, hp: 0, plny: 0,
           puls: 0, padl: false, dorazil: false, viden: false, dupTimer: 0,
           utokTimer: 1.0, super: superKolo };
  boss.plny = 0; boss.hp = 0;   // spočítá se, až obr přijde
  dejObra(typObra, false, false);           // předkreslíme dopředu
  for (let sy = 0; sy < boss.y + 500; sy += 120){
    stromy.push({ wy: sy, x: nah(26, TRAT_L-40), druh: nahC(0,2), faze: nah(0,7) });
    stromy.push({ wy: sy+60, x: nah(TRAT_R+40, Š-26), druh: nahC(0,2), faze: nah(0,7) });
  }
  for (let sy = 200; sy < boss.y + 400; sy += 340)
    lampy.push({ wy: sy, vpravo: Math.random() < .5 });
  vyrobOkoli(boss.y + 600);
  zlodejTimer = uroven >= OB.zlodejOd ? nah(4,7) : 999;
  konecKola = boss.y;
}

  OB = kampan ? obtiznostLevelu(kampanLevel) : OBTIZNOSTI[obtiznostIndex];

  skore = 0;

  krikCas = 0; castice = []; popisky = []; otres = 0; blesk = 0; zpomaleni = 0;

  mince = []; minceZaBeh = 0; srdcka = vyl('srdce'); armadaVrchol = armada;
  vudce.x = STRED; vudce.cilX = STRED; kamX = 0; kamNaklon = 0;
  jednotky = []; nastavJednotky();
  vyrobUroven();
  zvuk.start();
  spustHudbu();
  hlaska('PAL A BĚŽ!');
}
function levelSplnen(){
  splneno[kampanLevel] = Math.max(splneno[kampanLevel] || 0, skore);
  odemknuto = Math.max(odemknuto, Math.min(LEVELU, kampanLevel + 1));
  nejlepsi = Math.max(nejlepsi, skore);
  nejlepsiKolo = Math.max(nejlepsiKolo, 1 + Math.floor(kampanLevel/10));
  znamky++;
  if (vlastniAudio){ try { vlastniAudio.pause(); } catch(e){} }
  zvuk.hudbaStop();
  konfety(90);
  stav = 'vyhra';
}
function konecHry(){
  if (vlastniAudio){ try { vlastniAudio.pause(); } catch(e){} }
  stav = 'konec';
  nejlepsi = Math.max(nejlepsi, skore);
  nejlepsiKolo = Math.max(nejlepsiKolo, uroven);
  znamky++;                       // za každý dohraný běh jedna dárková známka
  zvuk.hudbaStop();
}
// jediné místo, kde se umírá — srdíčko tě může zachránit

    srdcka--;
    armadaZmen(Math.max(OB.start, Math.round(armadaVrchol*.3)));

// ============ BRANKY ============
function pouzijOperaci(op, x, tichy){
  if (op.typ === 'zbran'){
    zbran = Math.min(4, zbran+1);
    zvuk.zbranUp(); pulsAll(); zatres(7);
    iskry(x, PY-30, '#c9b6ff', 26, 340);
    kruh(x, PY-20, '#a78bfa', 180, .45);
    popisek(x, PY-95, 'ZBRAŇ ' + zbran + '!', '#c9b6ff', 34);
    hlaska(nahZ(['VÍC KANÓNŮ!','TEĎ TO ŘACHNE!','Palba jako z rukávu!']));
    body(40); return;
  }
  let n = armada;
  if (op.typ === 'krat')   n = armada*op.v;
  if (op.typ === 'plus')   n = armada+op.v;
  if (op.typ === 'minus')  n = armada-op.v;
  if (op.typ === 'deleno') n = Math.floor(armada/op.v);
  armadaZmen(n);
  if (op.dobra){
    if (tichy){ zvuk.cink(); popisek(x, PY-65, op.text, '#8fffc4', 24); iskry(x, PY-20, '#8fffc4', 5, 160); }
    else { zvuk.sber(); pulsAll(); iskry(x, PY-30, '#3ddc84', 22, 320);
           kruh(x, PY-20, '#3ddc84', 160, .4);
           popisek(x, PY-95, op.text+'!', '#3ddc84', 34); }
    body(5);
  } else {
    zvuk.chyba(); zatres(9);
    iskry(x, PY-30, '#ff5c7a', 22, 320);
    kusy(x, PY-20, '#c98a3a', 10);
    popisek(x, PY-95, op.text, '#ff8a8a', 34);
    hlaska(nahZ(['Ajaj!','Půlka se rozutekla!','To byla blbá branka!']));
  }
  if (armada <= 0){
    zemri('Armáda se rozutekla do lesa. Držte se zelených branek!');
  }
}

// ============ HORDY ============
function znicSkupinu(g){
  const gy = omez(PY - (g.wy - ujeto), 40, V-40);
  g.hotovo = true;
  zvuk.vybuch(); zatres(9);
  iskry(g.x, gy, '#ffd166', 26, 420);
  kusy(g.x, gy, POTVORY_DEF[g.druh].tmava, 16);
  kour(g.x, gy, 6);
  kruh(g.x, gy, '#ff8a8a', 200, .45);
  popisek(g.x, gy-40, 'ROZMÁZNUTO!', '#ffd166', 32);
  pustMince(g.x, gy, nahC(3,5), Math.max(1, Math.round(Math.log10(1 + g.plny)*3)));
  body(g.plny*3);
}
function bitka(g){
  g.hotovo = true; g.pocet = Math.max(0, g.pocet);
  const zbylo = Math.min(Math.max(0, Math.round(g.pocet)), Math.round(armada*.65));
  if (pouzitStit(g.x, PY)){
    iskry(g.x, PY, '#9ceaff', 30, 420);
    kusy(g.x, PY, POTVORY_DEF[g.druh].tmava, 20);
    popisek(g.x, PY-110, 'ODRAŽENO!', '#9ceaff', 30);
    body(g.plny*2);
    return;
  }
  // potvory nejdřív sundají věž, když ji máš
  if (veze.length){
    veze.pop();
    zatres(12); zvuk.zasah();
    kusy(vudce.x, PY, '#8b93a6', 18);
    popisek(vudce.x, PY-120, 'SUNDALI VĚŽ!', '#ffd166', 30);
    return;
  }
  zatres(13); blesk = .8; zvuk.zasah();
  iskry(g.x, PY, '#ff5c7a', 30, 420);
  kusy(g.x, PY, '#c98a3a', 18);
  popisek(g.x, PY-115, '−' + cislo(zbylo), '#ff8a8a', 34);
  armadaZmen(armada - zbylo);
  if (armada <= 0){
    zemri('Potvory se dostaly až k tobě a přemohly celou partu!');
  } else hlaska(nahZ(['AU!','Došly nám náboje!','Ubyli nám!']));
}

// ============ ŠTÍT ============
function pouzitStit(x, y){
  if (stit <= 0) return false;
  stit--;
  zvuk.cink(); zatres(7); blesk = .45;
  kruh(vudce.x, PY, '#7fe7ff', 300, .5);
  iskry(x, y, '#9ceaff', 26, 340);
  popisek(vudce.x, PY-140, 'ŠTÍT DRŽEL!', '#9ceaff', 32);
  return true;
}

// ============ PŘÍCHOD OBRA ============
function bossPrichod(){
  if (!boss || boss.padl || boss.dorazil || boss.viden) return;
  if (bossNohy() <= -320) return;
  boss.viden = true;
  // kolik vydrží: podle toho, jak silně právě teď pálíš
  const dpsOdhad = Math.min(38, 6 + Math.sqrt(armada)*1.9) * zbran *
                   Math.max(1, Math.sqrt(armada)*.75) * (1 + (zbran-1)*.8) *
                   (1 + veze.length*.3);
  boss.plny = Math.max(20, Math.round(dpsOdhad * (boss.super ? 11 : 5.5) * OB.boss));
  boss.hp = boss.plny;
  boss.utokTimer = boss.super ? .8 : 1.1;
  // na obra hraje vlastní bojová hudba
  if (!HUDBY[hudbaIndex].soubor && HUDBY[hudbaIndex].jmeno !== 'TICHO'){
    hudbaBossHraje = true;
    const t = HUDBA_BOSSE.tempo * (boss.super ? 1.1 : 1);
    zvuk.hudbaHraj(HUDBA_BOSSE.noty, t, HUDBA_BOSSE.typ, HUDBA_BOSSE.hlas);
    zvuk.hudbaBiciHraj(t);
  }
  zvuk.rev(); zatres(boss.super ? 16 : 9);
  if (boss.super){ blesk = .7; konfety(20); }
  hlaska((boss.super ? 'SUPER BOSS: ' : '') + boss.def.jmeno + '!');
}

// ============ ÚTOK OBRA ============
function vystrelBossa(by){
  const u = boss.def.utok || { typ:'kamen', y:-280, barva:'#8b93a6' };
  const x0 = Š/2 + nah(-40, 40), y0 = Math.max(-40, by + u.y);
  const cilX = omez(vudce.x + nah(-30, 30), TRAT_L+20, TRAT_R-20);
  const vy = u.typ === 'laser' ? 900 : 430;
  const t = (PY - y0) / vy;
  bossStrely.push({ x:x0, y:y0, vx:(cilX - x0)/Math.max(.2, t), vy,
                    cilX, typ:u.typ, barva:u.barva, uhel:0, rot:nah(-6,6),
                    r: u.typ === 'laser' ? 9 : 22, dopad:false });
  zvuk.rev();
  iskry(x0, y0, u.barva, 12, 260);
}

// ============ ZDI A SUDY ============
function prorazZed(z){
  z.hotovo = true;
  const zy = omez(PY - (z.wy - ujeto), 40, V-40);
  zvuk.vybuch(); zatres(11);
  iskry(z.x, zy, '#f0e2c0', 28, 460);
  kusy(z.x, zy, '#8b8172', 26);
  kour(z.x, zy, 8);
  kruh(z.x, zy, '#ffe9b0', 240, .45);
  popisek(z.x, zy-40, 'ZEĎ PADLA!', '#ffe9b0', 32);
  pustMince(z.x, zy, 2, Math.max(1, Math.round(Math.log10(1 + z.plny)*2)));
  body(z.plny*3);
}
function bouchniSud(b, by){
  b.hotovo = true;
  const sila = Math.max(4, armada*.9);
  zvuk.vybuch(); zatres(16); blesk = .8;
  iskry(b.x, by, '#ff9a3c', 46, 640);
  iskry(b.x, by, '#fff2b0', 26, 380);
  kusy(b.x, by, '#a8461f', 20);
  kour(b.x, by, 10);
  kruh(b.x, by, '#ffb03a', 300, .5);
  popisek(b.x, by-46, 'BUM!', '#ffd166', 40);
  pustMince(b.x, by, 2, 3);
  // sfoukne potvory kolem
  for (const g of skupiny){
    const f = hordaFront(g);
    if (!f) continue;
    if (Math.hypot(g.x - b.x, f.y - by) < 230){
      g.pocet -= sila; g.blik = .2;
      iskry(g.x, f.y, '#ffd166', 14, 320);
      if (g.pocet <= 0) znicSkupinu(g);
    }
  }
  for (const z of zdi){
    if (z.hotovo || z.hp <= 0) continue;
    const zy = PY - (z.wy - ujeto);
    if (Math.hypot(z.x - b.x, zy - by) < 230){
      z.hp -= sila; z.blik = .2;
      if (z.hp <= 0) prorazZed(z);
    }
  }
  if (boss && boss.viden && boss.plny > 0 && !boss.padl && !boss.dorazil){
    const bo = bossNohy();
    if (Math.abs(bo - by) < 320){
      boss.hp -= sila; boss.puls = 1;
      if (boss.hp <= 0) znicBosse();
    }
  }
  body(25);
}

// ============ OBR ============
function znicBosse(){
  boss.padl = true;
  if (hudbaBossHraje){ hudbaBossHraje = false; spustHudbu(); }
  blesk = 1; zatres(20); zpomaleni = .5; zvuk.vyhra(); zvuk.dupnuti();
  const by = bossNohy();
  iskry(Š/2, by-200, '#ffd166', 70, 700);
  kusy(Š/2, by-180, boss.def.kusy, 40);
  kour(Š/2, by-140, 16);
  kruh(Š/2, by-180, '#fff', 620, .7);
  konfety(80);
  const zisk = boss.plny*10 + 100;
  body(zisk);
  popisek(Š/2, 250, '+' + cislo(zisk), '#ffd166', 40);
  pustMince(Š/2, Math.max(80, by-120), 14, Math.max(6, Math.round(Math.log10(1 + boss.plny)*6)));
  hlaska(nahZ(['OBR PADL!','ROZMÁZLI JSME HO!','VÍTĚZSTVÍ!','TO BYLA JÍZDA!']));
  if (rezim === 'kampan'){ levelSplnen(); return; }
  dalsiUroven();
}
function bossDorazil(){
  boss.dorazil = true;
  if (hudbaBossHraje){ hudbaBossHraje = false; spustHudbu(); }
  const zbylo = Math.min(Math.max(0, Math.round(boss.hp)), Math.round(armada*.7));
  blesk = 1; zatres(20); zvuk.dupnuti();
  iskry(Š/2, 320, '#ff5c7a', 44, 520);
  kusy(Š/2, 340, '#c98a3a', 26);
  armadaZmen(armada - zbylo);
  if (armada <= 0){
    zemri(boss.def.jmeno + ' měl ještě ' + cislo(zbylo) +
          ' života a rozdupal celou armádu. Střílej dřív!');
  } else {
    zvuk.vybuch();
    popisek(Š/2, 300, '−' + cislo(zbylo), '#ff8a8a', 36);
    hlaska('Prorazili jsme mu mezi nohama!');
    body(boss.plny*6);
    if (rezim === 'kampan'){ levelSplnen(); return; }
    dalsiUroven();
  }
}

// ============ ZLODĚJ ============
function vyrobZlodeje(){
  const zleva = Math.random() < .5;
  zlodeji.push({ x: zleva ? -50 : Š+50, y: nah(180,470), vx:0, vy:0,
    rychlost: 210 + uroven*12, stav:'klid', timer:nah(.5,1.5),
    uhel: zleva ? 0 : Math.PI, zmena:0, bal:0 });
}
function mozekZlodeje(z, dt){
  const cx = vudce.x, cy = PY;
  const d = Math.hypot(z.x-cx, z.y-cy);
  switch (z.stav){
    case 'klid':
      z.zmena -= dt;
      if (z.zmena <= 0){ z.uhel += nah(-.8,.8); z.zmena = nah(.5,1.6); }
      z.x += Math.cos(z.uhel)*z.rychlost*.45*dt;
      z.y += Math.sin(z.uhel)*z.rychlost*.45*dt;
      if (d < 300 && armada > 5){ z.stav = 'vsiml'; z.timer = .7; zvuk.klik(); }
      break;
    case 'vsiml':
      z.timer -= dt;
      if (z.timer <= 0) z.stav = 'krade';
      break;
    case 'krade':
      if (armada > 120){ z.stav = 'utika'; break; }
      {
        const dd = d || 1;
        z.vx += ((cx-z.x)/dd*z.rychlost - z.vx)*3.5*dt;
        z.vy += ((cy-z.y)/dd*z.rychlost - z.vy)*3.5*dt;
        z.x += z.vx*dt; z.y += z.vy*dt;
      }
      if (d < 46){
        const k = Math.min(armada-1, 2+uroven);
        if (k > 0){
          armadaZmen(armada-k);
          z.bal = k; zvuk.prd(); zatres(6);
          kusy(z.x, z.y, '#c98a3a', 8);
          popisek(z.x, z.y-40, '−'+k, '#ffb3c6', 26);
          hlaska(nahZ(['ZLODĚJ!','Ukradl nám je!','Chyť ho! ...no nic.']));
        }
        z.stav = 'utika';
      }
      break;
    case 'utika':
      {
        const dd = d || 1;
        z.x -= (cx-z.x)/dd*z.rychlost*1.25*dt;
        z.y -= (cy-z.y)/dd*z.rychlost*1.25*dt - 40*dt;
      }
      break;
  }
  z.y += rychlost*.25*dt;
  if (z.x < -130 || z.x > Š+130 || z.y > V+130 || z.y < -160) z.mrtvy = true;
}

// ============ KROK ============
function krok(dt){
  cas += dt;
  let sx = 0;
  if (klavesy.ArrowLeft || klavesy.KeyA) sx -= 1;
  if (klavesy.ArrowRight || klavesy.KeyD) sx += 1;
  if (sx !== 0) vudce.cilX += sx*580*dt;
  else if (mys.drzi) vudce.cilX = mys.x + (ORTHO ? 0 : kamX);
  vudce.cilX = omez(vudce.cilX, TRAT_L+25, TRAT_R-25);
  vudce.x += (vudce.cilX - vudce.x)*Math.min(1, 11*dt);
  // kamera pomalu následuje partu a nakloní se do strany
  const cilKam = (vudce.x - STRED) * .38;
  kamX += (cilKam - kamX) * Math.min(1, 5*dt);
  const cilNaklon = -((vudce.x - STRED) / (TRAT_R - TRAT_L)) * .075;
  kamNaklon += (cilNaklon - kamNaklon) * Math.min(1, 4*dt);
  krokJednotek(dt);

  // souboj s obrem: trať zpomalí a obr stojí proti tobě
  // souboj: obr se zastaví tak, aby byl celý vidět, a pak se pomalu šourá blíž
  const bojujeme = boss && !boss.padl && !boss.dorazil && ujeto >= boss.y - 90;
  ujeto += (bojujeme ? (boss.super ? 6 : 10) : rychlost)*dt;
  if (krikCas > 0) krikCas = Math.max(0, krikCas - dt);
  if (zpravaCas > 0) zpravaCas -= dt;

  bossPrichod();
  strelbaKrok(dt);
  minceKrok(dt);
  if (stav !== 'hra') return;

  for (const g of branky){
    if (g.prosla) continue;
    if (ujeto >= g.y){
      g.prosla = true;
      pouzijOperaci((vudce.x < STRED ? g.levo : g.pravo).op, vudce.x, false);
      if (stav !== 'hra') return;
    }
  }
  for (const r of radky){
    if (r.prosla) continue;
    if (ujeto >= r.y){
      r.prosla = true;
      if (vudce.x > r.x1 && vudce.x < r.x2){
        pouzijOperaci(r.op, vudce.x, true);
        if (stav !== 'hra') return;
      }
    }
  }
  for (const g of skupiny){
    if (g.hotovo) continue;
    g.blik = Math.max(0, g.blik - dt*8);
    const gy = PY - (g.wy - ujeto);
    if (g.pocet === null){
      if (gy < -1100) continue;      // v perspektivě dohlédneme dál
      const rozjezd = (uroven === 1 ? .55 : 1) * (g.wy < 900 ? .5 : 1);
      g.plny = Math.max(4, Math.round(armada*nah(.85,1.45)*(1 + uroven*.05)*OB.horda*rozjezd));
      g.pocet = g.plny;
      const kolik = omez(g.plny, 6, 72);
      const sloupce = omez(Math.round(g.sirka/40), 4, 12);
      for (let i = 0; i < kolik; i++){
        const sl = i % sloupce, rd = Math.floor(i/sloupce);
        g.jed.push({ fx: -g.sirka/2 + (sl+.5)*(g.sirka/sloupce) + nah(-5,5),
                     fy: -rd*27 - nah(0,5), faze: nah(0,7) });
      }
    }
    // pod palbou je tlačíme dozadu, jinak se šourají k tobě
    g.wy += (g.blik > 0 ? 105 : -14)*dt;
    g.x += omez(vudce.x - g.x, -1, 1)*45*dt;
    const f = hordaFront(g);
    if (f && f.y >= PY-12){
      if (Math.abs(g.x - vudce.x) < g.sirka/2 + 40) bitka(g);
      else { g.hotovo = true; popisek(g.x, PY-70, 'uf, minuli!', '#fff', 26); body(20); }
      if (stav !== 'hra') return;
    }
  }
  // zdi
  for (const z of zdi){
    if (z.hotovo) continue;
    z.blik = Math.max(0, z.blik - dt*8);
    if (ujeto >= z.wy){
      z.hotovo = true;
      if (Math.abs(z.x - vudce.x) < z.sirka/2 + 30 && z.hp > 0){
        if (pouzitStit(z.x, PY)){
          kusy(z.x, PY, '#8b8172', 24);
          popisek(z.x, PY-110, 'PROJELI JSME JÍ!', '#9ceaff', 30);
          continue;
        }
        const cena = Math.max(1, Math.min(Math.round(z.hp), Math.round(armada*.5)));
        zatres(15); blesk = .7; zvuk.zasah();
        kusy(z.x, PY, '#8b8172', 22);
        kour(z.x, PY, 6);
        popisek(z.x, PY-120, '−' + cislo(cena), '#ffb3a0', 34);
        armadaZmen(armada - cena);
        hlaska(nahZ(['NARAZILI JSME DO ZDI!','Auvajs, zeď!','Tu jsme měli rozstřílet!']));
        if (armada <= 0){
          zemri('Nabourali jste do zdi, kterou jste nerozstříleli!'); return;
        }
      }
    }
  }
  // sudy
  for (const b of sudy){
    if (b.hotovo) continue;
    if (ujeto >= b.wy){
      b.hotovo = true;
      if (Math.abs(b.x - vudce.x) < 62){
        if (b.typ === 'zbran'){
          zbran = Math.min(4, zbran+1);
          zvuk.zbranUp(); pulsAll(); zatres(6);
          iskry(b.x, PY-20, '#c9b6ff', 26, 340);
          kruh(b.x, PY-20, '#a78bfa', 190, .45);
          popisek(b.x, PY-100, 'ZBRAŇ ' + zbran + '!', '#c9b6ff', 34);
          hlaska(nahZ(['SUD SE ZBRANĚMI!','TEĎ TO ŘACHNE!','Rozbalit a pálit!']));
          body(40);
        } else if (b.typ === 'stit'){
          stit = Math.min(3, stit+1);
          zvuk.zbranUp(); pulsAll(); zatres(5);
          iskry(b.x, PY-20, '#9ceaff', 26, 340);
          kruh(b.x, PY-20, '#7fe7ff', 220, .5);
          popisek(b.x, PY-100, 'ŠTÍT +1', '#9ceaff', 32);
          hlaska(nahZ(['MÁME BUBLINU!','Teď nás nic nesejme!','Štít nahozen!']));
          body(35);
        } else if (b.typ === 'vez'){
          const jednohlavna = veze.find(v => v.hlavne === 1);
          if (veze.length >= 2 && jednohlavna){
            // druhý sud za sebou = dvojhlavňová věž
            jednohlavna.hlavne = 2; jednohlavna.cas = Math.max(jednohlavna.cas, 16);
            zvuk.zbranUp(); zatres(8);
            iskry(b.x, PY-20, '#ffd166', 34, 420);
            kruh(b.x, PY-20, '#ffd166', 220, .45);
            popisek(b.x, PY-100, 'DVOJHLAVŇOVÁ VĚŽ!', '#ffd166', 30);
            hlaska(nahZ(['DVĚ HLAVNĚ!','To bude kanonáda!','Dvojka! Pal!']));
          } else {
            const slot = veze.some(v => v.slot === -1) ? 1 : -1;
            veze.push({ slot, cas: 15, cd: .2, uhelHlavne: -Math.PI/2, hlavne: 1 });
            if (veze.length > 2) veze.shift();
            zvuk.zbranUp(); zatres(6);
            iskry(b.x, PY-20, '#ffd166', 26, 340);
            popisek(b.x, PY-100, 'VĚŽ!', '#ffd166', 34);
            hlaska(nahZ(['VĚŽ NÁM POMŮŽE!','Ta pálí jako blázen!','Bum bum věžička!']));
          }
          body(35);
        } else {
          const k = Math.min(armada-1, 2 + uroven);
          zvuk.vybuch(); zatres(12); blesk = .6;
          iskry(b.x, PY, '#ff9a3c', 30, 460);
          kour(b.x, PY, 6);
          if (k > 0){
            armadaZmen(armada - k);
            popisek(b.x, PY-110, '−' + k, '#ffb3a0', 30);
          }
          hlaska(nahZ(['BUM! Ten sud měl bouchnout dřív!','Ajaj, to bouchlo nám!']));
        }
      }
    }
  }
  zlodejTimer -= dt;
  if (zlodejTimer <= 0){ vyrobZlodeje(); zlodejTimer = nah(6,11) - Math.min(4, uroven*.4); }
  for (const z of zlodeji) mozekZlodeje(z, dt);
  zlodeji = zlodeji.filter(z => !z.mrtvy);

  // obří střely (uhýbej!)
  for (const p of bossStrely){
    p.x += p.vx*dt; p.y += p.vy*dt; p.uhel += p.rot*dt;
    if (p.y >= PY - 6 && !p.dopad){
      p.dopad = true;
      const trefa = Math.abs(p.cilX - vudce.x) < 74;
      zatres(trefa ? 14 : 6);
      iskry(p.cilX, PY, p.barva, trefa ? 34 : 16, 420);
      kour(p.cilX, PY, 5);
      kruh(p.cilX, PY, p.barva, trefa ? 250 : 150, .4);
      if (trefa){
        if (!pouzitStit(p.cilX, PY)){
          const k = Math.max(1, Math.round(armada*OB.utok));
          armadaZmen(armada - k);
          popisek(vudce.x, PY-130, '−' + cislo(k), '#ffb3a0', 32);
          kusy(vudce.x, PY, '#c98a3a', 14);
          zvuk.zasah();
          hlaska(nahZ(['AU! To bolelo!','Uhýbej!','Trefil nás!']));
          if (armada <= 0){
            zemri(boss.def.jmeno + ' tě zasáhl a bylo po armádě. Uhýbej do strany!'); return;
          }
        }
      } else zvuk.vybuch();
    }
  }
  bossStrely = bossStrely.filter(p => !p.dopad);

  // věžičky, co střílí s tebou
  for (const v of veze) v.cas -= dt;
  veze = veze.filter(v => {
    if (v.cas > 0) return true;
    kour(vudce.x + v.slot*72, PY, 5);
    popisek(vudce.x + v.slot*72, PY-80, 'věž dosloužila', '#c9d4e6', 22);
    return false;
  });

  // konec bonusového kola
  if (bonusKolo && ujeto >= konecKola){
    const zisk = Math.round(armada*2 + 300);
    body(zisk);
    zvuk.vyhra(); konfety(70); blesk = .5;
    popisek(Š/2, 260, '+' + cislo(Math.round(zisk*OB.body)), '#ffd166', 40);
    hlaska('BONUS ZVLÁDNUTÝ!');
    dalsiUroven();
    return;
  }
  if (boss && !boss.padl && !boss.dorazil){
    boss.puls = Math.max(0, boss.puls - dt*4);
    const by = bossNohy();
    if (boss.viden){
      boss.dmgTimer = (boss.dmgTimer || 0) - dt;
      if (boss.dmgTimer <= 0 && (boss.dmgSoucet || 0) > 0){
        boss.dmgTimer = .3;
        popisek(Š/2 + nah(-70,70), Math.max(120, by - 150), '−' + cislo(boss.dmgSoucet), '#ffe08a', 30);
        boss.dmgSoucet = 0;
      }
      boss.dupTimer -= dt;
      if (boss.dupTimer <= 0){
        boss.dupTimer = .62;
        zvuk.dupnuti(); zatres(4);
        kour(Š/2 + nah(-150,150), Math.max(20, by-10), 3);
      }
      // vysavač tě táhne k sobě a saje ti bojovníky
      if (boss.def.sani && by > 40){
        vudce.cilX += (Š/2 - vudce.cilX) * .9 * dt;
        boss.saniTimer = (boss.saniTimer || 0) - dt;
        if (boss.saniTimer <= 0){
          boss.saniTimer = 1.1;
          const k = Math.max(1, Math.round(armada*.035));
          armadaZmen(armada - k);
          popisek(vudce.x + nah(-30,30), PY-80, '−' + cislo(k), '#c9b6ff', 24);
          iskry(vudce.x, PY-20, '#c9b6ff', 8, 200);
          zvuk.prd();
          if (armada <= 0){
            zemri('OBŘÍ VYSAVAČ vysál celou armádu! Sundej ho rychleji.'); return;
          }
        }
      }
      // útok: hodí po tobě něco, ty musíš uhnout
      boss.utokTimer -= dt;
      if (boss.utokTimer <= 0 && by > 60){
        const zly = boss.plny > 0 && boss.hp/boss.plny < .45;
        boss.utokTimer = (boss.def.super ? OB.utokCas*.6 : OB.utokCas) * (zly ? .7 : 1);
        vystrelBossa(by);
      }
    }
    if (ujeto >= boss.y - 30){ bossDorazil(); if (stav !== 'hra') return; }
  }
}
