    tlacitko(TL.znovu, '▶ Znovu', '#2f9e5c');
    tlacitko(TL.menu, '🏠 Menu', '#3c4f8a');
    tlacitko(TL.skinyK, '🎨 Skiny', '#8a4fff');
  }
}

function kresliObchod(){
  const g = ctx.createLinearGradient(0, 0, 0, V);
  g.addColorStop(0, '#2a1a5e'); g.addColorStop(1, '#0d0822');
  ctx.fillStyle = g; ctx.fillRect(0, 0, Š, V);
  ctx.textAlign = 'left';
  ctx.font = 'bold 40px system-ui'; obrysText('🎨 Skiny', 40, 48);
  ctx.font = 'bold 22px system-ui'; obrysText('Máš ' + koupeno.size + ' ze ' + SKINY.length + ' skinů', 42, 90);
  ctx.textAlign = 'center';
  // ukazatel sbírky
  ctx.fillStyle = 'rgba(0,0,0,.4)'; zaobl(300, 82, 330, 14, 7); ctx.fill();
  ctx.fillStyle = '#7dffb0'; zaobl(300, 82, Math.max(14, 330 * koupeno.size / SKINY.length), 14, 7); ctx.fill();
  // záložky: ovoce, zelenina, postavy…
  zalozkyRect = [];
  ctx.font = 'bold 13px system-ui';
  let zx = 40;
  for (const z of ZALOZKY){
    const t = nazevZalozky(z), w = ctx.measureText(t).width + 16, akt = z === skinFiltr;
    ctx.fillStyle = akt ? '#ffe066' : 'rgba(255,255,255,.12)';
    zaobl(zx, 110, w, 28, 10); ctx.fill();
    ctx.fillStyle = akt ? '#2a1a5e' : '#fff'; ctx.fillText(t, zx + w / 2, 125);
    zalozkyRect.push({ x: zx, y: 110, w, h: 28, z });
    zx += w + 6;
  }
  const l = seznamSkinu(), pos = poziceVSeznamu();
  const str = Math.floor(pos / NA_STRANU), stran = Math.max(1, Math.ceil(l.length / NA_STRANU));
  for (let i = 0; i < NA_STRANU; i++){
    const idx = str * NA_STRANU + i; if (idx >= l.length) break;
    const s = l[idx], k = karta(i);
    const ma = koupeno.has(s.id), nosi = mujSkin === s.id, vybrano = s.id === obchodVyber;
    ctx.fillStyle = nosi ? '#2f9e5c' : ma ? '#3c4f8a' : '#262b45';
    zaobl(k.x, k.y, k.w, k.h, 14); ctx.fill();
    const vz = VZACNOSTI[s.vzacnost];
    ctx.strokeStyle = vz.barva; ctx.lineWidth = s.vzacnost >= 3 ? 3 : 2; ctx.globalAlpha = s.vzacnost ? 1 : .35; ctx.stroke(); ctx.globalAlpha = 1;
    if (vybrano){ ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4; zaobl(k.x - 3, k.y - 3, k.w + 6, k.h + 6, 16); ctx.stroke(); }
    ctx.font = 'bold 10px system-ui'; ctx.fillStyle = vz.barva; ctx.textAlign = 'right';
    ctx.fillText('★'.repeat(s.vzacnost + 1), k.x + k.w - 7, k.y + 12); ctx.textAlign = 'center';
    if (!ma) ctx.globalAlpha = .75;
    kresliSkinNahled(k.x + k.w/2, k.y + 36, 19, s, vybrano ? Math.sin(hodiny2 * 3) * .15 : 0);
    ctx.globalAlpha = 1;
    ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText(s.jmeno, k.x + k.w/2, k.y + 70);
    ctx.font = '11px system-ui'; ctx.fillStyle = '#c9d6ff';
    ctx.fillText(KATEGORIE[s.kat], k.x + k.w/2, k.y + 83);
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = nosi ? '#c8ffd9' : ma ? '#c9d6ff' : (kasicka >= s.cena ? '#ffe066' : '#ff9aa8');
    if (s.denni && !ma) ctx.fillStyle = '#ff8ad8';
    ctx.fillText(nosi ? '✔ nosíš' : ma ? 'máš' : s.denni ? '🔒 DAILY SKIN' : s.cena + ' 🪙', k.x + k.w/2, k.y + 96);
  }
  // listování
  tlacitko(TLAC_ZPET, '◀', '#3c4f8a'); tlacitko(TLAC_DAL, '▶', '#3c4f8a');
  ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText('Strana ' + (str + 1) + ' / ' + stran, 340, 507);
  // pravý panel: velký náhled
  const s = SKINY[obchodVyber];
  ctx.fillStyle = 'rgba(0,0,0,.25)'; zaobl(690, 148, 250, 320, 18); ctx.fill();
  kresliMinci(800, 52, 16, 0);
  ctx.font = 'bold 28px system-ui'; ctx.textAlign = 'left'; obrysText(kasicka + '', 824, 53); ctx.textAlign = 'center';
  kresliSkinNahled(815, 225, 50, s, Math.sin(hodiny2 * 1.5) * .2);
  ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText(s.jmeno, 815, 318);
  ctx.font = '16px system-ui'; ctx.fillStyle = '#c9d6ff'; ctx.fillText(KATEGORIE[s.kat], 815, 341);
  const ma = koupeno.has(s.id), nosi = mujSkin === s.id;
  ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = nosi ? '#7dffb0' : ma ? '#c9d6ff' : kasicka >= s.cena ? '#ffe066' : '#ff9aa8';
  if (s.denni && !ma){
    ctx.fillStyle = '#ff8ad8'; ctx.fillText('🔒 DAILY SKIN', 815, 366);
    const den = kdyJeDaily(s); ctx.font = '14px system-ui'; ctx.fillStyle = '#ffd0ec';
    ctx.fillText(den ? 'k vyhrání ' + den + '. ' + MESICE2[new Date().getMonth()] : 'jen z denního kalendáře', 815, 386);
  } else ctx.fillText(nosi ? '✔ Tenhle skin máš na sobě' : ma ? 'Klikni a obleč si ho' : 'Cena: ' + s.cena + ' 🪙', 815, 372);
  { const vz = VZACNOSTI[s.vzacnost]; ctx.font = 'bold 16px system-ui'; ctx.fillStyle = vz.barva; ctx.fillText('★'.repeat(s.vzacnost + 1) + ' ' + vz.jmeno, 815, 410); }
  if (obchodZprava){
    ctx.globalAlpha = Math.min(1, obchodZprava.zivot * 2);
    ctx.font = 'bold 16px system-ui'; obrysText(obchodZprava.text, 815, 440);
    ctx.globalAlpha = 1;
  }
  tlacitko(TLAC_HRAT, '▶ Hrát', '#2f9e5c'); tlacitko(TLAC_MENU_S, '🏠 Menu', '#3c4f8a');
  efektyKresli();
}

// ============ SMYČKA ============
let posledni = performance.now(), hodiny2 = 0;
function smycka(t){
  const dt = Math.max(0, Math.min((t - posledni) / 1000, 0.05));
  posledni = t;
  hodiny2 += dt;
  if (stav === 'hra'){
    if (!klavesy.Space) warpUvolneno = true;               // mezerník ze startu se nepočítá
    const warp = ((klavesy.Space && warpUvolneno) || warpDotyk) && !hrac.mrtvy && !vyhra;
    if (warp && !warpBylo){ zvuk.ton({ f: 120, f2: 900, t: .45, typ: 'sawtooth', hlas: .08 }); zvuk.sum({ t: .4, hlas: .12, filtr: 2500 }); }
    if (!warp && warpBylo) zvuk.ton({ f: 700, f2: 150, t: .35, typ: 'sine', hlas: .08 });
    warpBylo = warp;
    warpSila += ((warp ? 1 : 0) - warpSila) * Math.min(1, dt * 6);
    krok(dt * (zpomalT > 0 ? .35 : 1) * (1 + warpSila * .9));
    zpomalT = Math.max(0, zpomalT - dt);
  }
  else if (stav === 'kolo'){ koloKrok(dt); const dz = 2.5 * dt; svet += dz; prachKrok(dz); ohnostrojKrok(dt); }
  else { const dz = 2.5 * dt; svet += dz; prachKrok(dz); ohnostrojKrok(dt); }
  if (obchodZprava){ obchodZprava.zivot -= dt; if (obchodZprava.zivot <= 0) obchodZprava = null; }
  efektyKrok(dt);
  kresli();
  requestAnimationFrame(smycka);
}
requestAnimationFrame(smycka);
