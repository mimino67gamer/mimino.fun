<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kostkopád 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0e0a07;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;}
  #obal{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{background:#2a1d14;max-width:100%;max-height:100%;
    aspect-ratio:16/9;touch-action:none;display:block;border-radius:8px;}
</style>
</head>
<body>
<div id="obal"><canvas id="platno"></canvas></div>
<script>
// ============ ZÁKLAD ============
const Š = 960, V = 540;
const platno = document.getElementById('platno');
let ctx = platno.getContext('2d');

function zmenVelikost(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  platno.width  = Š * dpr;
  platno.height = V * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
}
addEventListener('resize', zmenVelikost);
zmenVelikost();

// ============ POMOCNÍCI ============
const nah   = (a,b) => a + Math.random()*(b-a);
const nahC  = (a,b) => Math.floor(nah(a,b+1));
const nahZ  = pole => pole[Math.floor(Math.random()*pole.length)];
const omez  = (v,a,b) => Math.max(a, Math.min(b, v));
const vzdal = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const smerK = (a,b) => { const d = vzdal(a,b) || 1; return { x:(b.x-a.x)/d, y:(b.y-a.y)/d }; };

function zaobl(x, y, w, h, r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function emoji(znak, x, y, velikost=40, uhel=0, meritko=1, zrcadlo=1){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(uhel); ctx.scale(meritko*zrcadlo, meritko);
  ctx.font = velikost + 'px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(znak, 0, 0);
  ctx.restore();
}
function hexNaRgb(h){ const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
const rgb = a => `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;

// ============ ZVUK ============
const zvuk = (() => {
  let a = null, zapnuto = true, hudbaTimer = null;
  function audio(){
    if (!a) a = new (window.AudioContext || window.webkitAudioContext)();
    if (a.state === 'suspended') a.resume();
    return a;
  }
  function ton({f=440, f2=null, t=.15, typ='square', hlas=.15, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const o = c.createOscillator(), g = c.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f, z);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), z + t);
    g.gain.setValueAtTime(.0001, z);
    g.gain.exponentialRampToValueAtTime(hlas, z + .01);
    g.gain.exponentialRampToValueAtTime(.0001, z + t);
    o.connect(g); g.connect(c.destination);
    o.start(z); o.stop(z + t + .05);
  }
  function sum({t=.2, hlas=.2, filtr=1200, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const n = Math.max(1, Math.floor(c.sampleRate * t));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtr;
    const g = c.createGain(); g.gain.value = hlas;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(z);
  }
  function nota(jmeno){
    const z = {C:0, D:2, E:4, F:5, G:7, A:9, B:11, H:11};
    const m = /^([A-H])(#|b)?(-?\d)$/.exec(jmeno);
    if (!m) return 440;
    const p = z[m[1]] + (m[2]==='#' ? 1 : m[2]==='b' ? -1 : 0) + (+m[3]+1)*12;
    return 440 * Math.pow(2, (p - 69) / 12);
  }
  return {
    ton, sum, nota,
    tichoZapni(){ zapnuto = !zapnuto; if (!zapnuto) this.hudbaStop(); return zapnuto; },
    klik:   () => ton({f:600, f2:900, t:.05, hlas:.1}),
    skok:   () => ton({f:300, f2:700, t:.12, typ:'square'}),
    sber:   () => { ton({f:880, t:.07, typ:'triangle', hlas:.18});
                    ton({f:1320, t:.09, typ:'triangle', hlas:.14, kdy:.06}); },
    zasah:  () => { ton({f:200, f2:60, t:.2, typ:'sawtooth', hlas:.2});
                    sum({t:.15, filtr:800}); },
    vybuch: () => { sum({t:.5, hlas:.35, filtr:600});
                    ton({f:120, f2:30, t:.4, typ:'sawtooth', hlas:.2}); },
    strela: () => ton({f:1200, f2:200, t:.08, typ:'sawtooth', hlas:.12}),
    chyba:  () => { ton({f:180, t:.1, typ:'square', hlas:.15});
                    ton({f:130, t:.2, typ:'square', hlas:.15, kdy:.1}); },
    start:  () => [523,659,784].forEach((f,i) =>
                    ton({f, t:.1, typ:'triangle', hlas:.15, kdy:i*.08})),
    vyhra:  () => [523,659,784,1047].forEach((f,i) =>
                    ton({f, t:.18, typ:'triangle', hlas:.18, kdy:i*.11})),
    konec:  () => [523,415,330,262].forEach((f,i) =>
                    ton({f, t:.22, typ:'triangle', hlas:.16, kdy:i*.14})),
    prd:    () => { ton({f:90, f2:55, t:.28, typ:'sawtooth', hlas:.22});
                    sum({t:.25, hlas:.12, filtr:300}); },
    // --- zvuky pro tuhle hru ---
    kric:   () => { ton({f:950, f2:260, t:.9, typ:'sawtooth', hlas:.07});
                    ton({f:960, f2:270, t:.9, typ:'square', hlas:.04}); },
    bonk:   () => { ton({f:520, f2:120, t:.18, typ:'square', hlas:.16});
                    sum({t:.12, hlas:.2, filtr:1500}); },
    vlas:   () => ton({f:380, f2:1400, t:.16, typ:'sine', hlas:.13}),
    pip:    () => { ton({f:1900, t:.05, typ:'square', hlas:.06});
                    ton({f:2300, t:.05, typ:'square', hlas:.06, kdy:.09}); },
    skrip:  () => sum({t:.08, hlas:.08, filtr:3000}),
    hudbaHraj(noty, tempo = 120, typ = 'triangle', hlas = .05){
      this.hudbaStop();
      if (!zapnuto) return;
      const krok = 60 / tempo / 2;
      let i = 0;
      hudbaTimer = setInterval(() => {
        const n = noty[i % noty.length];
        if (n) ton({ f: typeof n === 'string' ? nota(n) : n, t: krok * .9, typ, hlas });
        i++;
      }, krok * 1000);
    },
    hudbaStop(){ if (hudbaTimer) { clearInterval(hudbaTimer); hudbaTimer = null; } }
  };
})();
let zvukZapnut = true;
const HUDBA = ['E4','G4','A4','G4','E4','D4','C4','D4','E4','G4','C5','A4','G4','E4','D4',null];

// ============ OVLÁDÁNÍ ============
const klavesy = {};
let konecCas = 0;
addEventListener('keydown', e => {
  klavesy[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM'){ prepniZvuk(); return; }
  if (stav === 'obchod'){ obchodKlavesa(e.code); return; }
  if (stav !== 'hra') obrazovkaKlavesa(e.code);
});
addEventListener('keyup', e => klavesy[e.code] = false);

const mys = { x: Š/2, y: V/2, drzi: false };
let mysRidi = false;
function bodZUdalosti(e){
  const r = platno.getBoundingClientRect();
  mys.x = (e.clientX - r.left) / r.width  * Š;
  mys.y = (e.clientY - r.top ) / r.height * V;
}
// WARP: drž mezerník (nebo na dotyk tlačítko WARP vlevo dole) a všechno se zrychlí
const TLWARP = { x: 16, y: V - 96, w: 120, h: 80 };
let warpDotyk = false, warpPrst = null, warpUvolneno = false, warpBylo = false, warpSila = 0;
platno.addEventListener('pointerdown', e => {
  const staraX = mys.x, staraY = mys.y;
  bodZUdalosti(e);
  if (stav === 'hra' && mys.x > TLWARP.x && mys.x < TLWARP.x + TLWARP.w && mys.y > TLWARP.y && mys.y < TLWARP.y + TLWARP.h){
    warpDotyk = true; warpPrst = e.pointerId; mys.x = staraX; mys.y = staraY; return;
  }
  mys.drzi = true;
  if (mys.x > Š-80 && mys.y > V-75){ prepniZvuk(); return; }   // ikonka zvuku
  if (stav === 'obchod'){ obchodKlik(mys.x, mys.y); return; }
  if (stav !== 'hra'){ obrazovkaKlik(); return; }
  mysRidi = true;
});
platno.addEventListener('pointermove', e => { if (e.pointerId === warpPrst) return; bodZUdalosti(e); if (stav === 'hra') mysRidi = true; });
addEventListener('pointerup', e => { if (e.pointerId === warpPrst){ warpDotyk = false; warpPrst = null; } else mys.drzi = false; });
addEventListener('pointercancel', e => { if (e.pointerId === warpPrst){ warpDotyk = false; warpPrst = null; } });

function prepniZvuk(){
  zvukZapnut = zvuk.tichoZapni();
  if (zvukZapnut && stav === 'hra') hrajHudbuPasma(aktPasmo);
}

// ============ ŠŤÁVA ============
let castice = [], popisky = [], otres = 0;
function bum(x, y, barva='#ffd166', kolik=14, sila=260){
  for (let i=0;i<kolik;i++){
    const a = nah(0, Math.PI*2), r = nah(60, sila);
    castice.push({x, y, vx:Math.cos(a)*r, vy:Math.sin(a)*r,
                  zivot:nah(.3,.8), max:.8, barva, vel:nah(3,7)});
  }
}
const zatres = s => otres = Math.max(otres, s);
function popisek(x, y, text, barva='#fff', vel=24){ popisky.push({x, y, text, barva, vel, zivot:1.1}); }
function efektyKrok(dt){
  for (const c of castice){ c.x += c.vx*dt; c.y += c.vy*dt; c.vy += 420*dt; c.zivot -= dt; }
  castice = castice.filter(c => c.zivot > 0);
  for (const p of popisky){ p.y -= 50*dt; p.zivot -= dt; }
  popisky = popisky.filter(p => p.zivot > 0);
  otres = Math.max(0, otres - dt*40);
}
function efektyKresli(){
  for (const c of castice){
    ctx.globalAlpha = Math.max(0, c.zivot / c.max);
    ctx.fillStyle = c.barva;
    ctx.fillRect(c.x - c.vel/2, c.y - c.vel/2, c.vel, c.vel);
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)';
  for (const p of popisky){
    ctx.font = 'bold ' + p.vel + 'px system-ui';
    ctx.globalAlpha = Math.min(1, p.zivot * 1.5);
    const m = 1 + Math.max(0, p.zivot - .9) * 3;     // vyskočí a zmenší se
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(m, m);
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.barva; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ============ SVĚT ============
// Díváme se SHORA dolů do kulaté trubky. Kostka padá pryč od nás,
// překážky vylétají z hloubky a zvětšují se, jak se blíží.
const CX = Š/2, CY = V/2;
const F = 460;          // „objektiv" — jak moc se věci zvětšují
const ZC = 2;           // v jaké hloubce pod námi je kostka
const A = .13;          // půlka velikosti kostky
const RC = .1;          // dotyková zóna kostky (menší než obrázek = odpouští)
const ZSPAWN = 14;      // odkud z hloubky se věci vynořují
const ZN = .45;         // blíž už nic nekreslíme
const ZK = ZC - A;      // hloubka VRŠKU kostky — tady se překážka opravdu dotkne (přesně to, co vidíš)
const MEZ = .8;         // jak daleko od středu trubky kostka smí
const BOSS_M = 1000;    // každých kolik metrů přijde Krtek Bagr (hra je nekonečná!)
const proj = (u, v, z) => [CX + u * F / z, CY + v * F / z];

// vrstvy trubky — žádná hnědá!
// PÁSMA — mění se každých 10 sekund pádu: začátek → LÁVA → LED → ELEKTŘINA → LÁVA …
const PASMA = {
  start:     { jmeno: 'Fialová jeskyně 💜', zed:'#6b4fc4', spara:'#3f2a85', pozadi:'#0d0822', prach:'rgba(255,255,255,.3)' },
  lava:      { jmeno: '🔥 LÁVOVÉ PÁSMO! 🔥', zed:'#e2541c', spara:'#ffb13b', pozadi:'#2a0600', prach:'rgba(255,170,60,.85)',
               hlaska: 'Tady je HORKO! 🔥' },
  led:       { jmeno: '🧊 LEDOVÉ PÁSMO! 🧊', zed:'#a9dcf5', spara:'#ffffff', pozadi:'#0a2233', prach:'rgba(255,255,255,.9)',
               hlaska: 'Brrr! A klouže to!! ⛸️' },
  elektrina: { jmeno: '⚡ ELEKTRICKÉ PÁSMO! ⚡', zed:'#3a2a8a', spara:'#ffe94a', pozadi:'#07031a', prach:'rgba(255,240,90,.9)',
               hlaska: 'Bzzzz! Tady to jiskří!' }
};
const PORADI_PASEM = ['lava', 'led', 'elektrina'];
const DELKA_PASMA = 10;
const barvy = { zed: hexNaRgb(PASMA.start.zed), spara: hexNaRgb(PASMA.start.spara), pozadi: hexNaRgb(PASMA.start.pozadi) };
const ztmav = (c, k) => rgb(c.map(x => x * k));

const HLASKY = ['Kde je dno?!', 'Já chci zpátky nahoru!', 'Mami, já letím!',
                'Nejdelší díra na světě!', 'Kdo vykopal takovou díru?', 'Mám hlad… a letím.',
                'Wííííí!', 'Zapomněl jsem padák!', 'Má tahle díra vůbec konec?!', 'Jsem kostka, ne pták!',
                'Borůvková pizza?! V díře?!', 'Modrý sýr smrdí!'];
const AU = ['AU!', 'Můj roh!', 'Auvajs!', 'Kdo tam dal TOHLE?!', 'Moje hranička!'];
const VLAS = ['O chlup!', 'Fííí!', 'Těsně!', 'To bylo o fous!'];
const TVAR_HLASKA = { kostka: 'Zase jsem kostka!', koule: 'Jéé, jsem kulička!', troj: 'Jsem trojúhelník?!' };

const CHLUP = Array.from({length: 512}, () => Math.random());
const nahKruh = (r = 1) => { const a = nah(0, 7), d = Math.sqrt(Math.random()) * r; return { u: Math.cos(a) * d, v: Math.sin(a) * d }; };
const prach = Array.from({length: 36}, () => ({ ...nahKruh(.95), z: nah(1, ZSPAWN) }));

// ---- tvary děr (body mnohoúhelníku kolem středu) ----
function hvezda(n, r1, r2){ const b = []; for (let i = 0; i < n*2; i++){ const r = i % 2 ? r2 : r1, a = -Math.PI/2 + i * Math.PI / n; b.push([Math.cos(a)*r, Math.sin(a)*r]); } return b; }
function mnohouhelnik(n, r, pootoc = -Math.PI/2){ const b = []; for (let i = 0; i < n; i++){ const a = pootoc + i * 2*Math.PI / n; b.push([Math.cos(a)*r, Math.sin(a)*r]); } return b; }
const SRDCE = (() => { const b = []; for (let i = 0; i < 32; i++){ const t = i / 32 * Math.PI * 2;
  b.push([16 * Math.pow(Math.sin(t), 3) * .034, (-(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) + 2) * .034]); } return b; })();
const TVARY = {
  troj:    { body: mnohouhelnik(3, .58), max: .58, barva: '#4fc3ff' },
  ctverec: { body: mnohouhelnik(4, .44, -Math.PI/4), max: .44, barva: '#6aa8ff' },
  sestka:  { body: mnohouhelnik(6, .4),  max: .4,  barva: '#3fd0e0' },
  hvezda:  { body: hvezda(5, .64, .32),  max: .64, barva: '#8fa6ff' },
  srdce:   { body: SRDCE,                max: .6,  barva: '#5ab8ff' },
  kriz:    { body: [[-.14,-.5],[.14,-.5],[.14,-.14],[.5,-.14],[.5,.14],[.14,.14],[.14,.5],[-.14,.5],[-.14,.14],[-.5,.14],[-.5,-.14],[-.14,-.14]], max: .5, barva: '#9fdcff' }
};
// díry pro tvarovku — každá pasuje jen na jeden tvar kostky
const TVAROVKA = {
  kostka: mnohouhelnik(4, .3, -Math.PI/4),
  troj:   mnohouhelnik(3, .38),
  koule:  null        // kruh o poloměru .26
};
function vDire(body, x, y){       // vzdálenost od kraje mnohoúhelníku: + uvnitř, − venku
  let uvnitr = false, d = 9;
  for (let i = 0, j = body.length - 1; i < body.length; j = i++){
    const [xi, yi] = body[i], [xj, yj] = body[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) uvnitr = !uvnitr;
    const dx = xj - xi, dy = yj - yi;
    const k = omez(((x - xi) * dx + (y - yi) * dy) / (dx*dx + dy*dy || 1), 0, 1);
    d = Math.min(d, Math.hypot(x - (xi + dx*k), y - (yi + dy*k)));
  }
  return uvnitr ? d : -d;
}
const rotuj = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const uhelRozdil = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };

// ============ SKINY (platí, dokud se hra nezavře) ============
// Každý skin = základní barva + vrstvy vzorů (kreslí se na vršek kostky)
//            + doplňky „za" (uši, lístky, stopky) a „před" (čumáček, páska, helma).
const KATEGORIE = { zakladni: '🟦 Kostky', ovoce: '🍉 Ovoce', zelenina: '🥕 Zelenina', sladke: '🍩 Sladkosti',
                    zvirata: '🐱 Zvířátka', postavy: '🤖 Postavičky', priroda: '🌍 Příroda', vzacne: '✨ Vzácné' };
const Z = '#3fae4a';   // zelená lístků
const SKINY = [
  // --- kostky ---
  { jmeno: 'Modrá kostka', kat: 'zakladni', cena: 0, zaklad: '#3d8bff', v: [] },

  { jmeno: 'Zelená kostka', kat: 'zakladni', cena: 10, zaklad: '#3fbf4f', v: [] },
  { jmeno: 'Žlutá kostka', kat: 'zakladni', cena: 10, zaklad: '#ffd93d', v: [] },
  // --- ovoce ---
  { jmeno: 'Meloun', kat: 'ovoce', cena: 20, zaklad: '#ff4d5e', bok: '#2fa84f', v: [['okraj', '#eaffd9', .34], ['okraj', '#2fa84f', .2], ['tecky', '#1a1a1a', .075, 11, 3, 'kapka', .58]] },
  { jmeno: 'Celý meloun', kat: 'ovoce', cena: 20, zaklad: '#3fbf4f', v: [['pruhy', '#1f7a33', .17, .44, 0, .08]] },
  { jmeno: 'Jahoda', kat: 'ovoce', cena: 20, zaklad: '#ff3b4f', v: [['prechod', '#ff8a8a', '#d61f35'], ['tecky', '#ffe066', .05, 16, 5, 'kapka', .85]], za: [['kalich', Z]] },
  { jmeno: 'Pomeranč', kat: 'ovoce', cena: 20, zaklad: '#ff9a1f', v: [['okraj', '#fff0d0', .2], ['okraj', '#ff7a00', .1], ['paprsky', '#ffe0a8', 8, .05], ['kruh', '#ffe0a8', .1]] },
  { jmeno: 'Citron', kat: 'ovoce', cena: 20, zaklad: '#ffe23d', v: [['okraj', '#fffbe0', .2], ['okraj', '#f0c800', .1], ['paprsky', '#fff6c2', 8, .05], ['kruh', '#fff6c2', .1]] },
  { jmeno: 'Limetka', kat: 'ovoce', cena: 20, zaklad: '#9ee04a', v: [['okraj', '#f0ffd8', .2], ['okraj', '#4f9e1f', .1], ['paprsky', '#e0f8c0', 8, .05], ['kruh', '#e0f8c0', .1]] },

const TLAC_OBCHOD = { x: CX - 110, y: 458, w: 220, h: 52 };

const TLAC_ZPET = { x: 40, y: 484, w: 64, h: 44 }, TLAC_DAL = { x: 576, y: 484, w: 64, h: 44 };
const vTlacitku = t => mys.x > t.x && mys.x < t.x + t.w && mys.y > t.y && mys.y < t.y + t.h;
const karta = i => ({ x: 40 + (i % 4) * 152, y: 150 + Math.floor(i / 4) * 110, w: 144, h: 102 });
let skinFiltr = 'vse', zalozkyRect = [];
const ZALOZKY = ['vse', ...Object.keys(KATEGORIE)];
const nazevZalozky = z => z === 'vse' ? '⭐ Vše' : KATEGORIE[z];
const seznamSkinu = () => skinFiltr === 'vse' ? SKINY : SKINY.filter(s => s.kat === skinFiltr);
function poziceVSeznamu(){ const l = seznamSkinu(); const i = l.indexOf(SKINY[obchodVyber]); return i < 0 ? 0 : i; }

function otevriObchod(){ stav = 'obchod'; obchodZprava = null; obchodVyber = mujSkin; skinFiltr = 'vse'; zvuk.klik(); }
function prepniFiltr(z){ skinFiltr = z; obchodVyber = seznamSkinu()[0].id; zvuk.klik(); }
function obchodKlik(x, y){
  if (vTlacitku(TLAC_HRAT)){ zacniHru(rezim); return; }
  if (vTlacitku(TLAC_MENU_S)){ otevriMenu(); return; }
  for (const r of zalozkyRect) if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h){ prepniFiltr(r.z); return; }
  const l = seznamSkinu(), pos = poziceVSeznamu();
  const str = Math.floor(pos / NA_STRANU), stran = Math.max(1, Math.ceil(l.length / NA_STRANU));
  if (vTlacitku(TLAC_ZPET)){ obchodVyber = l[((str + stran - 1) % stran) * NA_STRANU].id; zvuk.klik(); return; }
  if (vTlacitku(TLAC_DAL)){ obchodVyber = l[((str + 1) % stran) * NA_STRANU].id; zvuk.klik(); return; }
  for (let i = 0; i < NA_STRANU; i++){
    const idx = str * NA_STRANU + i; if (idx >= l.length) break;
    const k = karta(i);
    if (x > k.x && x < k.x + k.w && y > k.y && y < k.y + k.h){ obchodVyber = l[idx].id; kup(l[idx].id, i); return; }
  }
}
function obchodKlavesa(kod){
  const l = seznamSkinu(), n = l.length, pos = poziceVSeznamu();
  if (kod === 'ArrowRight' || kod === 'KeyD') obchodVyber = l[(pos + 1) % n].id;
  else if (kod === 'ArrowLeft' || kod === 'KeyA') obchodVyber = l[(pos + n - 1) % n].id;
  else if (kod === 'ArrowDown' || kod === 'KeyS') obchodVyber = l[(pos + 4) % n].id;
  else if (kod === 'ArrowUp' || kod === 'KeyW') obchodVyber = l[(pos + n - 4) % n].id;
  else if (kod === 'KeyE' || kod === 'Tab'){ prepniFiltr(ZALOZKY[(ZALOZKY.indexOf(skinFiltr) + 1) % ZALOZKY.length]); return; }
  else if (kod === 'KeyQ'){ prepniFiltr(ZALOZKY[(ZALOZKY.indexOf(skinFiltr) + ZALOZKY.length - 1) % ZALOZKY.length]); return; }
  else if (kod === 'Enter' || kod === 'Space') kup(obchodVyber, poziceVSeznamu() % NA_STRANU);
  else if (kod === 'Escape'){ otevriMenu(); return; }
  else if (kod === 'KeyH'){ zacniHru(rezim); return; }
  else return;
  zvuk.klik();
}
function kup(i, misto = 0){
  const s = SKINY[i], k = karta(misto);
  if (koupeno.has(s.id)){
    mujSkin = s.id; zvuk.klik();
    obchodZprava = { text: 'Teď jsi: ' + s.jmeno + '!', zivot: 1.6 };
  } else if (s.denni){
    zvuk.chyba();
    const den = kdyJeDaily(s), d = new Date();
    obchodZprava = { text: den ? 'Vyhraješ ho ' + den + '. ' + MESICE2[d.getMonth()] + '! 📅' : 'Jen z denního kalendáře! 📅', zivot: 2.4 };
  } else if (kasicka >= s.cena){
    kasicka -= s.cena; koupeno.add(s.id); mujSkin = s.id;
    bum(k.x + k.w/2, k.y + 45, '#ffd84a', 24, 260); zvuk.vyhra();
    obchodZprava = { text: 'Nový skin: ' + s.jmeno + '! 🎉', zivot: 2 };
  } else {
    zvuk.chyba();
    obchodZprava = { text: 'Chybí ti ještě ' + (s.cena - kasicka) + ' 🪙', zivot: 2 };
  }
}

// ---- barvy ----
const mix = (a, b, k) => a.map((x, i) => x + (b[i] - x) * k);
function hslNaRgb(h, s, l){
  const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
  return [f(0), f(8), f(4)];
}
function barvySkinu(skin){
  let z;
  if (skin.zaklad === 'duha') z = hslNaRgb((hodiny2 * 70) % 360, .85, .58);
  else if (skin.zaklad === 'chameleon') z = hslNaRgb(90 + Math.sin(hodiny2 * .6) * 140, .7, .55);
  else if (skin.v[0] && skin.v[0][0] === 'lava') z = mix(hexNaRgb('#ff4a1f'), hexNaRgb('#ffb01f'), .5 + .5 * Math.sin(hodiny2 * 3));
  else z = hexNaRgb(skin.zaklad);
  const bok = skin.bok ? hexNaRgb(skin.bok) : z;
  const W = [255, 255, 255], K = [0, 0, 0];
  const jas = (z[0] * .3 + z[1] * .59 + z[2] * .11) / 255;
  return {
    SVETLA: rgb(mix(z, W, .45)), ZAKLAD: rgb(z), STREDNI: rgb(mix(bok, K, .15)),
    TMAVA: rgb(mix(bok, K, .35)), NEJTM: rgb(mix(bok, K, .55)), BOK: rgb(bok),
    OKO: jas < .25 ? '#e8ecff' : '#0d1a3a',
    ZAR: skin.zar || 'rgba(255,255,255,.28)'
  };
}

  pruhy(c, w, mezera, uhel, vlna){

    for (let x = -1.8; x <= 1.8; x += mezera) for (let y = -1.6; y <= 1.6; y += .08){

  tecky(c, r, n, seed, tvar, rozsah){

      let a = R() * 7, d = Math.sqrt(R()) * rozsah;
      if (tvar === 'paprsek' || tvar === 'kolem'){ a = i / n * Math.PI * 2; d = rozsah; }
      const x = Math.cos(a) * d, y = Math.sin(a) * d;
      ctx.beginPath();
      if (tvar === 'kruh' || tvar === 'kolem') ctx.arc(x, y, r, 0, 7);
      else ctx.ellipse(x, y, r * .55, r, tvar === 'paprsek' ? a + Math.PI / 2 : R() * 7, 0, 7);

  kruh(c, r, x = 0, y = 0){ ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); },
  elipsa(c, rx, ry, x, y, rot){ ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); },

  paprsky(c, n, w){ ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; ctx.moveTo(Math.cos(a) * .12, Math.sin(a) * .12); ctx.lineTo(Math.cos(a) * .72, Math.sin(a) * .72); } ctx.stroke(); },

  skvrny(c, n, seed, rmin, rmax){

  kulicky(c, r, krok){

  spirala(c, w){ ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); for (let i = 0; i <= 80; i++){ const a = i / 80 * Math.PI * 7 + hodiny2, r = i / 80 * .95; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(0, 0); } ctx.stroke(); },

const VZACNOSTI = [

const ZIVE = { lava: 4, duha: 4, galaxie: 4, plazma: 5, vir: 5, zare: 5, skenovani: 3, blesk: 3, lesk: 2, fasety: 3, spirala: 2, hvezdicky: 2, posyp: 1 };
function zajimavost(s){
  let b = 0;
  for (const [co] of s.v) b += ZIVE[co] || 1;
  b += (s.za ? s.za.length : 0) * 2 + (s.pred ? s.pred.length : 0) * 2;
  if (s.kat === 'vzacne') b += 4;
  if (s.kat === 'postavy' || s.kat === 'zvirata') b += 1;
  if (s.chmyri) b += 1;
  if (s.zar) b += 2;
  return b;
}
function nastavCeny(){
  for (const s of SKINY){
    const z = zajimavost(s);
    s.vzacnost = z <= 2 ? 0 : z <= 4 ? 1 : z <= 6 ? 2 : z <= 9 ? 3 : 4;
    s.cena = VZACNOSTI[s.vzacnost].cena + (z % 3) * (s.vzacnost + 1) * 5;
  }
  // úplně nejzajímavější skiny jsou nejdražší ze všech
  [...SKINY].sort((a, b) => zajimavost(b) - zajimavost(a)).slice(0, 6).forEach(s => { s.vzacnost = 4; s.cena = 900; });
  SKINY[0].cena = 0; SKINY[0].vzacnost = 0;
}

function obrysVrsku(tvar, pul, n = 40){
  const b = [];
  if (tvar === 'koule'){ for (let i = 0; i < n; i++){ const t = i / n * Math.PI * 2; b.push([Math.cos(t) * pul * 1.12, Math.sin(t) * pul * 1.12, Math.cos(t), Math.sin(t)]); } }

    const r = mnohouhelnik(3, pul * 1.4);
    for (let i = 0; i < n; i++){
      const t = i / n * 3, e = Math.floor(t), f = t - e, p = r[e], q = r[(e + 1) % 3];
      const x = p[0] + (q[0] - p[0]) * f, y = p[1] + (q[1] - p[1]) * f;
      const nx = (p[1] - q[1]), ny = (q[0] - p[0]), d = Math.hypot(nx, ny);
      b.push([x, y, -nx / d, -ny / d]);
    }
  } else {                                                   // „squircle" = měkký hebký čtverec
    for (let i = 0; i < n; i++){
      const t = i / n * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
      const x = pul * Math.sign(c) * Math.pow(Math.abs(c), .4), y = pul * Math.sign(s) * Math.pow(Math.abs(s), .4);
      const nx = Math.sign(c) * Math.pow(Math.abs(c), 1.6), ny = Math.sign(s) * Math.pow(Math.abs(s), 1.6), d = Math.hypot(nx, ny) || 1;
      b.push([x, y, nx / d, ny / d]);
    }

function denniVyzva(){
  const R = rng(dnesniKlic() % 100000);
  const typy = [
    { typ: 'metry', cile: [250, 350, 450], text: c => 'Doleť do ' + c + ' m' },
    { typ: 'vlasu', cile: [4, 6, 8], text: c => 'Proleť ' + c + '× o chlup' },
    { typ: 'mince', cile: [30, 45, 60], text: c => 'Sesbírej ' + c + ' coinů v jednom kole' },
    { typ: 'pasma', cile: [2, 3], text: c => 'Proleť ' + c + ' pásma (láva, led, elektřina)' }
  ];
  const t = typy[Math.floor(R() * typy.length)], cil = t.cile[Math.floor(R() * t.cile.length)];
  const skin = skinNaDen(new Date());                     // dnešní DAILY SKIN z kalendáře
  return { typ: t.typ, cil, text: t.text(cil), skin };
}
function vyzvaPostup(){
  const v = denniVyzva();
  return Math.min(v.cil, { metry, vlasu, mince: diamanty, pasma: pruletPasem }[v.typ]);
}
const dnesHotovo = () => denniHotovo === dnesniKlic();
function kontrolaVyzvy(){
  if (rezim !== 'denni' || dnesHotovo() || hrac.mrtvy) return;
  const v = denniVyzva();
  if (vyzvaPostup() >= v.cil){
    denniHotovo = dnesniKlic();
    const nove = !koupeno.has(v.skin.id);
    koupeno.add(v.skin.id); mujSkin = v.skin.id;
    if (!nove) diamanty += 100;
    oznameni = { text: '🎁 VÝZVA SPLNĚNA! ' + (nove ? 'Nový skin: ' + v.skin.jmeno : '+100 🪙'), zivot: 3.5 };
    rekni('Jééé! Jsem ' + v.skin.jmeno + '!', 2.5);
    spustOhnostroj(12, 2); zatres(8); zvuk.vyhra();

}

function znovuPoKonci(){
  if (rezim === 'kampan') zacniLevel(levelVyhra ? Math.min(LEVELU, kampanLevel + 1) : kampanLevel);
  else zacniHru(rezim);

function otevriMenu(){ stav = 'menu'; zvuk.klik(); }
function otevriDenni(){ stav = 'denni'; vybranyDen = new Date().getDate(); zvuk.klik(); }
function obrazovkaKlik(){
  const pripraveno = performance.now() - konecCas > 500;
  if (stav === 'kampan'){ kampanKlik(); return; }
  if (stav === 'kolo'){
    if (vTlacitku(TL.domu)) otevriMenu();
    else if (kolo.vysledek && !kolo.toci) kolo.vysledek = null;
    else if (vTlacitku(TLKOLO.tocit)) zatocKolem();
    return;
  }
  if (stav === 'menu'){
    if (vTlacitku(TL.hrat)) zacniHru('normal');
    else if (vTlacitku(TL.kampan)) otevriKampan();
    else if (vTlacitku(TL.kolo)) otevriKolo();
    else if (vTlacitku(TL.denni)) otevriDenni();
    else if (vTlacitku(TL.skiny)) otevriObchod();
  } else if (stav === 'denni'){
    if (vTlacitku(TL.domu)) otevriMenu();
    else if (vTlacitku(TL.vyzva)){ if (vybranyDen && vybranyDen !== new Date().getDate()){ vybranyDen = new Date().getDate(); zvuk.klik(); } else zacniHru('denni'); }
    else kalendarKlik();
  } else if (stav === 'konec' && pripraveno){
    if (vTlacitku(TL.menu)){ if (rezim === 'kampan') otevriKampan(); else otevriMenu(); }
    else if (vTlacitku(TL.skinyK)) otevriObchod();
    else if (vTlacitku(TL.znovu)) znovuPoKonci();
  }
}
function obrazovkaKlavesa(kod){
  const pripraveno = performance.now() - konecCas > 700;
  if (stav === 'kampan'){ kampanKlavesa(kod); return; }
  if (stav === 'kolo'){
    if (kod === 'Escape') otevriMenu();
    else if (kolo.vysledek && !kolo.toci) kolo.vysledek = null;
    else zatocKolem();
    return;
  }
  if (stav === 'menu'){
    if (kod === 'Digit2' || kod === 'Numpad2') otevriDenni();
    else if (kod === 'Digit3' || kod === 'Numpad3') otevriKampan();
    else if (kod === 'Digit4' || kod === 'Numpad4') otevriKolo();
    else if (kod === 'KeyK') otevriObchod();
    else zacniHru('normal');                              // cokoliv jiného = hned hrát
  } else if (stav === 'denni'){
    if (kod === 'Escape') otevriMenu();
    else if (kod === 'KeyK') otevriObchod();
    else zacniHru('denni');
  } else if (stav === 'konec' && pripraveno){
    if (kod === 'Escape'){ if (rezim === 'kampan') otevriKampan(); else otevriMenu(); }
    else if (kod === 'KeyK') otevriObchod();
    else znovuPoKonci();
  }
}

// ============ PŘEKÁŽKY ============
function tvaryDeskyNaMetry(m){
  const t = ['kruh'];
  if (m > 60)  t.push('troj', 'ctverec');
  if (m > 120) t.push('dve');
  if (m > 200) t.push('hvezda', 'sestka');
  if (m > 300) t.push('kriz');
  if (m > 350) t.push('srdce');
  if (m > 400) t.push('terc');
  return t;
}

function novaPrekazka(){
  const m = metry + obtizOffset;
  if (m > 150 && Math.random() < .07){ prekazky.push(novaZlata()); return; }
  let druh = vyberDruh(m);
  posledniDruh = druh;
  const o = { druh, z: ZSPAWN, faze: nah(0, 7), hotovo: false, rot: 0, w: 0 };

  if (druh === 'deska'){
    o.tvar = nahZ(tvaryDeskyNaMetry(m));
    if (o.tvar === 'kruh'){
      o.r = Math.max(.3, .46 - m / 3000);
      umistiDiru(o, o.r);
      o.amp = (m > 450 && Math.random() < .4) ? .2 : 0;
    } else if (o.tvar === 'dve'){
      o.r = .29; o.rot = Math.atan2(volno.v, volno.u) + nah(-1, 1);
      if (m > 300 && Math.random() < .1) o.w = nahZ([-1, 1]) * nah(.4, .8);
      o.gu = 0; o.gv = 0;
      volno = { u: Math.cos(o.rot) * .45, v: Math.sin(o.rot) * .45 };
    } else if (o.tvar === 'terc'){
      o.gu = 0; o.gv = 0;
      const a = Math.atan2(volno.v, volno.u);
      volno = { u: Math.cos(a) * .55, v: Math.sin(a) * .55 };
    } else {
      umistiDiru(o, TVARY[o.tvar].max * .9);
      o.rot = nah(-.3, .3);
      if (m > 300 && Math.random() < .1) o.w = nahZ([-1, 1]) * nah(.4, .9);
    }
  }
  if (druh === 'pizza'){                        // pizza, které chybí dílek
    o.phi = Math.atan2(volno.v, volno.u) + nah(-1.2, 1.2); o.alfa = .52;
    if (m > 400 && Math.random() < .1) o.w = nahZ([-1, 1]) * nah(.3, .6);
    volno = { u: Math.cos(o.phi) * .55, v: Math.sin(o.phi) * .55 };
  }
  if (druh === 'ementál'){                      // sýr s dírami — jen jedna je dost velká
    o.diry = [];
    let u = volno.u + nah(-.35, .35), v = volno.v + nah(-.35, .35);
    const r0 = Math.hypot(u, v); if (r0 > .62){ u *= .62 / r0; v *= .62 / r0; }
    o.diry.push({ u, v, r: .3 });
    for (let pokus = 0; pokus < 40 && o.diry.length < 7; pokus++){
      const p = nahKruh(.8), r = nah(.07, .15);
      if (Math.hypot(p.u, p.v) + r > .95) continue;
      if (o.diry.every(d => Math.hypot(d.u - p.u, d.v - p.v) > d.r + r + .05)) o.diry.push({ u: p.u, v: p.v, r });
    }
    volno = { u, v };
  }
  if (druh === 'koule'){                        // skákací míče poletují po trubce
    o.mice = [];
    const n = m > 600 ? 4 : 3;
    for (let i = 0; i < n; i++){
      const p = nahKruh(.55), a = nah(0, 7), r = nah(.5, .8);
      o.mice.push({ u: p.u, v: p.v, vu: Math.cos(a) * r, vv: Math.sin(a) * r,
                    barva: ['#1e90ff', '#4fc3ff', '#7aa2ff', '#00bcd4'][i] });
    }
  }
  if (druh === 'tvarovka'){                     // tři díry — proletíš jen tou svojí
    o.rot = nah(0, 7); o.w = Math.random() < .15 ? nahZ([-1, 1]) * nah(.2, .4) : 0;
    o.poradi = ['kostka', 'koule', 'troj'];
    const i = o.poradi.indexOf(hrac.tvar), a = o.rot + i * Math.PI * 2 / 3 - Math.PI/2;
    volno = { u: Math.cos(a) * .5, v: Math.sin(a) * .5 };
  }
  if (druh === 'kus') vytvorKusy(o, m);
  vytvorNove(o, m);
  if (druh === 'mriz'){ o.t = .15; o.pozice = [-.36, .36]; o.rot = nahZ([0, Math.PI/4]); }
  if (druh === 'kvadr'){ o.r1 = nah(1.1, 1.7); o.r2 = nah(.9, 1.5); o.cu = 0; o.cv = 0; }
  if (druh === 'vrtule'){
    o.uhel = nah(0, 3); o.t = .2;
    o.w = nahZ([-1, 1]) * nah(1.2, 1.9) * (1 + m / 2500);
    o.ramena = m > 600 && Math.random() < .35 ? 4 : nahZ([2, 3]);
  }
  if (druh === 'dvere'){
    o.osa = Math.random() < .5 ? 'u' : 'v'; o.rych = nah(1.6, 2.4);
    const kdy = hodiny + (o.z - ZK) / rychlost;            // otevřené přesně, když doletíš
    o.faze = Math.PI / 2 - kdy * o.rych;
    volno = { ...volno, [o.osa]: 0 };
  }
  if (druh === 'laser'){ o.osa = Math.random() < .5 ? 'u' : 'v'; o.perioda = Math.max(1.4, 2 - m / 2000); }
  prekazkaKrok(o, 0);
  prekazky.push(o);
}

// KUSY = pevné tvary uprostřed trubky; letí se kolem nich
const KUS_TVARY = {
  kriz:   TVARY.kriz.body,
  iks:    TVARY.kriz.body.map(([x, y]) => rotuj(x, y, Math.PI / 4)),
  hvezda: hvezda(5, .64, .3),
  troj:   mnohouhelnik(3, .6),
  ctverec: mnohouhelnik(4, .45, -Math.PI/4),
  srdce:  SRDCE,
  kruh:   null
};
function kusBody(k){ return KUS_TVARY[k.tvar].map(([x, y]) => { const [rx, ry] = rotuj(x * k.s, y * k.s, k.rot); return [k.u + rx, k.v + ry]; }); }
function vytvorKusy(o, m){
  o.kusy = [];
  const volba = Math.random();
  if (volba < .45){                                          // jeden velký uprostřed
    const tvar = nahZ(m > 150 ? ['kriz', 'iks', 'hvezda', 'kriz', 'troj', 'srdce'] : ['kriz', 'iks', 'kriz']);
    const s = tvar === 'kriz' || tvar === 'iks' ? nah(1.5, 1.75) : nah(1.05, 1.25);
    o.kusy.push({ tvar, u: nah(-.1, .1), v: nah(-.1, .1), s, rot: nah(0, 7), w: m > 200 && Math.random() < .15 ? nahZ([-1, 1]) * nah(.3, .7) : 0 });
  } else {                                                    // pár menších tvarů rozházených
    const n = m > 300 ? 3 : 2;
    for (let pokus = 0; pokus < 60 && o.kusy.length < n; pokus++){
      const p = nahKruh(.62), tvar = nahZ(['kriz', 'iks', 'hvezda', 'troj', 'ctverec', 'kruh', 'srdce']);
      const k = { tvar, u: p.u, v: p.v, s: nah(.6, .78), rot: nah(0, 7), w: Math.random() < .15 ? nahZ([-1, 1]) * nah(.3, .7) : 0, r: .3 };
      if (o.kusy.every(j => Math.hypot(j.u - k.u, j.v - k.v) > .75)) o.kusy.push(k);
    }
  }
  // najdi volné místo (pro mince a pro další překážku)
  let nej = volno, nejZn = -9;
  for (let i = 0; i < 40; i++){
    const p = nahKruh(.75), zn = volneMisto(o, p.u, p.v) - Math.hypot(p.u - volno.u, p.v - volno.v) * .15;
    if (zn > nejZn){ nejZn = zn; nej = p; }
  }
  volno = nej;
}
function umistiDiru(o, velikost){
  const kraj = Math.max(0, .95 - velikost);
  const a = nah(0, 7), d = nah(.2, .8);
  let u = volno.u + Math.cos(a) * d, v = volno.v + Math.sin(a) * d;
  const r = Math.hypot(u, v); if (r > kraj){ u *= kraj / r; v *= kraj / r; }
  o.gu0 = o.gu = u; o.gv0 = o.gv = v;
  volno = { u, v };
}
function novaZlata(){
  const a = nah(0, 7), d = nah(0, .5);
  return { druh: 'zlata', z: ZSPAWN, faze: 0, hotovo: false, r: .17, gu: Math.cos(a) * d, gv: Math.sin(a) * d };
}

function prekazkaKrok(o, dt){
  krokNove(o, dt);
  if (o.druh === 'deska'){
    if (o.amp){
      o.gu = o.gu0 + Math.cos(hodiny * 1.5 + o.faze) * o.amp;
      o.gv = o.gv0 + Math.sin(hodiny * 1.5 + o.faze) * o.amp;
      const kraj = .95 - o.r, r = Math.hypot(o.gu, o.gv);
      if (r > kraj){ o.gu *= kraj / r; o.gv *= kraj / r; }
    }
    o.rot += o.w * dt;
  }
  if (o.druh === 'pizza') o.phi += o.w * dt;
  if (o.druh === 'kus') for (const k of o.kusy) k.rot += k.w * dt;
  if (o.druh === 'tvarovka') o.rot += o.w * dt;
  if (o.druh === 'koule'){
    for (const b of o.mice){
      b.u += b.vu * dt; b.v += b.vv * dt;
      const r = Math.hypot(b.u, b.v);
      if (r > .78){                                // odraz od stěny trubky
        const nu = b.u / r, nv = b.v / r, d = b.vu * nu + b.vv * nv;
        if (d > 0){ b.vu -= 2 * d * nu; b.vv -= 2 * d * nv; }
        b.u = nu * .78; b.v = nv * .78;
      }
    }
  }
  if (o.druh === 'kvadr'){ o.cu = Math.sin(hodiny * o.r1 + o.faze) * .45; o.cv = Math.cos(hodiny * o.r2 + o.faze) * .45; }
  if (o.druh === 'vrtule') o.uhel += o.w * dt;
  if (o.druh === 'dvere') o.g = .06 + .36 * (.5 + .5 * Math.sin(hodiny * o.rych + o.faze));
  if (o.druh === 'laser' && !(o.z - ZC < rychlost * 1.05 && o.strana !== undefined)){   // vteřinu před tebou už nepřeskočí
    const s = ((hodiny + o.faze) % o.perioda) / o.perioda;
    o.strana = s < .5 ? 0 : 1;
    o.varuje = (s % .5) > .5 - .17;
  }
}

function tvarovkaDira(o, tvar){
  const i = o.poradi.indexOf(tvar), a = o.rot + i * Math.PI * 2 / 3 - Math.PI/2;
  return { u: Math.cos(a) * .5, v: Math.sin(a) * .5, a };
}
function volneTvarovka(o, tvar, u, v){
  const d = tvarovkaDira(o, tvar);
  if (tvar === 'koule') return .26 - Math.hypot(u - d.u, v - d.v) - RC;
  const [x, y] = rotuj(u - d.u, v - d.v, -d.a);
  return vDire(TVAROVKA[tvar], x, y) - RC;
}
function vzdalOdRamene(u, v, th, delka){
  const cx = Math.cos(th), cy = Math.sin(th);
  const k = omez(u * cx + v * cy, 0, delka);
  return Math.hypot(u - cx * k, v - cy * k);
}

// kolik místa má kostka v bodě (u,v): kladné = v bezpečí, záporné = náraz
function volneMisto(o, u, v){
  const vn = volneNove(o, u, v); if (vn !== null) return vn;
  switch (o.druh){
    case 'zlata': return (o.r - RC) - Math.hypot(u - o.gu, v - o.gv);
    case 'trampolina': return 9;
    case 'krtek': {
      const n1 = Math.hypot(u - (boss.nosU - .3), v - .12), n2 = Math.hypot(u - (boss.nosU + .3), v - .12);
      return Math.max(.26 - n1, .26 - n2) - RC;
    }
    case 'deska': {
      if (o.tvar === 'kruh') return (o.r - RC) - Math.hypot(u - o.gu, v - o.gv);
      if (o.tvar === 'dve'){
        const cu = Math.cos(o.rot) * .45, cv = Math.sin(o.rot) * .45;
        return Math.max(o.r - Math.hypot(u - cu, v - cv), o.r - Math.hypot(u + cu, v + cv)) - RC;
      }
      if (o.tvar === 'terc'){ const d = Math.hypot(u, v); return Math.min(d - .32, .78 - d) - RC; }
      const [x, y] = rotuj(u - o.gu, v - o.gv, -o.rot);
      return vDire(TVARY[o.tvar].body, x, y) - RC;
    }
    case 'pizza': {
      const r = Math.hypot(u, v), d = Math.abs(uhelRozdil(Math.atan2(v, u), o.phi));
      const okraj = d < o.alfa ? r * Math.sin(o.alfa - d) : -r * Math.sin(Math.min(d - o.alfa, Math.PI/2));
      return okraj - RC;
    }
    case 'kus': {
      let d = 9;
      for (const k of o.kusy){
        if (k.tvar === 'kruh') d = Math.min(d, Math.hypot(u - k.u, v - k.v) - k.r * k.s * 1.4 - RC);
        else d = Math.min(d, -vDire(kusBody(k), u, v) - RC);
      }
      return d;
    }
    case 'ementál': {
      let d = -9;
      for (const h of o.diry) d = Math.max(d, h.r - Math.hypot(u - h.u, v - h.v));
      return d - RC;
    }
    case 'koule': {
      let d = 9;
      for (const b of o.mice) d = Math.min(d, Math.hypot(u - b.u, v - b.v) - .2 - RC);
      return d;
    }
    case 'tvarovka': return volneTvarovka(o, hrac.tvar, u, v);
    case 'mriz': {
      const [x, y] = rotuj(u, v, -o.rot);
      let d = 9;
      for (const b of o.pozice) d = Math.min(d, Math.abs(x - b) - (o.t/2 + RC), Math.abs(y - b) - (o.t/2 + RC));
      return d;
    }
    case 'kvadr': return Math.max(Math.abs(u - o.cu), Math.abs(v - o.cv)) - (.33 + RC);
    case 'vrtule': {
      let d = 9;
      for (let i = 0; i < o.ramena; i++) d = Math.min(d, vzdalOdRamene(u, v, o.uhel + i * Math.PI * 2 / o.ramena, 1.2) - (o.t/2 + RC));
      return d;
    }
    case 'dvere': { const x = o.osa === 'u' ? u : v; return o.g - RC - Math.abs(x); }
    case 'laser': { const x = o.osa === 'u' ? u : v; return o.strana === 0 ? x - RC : -x - RC; }
  }
  return 9;
}

// ============ DALŠÍ DRUHY PŘEKÁŽEK ============
const ODEMCENI = [          // od kolika metrů se který druh objevuje
  ['deska', 0], ['deska', 0], ['kus', 15], ['kus', 15], ['prsten', 30], ['pizza', 40], ['ctvrtky', 60],
  ['koule', 90], ['had', 110], ['ementál', 140], ['meteority', 160], ['kvadr', 180], ['kolo', 200],
  ['mriz', 230], ['kvetina', 250], ['vrtule', 260], ['tvarovka', 280], ['kyvadlo', 300], ['dvere', 320],
  ['tetris', 350], ['laser', 380], ['nuzky', 420], ['pulka', 460], ['meduzy', 500]
];
let posledniDruhy = [];
function vyberDruh(m){
  let moznosti = ODEMCENI.filter(([d, od]) => m >= od && !(d === 'tvarovka' && hrac.tvarT <= 4)).map(x => x[0]);
  const cerstve = moznosti.filter(d => !posledniDruhy.includes(d));
  if (cerstve.length) moznosti = cerstve;
  let d = nahZ(moznosti);
  // točící se překážky jsou vzácné
  const TOCIVE = ['vrtule', 'kolo', 'kvetina', 'nuzky', 'pulka'];
  if (TOCIVE.includes(d) && Math.random() < .8){ const klidne = moznosti.filter(x => !TOCIVE.includes(x)); if (klidne.length) d = nahZ(klidne); }
  posledniDruhy.push(d); if (posledniDruhy.length > 3) posledniDruhy.shift();
  return d;
}

const KOLO_BODY = (() => { const b = [], n = 12; for (let i = 0; i < n * 4; i++){
  const a = i / (n * 4) * Math.PI * 2, zub = (i % 4 === 0 || i % 4 === 1) ? .6 : .48; b.push([Math.cos(a) * zub, Math.sin(a) * zub]); } return b; })();
const LISTEK = (() => { const b = []; for (let i = 0; i < 14; i++){ const t = i / 14 * Math.PI * 2; b.push([.42 + Math.cos(t) * .3, Math.sin(t) * .13]); } return b; })();

function vytvorNove(o, m){
  const smerVolna = Math.atan2(volno.v, volno.u);
  switch (o.druh){
    case 'ctvrtky': case 'pulka':
      o.alfa = o.druh === 'pulka' ? Math.PI / 2 : Math.PI / 4;
      o.phi = smerVolna + nah(-1, 1);
      o.w = o.druh === 'pulka' ? nahZ([-1, 1]) * nah(.4, .9) : (m > 300 && Math.random() < .15 ? nahZ([-1, 1]) * nah(.3, .6) : 0);
      volno = { u: Math.cos(o.phi) * .5, v: Math.sin(o.phi) * .5 };
      break;
    case 'prsten':
      o.gu = nah(-.1, .1); o.gv = nah(-.1, .1); o.r1 = .38; o.r2 = .56;
      volno = Math.random() < .5 ? { u: o.gu, v: o.gv } : { u: Math.cos(smerVolna) * .7, v: Math.sin(smerVolna) * .7 };
      break;
    case 'had':
      o.sp = nah(.9, 1.3) * (1 + m / 3000); o.clanky = [];
      break;
    case 'kyvadlo':
      o.beta = nah(0, 7); o.rych = nah(1.6, 2.2);
      break;
    case 'nuzky':
      o.beta = nah(0, 7); o.w = nahZ([-1, 1]) * nah(.2, .5); o.rych = nah(1.5, 2.2); o.t = .16;
      break;
    case 'meteority': {
      const cil = { u: volno.u + nah(-.3, .3), v: volno.v + nah(-.3, .3) };
      const rc = Math.hypot(cil.u, cil.v); if (rc > .6){ cil.u *= .6 / rc; cil.v *= .6 / rc; }
      o.kameny = [];
      const n = m > 400 ? 9 : 7;
      for (let pokus = 0; pokus < 120 && o.kameny.length < n; pokus++){
        const p = nahKruh(.88), r = nah(.09, .17);
        if (Math.hypot(p.u - cil.u, p.v - cil.v) < .34 + r) continue;
        if (!o.kameny.every(k => Math.hypot(k.u - p.u, k.v - p.v) > k.r + r + .12)) continue;
        o.kameny.push({ u: p.u, v: p.v, r, rot: nah(0, 7), w: nah(-1, 1), tvar: Array.from({length: 7}, () => nah(.8, 1.1)) });
      }
      volno = cil;
      break;
    }
    case 'tetris': {
      const kandidati = [];
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++){
        const cu = -.75 + i * .5, cv = -.75 + j * .5;
        if (Math.hypot(cu, cv) < .82) kandidati.push({ i, j, cu, cv });
      }
      kandidati.sort((a, b) => Math.hypot(a.cu - volno.u, a.cv - volno.v) - Math.hypot(b.cu - volno.u, b.cv - volno.v) + nah(-.3, .3));
      o.prazdne = [kandidati[0]];
      if (Math.random() < .6){
        const druha = kandidati.find(k => Math.abs(k.i - kandidati[0].i) + Math.abs(k.j - kandidati[0].j) > 1);
        if (druha) o.prazdne.push(druha);
      }
      o.bloky = [];
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++)
        if (!o.prazdne.some(p => p.i === i && p.j === j)) o.bloky.push({ u: -1 + i * .5, v: -1 + j * .5, barva: nahZ(['#3f8cff', '#5ec8ff', '#2e55c7', '#7aa2ff', '#1fc9c9']) });
      volno = { u: o.prazdne[0].cu, v: o.prazdne[0].cv };
      break;
    }
    case 'meduzy':
      o.jel = [];
      for (let i = 0; i < (m > 800 ? 4 : 3); i++){ const p = nahKruh(.65); o.jel.push({ u: p.u, v: p.v, f: nah(0, 7) }); }
      break;
    case 'kolo': {
      const a = nah(0, 7), d = nah(.25, .4);
      o.gu = Math.cos(a) * d; o.gv = Math.sin(a) * d; o.rot = 0; o.w = nahZ([-1, 1]) * nah(.6, 1.2);
      volno = { u: -Math.cos(a) * .62, v: -Math.sin(a) * .62 };
      break;
    }
    case 'kvetina':
      o.rot = nah(0, 7); o.w = nahZ([-1, 1]) * nah(.4, .9); o.n = m > 500 && Math.random() < .5 ? 6 : 5;
      volno = { u: Math.cos(smerVolna) * .74, v: Math.sin(smerVolna) * .74 };
      break;
  }
}

const hadBod = (o, t) => [Math.sin(t * o.sp + o.faze) * .55, Math.sin(t * o.sp * 1.6 + o.faze * 1.3) * .5];
function kyvadloPoloha(o){
  const pu = Math.cos(o.beta), pv = Math.sin(o.beta);
  const fi = Math.sin(hodiny * o.rych + o.faze) * .95;
  const [du, dv] = rotuj(-pu, -pv, fi);
  return { pu, pv, bu: pu + du * 1.05, bv: pv + dv * 1.05 };
}
function nuzkyUhly(o){ const g = .25 + .45 * (.5 + .5 * Math.sin(hodiny * o.rych + o.faze)); return [o.beta + g, o.beta - g]; }
const koloBody = o => KOLO_BODY.map(([x, y]) => { const [rx, ry] = rotuj(x, y, o.rot); return [o.gu + rx, o.gv + ry]; });
const listekBody = (o, i) => LISTEK.map(([x, y]) => rotuj(x, y, o.rot + i * Math.PI * 2 / o.n));

function krokNove(o, dt){
  switch (o.druh){
    case 'ctvrtky': case 'pulka': o.phi += o.w * dt; break;
    case 'nuzky': o.beta += o.w * dt; break;
    case 'kolo': case 'kvetina': o.rot += o.w * dt; break;
    case 'meteority': for (const k of o.kameny) k.rot += k.w * dt; break;
    case 'had':
      o.clanky = Array.from({length: 8}, (_, i) => { const [u, v] = hadBod(o, hodiny - i * .13); return { u, v, r: i ? .12 - i * .005 : .15 }; });
      break;
    case 'meduzy': {
      const honi = o.z - ZC > 1.3 && !hrac.mrtvy;          // těsně před tebou už nezatáčí
      for (const j of o.jel){
        if (honi){ const s = smerK({x: j.u, y: j.v}, {x: hrac.u, y: hrac.v}); j.u += s.x * .3 * dt; j.v += s.y * .3 * dt; }
        for (const k of o.jel){ if (k === j) continue; const d = Math.hypot(j.u - k.u, j.v - k.v);
          if (d < .5 && d > 0){ j.u += (j.u - k.u) / d * .4 * dt; j.v += (j.v - k.v) / d * .4 * dt; } }
        const r = Math.hypot(j.u, j.v); if (r > .72){ j.u *= .72 / r; j.v *= .72 / r; }
        j.f += dt * 4;
      }
      break;
    }
  }
}

function volneNove(o, u, v){
  switch (o.druh){
    case 'ctvrtky': case 'pulka': {
      const r = Math.hypot(u, v), d = Math.abs(uhelRozdil(Math.atan2(v, u), o.phi));
      return (d < o.alfa ? r * Math.sin(Math.min(o.alfa - d, Math.PI / 2)) : -r * Math.sin(Math.min(d - o.alfa, Math.PI / 2))) - RC;
    }
    case 'prsten': { const d = Math.hypot(u - o.gu, v - o.gv); return Math.max(o.r1 - d, d - o.r2) - RC; }
    case 'had': { let d = 9; for (const c of o.clanky) d = Math.min(d, Math.hypot(u - c.u, v - c.v) - c.r - RC); return d; }
    case 'kyvadlo': {
      const p = kyvadloPoloha(o);
      const dx = p.bu - p.pu, dy = p.bv - p.pv, k = omez(((u - p.pu) * dx + (v - p.pv) * dy) / (dx*dx + dy*dy), 0, 1);
      const lano = Math.hypot(u - p.pu - dx * k, v - p.pv - dy * k) - .03;
      return Math.min(Math.hypot(u - p.bu, v - p.bv) - .27, lano) - RC;
    }
    case 'nuzky': { let d = 9; for (const th of nuzkyUhly(o)) d = Math.min(d, Math.abs(-Math.sin(th) * u + Math.cos(th) * v) - o.t / 2 - RC); return d; }
    case 'meteority': { let d = 9; for (const k of o.kameny) d = Math.min(d, Math.hypot(u - k.u, v - k.v) - k.r * 1.05 - RC); return d; }
    case 'tetris': {
      for (const p of o.prazdne){
        const dx = .25 - Math.abs(u - p.cu), dy = .25 - Math.abs(v - p.cv);
        if (dx > 0 && dy > 0) return Math.min(dx, dy) - RC;
      }
      return -.1;
    }
    case 'meduzy': { let d = 9; for (const j of o.jel) d = Math.min(d, Math.hypot(u - j.u, v - j.v) - .16 - RC); return d; }
    case 'kolo': return -vDire(koloBody(o), u, v) - RC;
    case 'kvetina': {
      let d = Math.hypot(u, v) - .16;
      for (let i = 0; i < o.n; i++) d = Math.min(d, -vDire(listekBody(o, i), u, v));
      return d - RC;
    }
  }
  return null;
}

function cestaNove(o, kruh){
  switch (o.druh){
    case 'ctvrtky': case 'pulka':
      kruh(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1.1, o.phi - o.alfa, o.phi + o.alfa); ctx.closePath(); return 'evenodd';
    case 'prsten': kolecko(o.gu, o.gv, o.r2); kolecko(o.gu, o.gv, o.r1); return 'evenodd';
    case 'had': for (const c of o.clanky) kolecko(c.u, c.v, c.r); return 'nonzero';
    case 'kyvadlo': {
      const p = kyvadloPoloha(o), a = Math.atan2(p.bv - p.pv, p.bu - p.pu);
      diraCesta([[0, -.03], [1.05, -.03], [1.05, .03], [0, .03]], p.pu, p.pv, a);
      kolecko(p.bu, p.bv, .27); return 'nonzero';
    }
    case 'nuzky': for (const th of nuzkyUhly(o)) diraCesta([[-1.3, -o.t/2], [1.3, -o.t/2], [1.3, o.t/2], [-1.3, o.t/2]], 0, 0, th); return 'nonzero';
    case 'meteority':
      for (const k of o.kameny) diraCesta(k.tvar.map((s, i) => { const a = i / 7 * Math.PI * 2; return [Math.cos(a) * k.r * s, Math.sin(a) * k.r * s]; }), k.u, k.v, k.rot);

function netopyrKrok(n, dt){
  n.mava += dt * 18;
  const obtiznost = 1 + hodiny / 60;
  const zPred = n.z;
  switch (n.stav){
    case 'spi':
      n.timer -= dt;
      if (n.timer <= 0 && metry > 90 && !trampolina && boss.stav === 'nic'){
        n.stav = 'vsiml'; n.timer = .9; n.trefil = false;
        const uh = nah(0, 7);
        n.u = Math.cos(uh) * .65; n.v = Math.sin(uh) * .65; n.z = 11; n.vu = 0; n.vv = 0;
        zvuk.pip();
      }
      return;
    case 'vsiml':
      n.timer -= dt; n.z -= rychlost * .35 * dt;
      if (n.timer <= 0) n.stav = 'utok';
      return;

        const rr = Math.min(2, 1.4 * obtiznost);
        n.vu += (s.x * rr - n.vu) * 1.9 * dt;
        n.vv += (s.y * rr - n.vv) * 1.9 * dt;
      }
      n.u += n.vu * dt; n.v += n.vv * dt;
      const r = Math.hypot(n.u, n.v); if (r > .85){ n.u *= .85 / r; n.v *= .85 / r; }
      if (zPred > ZK && n.z <= ZK && !hrac.mrtvy && !vyhra){
        const [x, y] = proj(hrac.u, hrac.v, ZC - A);
        if (Math.hypot(n.u - hrac.u, n.v - hrac.v) < .2){

      }
      if (n.z < ZN + .1){ n.stav = 'spi'; n.timer = nah(7, 12) / obtiznost; }
      return;
    }
  }
}

// ============ KROK HRY ============
function krok(dt){
  hodiny += dt;
  ohnostrojKrok(dt);

  if (vyhra){                                     // odraz od trampolíny — letí se nahoru!
    odrazT -= dt;
    const dz = -Math.max(2, rychlost * 1.4) * dt;
    svet += dz; prachKrok(dz);
    for (const o of prekazky) o.z -= dz;
    hrac.tocZbyva = Math.max(hrac.tocZbyva, 1);
    kostkaToceni(dt);
    hrac.u *= 1 - 2 * dt; hrac.v *= 1 - 2 * dt;
    if (bublina){ bublina.zivot -= dt; if (bublina.zivot <= 0) bublina = null; }
    if (odrazT <= 0){ ukonci(); zvuk.vyhra(); }
    return;
  }

  rychlost = Math.min(9.5, 3.4 + rychlostBonus + hodiny * .06);
  if (rezim === 'kampan' && !bossLevel && metry >= levelCil) vyhrajLevel();
  if (bossVyhraT > 0){ bossVyhraT -= dt; if (bossVyhraT <= 0) vyhrajLevel(); }
  const dz = (hrac.mrtvy ? 1.2 : rychlost * (hrac.turbo > 0 ? 2.2 : 1)) * dt;
  svet += dz;
  if (!hrac.mrtvy) draha += dz;
  metry = Math.floor(draha * 1.6);

  if (hrac.mrtvy){ konecZa -= dt; if (konecZa <= 0){ ukonci(); zvuk.konec(); } }

  // --- milníky a vrstvy ---
  if (Math.floor(metry / 100) > milnik){
    milnik = Math.floor(metry / 100);
    popisek(CX, 120, milnik * 100 + ' m! 🎉', '#ffe066', 36);
    zvuk.vyhra();
  }
  // přidávej další pásma dopředu do trubky (každé zhruba na 10 sekund letu)
  while (pasmaSeznam[pasmaSeznam.length - 1].od < draha + 40){
    const posl = pasmaSeznam[pasmaSeznam.length - 1];
    pasmaSeznam.push({ od: posl.od + Math.max(34, rychlost * DELKA_PASMA), typ: PORADI_PASEM[pasmoDalsi % PORADI_PASEM.length] });
    pasmoDalsi++;
  }
  pasmaSeznam = pasmaSeznam.filter((b, i) => i === pasmaSeznam.length - 1 || pasmaSeznam[i + 1].od > draha - 5);
  // upozornění: pásmo se blíží (už ho vidíš dole ve tmě)
  for (const b of pasmaSeznam){
    const zb = b.od - draha;
    if (!b.ohlaseno && zb > ZK && zb < 9 && !hrac.mrtvy){
      b.ohlaseno = true;
      oznameni = { text: 'Blíží se ' + { lava: 'LÁVA 🔥', led: 'LED 🧊', elektrina: 'ELEKTŘINA ⚡', start: 'klid 💜' }[b.typ] + '!', zivot: 1.8 };
    }
  }
  const pasmo = pasmoNa(draha + ZK);
  if (pasmo !== aktPasmo){
    aktPasmo = pasmo; nebezpeciT = 1.5;
    if (pasmo !== 'start') pruletPasem++;
    if (!hrac.mrtvy) hrajHudbuPasma(pasmo);
    oznameni = { text: PASMA[pasmo].jmeno, zivot: 2.4 };
    if (!hrac.mrtvy) rekni(PASMA[pasmo].hlaska, 2.4);
    zatres(6);
    if (pasmo === 'lava'){ zvuk.sum({ t: .8, hlas: .25, filtr: 500 }); zvuk.ton({ f: 90, f2: 60, t: .8, typ: 'sawtooth', hlas: .15 }); }
    if (pasmo === 'led'){ [1500, 1900, 2400].forEach((f, i) => zvuk.ton({ f, t: .25, typ: 'sine', hlas: .1, kdy: i * .08 })); }
    if (pasmo === 'elektrina'){ zvuk.sum({ t: .3, hlas: .3, filtr: 4000 }); zvuk.ton({ f: 60, t: .4, typ: 'square', hlas: .12 }); zablesk = 1; }
  }
  const cil = PASMA[aktPasmo];
  for (const k of ['zed','spara','pozadi']){
    const c = hexNaRgb(cil[k]);
    for (let i = 0; i < 3; i++) barvy[k][i] += (c[i] - barvy[k][i]) * Math.min(1, 1.5 * dt);
  }
  if (oznameni){ oznameni.zivot -= dt; if (oznameni.zivot <= 0) oznameni = null; }

  // --- pohyb kostky ---
  if (!hrac.mrtvy){
    let su = 0, sv = 0;
    if (klavesy.ArrowLeft  || klavesy.KeyA) su -= 1;
    if (klavesy.ArrowRight || klavesy.KeyD) su += 1;
    if (klavesy.ArrowUp    || klavesy.KeyW) sv -= 1;
    if (klavesy.ArrowDown  || klavesy.KeyS) sv += 1;
    let cu = 0, cv = 0;
    if (su || sv){
      mysRidi = false;
      const d = Math.hypot(su, sv); cu = su / d * 1.9; cv = sv / d * 1.9;
    } else if (mysRidi){
      const tu = (mys.x - CX) * (ZC - A) / F, tv = (mys.y - CY) * (ZC - A) / F;
      cu = (tu - hrac.u) * 9; cv = (tv - hrac.v) * 9;
      const d = Math.hypot(cu, cv); if (d > 2.2){ cu = cu / d * 2.2; cv = cv / d * 2.2; }
    }
    const prilnavost = aktPasmo === 'led' ? 4 : 12;            // na ledu to klouže!
    hrac.vu += (cu - hrac.vu) * prilnavost * dt;
    hrac.vv += (cv - hrac.vv) * prilnavost * dt;
    hrac.u += hrac.vu * dt; hrac.v += hrac.vv * dt;
    const r = Math.hypot(hrac.u, hrac.v);
    if (r > MEZ){
      const nu = hrac.u / r, nv = hrac.v / r;
      if (Math.hypot(hrac.vu, hrac.vv) > .6 && Math.random() < dt * 25){
        const [x, y] = proj(nu * 1.05, nv * 1.05, ZC - A);
        castice.push({ x, y, vx: nah(-120, 120), vy: nah(-160, 40), zivot: .4, max: .4, barva: '#ffffff', vel: 3 });
        if (Math.random() < .3) zvuk.skrip();
      }
      hrac.u = nu * MEZ; hrac.v = nv * MEZ;
      const ven = hrac.vu * nu + hrac.vv * nv;
      if (ven > 0){ hrac.vu -= ven * nu * 1.3; hrac.vv -= ven * nv * 1.3; }
    }
    // --- měnění tvaru: PUF! ---
    if (metry > 250 && boss.stav === 'nic'){
      hrac.tvarT -= dt;
      const tvarovkaLeti = prekazky.some(o => o.druh === 'tvarovka' && o.z > ZC);
      if (hrac.tvarT <= 0 && !tvarovkaLeti){
        hrac.tvar = nahZ(['kostka', 'koule', 'troj'].filter(t => t !== hrac.tvar));
        hrac.tvarT = nah(11, 16); hrac.puf = 1;
        const [x, y] = proj(hrac.u, hrac.v, ZC - A);
        bum(x, y, '#ffffff', 26, 240); bum(x, y, '#8cc8ff', 12, 200);
        popisek(x, y - 55, 'PUF!', '#ffffff', 30);

        zvuk.ton({ f: 400, f2: 1600, t: .25, typ: 'sine', hlas: .15 }); zvuk.sum({ t: .2, hlas: .1, filtr: 3000 });
      }
    }
  }
  hrac.puf = Math.max(0, hrac.puf - dt * 3);
  kostkaToceni(dt);
  hrac.au = Math.max(0, hrac.au - dt * .9);
  hrac.mrkT -= dt;
  if (hrac.mrkT <= 0){ hrac.mrk = .13; hrac.mrkT = nah(2, 4.5); }
  hrac.mrk = Math.max(0, hrac.mrk - dt);

  if (bublina){ bublina.zivot -= dt; if (bublina.zivot <= 0) bublina = null; }
  hlaskaT -= dt;
  if (hlaskaT <= 0 && !hrac.mrtvy){ rekni(nahZ(HLASKY)); hlaskaT = nah(7, 12); }

  // --- boss ---
  if (metry >= boss.dalsi && boss.stav === 'nic' && !hrac.mrtvy) bossStart();
  if (boss.stav !== 'nic') bossKrok(dt);
  const bossBezi = boss.stav === 'prilet' || boss.stav === 'hazi' || boss.stav === 'utok';

  // --- nebezpečí podle pásma ---
  nebezpeciKrok(dt, dz, bossBezi);

  // --- nové překážky, diamanty ---
  spawnT -= dt;
  if (spawnT <= 0 && !hrac.mrtvy && !trampolina && !bossBezi){
    novaPrekazka();
    spawnT = Math.max(.85, 1.55 - (metry + obtizOffset) / 900);   // v pásmech s nebezpečím je překážek míň
    diamantT = spawnT * .5;
  }
  diamantT -= dt;
  if (diamantT <= 0 && !hrac.mrtvy && !trampolina){
    diamantT = bossBezi ? 1.2 : 99;
    if (Math.random() < .65){
      let u = volno.u + nah(-.2, .2), v = volno.v + nah(-.2, .2);
      if (bossBezi){ const p = nahKruh(.7); u = p.u; v = p.v; }
      const r = Math.hypot(u, v); if (r > .75){ u *= .75 / r; v *= .75 / r; }
      const kolik = Math.random() < .3 ? 3 : 1;
      const typ = pasmoNa(draha + ZSPAWN);
      if (Math.random() < .06) kameny.push({ u, v, z: ZSPAWN, faze: 0, typ, velka: true });      // vzácný OBŘÍ coin
      else for (let i = 0; i < kolik; i++) kameny.push({ u, v, z: ZSPAWN + i * .8, faze: nah(0, 7), typ });
    }
  }

  powerupKrok(dt, dz, bossBezi);

  // --- překážky ---
  let nejbliz = 9;
  for (const o of prekazky){
    const zPred = o.z;
    o.z -= dz;
    prekazkaKrok(o, dt);
    if (o.druh === 'krtek') boss.z = o.z;
    if (hrac.mrtvy) continue;
    if (o.z > ZC && o.z - ZC < 3.5 && o.druh !== 'zlata' && o.druh !== 'trampolina')
      nejbliz = Math.min(nejbliz, volneMisto(o, hrac.u, hrac.v));
    if (zPred > ZK && o.z <= ZK && !o.hotovo){
      o.hotovo = true;
      const [x, y] = proj(hrac.u, hrac.v, ZC - A);
      const volne = volneMisto(o, hrac.u, hrac.v);
      if (o.druh === 'trampolina'){ odraz(); continue; }
      if (o.druh === 'zlata'){
        if (volne >= 0){
          zlatych++; diamanty += 10;
          popisek(x, y - 50, 'ZLATÁ TREFA! +10 🪙', '#ffe066', 30);
          spustOhnostroj(); zatres(6); zvuk.vyhra();
          hrac.tocZbyva = 2;
        } else {
          o.rozbita = true;
          bum(x, y, '#ffd84a', 30, 360); bum(x, y, '#fff6c2', 12, 250);
          popisek(x, y - 40, 'Cink! Zlatá díra vedle 😅', '#ffe066', 22);
          zvuk.ton({ f: 1800, f2: 900, t: .3, typ: 'triangle', hlas: .14 });
          zvuk.ton({ f: 2400, f2: 1200, t: .25, typ: 'triangle', hlas: .1, kdy: .05 });
        }

      if (volne < 0){

        }
        zasah(duvod); if (!hrac.mrtvy) combo = 0;
      } else if (o.druh === 'krtek') bossPoraz();
      else if (volne < .06){
        vlasu++;
        combo++;
        const nasobic = combo >= 4 ? 3 : combo >= 2 ? 2 : 1;          // 🔥 combo násobí coiny
        const bonus = (volne < .025 ? 10 : 5) * nasobic;             // čím těsněji, tím víc coinů!
        diamanty += bonus;
        if (nasobic > 1) popisek(CX, 185, '🔥 COMBO ×' + nasobic + '!', '#ff9a3c', 34);
        if (volne < .025){ zpomalT = .8; popisek(CX, 230, '🐌 ZPOMALENÍ!', '#9fd0ff', 26); }
        popisek(x, y + 55, nahZ(VLAS), '#7dffb0', 22);
        popisek(x, y - 55, '+' + bonus + ' 🪙', '#ffe066', bonus >= 10 ? 34 : 28);
        zvuk.vlas(); zvuk.sber(); bum(x, y, '#7dffb0', 10, 180); bum(x, y, '#ffd84a', bonus === 10 ? 22 : 12, 240);
        hrac.tocZbyva = 1;                         // zatočí se jako vrtule!
      } else if (o.druh !== 'krtek' && o.druh !== 'trampolina') combo = 0;
    }
  }
  prekazky = prekazky.filter(o => o.z > ZN && !(o.rozbita && o.z < ZC - .1));

  // --- diamanty ---
  for (const k of kameny){
    const zPred = k.z; k.z -= dz;
    if (!hrac.mrtvy && zPred > ZK && k.z <= ZK && Math.hypot(k.u - hrac.u, k.v - hrac.v) < (k.velka ? .3 : .22)){
      const hodnota = k.velka ? 25 : k.typ && k.typ !== 'start' ? 2 : 1;
      if (k.velka){ const [x2, y2] = proj(hrac.u, hrac.v, ZK); popisek(CX, 150, '🪙 OBŘÍ COIN! +25', '#ffe066', 40); spustOhnostroj(4, .8); bum(x2, y2, '#ffd84a', 40, 360); zvuk.vyhra(); }
      k.sebrano = true; diamanty += hodnota;
      const [x, y] = proj(hrac.u, hrac.v, ZC - A);
      bum(x, y, '#ffd84a', 14, 220); bum(x, y, '#fff6c2', 5, 150);
      const ikona = { lava: '🔥', led: '🧊', elektrina: '⚡' }[k.typ] || '🪙';
      popisek(x, y - 40, '+' + hodnota + ' ' + ikona, hodnota > 1 ? '#ffb13b' : '#ffe066', hodnota > 1 ? 30 : 24);
      zvuk.sber();
    }
  }
  kameny = kameny.filter(k => !k.sebrano && k.z > ZN);

  // --- netopýr ---
  // (netopýři jsou pryč)
  if (netopyr.stav === 'utok' && netopyr.z - ZC < 3.5 && Math.hypot(netopyr.u - hrac.u, netopyr.v - hrac.v) < .45) nejbliz = Math.min(nejbliz, 0);
  for (const h of hroudy) if (h.z > ZC && h.z - ZC < 2.5 && Math.hypot(h.u - hrac.u, h.v - hrac.v) < .35) nejbliz = 0;

  hrac.strach += ((nejbliz < .03 ? 1 : 0) - hrac.strach) * 8 * dt;
  hrac.pohU += (omez(hrac.vu, -1, 1) - hrac.pohU) * 6 * dt;
  hrac.pohV += (omez(hrac.vv, -1, 1) - hrac.pohV) * 6 * dt;

  kontrolaVyzvy();
  prachKrok(dz);
}

function nebezpeciKrok(dt, dz, bossBezi){
  zablesk = Math.max(0, zablesk - dt * 5);
  nebezpeciT -= dt;
  // férovost: nebezpečí nepřiletí ve stejnou chvíli jako překážka
  const kolize = (za, okno) => prekazky.some(o => o.z > ZK && Math.abs((o.z - ZK) / rychlost - za) < okno);
  if (false){   // lávové koule a blesky jsou vypnuté — pásma jsou jen na koukání (a led klouže)
    const za = aktPasmo === 'lava' ? (ZSPAWN - ZK) / (rychlost + 1.5) : 1.0;
    if ((aktPasmo === 'lava' || aktPasmo === 'elektrina') && kolize(za, .7)){ nebezpeciT = .25; }
    else if (aktPasmo === 'lava'){
      const p = { u: hrac.u + hrac.vu * .4 + nah(-.2, .2), v: hrac.v + hrac.vv * .4 + nah(-.2, .2) };
      const r = Math.hypot(p.u, p.v); if (r > .72){ p.u *= .72 / r; p.v *= .72 / r; }
      lavaKapky.push({ ...p, z: ZSPAWN, f: nah(0, 7) });
      nebezpeciT = nah(1.6, 2.2);
    } else if (aktPasmo === 'elektrina'){
      const a = nah(0, Math.PI), nu = Math.cos(a), nv = Math.sin(a);
      const d = omez(nu * hrac.u + nv * hrac.v + nah(-.2, .2), -.7, .7);
      blesky.push({ nu, nv, d, t: 1.0, uder: 0, zasazen: false, klik: 0 });
      nebezpeciT = nah(2, 2.8);
      zvuk.ton({ f: 900, t: .05, typ: 'square', hlas: .05 });
    } else nebezpeciT = 1;
  }
  for (const k of lavaKapky){
    const zPred = k.z; k.z -= (dz + 1.5 * dt); k.f += dt * 6;
    if (zPred > ZK && k.z <= ZK && !hrac.mrtvy){
      const [x, y] = proj(hrac.u, hrac.v, ZC - A);
      if (Math.hypot(k.u - hrac.u, k.v - hrac.v) < .2 + RC) zasah('Au, HORKÝ! 🔥');
      else { popisek(x, y + 55, 'Uff, vedle!', '#ffb13b', 20); zvuk.vlas(); }
    }
  }
  lavaKapky = lavaKapky.filter(k => k.z > ZN);
  for (const b of blesky){
    if (b.uder <= 0){
      b.t -= dt; b.klik -= dt;
      if (b.klik <= 0){ zvuk.ton({ f: 1400, t: .03, typ: 'square', hlas: .04 }); b.klik = .15; }
      if (b.t <= 0){ b.uder = .3; zablesk = 1; zatres(7);
        zvuk.sum({ t: .35, hlas: .35, filtr: 5000 }); zvuk.ton({ f: 120, f2: 40, t: .3, typ: 'sawtooth', hlas: .2 }); }
    } else {
      b.uder -= dt;
      if (!hrac.mrtvy && !b.zasazen && Math.abs(b.nu * hrac.u + b.nv * hrac.v - b.d) < .1 + RC * .6){ b.zasazen = true; zasah('BZZZT! ⚡'); }
    }
  }
  blesky = blesky.filter(b => !(b.uder < 0 && b.t <= 0));
}

// ============ KRESLENÍ ============
function poly(b){
  ctx.beginPath(); ctx.moveTo(b[0][0], b[0][1]);
  for (let i = 1; i < b.length; i++) ctx.lineTo(b[i][0], b[i][1]);
  ctx.closePath(); ctx.fill();
}

const ZARE_HRANICE = { lava: '255,160,50', led: '220,245,255', elektrina: '255,240,90', start: '170,140,255' };
function kresliTunel(){
  const zn = .3, zf = 18, KUSU = 28;
  const vHre = stav === 'hra' || stav === 'konec';
  const typNaZ = z => vHre ? pasmoNa(draha + z) : 'start';
  // úseky trubky podle pásem (od nejhlubšího)
  const hranice = vHre ? pasmaSeznam.map(b => ({ z: b.od - draha, typ: b.typ })).filter(b => b.z > zn && b.z < zf) : [];
  const body = [zf, ...hranice.map(b => b.z).sort((a, b) => b - a), zn];
  const daleko = PASMA[typNaZ(zf - .01)];
  ctx.fillStyle = daleko.pozadi; ctx.fillRect(0, 0, Š, V);
  for (let k = 0; k < body.length - 1; k++){
    const zDal = body[k], zBliz = body[k + 1];
    const P = PASMA[typNaZ((zDal + zBliz) / 2)], zed = hexNaRgb(P.zed);
    const n = F / zBliz * (zBliz === zn ? 1.05 : 1), f = F / zDal;
    for (let i = 0; i < KUSU; i++){
      const a1 = i / KUSU * Math.PI * 2, a2 = (i + 1.04) / KUSU * Math.PI * 2, am = (a1 + a2) / 2;
      const svetlo = .45 + .5 * Math.max(0, Math.cos(am + Math.PI * .75));
      ctx.fillStyle = ztmav(zed, svetlo);
      poly([[CX + Math.cos(a1)*n, CY + Math.sin(a1)*n], [CX + Math.cos(a2)*n, CY + Math.sin(a2)*n],
            [CX + Math.cos(a2)*f, CY + Math.sin(a2)*f], [CX + Math.cos(a1)*f, CY + Math.sin(a1)*f]]);
    }
    // podélné spáry
    ctx.strokeStyle = P.spara; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 12; i++){
      const a = i / 12 * Math.PI * 2 + .13;
      ctx.moveTo(CX + Math.cos(a)*n, CY + Math.sin(a)*n); ctx.lineTo(CX + Math.cos(a)*f, CY + Math.sin(a)*f);
    }
    ctx.stroke();
  }
  // kruhové spáry — letí proti tobě
  const frac = ((svet * 1.25) % 1 + 1) % 1;
  for (let i = 0; i < 18; i++){
    const zz = .4 + i + (1 - frac);
    if (zz > zf) break;
    const h = F / zz;
    ctx.globalAlpha = omez(1.2 - zz / 14, 0, 1);
    ctx.strokeStyle = PASMA[typNaZ(zz)].spara; ctx.lineWidth = Math.max(1, .05 * h);
    ctx.beginPath(); ctx.arc(CX, CY, h, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // v elektrickém pásmu blikají světýlka do rytmu hudby
  const takt = hodiny2 / (60 / 170), dobaTaktu = 1 - (takt % 1), cislo = Math.floor(takt);
  const BAR_SV = ['#ffe94a', '#5fe8ff', '#ff5dd8'];
  for (let i = 0; i < 18; i++){
    const zz = .4 + i + (1 - frac);
    if (zz > zf || typNaZ(zz) !== 'elektrina') continue;
    const h = F / zz;
    for (let j = 0; j < 12; j++){
      const a = j / 12 * Math.PI * 2 + .13, bs = BAR_SV[(j + i + cislo) % 3];
      ctx.globalAlpha = omez(1.2 - zz / 14, 0, 1) * (.35 + .65 * dobaTaktu);
      ctx.fillStyle = bs; ctx.beginPath(); ctx.arc(CX + Math.cos(a) * h * .97, CY + Math.sin(a) * h * .97, Math.max(2, .045 * h), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // zářící hranice pásma — vidíš ji z dálky, jak se blíží
  for (const b of hranice){
    const h = F / b.z, c = ZARE_HRANICE[b.typ], pulz = .6 + .4 * Math.sin(hodiny2 * 8);
    ctx.strokeStyle = `rgba(${c},${.35 * pulz})`; ctx.lineWidth = Math.max(4, .3 * h);
    ctx.beginPath(); ctx.arc(CX, CY, h, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = `rgba(${c},${.9 * pulz})`; ctx.lineWidth = Math.max(2, .08 * h);
    ctx.beginPath(); ctx.arc(CX, CY, h, 0, Math.PI * 2); ctx.stroke();
  }
  // tma v hloubce
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 330);
  const p = hexNaRgb(daleko.pozadi), c = `${p[0]|0},${p[1]|0},${p[2]|0}`;
  g.addColorStop(0, `rgba(${c},1)`); g.addColorStop(.18, `rgba(${c},.85)`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, Š, V);
  // hranice pásma prosvítá i skrz tmu
  for (const b of hranice) if (b.z > 6){
    const h = F / b.z, c2 = ZARE_HRANICE[b.typ];
    ctx.strokeStyle = `rgba(${c2},.55)`; ctx.lineWidth = Math.max(2, .08 * h);
    ctx.beginPath(); ctx.arc(CX, CY, h, 0, Math.PI * 2); ctx.stroke();
  }
  // prach — barva podle pásma, ve kterém zrovna letí
  const skupiny = {};
  for (const pr of prach){ const t = typNaZ(pr.z); (skupiny[t] = skupiny[t] || []).push(pr); }
  for (const t in skupiny){
    ctx.strokeStyle = PASMA[t].prach; ctx.lineWidth = t === 'start' ? 1.5 : 2.5;
    ctx.beginPath();
    for (const pr of skupiny[t]){
      const [x1, y1] = proj(pr.u, pr.v, pr.z), [x2, y2] = proj(pr.u, pr.v, pr.z + .12 + rychlost * .03 + warpSila * 1.6);
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    }
    ctx.stroke();
  }
}

function pasmoNa(pos){
  let t = 'start';
  for (const b of pasmaSeznam) if (b.od <= pos) t = b.typ;
  return t;
}
function pruhlednost(z){
  let a = omez((ZSPAWN + 1 - z) / 2.5, 0, 1);
  if (z < 1.05) a *= omez((z - .55) / .5, 0, 1);      // zmizí až těsně u tebe, když už je za tebou
  return a;
}
const tma = z => omez((z - 3) / 12, 0, .75);

function diraCesta(body, gu, gv, rot){
  body.forEach(([x, y], i) => {
    const [rx, ry] = rotuj(x, y, rot);
    i ? ctx.lineTo(gu + rx, gv + ry) : ctx.moveTo(gu + rx, gv + ry);
  });
  ctx.closePath();
}
const kolecko = (u, v, r) => { ctx.moveTo(u + r, v); ctx.arc(u, v, r, 0, Math.PI * 2); };

// tvar překážky jako cesta (v jednotkách trubky, poloměr 1); vrací pravidlo vyplnění
function cesta(o){
  ctx.beginPath();
  const kruh = () => kolecko(0, 0, 1.02);
  const cn = cestaNove(o, kruh); if (cn) return cn;
  switch (o.druh){
    case 'zlata': kruh(); kolecko(o.gu, o.gv, o.r); return 'evenodd';
    case 'trampolina': kruh(); return 'nonzero';
    case 'krtek': kruh(); kolecko(boss.nosU - .3, .12, .26); kolecko(boss.nosU + .3, .12, .26); return 'evenodd';
    case 'deska':
      kruh();
      if (o.tvar === 'kruh') kolecko(o.gu, o.gv, o.r);
      else if (o.tvar === 'dve'){ const cu = Math.cos(o.rot) * .45, cv = Math.sin(o.rot) * .45; kolecko(cu, cv, o.r); kolecko(-cu, -cv, o.r); }
      else if (o.tvar === 'terc'){ kolecko(0, 0, .78); kolecko(0, 0, .32); }
      else diraCesta(TVARY[o.tvar].body, o.gu, o.gv, o.rot);
      return 'evenodd';
    case 'pizza':
      kruh();
      ctx.moveTo(0, 0); ctx.arc(0, 0, 1.1, o.phi - o.alfa, o.phi + o.alfa); ctx.closePath();
      return 'evenodd';
    case 'ementál': kruh(); for (const h of o.diry) kolecko(h.u, h.v, h.r); return 'evenodd';
    case 'kus':
      for (const k of o.kusy){ if (k.tvar === 'kruh') kolecko(k.u, k.v, k.r * k.s * 1.4); else diraCesta(kusBody(k), 0, 0, 0); }
      return 'nonzero';
    case 'koule': for (const b of o.mice) kolecko(b.u, b.v, .2); return 'nonzero';
    case 'tvarovka':
      kruh();
      for (const t of o.poradi){
        const d = tvarovkaDira(o, t);
        if (t === 'koule') kolecko(d.u, d.v, .26); else diraCesta(TVAROVKA[t], d.u, d.v, d.a);
      }
      return 'evenodd';
    case 'mriz':
      for (const b of o.pozice){
        diraCesta([[b - o.t/2, -1.5], [b + o.t/2, -1.5], [b + o.t/2, 1.5], [b - o.t/2, 1.5]], 0, 0, o.rot);
        diraCesta([[-1.5, b - o.t/2], [1.5, b - o.t/2], [1.5, b + o.t/2], [-1.5, b + o.t/2]], 0, 0, o.rot);
      }
      return 'nonzero';
    case 'kvadr': ctx.rect(o.cu - .33, o.cv - .33, .66, .66); return 'nonzero';
    case 'vrtule':
      for (let i = 0; i < o.ramena; i++){
        const th = o.uhel + i * Math.PI * 2 / o.ramena;
        diraCesta([[0, -o.t/2], [1.2, -o.t/2], [1.2, o.t/2], [0, o.t/2]], 0, 0, th);
      }
      kolecko(0, 0, o.t / 2 + .01);
      return 'nonzero';
    case 'dvere':
      if (o.osa === 'u'){ ctx.rect(-1.1, -1.1, 1.1 - o.g, 2.2); ctx.rect(o.g, -1.1, 1.1 - o.g, 2.2); }
      else              { ctx.rect(-1.1, -1.1, 2.2, 1.1 - o.g); ctx.rect(-1.1, o.g, 2.2, 1.1 - o.g); }
      return 'nonzero';
    case 'laser':
      if (o.osa === 'u'){ if (o.strana === 0) ctx.rect(-1.1, -1.1, 1.1, 2.2); else ctx.rect(0, -1.1, 1.1, 2.2); }
      else              { if (o.strana === 0) ctx.rect(-1.1, -1.1, 2.2, 1.1); else ctx.rect(-1.1, 0, 2.2, 1.1); }
      return 'nonzero';
  }
  return 'nonzero';
}

function pruhyUnits(b1, b2, sirka = .1){
  ctx.fillStyle = b1; ctx.fillRect(-1.1, -1.1, 2.2, 2.2);
  ctx.fillStyle = b2; ctx.beginPath();
  for (let i = -3.4; i < 1.2; i += sirka * 2){
    ctx.moveTo(i, 1.1); ctx.lineTo(i + sirka, 1.1); ctx.lineTo(i + sirka + 2.2, -1.1); ctx.lineTo(i + 2.2, -1.1); ctx.closePath();
  }
  ctx.fill();
}
function vJednotkach(z, fn){
  const k = F / z;
  ctx.save(); ctx.translate(CX, CY); ctx.scale(k, k);
  ctx.beginPath(); ctx.arc(0, 0, 1.02, 0, Math.PI * 2); ctx.clip();
  fn(k);
  ctx.restore();
}
function svetylka(body, gu, gv, rot, vel){
  body.forEach(([x, y], i) => {
    const [rx, ry] = rotuj(x, y, rot);
    ctx.fillStyle = (Math.floor(hodiny * 6) + i) % 2 ? '#ffffff' : '#9fe8ff';
    ctx.beginPath(); ctx.arc(gu + rx, gv + ry, vel, 0, 7); ctx.fill();
  });
}
const kruhBody = (r, n = 8) => Array.from({length: n}, (_, i) => [Math.cos(i / n * Math.PI * 2) * r, Math.sin(i / n * Math.PI * 2) * r]);
function koulePlast(u, v, r, barva){
  const g = ctx.createRadialGradient(u - r*.35, v - r*.35, r * .1, u, v, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.25, barva); g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = barva; ctx.beginPath(); ctx.arc(u, v, r, 0, 7); ctx.fill();
  ctx.fillStyle = g; ctx.fill();
}

function kresliKrtka(k){
  // obří krtek zabírá celou trubku; nos se dvěma dírkami
  const nu = boss.nosU;
  ctx.save(); ctx.rotate(boss.uhel);
  let p = cesta({ druh: 'krtek' });
  ctx.fillStyle = '#3d3a4a'; ctx.fill(p);
  // chlupy krtka (tmavší čárky)
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = .02; ctx.beginPath();
  for (let i = 0; i < 60; i++){ const a = CHLUP[i] * 7, d = .5 + CHLUP[i + 70] * .5; ctx.moveTo(Math.cos(a)*d, Math.sin(a)*d); ctx.lineTo(Math.cos(a)*(d+.06), Math.sin(a)*(d+.06)); }
  ctx.stroke();
  // helma stavbaře
  ctx.fillStyle = '#ffcc2e'; ctx.beginPath(); ctx.arc(0, -.55, .5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.fillRect(-.6, -.6, 1.2, .08);
  ctx.fillStyle = '#e0a800'; ctx.fillRect(-.06, -1.02, .12, .42);
  // malá očička
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-.32, -.32, .07, 0, 7); ctx.arc(.32, -.32, .07, 0, 7); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-.32 + hrac.u * .03, -.32 + hrac.v * .03, .035, 0, 7); ctx.arc(.32 + hrac.u * .03, -.32 + hrac.v * .03, .035, 0, 7); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = .035; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-.45, -.45); ctx.lineTo(-.2, -.4); ctx.moveTo(.45, -.45); ctx.lineTo(.2, -.4); ctx.stroke();
  // obří růžový nos s dírkami

  ctx.fillText(jeDnes ? '⭐ DNEŠNÍ DAILY SKIN ⭐' : vd + '. ' + MESICE2[K.mes], 181, 118);

  }
  kresliSkinNahled(181, 205, 46, s, Math.sin(hodiny2 * 1.5) * .15);

  ctx.font = 'bold 14px system-ui'; ctx.fillStyle = vz.barva;

      tlacitko(TL.vyzva, '▶ Hrát jen tak', '#3c4f8a');

    ctx.fillText(vd < K.dnes ? (koupeno.has(s.id) ? '✔ Tenhle skin máš!' : 'Tenhle den už byl… 😢') : '🔒 Tenhle skin můžeš vyhrát', 181, 350);
    if (vd > K.dnes) ctx.fillText(vd + '. ' + MESICE2[K.mes] + ' — za ' + (vd - K.dnes) + (vd - K.dnes === 1 ? ' den' : vd - K.dnes < 5 ? ' dny' : ' dní'), 181, 374);

}

function kresliKonecKampan(){
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, Š, V);
  ctx.font = 'bold 50px system-ui'; ctx.fillStyle = '#fff';

  ctx.fillText(levelVyhra ? 'Super! Odemkl se level ' + Math.min(LEVELU, kampanLevel + 1) + '.' : bossLevel ? 'Krtek Bagr vyhrál… zkus to znovu!' : 'Doletěla jsi ' + metry + ' z ' + levelCil + ' m. Skoro!', CX, 136);
  if (!levelVyhra && !bossLevel){ const w = 400; ctx.fillStyle = 'rgba(255,255,255,.15)'; zaobl(CX - w/2, 160, w, 16, 8); ctx.fill(); ctx.fillStyle = '#ffe066'; zaobl(CX - w/2, 160, Math.max(16, w * Math.min(1, metry / levelCil)), 16, 8); ctx.fill(); }
  ctx.font = '25px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText('🪙 ' + diamanty + '     O chlup: ' + vlasu + '×', CX, 240);
  let y = 286;
  if (levelVyhra){ ctx.font = 'bold 40px system-ui'; ctx.fillStyle = '#ffe066'; ctx.fillText(hvezdyText(levelHvezdy), CX, 178);
    ctx.font = '15px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(levelHvezdy < 3 ? 'Víc hvězd = sesbírej víc coinů!' : 'Všechny hvězdy! Jsi mistr! 🤩', CX, 206); }
  for (const o of (levelVyhra ? odmenyTed : [])){ ctx.font = 'bold 28px system-ui'; ctx.fillStyle = '#ffe066'; ctx.fillText(o, CX, y); y += 40; }
  if (levelVyhra && kampanLevel % NA_SVET === 0) kresliSkinNahled(CX + 300, 280, 34, odmenaSkin(kampanLevel), Math.sin(hodiny2 * 2) * .2);
  ctx.font = '22px system-ui'; ctx.fillStyle = '#ffe9a8'; ctx.fillText('V kasičce máš ' + kasicka + ' 🪙' + (noveZatoceni ? '   •   🎡 +1 zatočení kolem štěstí!' : ''), CX, 372);
  if (performance.now() - konecCas > 700){
    ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText('mezerník = ' + (levelVyhra ? 'další level' : 'znovu') + '   •   Esc = levely', CX, 414);
    tlacitko(TL.znovu, levelVyhra ? '▶ Další level' : '↻ Znovu', '#2f9e5c');
    tlacitko(TL.menu, '🗺️ Levely', '#e08a1f');
    tlacitko(TL.skinyK, '🎨 Skiny', '#8a4fff');
  }
}
function kresliKonec(){
  if (rezim === 'kampan'){ kresliKonecKampan(); return; }
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, Š, V);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 50px system-ui';
  ctx.fillText('Kostka dopadla! 💥', CX, 72);
  const komentar = metry < 150 ? 'Sotva se rozjela!' :
                   metry < 400 ? 'Slušnej pád!' :
                   metry < 800 ? 'Hluboko jak sklep u babičky!' :
                   metry < 1500 ? (boss.krtku ? 'Porazila krtka! Profík!' : 'Kostka profík!') :
                   metry < 3000 ? 'KOSTKA LEGENDA!' : 'NEKONEČNÁ KOSTKA! 🤯';
  ctx.font = 'bold 28px system-ui'; ctx.fillStyle = '#ffe066';
  ctx.fillText(komentar, CX, 126);
  ctx.font = '25px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText('Hloubka: ' + metry + ' m' + (boss.krtku ? '     Poražení krtci: ' + boss.krtku + ' 🤧' : ''), CX, 180);
  ctx.fillText('🪙 ' + diamanty + '     O chlup: ' + vlasu + '×     Zlaté trefy: ' + zlatych, CX, 220);
  ctx.fillStyle = '#9fd0ff';
  ctx.fillText('Nejlepší: ' + nejlepsi + ' m' + (metry >= nejlepsi && metry > 0 ? '  🏆 NOVÝ REKORD!' : ''), CX, 260);
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('V kasičce máš ' + kasicka + ' 🪙' + (noveZatoceni ? '   •   🎡 +1 zatočení kolem štěstí!' : ''), CX, 300);
  if (rezim === 'denni'){
    const v = denniVyzva();
    ctx.font = 'bold 22px system-ui';
    if (dnesHotovo()){ ctx.fillStyle = '#7dffb0'; ctx.fillText('🎁 Výzva splněna! Skin „' + v.skin.jmeno + '" je tvůj!', CX, 348); }
    else { ctx.fillStyle = '#ff9ab8'; ctx.fillText('🎁 Výzva: ' + v.text + ' — máš ' + vyzvaPostup() + ' / ' + v.cil + '. Zkus to znovu!', CX, 348); }

  if (performance.now() - konecCas > 700){
