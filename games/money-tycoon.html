<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<title>Money Tycoon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--pozadi:#12131c;}
  html,body{margin:0;background:var(--pozadi);overflow-x:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;}
  #obal{min-height:100vh;display:grid;place-items:center;}
  canvas{background:#1d2030;display:block;border-radius:8px;touch-action:manipulation;}
</style>
<div id="obal"><canvas id="platno"></canvas></div>
<script>
// ============ ZÁKLAD ============
const Š = 960, V = 540;          // kuličky: 960 × 540
const V_DOMOV = 690;              // hlavní stránka je vyšší — pod políčky je řada s batohem
const platno = document.getElementById('platno');
const ctx = platno.getContext('2d');
const vyska = () => stav === 'domov' ? V_DOMOV : V;
function zmenVelikost(){
  const H = vyska();
  const w = document.documentElement.clientWidth || innerWidth, h = innerHeight;
  // hlavní stránka = přes celou šířku (a dá se posunout dolů), kuličky = celé v okně
  const sc = stav === 'domov' ? Math.min(w / Š, 2.2) : Math.min(w / Š, h / V);
  platno.style.width = Math.floor(Š * sc) + 'px';
  platno.style.height = Math.floor(H * sc) + 'px';
  const k = sc * Math.min(window.devicePixelRatio || 1, 2);
  platno.width = Math.round(Š * k); platno.height = Math.round(H * k);
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
addEventListener('resize', zmenVelikost);

// ============ ZVUK ============
const zvuk = (() => {
  let a = null, zapnuto = true, hudbaTimer = null;
  function audio(){
    if (!a) a = new (window.AudioContext || window.webkitAudioContext)();
    if (a.state === 'suspended') a.resume();
    return a;
  }
  function ton({f=440, f2=null, t=.15, typ='square', hlas=.15, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const o = c.createOscillator(), g = c.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f, z);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), z + t);
    g.gain.setValueAtTime(.0001, z);
    g.gain.exponentialRampToValueAtTime(hlas, z + .01);
    g.gain.exponentialRampToValueAtTime(.0001, z + t);
    o.connect(g); g.connect(c.destination);
    o.start(z); o.stop(z + t + .05);
  }
  function sum({t=.2, hlas=.2, filtr=1200, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const n = Math.max(1, Math.floor(c.sampleRate * t));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtr;
    const g = c.createGain(); g.gain.value = hlas;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(z);
  }
  function nota(jmeno){
    const z = {C:0, D:2, E:4, F:5, G:7, A:9, B:11, H:11};
    const m = /^([A-H])(#|b)?(-?\d)$/.exec(jmeno);
    if (!m) return 440;
    const p = z[m[1]] + (m[2]==='#' ? 1 : m[2]==='b' ? -1 : 0) + (+m[3]+1)*12;
    return 440 * Math.pow(2, (p - 69) / 12);
  }
  return {
    ton, sum, nota,
    tichoZapni(){ zapnuto = !zapnuto; if (!zapnuto) this.hudbaStop(); return zapnuto; },
    klik:   () => ton({f:600, f2:900, t:.05, hlas:.1}),
    skok:   () => ton({f:300, f2:700, t:.12, typ:'square'}),
    sber:   () => { ton({f:880, t:.07, typ:'triangle', hlas:.18});
                    ton({f:1320, t:.09, typ:'triangle', hlas:.14, kdy:.06}); },
    zasah:  () => { ton({f:200, f2:60, t:.2, typ:'sawtooth', hlas:.2});
                    sum({t:.15, filtr:800}); },
    vybuch: () => { sum({t:.5, hlas:.35, filtr:600});
                    ton({f:120, f2:30, t:.4, typ:'sawtooth', hlas:.2}); },
    strela: () => ton({f:1200, f2:200, t:.08, typ:'sawtooth', hlas:.12}),
    chyba:  () => { ton({f:180, t:.1, typ:'square', hlas:.15});
                    ton({f:130, t:.2, typ:'square', hlas:.15, kdy:.1}); },
    start:  () => [523,659,784].forEach((f,i) =>
                    ton({f, t:.1, typ:'triangle', hlas:.15, kdy:i*.08})),
    vyhra:  () => [523,659,784,1047].forEach((f,i) =>
                    ton({f, t:.18, typ:'triangle', hlas:.18, kdy:i*.11})),
    konec:  () => [523,415,330,262].forEach((f,i) =>
                    ton({f, t:.22, typ:'triangle', hlas:.16, kdy:i*.14})),
    prd:    () => { ton({f:90, f2:55, t:.28, typ:'sawtooth', hlas:.22});
                    sum({t:.25, hlas:.12, filtr:300}); },
    hudbaHraj(noty, tempo = 120, typ = 'triangle', hlas = .05){
      this.hudbaStop();
      if (!zapnuto) return;
      const krok = 60 / tempo / 2;
      let i = 0;
      hudbaTimer = setInterval(() => {
        const n = noty[i % noty.length];
        if (n) ton({ f: typeof n === 'string' ? nota(n) : n, t: krok * .9, typ, hlas });
        i++;
      }, krok * 1000);
    },
    hudbaStop(){ if (hudbaTimer) { clearInterval(hudbaTimer); hudbaTimer = null; } }
  };
})();
let zvukZapnut = true;
const HUDBA = ['C4','E4','G4','E4','F4','A4','C5','A4','G4','E4','D4','G4','C4',null,'G3',null];
let posledniCink = 0;
function cink(f){                       // pípnutí při ťuknutí, ať to nezahltí uši
  const t = performance.now();
  if (t - posledniCink < 35) return;
  posledniCink = t;
  zvuk.ton({f, t:.08, typ:'triangle', hlas:.09});
}
const PENTA = [523,587,659,784,880,1047,1175,1319,1568];

// ============ POMOCNÍCI ============
const nah   = (a,b) => a + Math.random()*(b-a);
const nahZ  = pole => pole[Math.floor(Math.random()*pole.length)];
const omez  = (v,a,b) => Math.max(a, Math.min(b, v));
const vzdal = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

// ============ ŠŤÁVA ============
let castice = [], otres = 0, popisky = [];
let vKroku = false;   // efekty z kuliček se na hlavní stránce nekreslí
const patriDomu = () => stav === 'domov' && !vKroku;
function bum(x, y, barva='#ffd166', kolik=14, sila=260){
  for (let i=0;i<kolik;i++){
    const a = nah(0, Math.PI*2), r = nah(60, sila);
    castice.push({x, y, vx:Math.cos(a)*r, vy:Math.sin(a)*r,
                  zivot:nah(.3,.7), max:.7, barva, vel:nah(2,5), domov: patriDomu()});
  }
}
function zatres(s){ otres = Math.max(otres, s); }
function popisek(x, y, text, barva='#fff', vel=20){
  if (String(text).startsWith('+')) return;   // žádná vyskakující „plus“ čísla
  popisky.push({x, y, text, barva, zivot:.9, vel, domov: patriDomu()});
}
function efektyKrok(dt){
  for (const c of castice){ c.x += c.vx*dt; c.y += c.vy*dt; c.vy += 500*dt; c.zivot -= dt; }
  castice = castice.filter(c => c.zivot > 0);
  for (const p of popisky){ p.y -= 45*dt; p.zivot -= dt; }
  popisky = popisky.filter(p => p.zivot > 0);
  if (popisky.length > 60) popisky.splice(0, popisky.length - 60);
  otres = Math.max(0, otres - dt*40);
}
function efektyKresli(){
  const naDomove = stav === 'domov';
  for (const c of castice){
    if (c.domov !== naDomove) continue;
    ctx.globalAlpha = Math.max(0, c.zivot / c.max);
    ctx.fillStyle = c.barva;
    ctx.fillRect(c.x - c.vel/2, c.y - c.vel/2, c.vel, c.vel);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popisky){
    if (p.domov !== naDomove) continue;
    ctx.globalAlpha = Math.min(1, p.zivot*1.5);
    ctx.font = `bold ${p.vel}px Rajdhani, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.barva;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// ============ HERNÍ PLOCHA ============
const PLOCHA = { x1: 12, x2: 708, dno: 482 };
const KOSE = [
  { hodnota: 2,  barva:'#3a86ff' },
  { hodnota: 5,  barva:'#8338ec' },
  { hodnota: 15, barva:'#ffbe0b' },
  { hodnota: 5,  barva:'#8338ec' },
  { hodnota: 2,  barva:'#3a86ff' },
];
const SIRKA_KOSE = (PLOCHA.x2 - PLOCHA.x1) / KOSE.length;

const VECI = {
  kolik:  { r: 9,  penize: 1, odraz: .6 },
  hvezda: { r: 15, penize: 5, odraz: 1.05 },
  split:  { r: 15, penize: 0, odraz: 0 },
};

// ============ ÚROVNĚ KULIČEK ============
// Každá úroveň = víc peněz za každé ťuknutí i za koš.
const UROVNE = [
  { nasobek: 1,   barva: '#c3c9d6', tvar: '',   jmeno: 'Obyčejná' },
  { nasobek: 2,   barva: '#5ee07a', tvar: '🙂', jmeno: 'Veselá' },
  { nasobek: 4,   barva: '#4aa8ff', tvar: '😀', jmeno: 'Nadšená' },
  { nasobek: 8,   barva: '#b36bff', tvar: '😎', jmeno: 'Frajerka' },
  { nasobek: 16,  barva: '#ff7a3d', tvar: '🤠', jmeno: 'Kovbojka' },
  { nasobek: 40,  barva: '#ffcf33', tvar: '🤑', jmeno: 'Zbohatlice' },
  { nasobek: 100, barva: 'duha',    tvar: '👑', jmeno: 'KRÁLOVNA' },
];
// žádné maximum: po královně pokračují další královny, každá 2× lepší
for (let n = 2; n <= 60; n++) UROVNE.push({ nasobek: 100 * Math.pow(2, n - 1), barva: 'duha', tvar: '👑', jmeno: 'KRÁLOVNA ' + n });
const DRAHOTA = 25;   // 💪 obtížnost: skoro nemožné — všechno je 25× dražší
const cenaVylepseni = uroven => Math.round(15 * DRAHOTA * Math.pow(3, uroven));   // uroven 0 = obyčejná
const polomer = uroven => 8 + uroven * 1.3;

// ============ OBCHOD ============
let pocetKouli = 0, urovenRychle = 0, pocetHvezd = 0, pocetSplitu = 0;
const OBCHOD = [
  { id:'nova',   ikona:'⚪', nazev:'Nová kulička',     popis:'další kulička do party',
    cena: () => Math.round(20 * Math.pow(1.6, pocetKouli - 3)), uroven: () => pocetKouli },
  { id:'vylep',  ikona:'⬆️', nazev:'Vylepšit slabou', popis:'nebo klikni na kuličku!',
    cena: () => { const k = nejslabsi(); return k ? cenaVylepseni(k.uroven) : 0; } },
  { id:'rychle', ikona:'⚡', nazev:'Rychlý kohoutek',  popis:'kuličky vyletí dřív',
    cena: () => Math.round(40 * Math.pow(2, urovenRychle)), uroven: () => urovenRychle },
  { id:'hvezda', ikona:'⭐', nazev:'Hvězdný kolík',   popis:'kolík → hvězda (+5 $)',
    cena: () => Math.round(60 * Math.pow(1.5, pocetHvezd)), uroven: () => pocetHvezd },
  { id:'split',  ikona:'🌀', nazev:'Zdvojovač',        popis:'udělá kuličce dvojče',
    cena: () => Math.round(200 * Math.pow(2, pocetSplitu)), uroven: () => pocetSplitu },
];

// ============ STAV HRY ============
let stav = 'domov';           // 'domov' = hlavní stránka, 'hra' = kuličky
let hraZacla = false;
let penize = 20, vydelano = 0, cas = 0, casHry = 0;
let znovuzrozeni = 0;
const nasobekKorun = () => Math.pow(2, znovuzrozeni);   // 👑 každé znovuzrození = 2× víc peněz
let bonusSbirkyFn = () => 1;                            // 📖 sbírka přidává procenta
const nasobekZnovu = () => nasobekKorun() * bonusSbirkyFn();
const DELKA_KOLA = 120;
let koule = [], veci = [], zasobnik = [];
let casDoKoule = 0, kohoutekX = 360, konecOd = 0, mezernikCD = 0;
const kurzor = { x: 360, y: 260, videt: false };
let mval = null, mvalCasovac = 20, posledniTitul = '';
const MAX_KLONU = 60;

function intervalKoule(){ return Math.max(.06, 0.8 * Math.pow(0.72, urovenRychle)) * (efekty.turbo > 0 ? .35 : 1); }
function vsechnyKulicky(){ return [...koule.filter(k => !k.klon), ...zasobnik, ...(mval ? mval.bricho : [])]; }
function nejslabsi(){
  let n = null;
  for (const k of vsechnyKulicky()) if (k.uroven < UROVNE.length - 1 && (!n || k.uroven < n.uroven)) n = k;
  return n;
}
function novaKulicka(uroven = 0){ return { uroven, r: polomer(uroven), pop: 0 }; }

function postavDesku(){
  veci = [];
  for (let rada = 0; rada < 5; rada++){
    const y = 135 + rada * 66;
    const posun = rada % 2 ? 50 : 0;
    for (let x = 60 + posun; x < 680; x += 100){
      veci.push({ typ:'kolik', x, y, r: VECI.kolik.r, pop: 0 });
    }
  }
}

function zacniHru(){
  stav = 'hra';
  cas = DELKA_KOLA; casHry = 0;
  koule = []; zasobnik = [];
  pocetKouli = 3; urovenRychle = 0; pocetHvezd = 0; pocetSplitu = 0;
  for (let i = 0; i < pocetKouli; i++) zasobnik.push(novaKulicka());
  postavDesku();
  castice = []; popisky = []; otres = 0;
  casDoKoule = .3; posledniTitul = titul(0)[0]; mval = null; mvalCasovac = Infinity;   // mýval už nechodí
  zvuk.start();
}

// vypustí kuličku ze zásobníku do hry
function vypust(x){
  if (!zasobnik.length) return false;
  const k = zasobnik.shift();
  Object.assign(k, { x: x + nah(-4,4), y: 52, vx: nah(-30,30), vy: 40,
                     zivot: 0, cd: 0, posledni: null, posledniT: 0, pryc: false });
  koule.push(k);
  return true;
}
// kulička se vrací zpátky nahoru do zásobníku
function doZasobniku(k){
  k.pryc = true;
  if (!k.klon) zasobnik.push(k);
}

// ============ VYLEPŠENÍ KULIČKY ============
function vylepsi(k, x, y){
  if (!k) { popisek(360, 260, 'Všechny kuličky jsou KRÁLOVNY! 👑', '#ffd166', 22); zvuk.chyba(); return; }
  if (k.uroven >= UROVNE.length - 1){ popisek(x, y - 25, 'Už je to královna! 👑', '#ffd166', 16); zvuk.chyba(); return; }
  const cena = cenaVylepseni(k.uroven);
  if (penize < cena){ popisek(x, y - 25, 'Málo peněz! (' + cena + ' $)', '#ff6b6b', 16); zvuk.chyba(); return; }
  penize -= cena;
  k.uroven++; staty.vylepseni++;
  k.r = polomer(k.uroven);
  k.pop = 1;
  const u = UROVNE[k.uroven];
  popisek(x, y - 30, u.jmeno + '! ' + u.tvar + ' ×' + u.nasobek, u.barva === 'duha' ? '#fff' : u.barva, 20);
  bum(x, y, u.barva === 'duha' ? '#ffffff' : u.barva, 22, 280);
  if (k.uroven >= 5) zatres(6);
  [0,1,2].forEach(i => zvuk.ton({ f: 400 + k.uroven*120 + i*200, t:.09, typ:'square', hlas:.1, kdy: i*.06 }));
}

// ============ OVLÁDÁNÍ ============
const klavesy = {};
function muzeRestart(){ return stav === 'menu' || (stav === 'konec' && performance.now() - konecOd > 1200); }
function prepniZvuk(){
  zvukZapnut = zvuk.tichoZapni();

}

addEventListener('keydown', e => {
  klavesy[e.code] = true;
  if (intro){ ukonciIntro(); return; }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM'){ prepniZvuk(); return; }
  if (e.code === 'KeyB' && !kolo.otevrene){ batoh.otevreny ? zavriBatoh() : otevriBatoh(); return; }
  if (batoh.otevreny){
    if (e.code === 'Escape') zavriBatoh();
    const c = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9'].indexOf(e.code);
    if (c >= 0){ const id = veciVBatohu()[c]; if (id) pouzij(id, c); }
    return;
  }
  if (OBR[stav]){
    if (e.code === 'Escape' || e.code === 'KeyH'){ jdiDomu(); return; }
    OBR[stav].klavesa(e, ['Digit1','Digit2','Digit3','Digit4','Digit5'].indexOf(e.code));
    return;
  }
  if (['bankomat','automat','tovarna','znovu','dul','balonky','pizza','ukoly','banka'].includes(stav)){
    if (e.code === 'Escape' || e.code === 'KeyH'){ jdiDomu(); return; }
    const c = ['Digit1','Digit2','Digit3','Digit4','Digit5'].indexOf(e.code);
    if (stav === 'bankomat'){ if (['Space','Enter'].includes(e.code) && !e.repeat) klikBankomat(); if (c >= 0 && c < 3) kupBankomat(c); }
    if (stav === 'automat'){ if (['Space','Enter'].includes(e.code)) zatocAutomat(); if (c >= 0 && !automat.toci){ automat.sazka = c; zvuk.klik(); } }
    if (stav === 'tovarna'){
      if (c >= 0 && c < 3) kupTovarna(c);
      if (e.code === 'Space'){ const v = tovarna.veci.filter(v => !v.pad).sort((a, b) => b.x - a.x)[0]; if (v) zabal(v); }
    }
    if (stav === 'znovu' && e.code === 'Enter') znovuzrodSe();
    if (stav === 'dul'){ if (['Space','Enter'].includes(e.code) && !e.repeat) ranaDoSkaly(); if (c >= 0 && c < 3) kupDul(c); }
    if (stav === 'balonky'){
      if (c >= 0 && c < 3) kupBal(c);
      if (e.code === 'Space'){ const b = bal.seznam.filter(b => b.typ !== 'bomba').sort((a, b) => a.y - b.y)[0]; if (b) propichni(b); }
    }
    if (stav === 'pizza'){
      const p = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].indexOf(e.code);
      if (p >= 0) pridejPrisadu(p);
      if (e.code === 'Enter' || e.code === 'Space') podejPizzu();
      if (e.code === 'Backspace'){ piz.na = []; }
      if (e.code === 'KeyQ') kupPizza(0); if (e.code === 'KeyW') kupPizza(1); if (e.code === 'KeyE') kupPizza(2);
    }
    return;
  }
  if (stav === 'vejce'){
    if (otevirani){ if (['Space','Enter','Escape'].includes(e.code)) zavriOtevirani(); return; }
    if (e.code === 'Escape' || e.code === 'KeyH'){ jdiDomu(); return; }
    const c = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].indexOf(e.code);
    if (c >= 0) kupVejce(c);
    return;
  }
  if (stav === 'domov'){
    if (kolo.otevrene){
      if (['Enter','Space'].includes(e.code)) roztoc();
      if (e.code === 'Escape') zavriKolo();
      if (e.code === 'KeyU') prepniPanelKola('vylepseni');
      if (e.code === 'KeyC') prepniPanelKola('ceny');
      const c = ['Digit1','Digit2','Digit3'].indexOf(e.code);
      if (c >= 0 && kolo.panel === 'vylepseni') kupVylepseniKola(c);
      return;
    }
    tajnaKlavesa(e);
    if (['Enter','Space','Digit1','Numpad1'].includes(e.code)) otevriKulicky();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyH'){ jdiDomu(); return; }
  let i = ['Digit1','Digit2','Digit3','Digit4','Digit5'].indexOf(e.code);
  if (i < 0) i = ['Numpad1','Numpad2','Numpad3','Numpad4','Numpad5'].indexOf(e.code);
  if (i >= 0) klikObchod(i);
  if (e.code === 'Enter'){ kurzor.videt = true; klikDeska(kurzor.x, kurzor.y); }
  if (e.code === 'Space' && mezernikCD <= 0){ if (vypust(kohoutekX)) zvuk.klik(); mezernikCD = .2; }
});
addEventListener('keyup', e => klavesy[e.code] = false);

function bodZUdalosti(e){
  const r = platno.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * Š, y: (e.clientY - r.top) / r.height * vyska() };
}
platno.addEventListener('contextmenu', e => e.preventDefault());
platno.addEventListener('pointermove', e => {
  const b = bodZUdalosti(e);
  kurzor.x = b.x; kurzor.y = b.y; kurzor.videt = true;
});
platno.addEventListener('pointerdown', e => {
  e.preventDefault();
  mysTlacitko = e.button; hrac.kliky++;
  if (intro){ ukonciIntro(); return; }
  const b = bodZUdalosti(e);
  kurzor.x = b.x; kurzor.y = b.y; kurzor.videt = true;
  if (batoh.otevreny){ klikBatoh(b.x, b.y); return; }
  if (stav === 'domov'){ klikDomov(b.x, b.y); return; }
  if (stav === 'vejce'){ klikVejce(b.x, b.y); return; }
  if (stav === 'bankomat'){ klikBankomatObrazovka(b.x, b.y); return; }
  if (stav === 'automat'){ klikAutomat(b.x, b.y); return; }
  if (stav === 'tovarna'){ klikTovarna(b.x, b.y); return; }
  if (stav === 'znovu'){ klikZnovu(b.x, b.y); return; }
  if (stav === 'dul'){ klikDul(b.x, b.y); return; }
  if (stav === 'balonky'){ klikBalonky(b.x, b.y); return; }
  if (stav === 'pizza'){ klikPizza(b.x, b.y); return; }
  if (stav === 'ukoly'){ klikUkoly(b.x, b.y); return; }
  if (stav === 'banka'){ klikBanka(b.x, b.y); return; }
  if (OBR[stav]){ if (naZpet(b.x, b.y)) jdiDomu(); else OBR[stav].klik(b.x, b.y); return; }
  if (b.x > 96 && b.x < 196 && b.y > 18 && b.y < 58){ otevriBatoh(); return; }
  if (b.x > 905 && b.y > 44 && b.y < 80){ prepniZvuk(); return; }
  if (b.x > 728 && b.y > 488){ jdiDomu(); return; }
  if (b.x < 90 && b.y > 14 && b.y < 62){ jdiDomu(); return; }   // domeček vlevo nahoře
  if (b.x > 720){
    const i = Math.floor((b.y - 92) / 78);
    if (b.y >= 92 && i >= 0 && i < OBCHOD.length) klikObchod(i);
    return;
  }
  klikDeska(b.x, b.y);
});

// která kulička je pod prstem (hodně tolerantní, kuličky jsou rychlé)
function kulickaPod(x, y){
  let n = null, nd = 34;
  for (const k of koule){
    if (k.klon) continue;
    const d = Math.hypot(k.x - x, k.y - y);
    if (d < nd + k.r * .5){ nd = d; n = k; }
  }
  return n;
}

function klikDeska(x, y){
  if (mval && mval.stav === 'chodi' && Math.hypot(x - mval.x, y - mval.y) < 40){ odpalMvala(); return; }
  const k = kulickaPod(x, y);
  if (k){ vylepsi(k, k.x, k.y); return; }
  if (y < 75){ if (vypust(omez(x, 30, 690))) zvuk.klik(); else { popisek(x, 80, 'Všechny kuličky jsou venku!', '#aab', 14); } return; }
}

function klikObchod(i){
  const p = OBCHOD[i];
  const stredY = 92 + i*78 + 36;
  if (p.id === 'vylep'){
    const k = nejslabsi();
    const naDesce = k && koule.includes(k);
    vylepsi(k, naDesce ? k.x : 840, naDesce ? k.y : stredY);
    return;
  }
  if (p.max != null && p.uroven() >= p.max){ popisek(840, stredY, 'Už je to na max!', '#ffd166', 16); zvuk.chyba(); return; }
  const cena = p.cena();
  if (penize < cena){ popisek(840, stredY, 'Málo peněz!', '#ff6b6b', 18); zvuk.chyba(); return; }
  if (p.id === 'hvezda' || p.id === 'split'){
    const kandidati = veci.filter(v => v.typ === 'kolik' && v.y > 150);
    if (!kandidati.length){ popisek(840, stredY, 'Už není volný kolík!', '#ffd166', 16); zvuk.chyba(); return; }
    const v = nahZ(kandidati);
    penize -= cena;
    v.typ = p.id; v.r = VECI[p.id].r; v.pop = 1.5;
    if (p.id === 'hvezda') pocetHvezd++; else pocetSplitu++;
    bum(v.x, v.y, p.id === 'hvezda' ? '#ffe066' : '#7ae7ff', 24, 260);
    popisek(v.x, v.y - 28, p.id === 'hvezda' ? 'Tadá! ⭐' : 'Kopírka! 🌀', '#fff', 20);
    zvuk.vyhra();
    return;
  }
  penize -= cena;
  if (p.id === 'nova'){
    pocetKouli++; zasobnik.push(novaKulicka());
    popisek(kohoutekX, 70, 'Nová kulička! ⚪', '#fff', 18);
    zvuk.sber();
  } else if (p.id === 'rychle'){
    urovenRychle++;
    popisek(840, stredY, 'Vžum! ⚡', '#fff', 22);
    zvuk.vyhra();
  }
  bum(840, stredY, '#ffd166', 20);
}

// ============ MÝVAL ZLODĚJ ============
// Jako kočka u akvária: kouká nahoru, vybere si kuličku, která je nejníž
// (a nejradši tu nejdražší!) a běží pod ni. Když na něj klikneš,
// odletí do vesmíru a všechny kuličky vyplivne zpátky.
const HLASKY_MVAL = ['Mňam kulička! 😋', 'Díky, šéfe!', 'Chrup chrup!', 'Tahle je moje!', 'Hehehe!'];
function novyMval(){
  const zleva = Math.random() < .5;
  mval = { x: zleva ? -30 : 750, y: 468, stav: 'chodi', vx: 0, vy: 0, rot: 0,
           smer: zleva ? 1 : -1, bricho: [], cil: 360, cuchani: 0 };
  popisek(360, 440, 'Pozor, mýval zloděj! 🦝', '#ffd166', 24);
  zvuk.ton({f:300, f2:500, t:.2, typ:'square', hlas:.12});
}
function odpalMvala(){
  mval.stav = 'leti'; mval.vx = nah(-200,200); mval.vy = -1100;
  const odmena = 25;
  penize += odmena; vydelano += odmena;
  popisek(mval.x, mval.y - 30, 'PING! 🚀 +' + odmena + ' $', '#7fffb2', 26);
  if (mval.bricho.length){
    popisek(mval.x, mval.y - 60, 'Bleee! Vrací ' + mval.bricho.length + ' kuliček', '#fff', 18);
    for (const k of mval.bricho) zasobnik.push(k);
    mval.bricho = [];
  }
  bum(mval.x, mval.y, '#fff', 30, 400);
  zatres(10);
  zvuk.ton({f:1500, f2:3000, t:.25, typ:'sine', hlas:.2});
  zvuk.ton({f:200, f2:1200, t:.4, typ:'square', hlas:.1});
}
function mvalKrok(dt){
  if (!mval){
    mvalCasovac -= dt;
    if (mvalCasovac <= 0) novyMval();
    return;
  }
  if (mval.stav === 'leti'){
    mval.x += mval.vx*dt; mval.y += mval.vy*dt; mval.rot += 12*dt;
    if (mval.y < -80){ mval = null; mvalCasovac = nah(8, 13) * (1 - casHry/DELKA_KOLA*0.4); }
    return;
  }
  // cíl: kulička nízko, nejvyšší úroveň má přednost
  let nejlepsi = null, skoreCile = -1;
  for (const k of koule){
    if (k.y < 220) continue;
    const s = k.y + k.uroven * 60;
    if (s > skoreCile){ skoreCile = s; nejlepsi = k; }
  }
  const rychlost = 100 + casHry * 1.2;
  if (nejlepsi){
    mval.cil = nejlepsi.x + nejlepsi.vx * .25;
  } else {
    mval.cuchani -= dt;
    if (mval.cuchani <= 0){ mval.cil = nah(60, 660); mval.cuchani = nah(1, 2.5); }
  }
  const dx = omez(mval.cil, 30, 690) - mval.x;
  const krok = Math.sign(dx) * Math.min(Math.abs(dx), rychlost*dt);
  mval.x += krok;
  if (Math.abs(krok) > .1) mval.smer = Math.sign(krok);
  for (const k of koule){
    if (!k.pryc && Math.hypot(k.x - mval.x, k.y - (mval.y - 8)) < 26 + k.r*.5){
      k.pryc = true;
      if (!k.klon) mval.bricho.push(k);
      popisek(mval.x, mval.y - 40, k.uroven >= 3 ? 'Ta drahá je nejlepší! 😋' : nahZ(HLASKY_MVAL), '#ffb3b3', 18);
      zvuk.ton({f:220, f2:110, t:.12, typ:'square', hlas:.12});
      bum(k.x, k.y, '#ccc', 6, 120);
    }
  }
}

// ============ HLAVNÍ KROK ============
function zaplat(zisk, x, y, barva, vel){
  zisk *= nasobekPenez() * nasobekZnovu();
  penize += zisk; vydelano += zisk;
  popisek(x, y, '+' + zisk, barva, vel);
}

function krok(dt){
  casHry += dt;
  mezernikCD -= dt;

  const rychlostK = 380;
  if (klavesy.ArrowLeft  || klavesy.KeyA){ kurzor.x -= rychlostK*dt; kurzor.videt = true; }
  if (klavesy.ArrowRight || klavesy.KeyD){ kurzor.x += rychlostK*dt; kurzor.videt = true; }
  if (klavesy.ArrowUp    || klavesy.KeyW){ kurzor.y -= rychlostK*dt; kurzor.videt = true; }
  if (klavesy.ArrowDown  || klavesy.KeyS){ kurzor.y += rychlostK*dt; kurzor.videt = true; }
  kurzor.x = omez(kurzor.x, 0, Š); kurzor.y = omez(kurzor.y, 0, V);

  kohoutekX = 370 + Math.sin(casHry * .9) * 270;
  casDoKoule -= dt;
  if (casDoKoule <= 0){ vypust(kohoutekX); casDoKoule = intervalKoule(); }

  const pocetKlonu = koule.filter(k => k.klon).length;
  for (const k of koule){
    k.zivot += dt; k.cd -= dt; k.posledniT -= dt;
    k.pop = Math.max(0, (k.pop||0) - dt*3);
    k.vy += 700 * dt;
    const rych = Math.hypot(k.vx, k.vy);
    if (rych > 900){ k.vx *= 900/rych; k.vy *= 900/rych; }
    if (efekty.magnet > 0 && k.y > 250) k.vx += (360 - k.x) * 2.2 * dt;     // magnet táhne k jackpotu
    k.x += k.vx * dt; k.y += k.vy * dt;
    if (k.x < PLOCHA.x1 + k.r){ k.x = PLOCHA.x1 + k.r; k.vx = Math.abs(k.vx) * .7; }
    if (k.x > PLOCHA.x2 - k.r){ k.x = PLOCHA.x2 - k.r; k.vx = -Math.abs(k.vx) * .7; }
    const nasobek = UROVNE[k.uroven].nasobek;
    const barvaK = UROVNE[k.uroven].barva === 'duha' ? '#ffffff' : UROVNE[k.uroven].barva;

    for (const v of veci){
      const dx = k.x - v.x, dy = k.y - v.y;
      const d = Math.hypot(dx, dy) || .01, min = k.r + v.r;
      if (d >= min) continue;
      if (v.typ === 'split'){
        if (k.cd <= 0 && !k.klon && pocetKlonu < MAX_KLONU){
          k.cd = .8;
          koule.push({ ...k, klon: true, vx: -k.vx + nah(-40,40), vy: k.vy * .8, cd: .8,
                       zivot: 0, posledni: null, pop: 1 });
          k.vx += nah(-40, 40);
          v.pop = 1;
          popisek(v.x, v.y - 25, 'Dvojče!', '#7ae7ff', 16);
          zvuk.ton({f:700, f2:1400, t:.1, typ:'sine', hlas:.12});
        }
        continue;
      }
      const nx = dx/d, ny = dy/d;
      k.x = v.x + nx*min; k.y = v.y + ny*min;
      const vn = k.vx*nx + k.vy*ny;
      if (vn < 0){
        const typ = (efekty.jednorozec > 0 && v.typ === 'kolik') ? 'hvezda' : v.typ;
        const e = VECI[typ].odraz;
        k.vx -= (1+e)*vn*nx; k.vy -= (1+e)*vn*ny;
        k.vx += nah(-25, 25);
        if (typ === 'hvezda'){
          const r2 = Math.hypot(k.vx, k.vy);
          if (r2 < 380){ k.vx = k.vx/(r2||1)*380; k.vy = k.vy/(r2||1)*380; }
        }
        if (vn < -60 && (k.posledni !== v || k.posledniT <= 0)){
          k.posledni = v; k.posledniT = .15;
          v.pop = 1;
          const zisk = VECI[typ].penize * nasobek;
          zaplat(zisk, v.x, v.y - 18, k.uroven ? barvaK : '#b7ffb7', typ === 'hvezda' ? 22 : 15 + Math.min(k.uroven, 5));
          if (typ === 'hvezda'){
            bum(v.x, v.y, '#ffe066', 10, 220);
            if (Math.random() < .15) popisek(v.x, v.y - 45, nahZ(['BOING!','PINK!','ŠUP!']), '#fff', 20);
            zvuk.ton({f:900, f2:1600, t:.08, typ:'square', hlas:.08});
          } else {
            bum(k.x, k.y, barvaK, 3 + k.uroven, 120);
            cink(PENTA[omez(Math.floor((480 - v.y) / 45) + Math.min(k.uroven,2), 0, PENTA.length-1)]);
          }
        }
      }
    }
    // koše dole
    if (k.y > PLOCHA.dno + 10 && !k.pryc){
      const i = omez(Math.floor((k.x - PLOCHA.x1) / SIRKA_KOSE), 0, KOSE.length-1);
      const kos = KOSE[i];
      const zisk = kos.hodnota * nasobek;
      kos.blik = 1;
      const stredX = PLOCHA.x1 + SIRKA_KOSE*(i + .5);
      if (kos.hodnota >= 25){
        zaplat(zisk, stredX, 468, '#ffd700', 26);
        popisek(stredX, 440, 'JACKPOT!', '#ffd700', 24);
        bum(stredX, 500, '#ffd700', 30, 350); zatres(4 + Math.min(k.uroven, 5) * 2);
        zvuk.vyhra();
      } else {
        zaplat(zisk, stredX, 478, kos.barva === '#8338ec' ? '#d9b8ff' : '#a8ccff', 20);
        bum(k.x, 505, kos.barva, 8, 150);
        zvuk.sber();
      }
      doZasobniku(k);
    }
    // zaseklá kulička se po 14 s vrátí nahoru
    if (k.zivot > 14 && !k.pryc){ bum(k.x, k.y, '#aaa', 8, 100); popisek(k.x, k.y-15, 'hop nahoru', '#aaa', 14); doZasobniku(k); }
  }
  koule = koule.filter(k => !k.pryc);
  for (const k of zasobnik) k.pop = Math.max(0, (k.pop||0) - dt*3);

  for (const v of veci) v.pop = Math.max(0, v.pop - dt*5);
  for (const kos of KOSE) kos.blik = Math.max(0, (kos.blik||0) - dt*3);

  mvalKrok(dt);

}

// ============ KRESLENÍ ============
function zaoblenyObdelnik(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function kresliPlochu(){
  const g = ctx.createLinearGradient(0, 0, 0, V);
  g.addColorStop(0, '#1b2a4a'); g.addColorStop(1, '#2a1b3d');
  ctx.fillStyle = g;
  ctx.fillRect(PLOCHA.x1, 0, PLOCHA.x2 - PLOCHA.x1, V);
  { const t = performance.now() / 1000;                    // světla a hvězdičky na desce
    for (let k = 0; k < 2; k++){ const x = 360 + Math.sin(t * .3 + k * 3) * 280, y = 250 + Math.cos(t * .25 + k) * 150;
      const gs = ctx.createRadialGradient(x, y, 5, x, y, 240); gs.addColorStop(0, 'rgba(120,160,255,.12)'); gs.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gs; ctx.fillRect(PLOCHA.x1, 0, PLOCHA.x2 - PLOCHA.x1, V); }
    for (let k = 0; k < 18; k++) jiskra(PLOCHA.x1 + (k * 139) % 690, 60 + (k * 97) % 400, 2.5, (Math.sin(t * 2 + k) + 1) / 4); }
  const gz = ctx.createLinearGradient(0, 0, PLOCHA.x1, 0); gz.addColorStop(0, '#2b3558'); gz.addColorStop(1, '#6b7ab0');
  ctx.fillStyle = gz; ctx.fillRect(0, 0, PLOCHA.x1, V);
  const gz2 = ctx.createLinearGradient(PLOCHA.x2, 0, PLOCHA.x2 + 12, 0); gz2.addColorStop(0, '#6b7ab0'); gz2.addColorStop(1, '#2b3558');
  ctx.fillStyle = gz2; ctx.fillRect(PLOCHA.x2, 0, 12, V);
  for (let i = 0; i < KOSE.length; i++){
    const kos = KOSE[i], x = PLOCHA.x1 + i*SIRKA_KOSE;
    ctx.globalAlpha = .55 + (kos.blik||0) * .45;
    lesklaKarta(x + 4, PLOCHA.dno + 2, SIRKA_KOSE - 8, V - PLOCHA.dno + 10, 12, odstin(kos.barva, .1), odstin(kos.barva, -.45), { stin: false, lesk: .3 });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const s = 1 + (kos.blik||0) * .4;
    ctx.font = `bold ${Math.round(22*s)}px Rajdhani, system-ui, sans-serif`;
    ctx.fillText((kos.hodnota >= 25 ? '💰 ' : '') + kos.hodnota + ' $', x + SIRKA_KOSE/2, 515);
  }
  ctx.fillStyle = '#c9d3f5';
  for (let i = 1; i < KOSE.length; i++) ctx.fillRect(PLOCHA.x1 + i*SIRKA_KOSE - 3, PLOCHA.dno - 8, 6, V);
}

function kresliKohoutek(){
  ctx.fillStyle = '#6c7aa8';
  ctx.fillRect(PLOCHA.x1, 0, PLOCHA.x2 - PLOCHA.x1, 14);
  // čekající kuličky v trubce
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let x = 20;
  for (const k of zasobnik.slice(0, 18)){
    kresliKouliNa(x + 6, 7, k, 5.5 / k.r);
    x += 14;
  }
  if (zasobnik.length > 18){ ctx.font = 'bold 11px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText('+' + (zasobnik.length - 18), x, 8); }

  ctx.save();
  ctx.translate(kohoutekX, 0);
  ctx.fillStyle = '#9aa7d6';
  zaoblenyObdelnik(-18, 8, 36, 34, 6); ctx.fill();
  ctx.fillStyle = '#2b3150';
  ctx.fillRect(-9, 36, 18, 10);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '20px serif';
  ctx.fillText('💰', 0, 24);
  ctx.restore();
  if (zasobnik.length){
    const pod = 1 - Math.max(0, casDoKoule) / intervalKoule();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(kohoutekX - 18, 48, 36, 4);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(kohoutekX - 18, 48, 36 * pod, 4);
  }
}

function kresliVec(v){
  const s = 1 + v.pop * .35;
  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.scale(s, s);
  if (v.typ === 'kolik' && efekty.jednorozec > 0){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '26px serif';
    ctx.fillText('🌟', 0, 2);
  } else if (v.typ === 'kolik'){
    // lesklý kolík se stínem
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(2, 4, v.r, 0, TAU); ctx.fill();
    const gk = ctx.createRadialGradient(-v.r * .35, -v.r * .4, 1, 0, 0, v.r);
    gk.addColorStop(0, '#dbe9ff'); gk.addColorStop(.35, '#4f8cff'); gk.addColorStop(1, '#1e3fa8');
    ctx.fillStyle = gk; ctx.beginPath(); ctx.arc(0, 0, v.r, 0, TAU); ctx.fill();
    if (v.pop > 0){ ctx.globalAlpha = v.pop; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, v.r + 4, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  } else {
    if (v.typ === 'split') ctx.rotate(performance.now()/300);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = (v.r*2 + 4) + 'px serif';
    ctx.fillText(v.typ === 'hvezda' ? '⭐' : '🌀', 0, 2);
  }
  ctx.restore();
}

function kresliKouliNa(x, y, k, meritko = 1){
  const u = UROVNE[k.uroven];
  const r = k.r * meritko * (1 + (k.pop||0) * .6);
  ctx.save();
  if (k.klon) ctx.globalAlpha = .55;
  let g;
  if (u.barva === 'duha'){
    g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    const posun = (performance.now() / 600) % 1;
    ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff595e'].forEach((c, i) => g.addColorStop((i/5 + posun) % 1, c));
  } else {
    g = ctx.createRadialGradient(x - r*.35, y - r*.35, 1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, u.barva);
  }
  if (k.uroven >= 4 && meritko === 1){            // drahé kuličky svítí
    ctx.shadowColor = u.barva === 'duha' ? '#fff' : u.barva;
    ctx.shadowBlur = 12;
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  if (u.tvar && meritko === 1){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = Math.round(r * 1.5) + 'px serif';
    ctx.fillText(u.tvar, x, y + 1);
  }
  ctx.restore();
}

function kresliMvala(){
  if (!mval) return;
  ctx.save();
  ctx.translate(mval.x, mval.y);
  if (mval.stav === 'leti') ctx.rotate(mval.rot);
  else ctx.translate(0, Math.abs(Math.sin(performance.now()/90)) * -4);
  ctx.scale(mval.smer, 1);
  const tloustka = 1 + Math.min(mval.bricho.length, 8) * .06;   // čím víc snědl, tím je tlustší
  ctx.scale(tloustka, 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '40px serif';
  ctx.fillText('🦝', 0, 0);
  ctx.restore();
  if (mval.stav === 'chodi' && mval.bricho.length){
    ctx.font = 'bold 13px Rajdhani, system-ui, sans-serif';
    ctx.fillStyle = '#ffb3b3'; ctx.textAlign = 'center';
    ctx.fillText('v bříšku: ' + mval.bricho.length, mval.x, mval.y - 30);
  }
}

function kresliKurzor(){
  if (stav !== 'hra' || !kurzor.videt) return;
  const x = kurzor.x, y = kurzor.y;
  if (x > PLOCHA.x2 || x < PLOCHA.x1) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (mval && mval.stav === 'chodi' && Math.hypot(x - mval.x, y - mval.y) < 40){
    ctx.font = 'bold 16px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#7fffb2';
    ctx.fillText('KLIKNI = odpálit! 🚀', x, y - 34);
    return;
  }
  const k = kulickaPod(x, y);
  if (k){
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r + 6, 0, Math.PI*2); ctx.stroke();
    ctx.font = 'bold 14px Rajdhani, system-ui, sans-serif';
    if (k.uroven >= UROVNE.length - 1){ ctx.fillStyle = '#ffd166'; ctx.fillText('👑 MAX', k.x, k.y - k.r - 16); }
    else {
      const cena = cenaVylepseni(k.uroven);
      ctx.fillStyle = penize >= cena ? '#b7ffb7' : '#ff8a8a';
      ctx.fillText('⬆️ ' + cena + ' $ → ' + UROVNE[k.uroven+1].tvar, k.x, k.y - k.r - 16);
    }
    return;
  }
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.stroke();
}

function kresliObchod(){

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = 'bold 30px Rajdhani, system-ui, sans-serif';

    ctx.globalAlpha = muze ? 1 : .45;
    ctx.textAlign = 'center';
    ctx.font = '28px serif';
    ctx.fillText(p.ikona, 757, y + 35);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px Rajdhani, system-ui, sans-serif';
    ctx.fillText((i+1) + '. ' + p.nazev, 782, y + 20);
    ctx.font = '12px Rajdhani, system-ui, sans-serif';
    ctx.fillStyle = '#aab';
    ctx.fillText(p.popis, 782, y + 40);
    ctx.font = 'bold 14px Rajdhani, system-ui, sans-serif';
    ctx.fillStyle = muze ? '#b7ffb7' : '#ff8a8a';
    ctx.fillText(naMax ? 'MAX!' : nic ? 'všechny 👑' : fmt(cena) + ' $', 782, y + 58, 160);
    if (p.max != null && p.id !== 'nova'){
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 12px Rajdhani, system-ui, sans-serif';

    }

  // tlačítko domů
  const naDomu = kurzor.x > 728 && kurzor.y > 488;
  lesklaKarta(728, 490, 224, 42, 14, naDomu ? '#ffd43b' : '#ffb000', '#b36b00', { nad: naDomu });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Rajdhani, system-ui, sans-serif';
  ctx.fillText('🏠 Hlavní stránka', 840, 511);
}

function titul(v){

  if (v < 6000)    return ['Boháč s cylindrem', '🎩'];

  if (v < 100000)  return ['KRÁL VŠECH PENĚZ', '👑'];

}

function prekryv(radky){
  ctx.fillStyle = 'rgba(0,0,0,.65)';

  ctx.clearRect(0, 0, Š, vyska());

      ['Tvůj titul:', 22, '#aab', 305],
      [ik + ' ' + t + ' ' + ik, 32, '#b7ffb7', 345],

}

// 20 políček na způsoby vydělávání. Zatím je hotové jen první: Kuličky.
const POLICKA = 20, SL = 5, PW = 170, PH = 84, MEZERA = 12;
function polickoRect(i){
  const rada = Math.floor(i / SL), sloupec = i % SL;
  const vRade = rada < 3 ? SL : POLICKA - 3*SL;          // poslední řada má 4 políčka
  const sirkaRady = vRade * PW + (vRade - 1) * MEZERA;
  const x0 = (Š - sirkaRady) / 2;
  return { x: x0 + sloupec * (PW + MEZERA), y: 134 + rada * (PH + MEZERA), w: PW, h: PH };
}
const uvnitr = (b, r) => b.x >= r.x && b.x <= r.x + r.w && b.y >= r.y && b.y <= r.y + r.h;

function otevriKulicky(){
  if (!hraZacla){ zacniHru(); hraZacla = true; }
  stav = 'hra';
  zmenVelikost(); scrollTo(0, 0);
  zvuk.klik();
}
function jdiDomu(){ stav = 'domov'; zmenVelikost(); scrollTo(0, 0); batoh.novych = 0; zvuk.klik(); }

function klikDomov(x, y){
  if (kolo.otevrene){ klikKolo(x, y); return; }
  if (klikMince(x, y) || klikDest(x, y) || klikChodec(x, y)) return;
  if (x > 915 && y > 110 && y < 134){ prepniZvuk(); return; }
  if (uvnitr({x, y}, TL_TEMATA)){ otevriObrazovku('temata'); return; }
  if (uvnitr({x, y}, TL_STATY)){ otevriObrazovku('statistiky'); return; }
  if (uvnitr({x, y}, TL_SBIRKA)){ otevriObrazovku('sbirka'); return; }
  if (uvnitr({x, y}, TL_MEDAILE)){ otevriObrazovku('medaile'); return; }
  if (Math.hypot(x - 58, y - 56) < 46 || (x > 90 && x < 200 && y > 30 && y < 84)){ otevriVejce(); return; }   // vajíčka vlevo nahoře
  if (Math.hypot(x - 900, y - 58) < 46){ otevriKolo(); return; }
  if (uvnitr({x, y}, spodniRect(0))){ otevriBatoh(); return; }       // batoh
  if (uvnitr({x, y}, spodniRect(1))){ otevriObrazovku('banka'); return; }   // banka
  for (let i = 2; i < 5; i++) if (uvnitr({x, y}, spodniRect(i))){ otevriObrazovku(SPODNI_NOVE[i - 2].stav); return; }
  if (uvnitr({x, y}, polickoRect(0))){ otevriKulicky(); return; }
  for (let i = 1; i <= DALSI_POLICKA.length; i++) if (uvnitr({x, y}, polickoRect(i))){ otevriObrazovku(DALSI_POLICKA[i - 1].stav); return; }
  for (let i = DALSI_POLICKA.length + 1; i < POLICKA; i++){
    const r = polickoRect(i);
    if (uvnitr({x, y}, r)){ popisek(r.x + r.w/2, r.y + r.h/2, 'Tady zatím nic není!', '#aab', 16); zvuk.chyba(); return; }
  }
}

function kresliVajickoVRohu(){
  const t = performance.now() / 1000, cx = 58, cy = 56;
  const nad = Math.hypot(kurzor.x - cx, kurzor.y - cy) < 46 || (kurzor.x > 90 && kurzor.x < 200 && kurzor.y > 30 && kurzor.y < 84);
  // záře
  const z = ctx.createRadialGradient(cx, cy, 5, cx, cy, 50);
  z.addColorStop(0, 'rgba(255,209,102,.45)'); z.addColorStop(1, 'rgba(255,209,102,0)');
  ctx.fillStyle = z; ctx.beginPath(); ctx.arc(cx, cy, 50, 0, TAU); ctx.fill();
  kresliVajicko(cx, cy, nad ? .85 : .75, VEJCE[Math.floor(t / 1.5) % VEJCE.length], Math.sin(t * (nad ? 14 : 5)) * .12);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 20px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = nad ? '#ffe08a' : '#ffd166';
  ctx.fillText('Vajíčka', 100, 56);
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#7fffb2';
  ctx.fillText(pocetMazlicku() ? '🐾 +' + fmtS(prijemMazlicku()) + ' $/s' : 'KLIKNI!', cx, cy + 50);
}

const TL_SBIRKA = { x: 196, y: 70, w: 100, h: 40 }, TL_MEDAILE = { x: 664, y: 70, w: 100, h: 40 };
function kresliMaleTlacitko(r, text, pocet, c1, c2){
  const nad = uvnitr(kurzor, r);
  ctx.save(); ctx.translate(r.x + r.w/2, r.y + r.h/2); if (nad) ctx.scale(1.07, 1.07);
  const g = ctx.createLinearGradient(0, -r.h/2, 0, r.h/2); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; zaoblenyObdelnik(-r.w/2, -r.h/2, r.w, r.h, 10); ctx.fill();

  ctx.font = 'bold 11px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#fff4d6'; ctx.fillText(pocet, 0, 10);
  ctx.restore();
}

function kresliDomov(){
  kresliPozadiDomova();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const t = performance.now() / 1000;
  kresliTitul();

  ctx.font = 'bold 24px Rajdhani, system-ui, sans-serif';

  { const txt = fmt(penize) + ' $' + (pocetMazlicku() ? '   🐾 +' + fmtS(prijemMazlicku()) + ' $/s' : '');
    ctx.font = '800 24px Rajdhani, system-ui, sans-serif'; const w = Math.min(360, ctx.measureText(txt).width);
    kresliMinciIkonu(Š/2 - w/2 - 18, 87, 13, t * 1.5);

  kresliMaleTlacitko(TL_SBIRKA, '📖 Sbírka', sbirka.size + '/' + VSECHNO_DO_SBIRKY.length, '#c9a25a', '#6b4a1e');
  kresliMaleTlacitko(TL_MEDAILE, '🏅 Medaile', ziskaneMedaile.size + '/' + MEDAILE.length, '#ffd166', '#a87400');

  ctx.textAlign = 'right'; ctx.font = '18px serif'; ctx.fillStyle = '#fff';

  ctx.textAlign = 'center'; ctx.fillText('🎨', TL_TEMATA.x + 14, 122); ctx.fillText('📊', TL_STATY.x + 14, 122);
  kresliUroven();
  kresliVajickoVRohu();
  kresliMaleKolo();
  kresliEfekty(Š/2, 121, true);
  if (stastna.cas > 0) napis('🎉 2× ' + Math.ceil(stastna.cas) + ' s', 850, 150, 13, '#ff85c0');
  ctx.textAlign = 'center';

  for (let i = 0; i < POLICKA; i++){
    const r = polickoRect(i);
    if (i === 0){
      kresliDalsiPolicko({ nazev: 'Kuličky', barvy: ['#4f8cff', '#6a2fd6'], popis: () => hraZacla ? vsechnyKulicky().length + ' kuliček' : 'klikni a hraj!',
        kresliIkonu: (x, y, t) => kresliKouliNa(x, y - Math.abs(Math.sin(t * 4)) * 6, { uroven: 3, r: 15, pop: 0 }) }, r, t, 0);
    } else if (i >= 1 && i <= DALSI_POLICKA.length){
      kresliDalsiPolicko(DALSI_POLICKA[i - 1], r, t, i);
    } else if (i === -1){
      const nad = uvnitr(kurzor, r);
      const s = nad ? 1.05 : 1 + Math.sin(t * 3 + 1) * .015;
      ctx.save();
      ctx.translate(r.x + r.w/2, r.y + r.h/2); ctx.scale(s, s);
      const gg = ctx.createLinearGradient(0, -r.h/2, 0, r.h/2);
      gg.addColorStop(0, '#ffb347'); gg.addColorStop(1, '#e0569b');
      ctx.fillStyle = gg;
      zaoblenyObdelnik(-r.w/2, -r.h/2, r.w, r.h, 14); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = nad ? '#ffd166' : 'rgba(255,255,255,.5)'; ctx.stroke();
      kresliVajicko(-52, 4, .5, VEJCE[Math.floor(t / 1.5) % VEJCE.length], Math.sin(t * 6) * .12);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Rajdhani, system-ui, sans-serif';
      ctx.fillText('Vajíčka', 22, -12);
      ctx.font = 'bold 13px Rajdhani, system-ui, sans-serif';
      ctx.fillStyle = '#fff0c8';
      ctx.fillText(pocetMazlicku() ? '+' + fmtS(prijemMazlicku()) + ' $/s' : 'od 5 $ do milionu!', 22, 16);
      ctx.restore();
    } else {
      ctx.setLineDash([8, 6]);
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.18)';
      zaoblenyObdelnik(r.x, r.y, r.w, r.h, 14); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 20px Rajdhani, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillText(i + 1, r.x + r.w/2, r.y + r.h/2);
    }
  }
  kresliSpodniRadu();
  kresliChodce(); kresliDest(); kresliMinci();
  if (kolo.otevrene) kresliVelkeKolo();
  efektyKresli();
}

const nasobekPenez = () => (efekty.x2 > 0 ? 2 : 1) * (efekty.x5 > 0 ? 5 : 1);

function dejPenize(kolik){ const k = vyhraZa({ vyhra: kolik }); penize += k; vydelano += k; return '+' + k + ' $'; }
function vylepsiKulicku(k, o = 1){
  if (!k) return;
  k.uroven = Math.min(UROVNE.length - 1, k.uroven + o); k.r = polomer(k.uroven); k.pop = 1;
}
function nahodnyKolik(){ const k = veci.filter(v => v.typ === 'kolik' && v.y > 150); return k.length ? nahZ(k) : null; }
const CENY = {

  pytel:      { ikona: '💰', nazev: 'Pytel peněz',        akce: () => dejPenize(60) },

const vylKola = { stesti: 0, rychlost: 0, vyhry: 0 };
const VYLEPSENI_KOLA = [
  { id: 'stesti',   ikona: '🍀', nazev: 'Štěstí',         popis: 'vzácné dílky jsou větší',   max: 999, cena: l => Math.round(100 * Math.pow(2.2, l)) },
  { id: 'rychlost', ikona: '⏱️', nazev: 'Rychlejší kolo', popis: 'točíš dřív znova',           max: 999, cena: l => Math.round(80 * Math.pow(2, l)) },
  { id: 'vyhry',    ikona: '💰', nazev: 'Větší výhry',    popis: 'peníze z kola o půlku víc',    max: 999, cena: l => Math.round(150 * Math.pow(2.3, l)) },
];
let CELKEM_VAHA = 0;
function prepocitejKolo(){
  // se štěstím rostou vzácné dílky (čím vzácnější, tím víc)
  for (let i = 0; i < VZACNOSTI.length; i++) VZACNOSTI[i].w = VZACNOSTI[i].vaha * Math.pow(1 + .05 * vylKola.stesti, i);
  CELKEM_VAHA = VZACNOSTI.reduce((s, v) => s + v.w, 0);
  let a = 0; for (const v of VZACNOSTI){ v.a0 = a; a += v.w / CELKEM_VAHA * Math.PI * 2; v.a1 = a; }
}
prepocitejKolo();
const pauzaKola = () => Math.max(6, Math.round(60 * Math.pow(.85, vylKola.rychlost)));
const vyhraZa = v => Math.round(v.vyhra * (1 + .5 * vylKola.vyhry) * nasobekZnovu());   // peněžní ceny
const KOLO = { cx: 320, cy: 292, r: 186 };
const kolo = { otevrene: false, rot: 0, toci: false, zacRot: 0, cilRot: 0, t0: 0, T: 4.5,
               pristi: 0, vysledek: null, vysledekT: 0, segment: -1, vybrany: 0, panel: 'vyhry' };
const TAU = Math.PI * 2;

function koloPripraveno(){ return performance.now() >= kolo.pristi && !kolo.toci; }
function zbyvaSekund(){ return Math.max(0, Math.ceil((kolo.pristi - performance.now()) / 1000)); }
function segmentNahore(rot){
  const a = (((-Math.PI/2 - rot) % TAU) + TAU) % TAU;
  return VZACNOSTI.findIndex(v => a >= v.a0 && a < v.a1);
}

function otevriKolo(){ kolo.otevrene = true; zvuk.klik(); }
function zavriKolo(){ if (!kolo.toci){ kolo.otevrene = false; zvuk.klik(); } }

function roztoc(){
  if (kolo.toci) return;
  if (!koloPripraveno()){ popisek(750, 485, 'Počkej ještě ' + zbyvaSekund() + ' s!', '#ffb3b3', 18); zvuk.chyba(); return; }
  let los = Math.random() * CELKEM_VAHA, i = 0;
  while (i < VZACNOSTI.length - 1 && los >= VZACNOSTI[i].w){ los -= VZACNOSTI[i].w; i++; }
  const v = VZACNOSTI[i], w = v.a1 - v.a0;
  const u = v.a0 + w * nah(.2, .8);
  let cil = -Math.PI/2 - u;
  while (cil < kolo.rot + TAU * 6) cil += TAU;
  Object.assign(kolo, { toci: true, zacRot: kolo.rot, cilRot: cil, t0: performance.now(), vybrany: i, vysledek: null });
  zvuk.ton({ f: 300, f2: 900, t: .3, typ: 'square', hlas: .1 });
}

function vyhraKola(i){
  const v = VZACNOSTI[i];
  const id = nahZ(v.ceny); staty.kolo++;
  kolo.vysledekCena = id;
  doBatohu(id);
  const pen = vyhraZa(v);
  penize += pen; vydelano += pen;

  else if (i >= 3) zvuk.vyhra();
  else zvuk.sber();
}

function koloKrok(){
  if (!kolo.toci) return;
  const p = Math.min(1, (performance.now() - kolo.t0) / 1000 / kolo.T);
  const e = 1 - Math.pow(1 - p, 4);                     // na konci pěkně zpomaluje
  kolo.rot = kolo.zacRot + (kolo.cilRot - kolo.zacRot) * e;
  const s = segmentNahore(kolo.rot);
  if (s !== kolo.segment){ kolo.segment = s; zvuk.ton({ f: 1100 + s * 60, t: .03, typ: 'square', hlas: .05 }); }
  if (p >= 1){ kolo.toci = false; vyhraKola(kolo.vybrany); }
}

function vyplnDilku(v, cx, cy, r){
  if (v.barva !== 'vesmir') return v.barva;
  const g = ctx.createRadialGradient(cx, cy, r * .2, cx, cy, r);
  g.addColorStop(0, '#2a0f5c'); g.addColorStop(.6, '#5b2bd6'); g.addColorStop(1, '#00e5ff');
  return g;
}

function kresliKolo(cx, cy, r, rot, sNapisy){
  const t = performance.now() / 1000;
  for (let i = 0; i < VZACNOSTI.length; i++){
    const v = VZACNOSTI[i];
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, rot + v.a0, rot + v.a1); ctx.closePath();
    ctx.fillStyle = vyplnDilku(v, cx, cy, r); ctx.fill();
    ctx.lineWidth = sNapisy ? 2 : 1; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke();
    if (v.barva === 'vesmir'){                            // hvězdičky v galaktickém dílku
      for (let h = 0; h < 5; h++){
        const a = rot + v.a0 + (v.a1 - v.a0) * ((h * .37 + .15) % 1);
        const rr = r * (.45 + ((h * .29) % .5));
        ctx.globalAlpha = .5 + .5 * Math.sin(t * 5 + h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(cx + Math.cos(a) * rr - 1, cy + Math.sin(a) * rr - 1, 2.5, 2.5);
      }
      ctx.globalAlpha = 1;
    }
    if (sNapisy){
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(rot + (v.a0 + v.a1) / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const maly = v.vaha < 7;
      ctx.font = `bold ${maly ? 12 : 15}px Rajdhani, system-ui, sans-serif`;
      ctx.fillStyle = v.jmeno === 'Legendary' ? '#3a2a00' : '#fff';
      ctx.fillText(v.jmeno, r - 10, 0);
      ctx.restore();
    }
  }
  // střed
  ctx.beginPath(); ctx.arc(cx, cy, r * .2, 0, TAU);
  const g = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, r * .2);
  g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#e0a800');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
}

function kresliVajicko(cx, cy, s, v, rot = 0, praskliny = 0){

  ctx.bezierCurveTo(38, 38, 20, 50, 0, 50);
  ctx.bezierCurveTo(-20, 50, -38, 38, -38, 14);
  ctx.bezierCurveTo(-38, 0, -30, -46, 0, -46);
  ctx.closePath();
  const g = ctx.createRadialGradient(-12, -18, 4, 0, 0, 58);
  g.addColorStop(0, v.barvy[0]); g.addColorStop(1, v.barvy[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke();

  for (const [x, y, r] of [[-16,-10,5],[14,4,7],[-6,24,6],[20,-24,4],[-24,16,4],[6,-32,3]]){
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();

  const zlata = Math.random() < bankomat.zlato * .05;

  penize += kolik; vydelano += kolik;
  bankomat.bankovky.push({ x: BANKOMAT.x + BANKOMAT.w/2 + nah(-20, 20), y: BANKOMAT.y + 250, vx: nah(-160, 160), vy: nah(-420, -250),

    popisek(BANKOMAT.x + BANKOMAT.w/2 + nah(-40, 40), BANKOMAT.y + 60, '+' + fmt(kolik), zlata ? '#ffd700' : '#b7ffb7', zlata ? 30 : 22);

    else zvuk.ton({ f: 1200 + Math.random() * 300, t: .05, typ: 'square', hlas: .08 });

function bankomatKrok(dt){
  // automatické klikání běží pořád — mimo obrazovku jen přičítá peníze
  if (stav === 'bankomat' && bankomat.auto > 0){
    bankomat.autoCas += dt * bankomat.auto;
    while (bankomat.autoCas >= 1){ bankomat.autoCas -= 1; klikBankomat(true); }
  } else if (bankomat.auto > 0){
    const p = prijemBankomatu() * dt; penize += p; vydelano += p;
  }
  bankomat.stisk = Math.max(0, bankomat.stisk - dt * 6);
  bankomat.tvarCas -= dt; if (bankomat.tvarCas <= 0) bankomat.tvar = '😃';
  bankomat.hlaskaCas -= dt;
  for (const b of bankomat.bankovky){ b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt; b.zivot -= dt; }
  bankomat.bankovky = bankomat.bankovky.filter(b => b.zivot > 0 && b.y < V + 40);
}

// ============ 🎰 AUTOMAT NA MINCE ============
const SYMBOLY = [
  { s: '🍒', w: 30, x3: 5 }, { s: '🍋', w: 25, x3: 8 }, { s: '🔔', w: 18, x3: 12 }, { s: '⭐', w: 12, x3: 25 },
  { s: '💎', w: 8, x3: 60 }, { s: '7️⃣', w: 5, x3: 150 }, { s: '🌌', w: 2, x3: 777 },
];
const SAZKY = [10, 100, 1000, 10000, 100000];
const automat = { sazka: 0, toci: false, valce: [0, 1, 2], cil: [0, 0, 0], stop: [0, 0, 0], t0: 0, posun: [0, 0, 0], vysledek: '', vyhra: 0, vysledekCas: 0, svetla: 0 };
function losujSymbol(){
  let los = Math.random() * SYMBOLY.reduce((a, b) => a + b.w, 0), i = 0;
  while (los >= SYMBOLY[i].w){ los -= SYMBOLY[i].w; i++; }
  return i;
}
function zatocAutomat(){
  if (automat.toci) return;
  const sazka = SAZKY[automat.sazka];
  if (penize < sazka){ popisek(310, 440, 'Málo peněz na sázku! 😭', '#ff6b6b', 20); zvuk.chyba(); return; }
  penize -= sazka;
  automat.toci = true; automat.t0 = performance.now();
  automat.cil = [losujSymbol(), losujSymbol(), losujSymbol()];
  automat.stop = [false, false, false];
  automat.vysledek = ''; automat.vyhra = 0;
  zvuk.ton({ f: 200, f2: 600, t: .25, typ: 'sawtooth', hlas: .08 });
}
function automatKrok(dt){
  automat.svetla += dt;
  automat.vysledekCas -= dt;
  if (!automat.toci) return;
  const t = (performance.now() - automat.t0) / 1000;
  for (let i = 0; i < 3; i++){
    if (automat.stop[i]) continue;
    if (t > .8 + i * .45){
      automat.stop[i] = true; automat.valce[i] = automat.cil[i]; automat.posun[i] = 0;
      zvuk.ton({ f: 300 + i * 100, t: .08, typ: 'square', hlas: .12 });
    } else {
      automat.posun[i] += dt * 18;
      if (automat.posun[i] >= 1){ automat.posun[i] -= 1; automat.valce[i] = (automat.valce[i] + 1) % SYMBOLY.length; }
    }
  }
  if (automat.stop.every(Boolean)){
    automat.toci = false;
    const [a, b, c] = automat.cil, sazka = SAZKY[automat.sazka];
    let nasob = 0;
    if (a === b && b === c) nasob = SYMBOLY[a].x3;
    else if (a === b || b === c || a === c) nasob = 1;
    automat.vyhra = sazka * nasob;
    penize += automat.vyhra; if (nasob > 1) vydelano += automat.vyhra - sazka;
    automat.vysledekCas = 3;
    if (nasob >= 100){ automat.vysledek = 'MEGA JACKPOT!!! 🤯'; zatres(14); bum(310, 250, '#ffd700', 60, 500); zvuk.vyhra(); setTimeout(() => zvuk.vyhra(), 400); setTimeout(() => zvuk.vyhra(), 800); }
    else if (nasob > 1){ automat.vysledek = 'VÝHRA ×' + nasob + '!'; zatres(4 + Math.min(8, nasob / 5)); bum(310, 250, '#ffd166', 30, 350); zvuk.vyhra(); }
    else if (nasob === 1){ automat.vysledek = 'Sázka zpátky 😅'; zvuk.sber(); }
    else { automat.vysledek = nahZ(['Nic... 🙃', 'Vedle! 😬', 'Příště to vyjde!', 'Automat se směje 😏']); zvuk.chyba(); }
  }
}
function klikAutomat(x, y){
  if (naZpet(x, y)){ jdiDomu(); return; }
  for (let i = 0; i < SAZKY.length; i++){
    const r = { x: 656, y: 110 + i * 56, w: 282, h: 48 };
    if (uvnitr({x, y}, r) && !automat.toci){ automat.sazka = i; zvuk.klik(); return; }
  }
  if ((x > 60 && x < 560 && y > 100 && y < 420) || (x > 656 && x < 938 && y > 400 && y < 470)) zatocAutomat();
}

    const pos = automat.posun[i];

  }
  // výsledek

  if (automat.vysledekCas > 0 && automat.vysledek){

    if (automat.vyhra > 0){ ctx.font = 'bold 20px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#b7ffb7'; ctx.fillText('+' + fmt(automat.vyhra) + ' $', 0, 30); }

  } else if (!automat.toci){
    ctx.font = 'bold 20px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#ffe9a8';
    ctx.fillText('Klikni nebo zmáčkni mezerník!', x0 + 240, y0 + 272);
  }
  // páka
  const paka = automat.toci ? Math.max(0, 1 - (performance.now() - automat.t0) / 300) : 0;
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x0 + 490, y0 + 170); ctx.lineTo(x0 + 520, y0 + 170 - 90 + paka * 150); ctx.stroke();
  ctx.fillStyle = '#ff3b5c'; ctx.beginPath(); ctx.arc(x0 + 520, y0 + 170 - 90 + paka * 150, 16, 0, TAU); ctx.fill();
  // výplaty
  ctx.textAlign = 'center'; ctx.font = '14px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#ffd9e6';
  ctx.fillText('Tři stejné obrázky = výhra! 🍀', 310, 468);
  // sázky vpravo
  ctx.textAlign = 'left'; ctx.font = 'bold 22px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#ffd166';
  ctx.fillText('💰 Kolik vsadíš?', 656, 84);
  for (let i = 0; i < SAZKY.length; i++){
    const r = { x: 656, y: 110 + i * 56, w: 282, h: 48 }, vyb = automat.sazka === i, muze = penize >= SAZKY[i];
    ctx.fillStyle = vyb ? '#ffd166' : uvnitr(kurzor, r) ? '#3a3f5c' : '#262a40';
    zaoblenyObdelnik(r.x, r.y, r.w, r.h, 12); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = 'bold 20px Rajdhani, system-ui, sans-serif';
    ctx.fillStyle = vyb ? '#3a2a00' : muze ? '#fff' : '#ff8a8a';
    ctx.fillText((i + 1) + '.  ' + fmt(SAZKY[i]) + ' $', r.x + r.w/2, r.y + 25);
  }
  const muze = penize >= SAZKY[automat.sazka] && !automat.toci;
  ctx.fillStyle = muze ? (uvnitr(kurzor, { x: 656, y: 400, w: 282, h: 70 }) ? '#ff5c7a' : '#ff3b5c') : '#553040';
  zaoblenyObdelnik(656, 400, 282, 70, 16); ctx.fill();
  ctx.textAlign = 'center'; ctx.font = 'bold 28px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(automat.toci ? 'Točí se...' : 'TOČIT! 🎰', 797, 436);

// ============ 🏭 TOVÁRNA ============
// Po pásu jezdí výrobky. Klikni na ně a zabalíš je do krabice = peníze. Co spadne z pásu, je rozbité.
const VYROBKY = [
  { i: '🧸', nazev: 'Plyšák', cena: 5 }, { i: '🎮', nazev: 'Ovladač', cena: 25 }, { i: '📱', nazev: 'Mobil', cena: 120 },
  { i: '💻', nazev: 'Počítač', cena: 600 }, { i: '🚗', nazev: 'Auto', cena: 3000 }, { i: '🚀', nazev: 'Raketa', cena: 15000 },
  { i: '🛸', nazev: 'Létající talíř', cena: 80000 },
];
const tovarna = { rychlost: 0, vyrobek: 0, roboti: 0, veci: [], letici: [], casDoVeci: 0, robotCas: [], posun: 0 };
const PAS = { x1: 20, x2: 560, y: 300 };
const rychlostPasu = () => Math.min(420, 90 * (1 + .25 * tovarna.rychlost));
const intervalVeci = () => Math.max(.12, 1.3 / (1 + .3 * tovarna.rychlost));
const vyrobekTed = () => VYROBKY[Math.min(tovarna.vyrobek, VYROBKY.length - 1)];
const cenaVyrobku = () => vyrobekTed().cena * Math.pow(3, Math.max(0, tovarna.vyrobek - VYROBKY.length + 1)) * nasobekZnovu();
const prijemTovarny = () => tovarna.roboti * .5 * cenaVyrobku();         // mimo obrazovku: každý robot 1 věc za 2 s
function zabal(v, robot = false){
  v.pryc = true; staty.zabaleno++;
  const kolik = cenaVyrobku() * (v.zlata ? 5 : 1);
  penize += kolik; vydelano += kolik;
  tovarna.letici.push({ x: v.x, y: v.y, t: 0, i: v.i, zlata: v.zlata });
  popisek(v.x, v.y - 34, '+' + fmt(kolik), v.zlata ? '#ffd700' : '#b7ffb7', v.zlata ? 24 : 18);
  if (!robot){ bum(v.x, v.y, v.zlata ? '#ffd700' : '#ffe9a8', 10, 180); zvuk.sber(); }
  else zvuk.ton({ f: 700, t: .05, typ: 'triangle', hlas: .06 });
}
function tovarnaKrok(dt){
  if (stav !== 'tovarna'){
    if (tovarna.roboti > 0){ const p = prijemTovarny() * dt; penize += p; vydelano += p; }
    return;
  }
  tovarna.posun = (tovarna.posun + rychlostPasu() * dt) % 40;
  tovarna.casDoVeci -= dt;
  if (tovarna.casDoVeci <= 0){
    tovarna.casDoVeci = intervalVeci();
    tovarna.veci.push({ x: PAS.x1 - 10, y: PAS.y - 26, i: vyrobekTed().i, zlata: Math.random() < .05, pad: 0, vy: 0, pop: 0 });
  }
  for (const v of tovarna.veci){
    if (v.pad){ v.vy += 1200 * dt; v.y += v.vy * dt; v.x += 60 * dt; if (v.y > V + 40) v.pryc = true; continue; }
    v.x += rychlostPasu() * dt;
    if (v.x > PAS.x2){
      v.pad = 1; v.vy = -100;
      popisek(PAS.x2 + 20, PAS.y - 60, nahZ(['Plesk! 💥', 'Rozbité! 😱', 'Škoda!', 'Ups!']), '#ff8a8a', 18);
      zvuk.ton({ f: 180, f2: 60, t: .2, typ: 'sawtooth', hlas: .1 });
    }
  }
  // roboti: každý hlídá svoje místo na pásu a chytí věc, co jede kolem
  while (tovarna.robotCas.length < tovarna.roboti) tovarna.robotCas.push(0);
  const ramen = Math.min(6, tovarna.roboti), perioda = 2 * ramen / Math.max(1, tovarna.roboti);
  for (let r = 0; r < ramen; r++){
    tovarna.robotCas[r] -= dt;
    const rx = robotX(r);
    if (tovarna.robotCas[r] <= 0){
      const v = tovarna.veci.find(v => !v.pryc && !v.pad && Math.abs(v.x - rx) < 22);
      if (v){ zabal(v, true); tovarna.robotCas[r] = perioda; }
    }
  }
  for (const l of tovarna.letici) l.t += dt * 1.8;
  tovarna.letici = tovarna.letici.filter(l => l.t < 1);
  tovarna.veci = tovarna.veci.filter(v => !v.pryc);
}
const robotX = r => PAS.x2 - 40 - r * 80;
const VYL_TOVARNA = [
  { ikona: '🏃', nazev: 'Rychlejší pás',  popis: () => 'víc věcí za minutu', cena: () => Math.round(50 * Math.pow(2, tovarna.rychlost)), lvl: () => tovarna.rychlost, max: 999, kup: () => tovarna.rychlost++, hlaska: 'Vžum! 🏃' },
  { ikona: '⬆️', nazev: 'Lepší výrobky',  popis: () => tovarna.vyrobek < VYROBKY.length - 1 ? 'další: ' + VYROBKY[tovarna.vyrobek + 1].i + ' ' + VYROBKY[tovarna.vyrobek + 1].nazev : 'ještě dražší ' + VYROBKY[VYROBKY.length - 1].i + ' (3× víc)', cena: () => Math.round(150 * Math.pow(6, tovarna.vyrobek)), lvl: () => tovarna.vyrobek, max: 999, kup: () => tovarna.vyrobek++, hlaska: 'Nový výrobek! ✨' },
  { ikona: '🤖', nazev: 'Robot balič',    popis: () => 'balí za tebe, i když jsi pryč', cena: () => Math.round(200 * Math.pow(3, tovarna.roboti)), lvl: () => tovarna.roboti, max: 999, kup: () => tovarna.roboti++, hlaska: 'Robot nastoupil! 🤖' },
];
function kupTovarna(i){ const u = VYL_TOVARNA[i]; zkusKoupit(i, u.cena(), u.lvl(), u.max, u.kup, u.hlaska); }
function klikTovarna(x, y){
  if (naZpet(x, y)){ jdiDomu(); return; }
  for (let i = 0; i < 3; i++) if (uvnitr({x, y}, kartaRect(i))){ kupTovarna(i); return; }
  let nej = null, nd = 50;
  for (const v of tovarna.veci){ if (v.pad) continue; const d = Math.hypot(v.x - x, v.y - y); if (d < nd){ nd = d; nej = v; } }
  if (nej) zabal(nej);
}
function kresliTovarnu(){
  kresliPozadi('#2b2f3a', '#161922');
  const t = performance.now() / 1000;
  ctx.save();
  if (otres > 0) ctx.translate(nah(-otres, otres), nah(-otres, otres));
  kresliNadpis('🏭 Továrna', 110);
  ctx.textAlign = 'left'; ctx.font = 'bold 20px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('💵 ' + fmt(penize) + ' $', 310, 40);
  // okna a trubky na zdi
  for (let i = 0; i < 4; i++){ ctx.fillStyle = 'rgba(255,230,150,.08)'; ctx.fillRect(40 + i * 140, 80, 90, 60); }
  ctx.fillStyle = '#555c6b'; ctx.fillRect(0, 170, 620, 10);

  ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.fillText('⚙️', 35, PAS.y - 55);
  ctx.save(); ctx.translate(35, PAS.y - 55); ctx.rotate(t * 3); ctx.restore();
  // pás
  ctx.fillStyle = '#2a2d36'; ctx.fillRect(PAS.x1, PAS.y, PAS.x2 - PAS.x1, 22);
  ctx.fillStyle = '#4a4f5c';
  for (let x = PAS.x1 - 40 + tovarna.posun; x < PAS.x2; x += 40) if (x > PAS.x1) ctx.fillRect(x, PAS.y + 3, 18, 16);
  for (let x = PAS.x1 + 10; x < PAS.x2; x += 60){ ctx.fillStyle = '#777'; ctx.beginPath(); ctx.arc(x, PAS.y + 30, 7, 0, TAU); ctx.fill(); }
  // roboti
  for (let r = 0; r < Math.min(6, tovarna.roboti); r++){
    const rx = robotX(r), hybe = (tovarna.robotCas[r] || 0) > .3;
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 5;

    ctx.font = '30px serif'; ctx.fillText('🤖', rx, 196);
  }
  // výrobky
  for (const v of tovarna.veci){
    const nad = !v.pad && Math.hypot(kurzor.x - v.x, kurzor.y - v.y) < 50;
    ctx.save(); ctx.translate(v.x, v.y); if (v.pad) ctx.rotate(v.vy / 300);
    const s = nad ? 1.2 : 1; ctx.scale(s, s);
    if (v.zlata){ ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 18; }
    ctx.font = '42px serif'; ctx.fillText(v.i, 0, 0);
    ctx.restore();
  }
  // krabice a letící věci
  const kx = 300, ky = 440;
  ctx.font = '70px serif'; ctx.fillText('📦', kx, ky + Math.sin(t * 4) * 2);
  for (const l of tovarna.letici){
    const x = l.x + (kx - l.x) * l.t, y = l.y + (ky - l.y) * l.t - Math.sin(l.t * Math.PI) * 120;
    ctx.globalAlpha = 1 - l.t * .5;
    ctx.font = (42 - l.t * 20) + 'px serif'; ctx.fillText(l.i, x, y);
  }
  ctx.globalAlpha = 1;
  // koš na konci
  ctx.font = '40px serif'; ctx.fillText('🗑️', PAS.x2 + 30, 470);
  ctx.font = 'bold 15px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#b7ffb7';
  ctx.fillText(vyrobekTed().i + ' = ' + fmt(cenaVyrobku()) + ' $' + (tovarna.roboti ? '   🤖 +' + fmtS(prijemTovarny()) + ' $/s' : ''), 300, 500);
  ctx.font = '13px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#9ab';
  ctx.fillText('klikni na věc na pásu a zabal ji! (mezerník = ta nejdál)', 300, 524);
  ctx.textAlign = 'left'; ctx.font = 'bold 22px Rajdhani, system-ui, sans-serif'; ctx.fillStyle = '#ffd166';
  ctx.fillText('⬆️ Vylepšení', 652, 56);
  VYL_TOVARNA.forEach((u, i) => kresliKartu(i, u.ikona, u.nazev, u.popis(), u.cena(), u.lvl(), u.max));
  efektyKresli();
  ctx.restore();
  kresliZpet();
}

// ============ 👑 ZNOVUZROZENÍ ============
const cenaZnovuzrozeni = () => 10000000 * Math.pow(10, znovuzrozeni);
let znovuPotvrdit = 0, znovuZablesk = 0;
function znovuzrodSe(){
  if (penize < cenaZnovuzrozeni()){ popisek(Š/2, 400, 'Ještě nemáš dost peněz! 😅', '#ff8a8a', 22); zvuk.chyba(); return; }
  if (znovuPotvrdit <= 0){ znovuPotvrdit = 3; zvuk.klik(); return; }
  znovuPotvrdit = 0;
  znovuzrozeni++;
  // všechno od nuly…
  penize = 20; vydelano = 0; hraZacla = false;
  koule = []; zasobnik = []; urovenRychle = 0; pocetKouli = 3;

const DRACI = ['🐉', '🐲', '🦖', '👹', '🐙', '👾', '🦑', '🐊'];
const drak = { uroven: 1, hp: 0, mec: 0, rytiri: 0, krit: 0, cas: 30, zasah: 0, smrt: 0, rytirCas: 0 };
const maxHpDraka = () => Math.round(60 * Math.pow(1.7, drak.uroven - 1));
const silaMece = () => 1 + drak.mec;
const odmenaDraka = () => Math.round(150 * Math.pow(1.55, drak.uroven - 1)) * nasobekZnovu();
const prijemDraka = () => drak.rytiri * silaMece() * .5 / maxHpDraka() * odmenaDraka();

function udeř(rytir = false){
  if (drak.smrt > 0) return;
  let dmg = silaMece() * (rytir ? .5 : 1);
  if (!rytir && Math.random() < drak.krit * .05){ dmg *= 5; popisek(360, 150, 'KRITICKÝ ZÁSAH! ⚡', '#ffd166', 26); zatres(8); }

// 6. 💎 SPOJOVAČKA — prohazuj drahokamy, spoj 3 stejné a více!
// ---------------------------------------------------------------
const SP_N = 8, SP_B = 54, SP_X = 60, SP_Y = 82;
const DRAHOKAMY = ['💎', '🍓', '🍋', '🍀', '🔮', '🟠'];
const spj = { pole: [], posun: [], vybrany: -1, zamek: 0, tahy: 30, body: 0, kombo: 0, konec: false, odmena: 0, rekord: 0, trepani: -1, trepCas: 0 };
function spNahodny(){ return Math.floor(Math.random() * DRAHOKAMY.length); }
function noveSpojovani(){
  do { spj.pole = Array.from({ length: SP_N * SP_N }, spNahodny); } while (najdiShody().length);
  spj.posun = spj.pole.map(() => 0); Object.assign(spj, { vybrany: -1, zamek: 0, tahy: 30, body: 0, kombo: 0, konec: false });
}
function najdiShody(){
  const shoda = new Set();
  for (let r = 0; r < SP_N; r++) for (let s = 0; s < SP_N; s++){
    const i = r * SP_N + s, v = spj.pole[i]; if (v < 0) continue;
    if (s <= SP_N - 3 && spj.pole[i + 1] === v && spj.pole[i + 2] === v){ let k = s; while (k < SP_N && spj.pole[r * SP_N + k] === v){ shoda.add(r * SP_N + k); k++; } }
    if (r <= SP_N - 3 && spj.pole[i + SP_N] === v && spj.pole[i + 2 * SP_N] === v){ let k = r; while (k < SP_N && spj.pole[k * SP_N + s] === v){ shoda.add(k * SP_N + s); k++; } }
  }
  return [...shoda];
}
function spVyres(){                     // odstraní shody, nechá spadnout, doplní — a znovu, dokud jsou kombo
  const shody = najdiShody();
  if (!shody.length){ spj.kombo = 0; if (spj.tahy <= 0) spKonec(); return; }
  spj.kombo++;
  const zisk = odmena(shody.length * 2 * spj.kombo * (shody.length >= 5 ? 3 : shody.length >= 4 ? 2 : 1));
  spj.body += zisk; dej(zisk);
  for (const i of shody){ bum(SP_X + (i % SP_N) * SP_B + 27, SP_Y + Math.floor(i / SP_N) * SP_B + 27, '#fff', 5, 150); spj.pole[i] = -1; }
  if (spj.kombo >= 2) popisek(SP_X + 216, SP_Y + 200, 'KOMBO ×' + spj.kombo + '!', '#ffd166', 28);
  zvuk.ton({ f: 500 + spj.kombo * 120, f2: 900 + spj.kombo * 120, t: .12, typ: 'triangle', hlas: .12 });
  for (let s = 0; s < SP_N; s++){
    let dolu = SP_N - 1;
    for (let r = SP_N - 1; r >= 0; r--){
      const i = r * SP_N + s;
      if (spj.pole[i] >= 0){ const cil = dolu * SP_N + s; if (cil !== i){ spj.pole[cil] = spj.pole[i]; spj.posun[cil] = (dolu - r) * SP_B; spj.pole[i] = -1; } dolu--; }
    }
    for (let r = dolu; r >= 0; r--){ const i = r * SP_N + s; spj.pole[i] = spNahodny(); spj.posun[i] = (dolu + 1) * SP_B + 20; }
  }
  spj.zamek = .35;
}
function spKonec(){ spj.konec = true; spj.rekord = Math.max(spj.rekord, spj.body); zvuk.vyhra(); }
function spProhod(a, b){
  [spj.pole[a], spj.pole[b]] = [spj.pole[b], spj.pole[a]];
  if (najdiShody().length){ spj.tahy--; spj.kombo = 0; spVyres(); }
  else { [spj.pole[a], spj.pole[b]] = [spj.pole[b], spj.pole[a]]; spj.trepani = a; spj.trepCas = .3; zvuk.chyba(); }
}
noveSpojovani();
OBR.spojovacka = {
  nazev: 'Spojovačka', ikona: '💎', barvy: ['#cc5de8', '#5f1a7a'], hudba: 'domov',
  popis: () => spj.rekord ? 'rekord ' + fmt(spj.rekord) + ' $' : 'spoj 3 stejné!',
  krok(dt){
    for (let i = 0; i < spj.posun.length; i++) spj.posun[i] = Math.max(0, spj.posun[i] - dt * 900);

  },
  klik(x, y){

    if (spj.konec || spj.zamek > 0) return;
    const s = Math.floor((x - SP_X) / SP_B), r = Math.floor((y - SP_Y) / SP_B);
    if (s < 0 || s >= SP_N || r < 0 || r >= SP_N) return;
    const i = r * SP_N + s;
    if (spj.vybrany < 0){ spj.vybrany = i; zvuk.klik(); return; }

    spj.vybrany = -1;

  },
  klavesa(e){ if (e.code === 'Enter') noveSpojovani(); },
  kresli(){
    hlavicka('💎 Spojovačka', '#2a0f3a', '#0f0514');
    const t = performance.now() / 1000;
    ctx.fillStyle = 'rgba(255,255,255,.06)'; zaoblenyObdelnik(SP_X - 8, SP_Y - 8, SP_N * SP_B + 16, SP_N * SP_B + 16, 14); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(SP_X - 8, SP_Y - 8, SP_N * SP_B + 16, SP_N * SP_B + 16); ctx.clip();
    spj.pole.forEach((v, i) => {

      if ((r + s) % 2){ ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(SP_X + s * SP_B, SP_Y + r * SP_B, SP_B, SP_B); }
      if (v < 0) return;
      const vyb = spj.vybrany === i, tres = spj.trepani === i && spj.trepCas > 0 ? Math.sin(t * 60) * 5 : 0;
      if (vyb){ ctx.fillStyle = 'rgba(255,209,102,.35)'; zaoblenyObdelnik(SP_X + s * SP_B + 3, SP_Y + r * SP_B + 3, SP_B - 6, SP_B - 6, 10); ctx.fill(); }
      ctx.save(); ctx.translate(x + tres, y); const sc = vyb ? 1.12 + Math.sin(t * 8) * .05 : 1; ctx.scale(sc, sc);
      ctx.font = '38px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(DRAHOKAMY[v], 0, 2);
      ctx.restore();
    });
    ctx.restore();
    panelVpravo('💎 Spojovačka', ['Klikni na dva sousední', 'drahokamy = prohodí se.', '3 stejné v řadě zmizí!', '4 = 2× víc   5 = 3× víc', '', 'Tahů zbývá: ' + spj.tahy, 'Vyděláno: ' + fmt(spj.body) + ' $', 'rekord: ' + fmt(spj.rekord) + ' $']);
    tlacitko(TL_HRAT, '♻️ Nová hra', '#9c36b5', '#cc5de8', 20);
    if (spj.konec) vysledekOkno({ x: 90, y: 200, w: 400, h: 150 }, [['💎 Tahy došly!', 26, '#ffd166'], ['Celkem jsi vydělal ' + fmt(spj.body) + ' $', 18, '#fff']]);
    paticka();
  },

const prijemVeci = u => .15 * Math.pow(3.1, u) * nasobekZnovu();

function odstin(hex, o){
  if (!hex || hex[0] !== '#' || hex.length < 7) return hex;

  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(c => c.toString(16).padStart(2, '0')).join('');
}
