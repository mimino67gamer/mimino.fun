<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VLNA — 1000 levelů</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b12;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;}
  #obal{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{background:#12131c;max-width:100%;max-height:100%;
    aspect-ratio:16/9;touch-action:none;display:block;border-radius:8px;}
</style>
</head>
<body>
<div id="obal"><canvas id="platno"></canvas></div>
<script>
// ============ ZÁKLAD ============
const Š = 960, V = 540;
const platno = document.getElementById('platno');
const ctx = platno.getContext('2d');

function zmenVelikost(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  platno.width  = Š * dpr;
  platno.height = V * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
}
addEventListener('resize', zmenVelikost);
zmenVelikost();

// ============ ZVUK ============
const zvuk = (() => {
  let a = null, zapnuto = true, hudbaTimer = null;
  function audio(){
    if (!a) a = new (window.AudioContext || window.webkitAudioContext)();
    if (a.state === 'suspended') a.resume();
    return a;
  }
  function ton({f=440, f2=null, t=.15, typ='square', hlas=.15, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const o = c.createOscillator(), g = c.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f, z);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), z + t);
    g.gain.setValueAtTime(.0001, z);
    g.gain.exponentialRampToValueAtTime(hlas, z + .01);
    g.gain.exponentialRampToValueAtTime(.0001, z + t);
    o.connect(g); g.connect(c.destination);
    o.start(z); o.stop(z + t + .05);
  }
  function sum({t=.2, hlas=.2, filtr=1200, kdy=0} = {}){
    if (!zapnuto) return;
    const c = audio(), z = c.currentTime + kdy;
    const n = Math.max(1, Math.floor(c.sampleRate * t));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtr;
    const g = c.createGain(); g.gain.value = hlas;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(z);
  }
  function nota(jmeno){
    const z = {C:0, D:2, E:4, F:5, G:7, A:9, B:11, H:11};
    const m = /^([A-H])(#|b)?(-?\d)$/.exec(jmeno);
    if (!m) return 440;
    const p = z[m[1]] + (m[2]==='#' ? 1 : m[2]==='b' ? -1 : 0) + (+m[3]+1)*12;
    return 440 * Math.pow(2, (p - 69) / 12);
  }
  return {
    ton, sum, nota,
    tichoZapni(){ zapnuto = !zapnuto; if (!zapnuto) this.hudbaStop(); return zapnuto; },
    jeZapnuto(){ return zapnuto; },
    klik:   () => ton({f:600, f2:900, t:.05, hlas:.1}),
    tik:    () => ton({f:520, f2:760, t:.03, typ:'square', hlas:.045}),
    sber:   () => { ton({f:880, t:.07, typ:'triangle', hlas:.18});
                    ton({f:1320, t:.09, typ:'triangle', hlas:.14, kdy:.06}); },
    vybuch: () => { sum({t:.5, hlas:.35, filtr:600});
                    ton({f:120, f2:30, t:.4, typ:'sawtooth', hlas:.2}); },
    prapor: () => [784,1047].forEach((f,i) =>
                    ton({f, t:.12, typ:'triangle', hlas:.16, kdy:i*.09})),
    chyba:  () => { ton({f:180, t:.1, typ:'square', hlas:.15});
                    ton({f:130, t:.2, typ:'square', hlas:.15, kdy:.1}); },
    zrychli:() => ton({f:400, f2:1400, t:.25, typ:'sawtooth', hlas:.16}),
    zpomal: () => ton({f:1200, f2:300, t:.3, typ:'sawtooth', hlas:.14}),
    portal: () => { ton({f:300, f2:1200, t:.18, typ:'sine', hlas:.18});
                    ton({f:1200, f2:300, t:.18, typ:'sine', hlas:.14, kdy:.08}); },
    strela: () => ton({f:1000, f2:220, t:.09, typ:'sawtooth', hlas:.12}),
    au:     () => { ton({f:260, f2:120, t:.22, typ:'square', hlas:.2}); sum({t:.2, filtr:900}); },
    start:  () => [523,659,784].forEach((f,i) =>
                    ton({f, t:.1, typ:'triangle', hlas:.15, kdy:i*.08})),
    vyhra:  () => [523,659,784,1047,1319].forEach((f,i) =>
                    ton({f, t:.2, typ:'triangle', hlas:.18, kdy:i*.13})),
    prd:    () => { ton({f:90, f2:55, t:.28, typ:'sawtooth', hlas:.22});
                    sum({t:.25, hlas:.12, filtr:300}); },
    // hudba s vrstvami: melodie + bicí + basa. Čím těsnější chodba, tím ostřejší.
    hudbaHraj(noty, tempo = 120, typ = 'triangle', hlas = .045, bici = 0, oktava = 0){
      this.hudbaStop();
      if (!zapnuto) return;
      const krok = 60 / tempo / 2;
      let i = 0;
      hudbaTimer = setInterval(() => {
        const n = noty[i % noty.length];
        if (n){
          const f = (typeof n === 'string' ? nota(n) : n) * Math.pow(2, oktava);
          ton({ f, t: krok*.9, typ, hlas });
        }
        if (bici >= 1 && i % 4 === 0) sum({ t:.09, hlas:.13, filtr:190 });        // kopák
        if (bici >= 2 && i % 4 === 2) sum({ t:.05, hlas:.09, filtr:5200 });       // činel
        if (bici >= 3 && i % 2 === 1) ton({ f:70, f2:45, t:.07, typ:'sawtooth', hlas:.10 }); // basa
        i++;
      }, krok * 1000);
    },
    hudbaStop(){ if (hudbaTimer) { clearInterval(hudbaTimer); hudbaTimer = null; } }
  };
})();

// ============ POMOCNÍCI ============
const nah  = (a,b) => a + Math.random()*(b-a);
const omez = (v,a,b) => Math.max(a, Math.min(b, v));

function emoji(znak, x, y, velikost=44, uhel=0, meritko=1, pruhlednost=1){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(uhel); ctx.scale(meritko, meritko);
  ctx.globalAlpha = pruhlednost;
  ctx.font = velikost + 'px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(znak, 0, 0);
  ctx.restore();
}
// náhoda, která je pro každý level vždycky stejná
function kostka(seed){
  let a = seed >>> 0;
  return function(){
    a += 0x6D2B79F5; let t = a;
    t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61);
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

// ============ KRESLÍCÍ NÁSTROJE (všechno kreslíme, žádné ikony) ============
function zare(barva, sila, co){
  ctx.save(); ctx.shadowColor = barva; ctx.shadowBlur = sila; co(); ctx.restore();
}
function cestaHvezda(x, y, r1, r2, hrotu, uhel){
  ctx.beginPath();
  for (let i=0;i<hrotu*2;i++){
    const a = uhel + i*Math.PI/hrotu, r = (i%2 ? r2 : r1);
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function cestaSrdce(x, y, r){
  ctx.beginPath();
  ctx.moveTo(x, y + r*0.8);
  ctx.bezierCurveTo(x - r*1.4, y - r*0.3, x - r*0.55, y - r*1.2, x, y - r*0.35);
  ctx.bezierCurveTo(x + r*0.55, y - r*1.2, x + r*1.4, y - r*0.3, x, y + r*0.8);
  ctx.closePath();
}
function cestaDiamant(x, y, r){
  ctx.beginPath();
  ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.8, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r*0.8, y);
  ctx.closePath();
}
function cestaBlesk(x, y, r){
  ctx.beginPath();
  ctx.moveTo(x+r*0.15, y-r); ctx.lineTo(x-r*0.6, y+r*0.12); ctx.lineTo(x-r*0.05, y+r*0.12);
  ctx.lineTo(x-r*0.3, y+r); ctx.lineTo(x+r*0.6, y-r*0.16); ctx.lineTo(x+r*0.02, y-r*0.16);
  ctx.closePath();
}
function cestaPilka(x, y, r, uhel, zubu = 9){
  ctx.beginPath();
  for (let i=0;i<zubu;i++){
    const a0 = uhel + i*2*Math.PI/zubu, a1 = a0 + Math.PI/zubu*0.62, a2 = a0 + Math.PI/zubu;
    const b0 = a0 + 2*Math.PI/zubu - Math.PI/zubu*0.38;
    i ? ctx.lineTo(x+Math.cos(a0)*r, y+Math.sin(a0)*r) : ctx.moveTo(x+Math.cos(a0)*r, y+Math.sin(a0)*r);
    ctx.lineTo(x+Math.cos(a1)*r*1.32, y+Math.sin(a1)*r*1.32);
    ctx.lineTo(x+Math.cos(a2)*r, y+Math.sin(a2)*r);
    ctx.lineTo(x+Math.cos(b0)*r, y+Math.sin(b0)*r);
  }
  ctx.closePath();
}
// oči, které koukají na hráče — z tvaru je hned živá potvora
function kresliOci(x, y, r, cilX, cilY, poc = 2){
  const d = Math.hypot(cilX - x, cilY - y) || 1;
  const ox = (cilX - x)/d * r*0.16, oy = (cilY - y)/d * r*0.16;
  for (let i=0;i<poc;i++){
    const px = x + (poc === 1 ? 0 : (i ? r*0.34 : -r*0.34));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(px, y - r*0.1, r*0.26, r*0.3, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#14121f';
    ctx.beginPath(); ctx.arc(px + ox, y - r*0.1 + oy, r*0.14, 0, 6.3); ctx.fill();
  }
}
function kresliPotvoru(x, y, r, barva, cilX, cilY, cas){
  ctx.save();
  const puls = 1 + Math.sin(cas*4)*0.06;
  ctx.translate(x, y); ctx.scale(puls, 1/puls);
  zare(barva, 16, () => {
    ctx.fillStyle = barva;
    cestaHvezda(0, 0, r*1.15, r*0.82, 9, cas*0.6);
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.arc(0, 0, r*0.72, 0, 6.3); ctx.fill();
  ctx.restore();
  kresliOci(x, y, r, cilX, cilY);
}
function kresliSrdicko(x, y, r, plne){
  ctx.lineWidth = 2;
  cestaSrdce(x, y, r);
  ctx.fillStyle = plne ? '#ff4757' : 'rgba(255,255,255,.12)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
}
function kresliPohar(x, y, r){
  ctx.save(); ctx.translate(x, y); ctx.scale(r/16, r/16);
  ctx.lineWidth = 2; ctx.strokeStyle = '#8a5a00';
  const g = ctx.createLinearGradient(-10,-14,10,14);
  g.addColorStop(0,'#ffe680'); g.addColorStop(.5,'#ffc300'); g.addColorStop(1,'#e09b00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-10,-14); ctx.lineTo(10,-14); ctx.lineTo(8,-2);
  ctx.quadraticCurveTo(0, 10, -8, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10,-11); ctx.quadraticCurveTo(-19,-6,-9,-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 10,-11); ctx.quadraticCurveTo( 19,-6, 9,-2); ctx.stroke();
  ctx.fillStyle = '#e09b00';
  ctx.fillRect(-2, 6, 4, 6); ctx.fillRect(-7, 11, 14, 4);
  ctx.restore();
}
function kresliZamek(x, y, r){
  ctx.save(); ctx.translate(x, y); ctx.scale(r/10, r/10);
  ctx.strokeStyle = '#e8e8ff'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(0, -4, 4.6, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.roundRect(-7, -2, 14, 11, 2.5); ctx.fill();
  ctx.fillStyle = '#8a5a00';
  ctx.beginPath(); ctx.arc(0, 3.5, 1.8, 0, 6.3); ctx.fill();
  ctx.restore();
}
function kresliFajfku(x, y, r, barva='#7bed9f'){
  ctx.save(); ctx.strokeStyle = barva; ctx.lineWidth = r*0.42;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r*0.55, y); ctx.lineTo(x - r*0.1, y + r*0.5); ctx.lineTo(x + r*0.6, y - r*0.5);
  ctx.stroke(); ctx.restore();
}
function kresliDemona(x, y, r, cilX, cilY, cas){
  ctx.save(); ctx.translate(x, y + Math.sin(cas*3)*r*0.06);
  // rohy
  ctx.fillStyle = '#8b2f5a';
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(s*r*0.52, -r*0.62); ctx.lineTo(s*r*0.9, -r*1.22); ctx.lineTo(s*r*0.24, -r*0.86);
    ctx.closePath(); ctx.fill();
  }
  zare('#c77dff', 18, () => {
    const g = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.2, 0, 0, r);
    g.addColorStop(0,'#e35d9a'); g.addColorStop(1,'#8b1f57');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r*0.8, 0, 6.3); ctx.fill();
  });
  ctx.restore();
  kresliOci(x, y + Math.sin(cas*3)*r*0.06 - r*0.1, r*0.9, cilX, cilY);
  // úsměv
  ctx.save(); ctx.translate(x, y + Math.sin(cas*3)*r*0.06);
  ctx.strokeStyle = '#3a0f26'; ctx.lineWidth = Math.max(2, r*0.09); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, r*0.16, r*0.4, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.restore();
}
function kresliZvukIkonu(zx, zy){
  ctx.fillStyle = zvuk.jeZapnuto() ? '#fff' : 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.moveTo(zx-8, zy-4); ctx.lineTo(zx-3, zy-4); ctx.lineTo(zx+3, zy-11);
  ctx.lineTo(zx+3, zy+11); ctx.lineTo(zx-3, zy+4); ctx.lineTo(zx-8, zy+4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (zvuk.jeZapnuto()){
    ctx.beginPath(); ctx.arc(zx+5, zy, 7, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(zx+5, zy, 12, -0.9, 0.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(zx+8, zy-6); ctx.lineTo(zx+18, zy+6);
    ctx.moveTo(zx+18, zy-6); ctx.lineTo(zx+8, zy+6); ctx.stroke();
  }
}
function kresliSipkuBrany(x, y, r, dozadu, barva){
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = barva;
  const s = dozadu ? -1 : 1;
  for (const o of [-r*0.5, r*0.15]){
    ctx.beginPath();
    ctx.moveTo(o - s*r*0.3, -r*0.55); ctx.lineTo(o + s*r*0.42, 0); ctx.lineTo(o - s*r*0.3, r*0.55);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ============ ŠŤÁVA ============
let castice = [], otres = 0, popisky = [], zablesk = 0, pulz = 0;
function bum(x, y, barva='#ffd166', kolik=14, sila=260){
  for (let i=0;i<kolik;i++){
    const a = nah(0, Math.PI*2), r = nah(sila*0.25, sila);
    castice.push({x, y, vx:Math.cos(a)*r, vy:Math.sin(a)*r,
                  zivot:nah(.35,.9), max:.9, barva, vel:nah(3,8),
                  uhel:nah(0,6.3), rot:nah(-8,8)});
  }
}
function zatres(sila){ otres = Math.max(otres, sila); }
function popisek(x, y, text, barva='#fff'){ popisky.push({x, y, text, barva, zivot:1}); }
function efektyKrok(dt){
  for (const c of castice){ c.x += c.vx*dt; c.y += c.vy*dt; c.vy += 420*dt; c.zivot -= dt; c.uhel += c.rot*dt; }
  castice = castice.filter(c => c.zivot > 0);
  for (const p of popisky){ p.y -= 46*dt; p.zivot -= dt*1.4; }
  popisky = popisky.filter(p => p.zivot > 0);
  otres = Math.max(0, otres - dt*40);
  zablesk = Math.max(0, zablesk - dt*3);
}
function efektyKresli(){
  for (const c of castice){
    ctx.save(); ctx.globalAlpha = Math.max(0, c.zivot/c.max);
    ctx.translate(c.x - kamera, c.y); ctx.rotate(c.uhel);
    ctx.fillStyle = c.barva; ctx.fillRect(-c.vel/2, -c.vel/2, c.vel, c.vel*0.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.font = 'bold 22px system-ui';
  for (const p of popisky){
    ctx.globalAlpha = Math.min(1, p.zivot);
    ctx.fillStyle = p.barva; ctx.fillText(p.text, p.x - kamera, p.y);
  }
  ctx.globalAlpha = 1;
}

// ============ SVĚTY ============

             potvora:'🦇', boss:'🧟', hudba:['A3','C4','E4','C4','G3',null,'A3',null], tempo:100, typ:'square' },
  duha:    { jmeno:'Duhová disko', ikona:'🌈', dekor:'disco',
             neboA:'#1a0b2e', neboB:'#4a1d6b', zed:'#301250', hrana:'#ffffff', stopa:'#ffd166',
             potvora:'🎈', boss:'🤡', hudba:['C4','E4','G4','C5','H4','G4','E4','G4'], tempo:160, typ:'square' }
};
const PORADI_SVETU = ['vesmir','lava','voda','pocitac'];
const VSECHNY_SVETY = ['vesmir','lava','voda','pocitac','cukr','led','dzungle','poust','hrad','duha'];
let vybranySvet = null;         // null = na střídačku podle levelu
const PRIDAVNA = ['Sýrová','Bublinková','Ponožková','Zmrzlinová','Turbo','Bláznivá','Rozjetá','Skákavá','Ospalá',
  'Elektrická','Vesmírná','Chlupatá','Křupavá','Divoká','Tajná','Zrzavá','Bahnitá','Cukrová','Rychlá','Duhová',
  'Kýchavá','Ušatá','Slizká','Kaktusová','Bramborová','Hlučná','Studená','Škytavá'];
const PODSTATNA = ['jeskyně','trubka','chodba','díra','skluzavka','šachta','klikatice','smyčka','propast','roura',
  'zatáčka','past','rychlodráha','štola','soutěska','chodbička','tlačenice','zkratka','serpentýna','rokle'];

// ============ STAVBA LEVELU ============
const KROK = 40;
const POCET_LEVELU = 1000;
let L = null;                 // aktuální level
let levelCislo = 1;
let nejdalLevel = 1;

// stupně obtížnosti jako v Geometry Dash — od lehkého po Tidal Wave
function obtiznost(n){
  if (n >= POCET_LEVELU) return { jmeno:'TIDAL WAVE',      znak:'🌊', barva:'#00d9ff' };
  if (n <= 50)           return { jmeno:'Lehký',           znak:'🟢', barva:'#7bed9f' };
  if (n <= 150)          return { jmeno:'Normální',        znak:'🔵', barva:'#54a0ff' };
  if (n <= 300)          return { jmeno:'Těžký',           znak:'🟡', barva:'#ffd166' };
  if (n <= 450)          return { jmeno:'Těžší',           znak:'🟠', barva:'#ff9f1c' };
  if (n <= 600)          return { jmeno:'Šílený',          znak:'🔴', barva:'#ff6b6b' };
  if (n <= 800)          return { jmeno:'Démon',           znak:'😈', barva:'#c77dff' };
  return                        { jmeno:'Extrémní démon',  znak:'💀', barva:'#ff3860' };
}

function postavLevel(n, pokus){
  const r = kostka(n * 7919 + pokus * 104729);
  const zaklad = (n - 1) / (POCET_LEVELU - 1);           // 0 = první, 1 = Tidal Wave
  const t = Math.pow(zaklad, 0.95);                      // roste hezky pozvolna
  const nouze = pokus >= 13;                             // až v nouzi ubereme překážky
  const svet = vybranySvet || PORADI_SVETU[(n - 1) % 4];
  const bossLevel = (n % 10 === 0);

  const mezera0 = omez(340 - 152*t + pokus*13, 178, 380);
  const rychlost = 278 + 132*t;                          // 278 → 410
  const cilDelka = 9500 + 9000*t + (bossLevel ? 4200 : 0);

  const LK = [];
  let aktS = 270, aktM = mezera0;

  function bezpecnyStred(s, m){ return omez(s, 48 + m/2, 492 - m/2); }
  // rovná úsečka — žádné oblouky, ostrý zlom na konci
  function usek(delka, cilS, cilM){
    cilM = omez(cilM, 172, 380);
    cilS = bezpecnyStred(cilS, Math.max(cilM, aktM));
    const kroku = Math.max(1, Math.round(delka/KROK));
    const zS = aktS, zM = aktM;
    for (let i=1;i<=kroku;i++){
      const u = i/kroku;
      LK.push({ s: zS+(cilS-zS)*u, m: zM+(cilM-zM)*u });
    }
    aktS = cilS; aktM = cilM;
  }
  // zubatá vlna — nahoru, zlom, dolů, zlom (jako v Geometry Dash)
  const zubata = (u) => 1 - 4*Math.abs(((u + 0.25) % 1) - 0.5);
  function vlna(pocet, amp, delkaVlny, cilM){
    cilM = omez(cilM, 172, 380);
    const maxAmp = Math.min(amp, 0.11*delkaVlny);
    const stred = bezpecnyStred(aktS, Math.max(cilM, aktM) + maxAmp*2);
    aktS = stred;
    const kroku = Math.max(1, Math.round(pocet*delkaVlny/KROK));
    const zM = aktM;
    for (let i=1;i<=kroku;i++){
      const u = i/kroku;
      LK.push({ s: stred + zubata(u*pocet)*maxAmp, m: zM+(cilM-zM)*u });
    }
    aktM = cilM;
  }

  usek(1500, 270, mezera0);                              // klidný rozjezd
  const konecStavby = cilDelka - (bossLevel ? 4200 : 0) - 1200;
  // chodba se láme nahoru–dolů: zigzag, ne oblouky
  let smerZ = r() < 0.5 ? 1 : -1;
  while (LK.length*KROK < konecStavby){
    const volba = r();
    let m = omez(mezera0 * (0.86 + r()*0.26), 172, 380);
    if (n >= 12 && !nouze && r() < 0.26 + t*0.14) m = Math.max(m, 190);
    smerZ = -smerZ;
    const maxVych = Math.max(30, 222 - m/2);
    const amp = maxVych * (0.62 + r()*0.38);
    if (volba < 0.30)      usek(430 + r()*300, 270 + smerZ*amp, m);
    else if (volba < 0.58) usek(560 + r()*380, 270 + smerZ*amp, m);
    else if (volba < 0.90) vlna(1 + Math.floor(r()*(2 + t*2)), 74 + r()*(40 + t*30),
                                820 + r()*300 - t*180, m);
    else                   usek(380 + r()*280, 270, Math.max(176, m*(0.9 - t*0.04)));
  }

  // aréna pro bosse
  let boss = null;
  if (bossLevel){
    const od = LK.length*KROK;
    usek(600, 270, 340);
    usek(3000, 270, 340);
    boss = { od: od + 400, x: 0, y: 270, hp: 3, strely: [], stridani: 2, poraz: 0 };
  }
  usek(1200, 270, Math.max(300, mezera0));               // vítězná rovinka

  const DELKA = LK.length * KROK;
  const bodNa = (x) => {
    const u = omez(x/KROK, 0, LK.length - 1.001);
    const i = Math.floor(u), f = u - i;
    const a = LK[i], b = LK[Math.min(i+1, LK.length-1)];
    return { s: a.s + (b.s-a.s)*f, m: a.m + (b.m-a.m)*f };
  };

  // ---- bodliny (jako spiky v Geometry Dash) ----
  const spiky = [];
  if (n >= 3 && !nouze){
    const kolik = Math.floor(5 + 46*t);
    for (let i=0;i<kolik;i++){
      const x = 2200 + r()*(Math.max(1, konecStavby - 3400));
      const b = bodNa(x);
      const vyska = Math.min(46, b.m*0.2);
      if (b.m - vyska < 150) continue;
      const kde = r() < 0.5 ? 'nahore' : 'dole';
      const skupina = 1 + Math.floor(r()*3);
      const nak = r() < 0.28 ? (r() < 0.5 ? 1 : -1) : 0;
      for (let k=0;k<skupina;k++) spiky.push({ x: x + k*46, kde, sirka: 46, vyska, naklon: nak });
    }
  }
  // ---- sekáče zapuštěné do stěny a bloky (jako v Geometry Dash) ----
  const pilkyZed = [], bloky = [];
  if (n >= 2 && !nouze){
    const kolikPil = Math.floor(8 + 44*t);
    for (let i=0;i<kolikPil;i++){
      const x = 1800 + r()*Math.max(1, konecStavby - 2600);
      const b = bodNa(x);
      // v úzké chodbě sekáč nevynecháme, jen ho zmenšíme
      const rr = omez(15 + r()*(14 + t*10), 10, b.m - 150);
      if (rr < 10) continue;
      if (spiky.some(sp => Math.abs(sp.x - x) < 110)) continue;
      if (pilkyZed.some(q => Math.abs(q.x - x) < q.r + rr + 30)) continue;
      const kde = r() < 0.5 ? 'nahore' : 'dole';
      pilkyZed.push({ x, r: rr, kde, faze: r()*6.3, smer: r() < 0.5 ? 1 : -1 });
      // občas dvojice proti sobě = úzká štěrbina
      if (r() < 0.22 + t*0.2 && b.m - rr*2 > 168)
        pilkyZed.push({ x: x + rr*2 + 26, r: rr*0.85, kde: kde === 'nahore' ? 'dole' : 'nahore',
                        faze: r()*6.3, smer: r() < 0.5 ? 1 : -1 });
    }
    // jeden obrovský pomalý sekáč, co zabere půl chodby
    if (n >= 20){
      for (let i=0;i<14;i++){
        const x = 2600 + r()*Math.max(1, konecStavby - 4200);
        const b = bodNa(x);
        if (b.m < 250) continue;
        if (spiky.some(sp => Math.abs(sp.x - x) < 200)) continue;
        if (pilkyZed.some(q => Math.abs(q.x - x) < q.r + 200)) continue;
        pilkyZed.push({ x, r: b.m*0.5 - 46, kde: r() < 0.5 ? 'nahore' : 'dole',
                        faze: r()*6.3, smer: r() < 0.5 ? 1 : -1, velka:true });
        break;
      }
    }
    const kolikBloku = Math.floor(4 + 20*t);
    for (let i=0;i<kolikBloku;i++){
      const x = 2000 + r()*Math.max(1, konecStavby - 3000);
      const b = bodNa(x);
      const vys = omez(24 + r()*(22 + t*20), 16, b.m - 152);
      if (vys < 16) continue;
      if (spiky.some(sp => Math.abs(sp.x - x) < 130)) continue;
      if (pilkyZed.some(q => Math.abs(q.x - x) < q.r + 120)) continue;
      if (bloky.some(q => Math.abs(q.x - x) < 200)) continue;
      const kde2 = r() < 0.5 ? 'nahore' : 'dole';
      const sir = 60 + r()*120;
      bloky.push({ x, sirka: sir, vyska: vys, kde: kde2, odsazeni: 0,
                   sklon: r() < 0.35 ? (r() < 0.5 ? 1 : -1) : 0 });
      // někdy na blok postavíme bodlinu
      if (r() < 0.45 && b.m - vys - 30 > 150)
        spiky.push({ x: x + sir/2, kde: kde2, sirka: 40, vyska: Math.min(30, b.m - vys - 150),
                     odsazeni: vys });
    }
  }
  // ---- volné sekáče a potvůrky ----
  const potvory = [];
  // roje malých rychlých pilek
  if (n >= 15 && !nouze){
    const rojů = Math.floor(1 + t*3);
    for (let i=0;i<rojů*4;i++){
      if (potvory.length >= rojů*3) break;
      const x = 2600 + r()*Math.max(1, konecStavby - 4400);
      const b = bodNa(x);
      if (b.m < 215) continue;
      if (spiky.some(sp => Math.abs(sp.x - x) < 220)) continue;
      if (pilkyZed.some(q => Math.abs(q.x - x) < q.r + 200)) continue;
      if (potvory.some(q => Math.abs(q.x - x) < 320)) continue;
      const kolik = 3 + Math.floor(r()*2);
      for (let k=0;k<kolik;k++){
        const y = b.s + (k % 2 ? 1 : -1) * (b.m*0.22);
        potvory.push({ x: x + k*68, y, zaklad: y, r: 10, typ:'pilka', maly:true,
                       znak:'', rozsah: 12, faze: r()*6.3 });
      }
    }
  }
  if (n >= 5 && !nouze){
    for (let x = 2400; x < konecStavby - 700; x += 520 + r()*420 - t*160){
      const b = bodNa(x);
      if (spiky.some(s => Math.abs(s.x - x) < 200)) continue;
      if (pilkyZed.some(q => Math.abs(q.x - x) < q.r + 90)) continue;
      if (bloky.some(q => x > q.x - 130 && x < q.x + q.sirka + 130)) continue;
      const druh = r();
      if (b.m >= 285 && druh < 0.3 && n >= 25){
        potvory.push({ x, y:b.s, zaklad:b.s, r:17, typ:'chytra', znak:SVETY[svet].potvora,
                       rozsah: b.m/2 - 112, faze: r()*6.3 });
      } else if (b.m >= 235 && druh < 0.7){
        potvory.push({ x, y:b.s, zaklad:b.s, r:16, typ:'pilka', znak:'⚙️',
                       rozsah: Math.min(30, b.m*0.13), faze: r()*6.3 });
      } else if (b.m >= 225){
        potvory.push({ x, y:b.s, zaklad:b.s, r:16, typ:'houpa', znak:SVETY[svet].potvora,
                       rozsah: Math.min(26, b.m*0.11), faze: r()*6.3 });
      }
    }
  }
  // ---- brány na rychlost ---- (čím výš, tím větší mazec)
  const brany = [];
  if (n >= 4){
    const kolik = 1 + Math.floor(r()*2 + t*5);
    for (let i=0;i<kolik;i++){
      const x = 1700 + (i+0.5+r()*0.5) * ((konecStavby - 2400)/kolik);
      if (x > konecStavby - 700) continue;
      if (brany.some(b => Math.abs(b.x - x) < 260)) continue;
      brany.push({ x, nasobek: r() < 0.55 ? (1.26 + t*0.16) : (0.8 - t*0.06), vzato:false });
    }
  }
  // ---- portály na obrácení ----
  const portaly = [];
  if (n >= 8){
    const kolik = 1 + Math.floor(r()*2 + t*4);
    for (let i=0;i<kolik;i++){
      const x = 2200 + (i+0.5+r()*0.5) * ((konecStavby - 3000)/kolik);
      if (x > konecStavby - 800) continue;
      if (brany.some(b => Math.abs(b.x - x) < 240)) continue;
      if (portaly.some(p => Math.abs(p.x - x) < 300)) continue;
      portaly.push({ x, vzato:false });
    }
  }
  // ---- mini vlna: hrdina se zmenší a lítá o hodně prudčeji ----
  const mini = [];
  if (n >= 12 && !nouze){
    // najdi široké úseky, kde se mini vlna dá zvládnout
    const minSirka = 178;
    const kandidati = [];
    let od = null;
    for (let q = 2000; q < konecStavby - 600; q += KROK){
      if (bodNa(q).m >= minSirka){ if (od === null) od = q; }
      else { if (od !== null && q - od >= 850) kandidati.push({ od, do: q }); od = null; }
    }
    if (od !== null && (konecStavby - 600 - od) >= 850) kandidati.push({ od, do: konecStavby - 600 });
    const kolik = 1 + Math.floor(r() * (1 + t*4));
    for (const k of kandidati){
      if (mini.length >= kolik) break;
      const dl = Math.min(k.do - k.od - 140, 800 + r()*1500);
      const x = k.od + 70;
      if (dl < 620) continue;
      if (brany.some(b => b.x > x - 200 && b.x < x + dl + 200)) continue;
      if (portaly.some(p => p.x > x - 200 && p.x < x + dl + 200)) continue;
      mini.push({ od: x, do: x + dl });
    }
    // v mini úseku žádné bodliny ani potvory — jinak by to bylo nelidský
    const vMini = (x) => mini.some(m => x > m.od - 130 && x < m.do + 130);
    for (let i = spiky.length-1;    i >= 0; i--) if (vMini(spiky[i].x))    spiky.splice(i,1);
    for (let i = potvory.length-1;  i >= 0; i--) if (vMini(potvory[i].x))  potvory.splice(i,1);
    for (let i = pilkyZed.length-1; i >= 0; i--) if (vMini(pilkyZed[i].x)) pilkyZed.splice(i,1);
    for (let i = bloky.length-1;    i >= 0; i--) if (vMini(bloky[i].x))    bloky.splice(i,1);
  }
  // ---- hvězdičky a praporky ----
  const hvezdy = [];
  for (let x = 900; x < DELKA - 900; x += 620){
    if (spiky.some(s => Math.abs(s.x - x) < 90)) continue;
    if (potvory.some(p => Math.abs(p.x - x) < 130)) continue;
    if (pilkyZed.some(q => Math.abs(q.x - x) < q.r + 60)) continue;
    if (bloky.some(q => x > q.x - 70 && x < q.x + q.sirka + 70)) continue;
    hvezdy.push({ x, y: bodNa(x).s, vzato:false, faze: r()*6.3, velka:false });
  }
  if (boss){
    for (let i=0;i<3;i++){
      const x = boss.od + 700 + i*950;
      hvezdy.push({ x, y: bodNa(x).s + (i%2 ? -60 : 60), vzato:false, faze:r()*6.3, velka:true });
    }
  }
  const praporky = [{ x: 150, vzato:true }];
  for (let x = 3000; x < DELKA - 1500; x += 3000) praporky.push({ x, vzato:false });

  const jmeno = (n >= POCET_LEVELU)
    ? 'TIDAL WAVE'
    : PRIDAVNA[Math.floor(r()*PRIDAVNA.length)] + ' ' + PODSTATNA[Math.floor(r()*PODSTATNA.length)];

  return { n, LK, DELKA, bodNa, spiky, pilkyZed, bloky, prekazky: [], potvory, brany, portaly, mini,
           hvezdy, praporky, boss, svet, rychlost, jmeno, bossLevel, obtiznost: obtiznost(n) };
}

// okraje chodby včetně bodlin
function okraje(lv, x){
  const b = lv.bodNa(x);
  let n = b.s - b.m/2, d = b.s + b.m/2;
  for (const s of lv.spiky){
    const xl = s.x - s.sirka/2, xr = s.x + s.sirka/2;
    if (x < xl || x > xr) continue;
    const xa = s.x + (s.naklon || 0) * (s.sirka/2);      // kde je hrot
    let u;
    if (x <= xa) u = (xa - xl) < 1 ? 1 : (x - xl)/(xa - xl);
    else         u = (xr - xa) < 1 ? 1 : (xr - x)/(xr - xa);
    const h = (s.odsazeni || 0) + s.vyska*omez(u, 0, 1);
    if (s.kde === 'nahore') n = Math.max(n, b.s - b.m/2 + h);
    else                    d = Math.min(d, b.s + b.m/2 - h);
  }
  // sekáče zapuštěné do stěny — do chodby čouhá kruhová výseč
  for (const p of lv.pilkyZed){
    const dx = x - p.x;
    if (Math.abs(dx) >= p.r) continue;
    const h = (p.odsazeni || 0) + Math.sqrt(p.r*p.r - dx*dx);
    if (p.kde === 'nahore') n = Math.max(n, b.s - b.m/2 + h);
    else                    d = Math.min(d, b.s + b.m/2 - h);
  }
  // bloky přilepené ke stěně (a naskládané na sobě)
  for (const bl of lv.bloky){
    if (x < bl.x || x > bl.x + bl.sirka) continue;
    let cast = 1;
    if (bl.sklon){                                        // rampa: šikmý vršek
      const u = (x - bl.x)/bl.sirka;
      cast = bl.sklon > 0 ? u : 1 - u;
    }
    const h = (bl.odsazeni || 0) + bl.vyska*cast;
    if (bl.kde === 'nahore') n = Math.max(n, b.s - b.m/2 + h);
    else                     d = Math.min(d, b.s + b.m/2 - h);
  }
  return { n, d };
}

const jeMini = (lv, x) => lv.mini.some(m => x >= m.od && x < m.do);

// ---- volné překážky (dají se položit kamkoliv, i do prostřed chodby) ----
function tvarPrekazky(pr){
  const sm = pr.smer || 1, sir = pr.sirka || 46, vys = pr.vyska || 44;
  if (pr.tvar === 'bodlina'){
    const xa = pr.x + (pr.naklon || 0)*(sir/2);
    return [[pr.x - sir/2, pr.y], [xa, pr.y + sm*vys], [pr.x + sir/2, pr.y]];
  }
  const sk = pr.sklon || 0;
  if (sk > 0) return [[pr.x - sir/2, pr.y], [pr.x + sir/2, pr.y + sm*vys], [pr.x + sir/2, pr.y]];
  if (sk < 0) return [[pr.x - sir/2, pr.y], [pr.x - sir/2, pr.y + sm*vys], [pr.x + sir/2, pr.y]];
  return [[pr.x - sir/2, pr.y], [pr.x - sir/2, pr.y + sm*vys],
          [pr.x + sir/2, pr.y + sm*vys], [pr.x + sir/2, pr.y]];
}
function bodVTvaru(body, px, py){
  let uvnitr = false;
  for (let i=0, j=body.length-1; i<body.length; j=i++){
    const [xi,yi] = body[i], [xj,yj] = body[j];
    if ((yi > py) !== (yj > py) && px < (xj-xi)*(py-yi)/(yj-yi) + xi) uvnitr = !uvnitr;
  }
  return uvnitr;
}
function prekazkaZasah(pr, px, py, R){
  const body = tvarPrekazky(pr);
  const vzorky = [[px,py],[px+R,py],[px-R,py],[px,py+R],[px,py-R],
                  [px+R*0.7,py+R*0.7],[px-R*0.7,py-R*0.7]];
  return vzorky.some(([a,b]) => bodVTvaru(body, a, b));
}

// robot si level zkusí projít — a to i se zpožděnou reakcí, jako živý hráč.
// Když to nedá, level se postaví znovu a šířeji.
function otestuj(lv){
  let x = 0, y = lv.bodNa(0).s, t = 0;
  const dt = 1/60;
  let bufer = [];
  // čím lehčí level, tím nešikovnějšího robota musí ustát.
  // U démonů stačí, že to zvládne robot s bleskovou reakcí — proto jsou nelidsky těsné.
  const nesikovnost = lv.n <= 200 ? 9 : lv.n <= 500 ? 8 : lv.n <= 800 ? 7 : 6;
  while (x < lv.DELKA - 60 && t < 500){
    const mini = jeMini(lv, x);
    const R = mini ? 5 : 8;
    const svisla = mini ? 1.7 : 1;
    const o1 = okraje(lv, x + 80);
    bufer.push(y > (o1.n + o1.d)/2);
    while (bufer.length > (mini ? nesikovnost + 1 : nesikovnost)) bufer.shift();
    const drzi = bufer[0];
    x += lv.rychlost*dt;
    y += (drzi ? -1 : 1) * lv.rychlost * svisla * dt;
    t += dt;
    const o = okraje(lv, x);
    if (o.d - o.n < 2*R + 86) return false;
    if (y < o.n + R || y > o.d - R) return false;
  }
  return x >= lv.DELKA - 60;
}

function nactiLevel(n){
  for (let pokus = 0; pokus < 22; pokus++){
    const lv = postavLevel(n, pokus);
    if (otestuj(lv)) return lv;
  }
  return postavLevel(n, 40);     // nouzově ta nejširší varianta
}

function kresliHrdinuTvar(h, x, y, r, uhel){
  ctx.save(); ctx.translate(x, y); ctx.rotate(uhel);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2, r*0.17);
  ctx.strokeStyle = 'rgba(255,255,255,.92)';
  const bar = (h === hrdina) ? barvaHrdiny() : h.barva;
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, bar); g.addColorStop(1, '#2b1440');
  ctx.fillStyle = g;
  zare(bar, 18, () => {
    switch (h.id){
      case 'sipka':
        ctx.beginPath(); ctx.moveTo(r*1.05,0); ctx.lineTo(-r*0.75,-r*0.78);
        ctx.lineTo(-r*0.3,0); ctx.lineTo(-r*0.75, r*0.78); ctx.closePath(); break;
      case 'raketa':
        ctx.beginPath();
        ctx.moveTo(r*1.1, 0);
        ctx.quadraticCurveTo(r*0.2, -r*0.62, -r*0.8, -r*0.42);
        ctx.lineTo(-r*0.55, 0);
        ctx.lineTo(-r*0.8, r*0.42);
        ctx.quadraticCurveTo(r*0.2, r*0.62, r*1.1, 0);
        ctx.closePath(); break;
      case 'kostka':
        ctx.beginPath(); ctx.roundRect(-r*0.82, -r*0.82, r*1.64, r*1.64, r*0.3); break;
      case 'kulicka':
        ctx.beginPath(); ctx.arc(0, 0, r*0.9, 0, 6.3); break;
      case 'diamant':  cestaDiamant(0, 0, r); break;
      case 'hvezda':   cestaHvezda(0, 0, r*1.05, r*0.46, 5, -Math.PI/2); break;
      case 'srdce':    cestaSrdce(0, 0, r*0.95); break;
      case 'blesk':    cestaBlesk(0, 0, r*1.05); break;
    }
    ctx.fill();
  });
  ctx.stroke();
  // lesk
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-r*0.2, -r*0.34, r*0.26, r*0.14, -0.5, 0, 6.3); ctx.fill();

}

    if (x >= body[i].x && x <= body[i+1].x){
      const t = (x - body[i].x) / Math.max(1, body[i+1].x - body[i].x);
      return { s: body[i].y + (body[i+1].y - body[i].y)*t,
               m: body[i].m + (body[i+1].m - body[i].m)*t };
    }
  }
  return { s:270, m:SIRKY[0].m };

      case 'sekac': case 'pilkaZed': case 'pilkaStred': {
        const oy = isFinite(o.y) ? o.y : Math.round(edStred(o.x).s);
        potvory.push({ x:o.x, y:oy, zaklad:oy, r:o.r || 20, typ:'pilka',
                       znak:'', rozsah:o.houpe ? (o.rozsah || 34) : 0, faze:0 }); break;
      }
      case 'roj':
        for (let k=0;k<3;k++){
          const yy = o.y + (k % 2 ? 1 : -1) * (o.rozestup || 42);
          potvory.push({ x:o.x + k*66, y:yy, zaklad:yy, r:o.r || 10, typ:'pilka', maly:true,
                         znak:'', rozsah:o.houpe === false ? 0 : 12, faze:k });
        }
        break;
      case 'branaPlus':  brany.push({ x:o.x, nasobek:1.32, vzato:false }); break;
      case 'branaMinus': brany.push({ x:o.x, nasobek:0.78, vzato:false }); break;
      case 'portal':     portaly.push({ x:o.x, vzato:false }); break;
      case 'mini':       mini.push({ od:o.x, do:o.x + (o.delka || 1200) }); break;
      case 'hvezda':     hvezdy.push({ x:o.x, y:o.y, vzato:false, faze:0, velka:false }); break;
      case 'praporek':   praporky.push({ x:o.x, vzato:false }); break;
    }
  }
  praporky.sort((a,b) => a.x - b.x);
  return { n:0, LK, DELKA, bodNa, spiky, pilkyZed, bloky, prekazky, potvory, brany, portaly, mini,
           hvezdy, praporky, boss:null, svet: vybranySvet || 'vesmir',
           rychlost: RYCHLOSTI[editor.rychlost].v, jmeno:'Tvůj level', bossLevel:false,
           vlastniHudba: { noty: HUDBY[editor.hudba].noty, tempo: HUDBY[editor.hudba].tempo,
                           typ: HUDBY[editor.hudba].typ, bici: editor.bici },
           obtiznost:{ jmeno:'Tvoje', znak:'', barva:'#00d9ff' } };
}
// ---- kód, kterým si vlastní level uložíš ----
const TYPY_KOD = ['tvar','pilkaZed','pilkaStred','bodlina','blok','branaPlus','branaMinus',
                  'portal','mini','hvezda','praporek','roj','bodlinaSikma','rampa','sekac'];
function kodVlastniho(){
  const kus = editor.objekty.map(o => {
    const t = TYPY_KOD.indexOf(o.typ);
    if (t < 0) return null;
    const x = Math.round(o.x/20).toString(36);
    const y = Math.round((o.y !== undefined ? o.y : 0)/10).toString(36);
    const k = o.kde === 'nahore' ? 1 : 0;
    const m = o.m ? SIRKY.findIndex(q => q.m === o.m) : 0;
    const extra = [Math.round(o.r || 0), Math.round(o.vyska || 0), Math.round(o.sirka || 0),
                   Math.round(o.odsazeni || 0), Math.round(o.rozsah || 0),
                   Math.round(o.rozestup || 0), Math.round(o.delka || 0),
                   o.houpe ? 1 : 0, (o.naklon || 0) + 1, (o.sklon || 0) + 1,
                   (o.smer || 1) + 1].join('.');
    return t.toString(36) + x + '.' + y + '.' + k + '.' + Math.max(0,m) + '.' + extra;
  }).filter(Boolean);
  return 'VLNA2-' + editor.rychlost + editor.hudba + editor.bici + '-' + kus.join('-');
}
function nactiZKodu(text){
  const cely = String(text).trim();
  if (!/^VLNA2-/i.test(cely)) return false;
  const casti = cely.split('-');
  if (casti.length < 2) return false;
  const hlava = casti[1];
  const nove = [];
  for (let i=2;i<casti.length;i++){
    const c = casti[i];
    if (!c) continue;
    const t = parseInt(c[0], 36);
    const zbytek = c.slice(1).split('.');
    const typ = TYPY_KOD[t];
    if (!typ) return false;
    const o = { typ, x: parseInt(zbytek[0], 36) * 20 };
    if (isNaN(o.x)) return false;
    const c1 = (i2, vych) => { const v = parseInt(zbytek[i2], 10); return isNaN(v) ? vych : v; };
    if (typ !== 'mini' && typ !== 'portal' && typ !== 'praporek' &&
        typ !== 'branaPlus' && typ !== 'branaMinus') o.y = parseInt(zbytek[1], 36) * 10;
    if (typ === 'tvar') o.m = SIRKY[omez(c1(3, 0), 0, SIRKY.length-1)].m;
    const r0 = c1(4, 0), vy0 = c1(5, 0), si0 = c1(6, 0), od0 = c1(7, 0),
          ro0 = c1(8, 0), re0 = c1(9, 0), dl0 = c1(10, 0), ho0 = c1(11, 1);
    if (r0)  o.r = r0;
    if (vy0) o.vyska = vy0;
    if (si0) o.sirka = si0;
    if (ro0) o.rozsah = ro0;
    if (re0) o.rozestup = re0;
    if (dl0) o.delka = dl0;
    if (['sekac','pilkaStred','pilkaZed','roj'].includes(typ)) o.houpe = (ho0 === 1);
    const nak0 = c1(12, 1) - 1, skl0 = c1(13, 1) - 1;
    if (['bodlina','bodlinaSikma'].includes(typ)) o.naklon = nak0;
    if (['blok','rampa'].includes(typ)) o.sklon = skl0;
    if (['bodlina','bodlinaSikma','blok','rampa'].includes(typ)) o.smer = (c1(14, 2) - 1) || 1;
    nove.push(o);
  }
  if (!nove.some(o => o.typ === 'tvar')) return false;
  editor.objekty = nove;
  editor.rychlost = omez(parseInt(hlava[0] || '1', 10) || 0, 0, RYCHLOSTI.length-1);
  editor.hudba    = omez(parseInt(hlava[1] || '0', 10) || 0, 0, HUDBY.length-1);
  editor.bici     = omez(parseInt(hlava[2] || '1', 10) || 0, 0, 3);
  editor.posun = 0;
  return true;
}
function otevriEditor(){
  stav = 'editor'; zvuk.hudbaStop(); zvuk.klik();
  if (!editor.objekty.some(o => o.typ === 'tvar')){
    editor.objekty.push({ typ:'tvar', x:0,    y:270, m:SIRKY[0].m });
    editor.objekty.push({ typ:'tvar', x:9600, y:270, m:SIRKY[0].m });
  }
}
function zkusVlastni(odkud){
  vlastniHra = true;
  L = postavVlastni();
  zacniHru();
  if (odkud && odkud > 100){
    hrac.x = omez(odkud, 0, L.DELKA - 200);

    stopa = []; zaznam = [];
    L.praporky.push({ x: hrac.x, vzato: true });

  }
}

let trenBod = null, trenCas = 0;
let zaznam = [], duchove = {}, hudbaTik = 0, hudbaProfil = '';
let hlaskaCas = 0, hlaska = '';
const HLASKY = ['Fíha!','Šikula!','To bylo těsný!','Jedeš!','Paráda!','Ani ses nelekl!','Mazec!'];
let tlacitka = [];
// mapa levelů — chodníček, co stoupá až k tisícce
const ROZESTUP = 88;
let mapaY = 0, tahani = null;
const mapaMax = () => (POCET_LEVELU - 1) * ROZESTUP - (V - 250);
const mapaX = (n) => Š/2 + Math.sin(n*0.5)*180 + Math.sin(n*0.19)*55;
const mapaObrY = (n) => V - 92 - ((n-1)*ROZESTUP - mapaY);

// ============ OVLÁDÁNÍ ============
const klavesy = {};
addEventListener('keydown', e => {
  // psaní démonovi má přednost před všemi ostatními klávesami
  if (chat.otevren){
    e.preventDefault();
    if (e.key === 'Escape'){ chat.otevren = false; zvuk.klik(); return; }
    if (e.key === 'Enter'){ demonPosli(chat.text); return; }
    if (e.key === 'Backspace'){ chat.text = chat.text.slice(0, -1); return; }
    if (e.key.length === 1 && chat.text.length < 4000){ chat.text += e.key; zvuk.tik(); }
    return;
  }
  klavesy[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM'){ zvuk.tichoZapni(); if (stav==='hra') pustHudbu(); return; }
  if (e.code === 'KeyD'){ otevriChat(); return; }
  if (stav === 'editor'){
    if (e.code === 'ArrowLeft')  { editor.posun = Math.max(0, editor.posun - 120); return; }
    if (e.code === 'ArrowRight') { editor.posun = Math.min(editor.delka - 400, editor.posun + 120); return; }
    if (e.code === 'Space' || e.code === 'Enter'){ zkusVlastni(0); return; }
    if (e.code === 'KeyZ'){ edZpet(); return; }
    if (e.code === 'Escape'){ stav = 'menu'; zvuk.klik(); return; }
    return;
  }
  if (e.code === 'KeyE' && stav !== 'hra'){ otevriEditor(); return; }
  if (e.code === 'KeyP'){
    trenink = !trenink; trenBod = null; zvuk.klik();
    hlaska = trenink ? 'Trénink zapnutý — nepočítá se' : 'Trénink vypnutý';
    hlaskaCas = 2; return;
  }
  if (stav === 'mapa'){
    if (e.code === 'ArrowUp')    { posunMapu(+ROZESTUP);   return; }
    if (e.code === 'ArrowDown')  { posunMapu(-ROZESTUP);   return; }
    if (e.code === 'PageUp')     { posunMapu(+ROZESTUP*10);return; }
    if (e.code === 'PageDown')   { posunMapu(-ROZESTUP*10);return; }
    if (e.code === 'Escape')     { stav = 'menu'; zvuk.klik(); return; }
    if (e.code === 'Space' || e.code === 'Enter'){ spustLevel(levelCislo); return; }
    return;
  }
  if (stav === 'menu'){
    if (e.code === 'KeyL' || e.code === 'Tab'){ otevriMapu(); return; }
    if (e.code === 'KeyE'){ otevriEditor(); return; }
    if (e.code === 'ArrowLeft')  { zmenLevel(-1);  return; }
    if (e.code === 'ArrowRight') { zmenLevel(+1);  return; }
    if (e.code === 'ArrowDown')  { zmenLevel(-10); return; }
    if (e.code === 'ArrowUp')    { zmenLevel(+10); return; }
    zacniHru(); return;
  }
  if (stav === 'konec'){
    if (e.code === 'Escape' || e.code === 'KeyQ'){ doMenu(); return; }
    dalsiLevel(); return;
  }
  if (e.code === 'KeyR') zacniHru();
  if (e.code === 'Escape') doMenu();
});
addEventListener('keyup', e => klavesy[e.code] = false);
addEventListener('paste', e => {
  if (!chat.otevren) return;
  const t = (e.clipboardData || window.clipboardData).getData('text');
  if (t) chat.text = (chat.text + t).slice(0, 4000);

});

const mys = { x: Š/2, y: V/2, drzi:false };
function bodZUdalosti(e){
  const r = platno.getBoundingClientRect();
  mys.x = (e.clientX - r.left) / r.width  * Š;
  mys.y = (e.clientY - r.top ) / r.height * V;
}
platno.addEventListener('pointerdown', e => {
  bodZUdalosti(e);
  if (stav !== 'mapa' && mys.x > Š-52 && mys.y > 42 && mys.y < 100){
    zvuk.tichoZapni(); if (stav==='hra') pustHudbu(); return;
  }
  for (const t of tlacitka){
    if (mys.x > t.x && mys.x < t.x+t.s && mys.y > t.y && mys.y < t.y+t.v){ t.akce(); return; }
  }
  if (chat.otevren) return;
  if (stav === 'editor'){ klikEditor(); return; }
  if (stav === 'mapa'){ tahani = { y: mys.y, zac: mapaY, posun: 0 }; return; }
  mys.drzi = true;
  if (stav === 'menu') zacniHru();
  else if (stav === 'konec') dalsiLevel();
});
platno.addEventListener('pointermove', e => {
  bodZUdalosti(e);
  if (editor.tahnuty){
    const t = editor.tahnuty, o = t.o;
    const dx = Math.abs(mys.x - t.zacX), dy = Math.abs(mys.y - t.zacY);
    if (o.typ === 'mini') o.delka = Math.round(omez(1200 + (mys.x - t.zacX)*4, 400, 5000)/20)*20;
    else if (o.typ === 'sekac')      o.r = Math.round(omez(Math.max(dx, dy), 8, 90));
    else if (o.typ === 'roj'){ o.r = Math.round(omez(Math.max(8, dy*0.4), 6, 28));
                               o.rozestup = Math.round(omez(Math.max(20, dy), 20, 120)); }
    else if (o.typ === 'bodlina' || o.typ === 'bodlinaSikma'){
      o.vyska = Math.round(omez(Math.max(12, dy), 12, 160));
      o.sirka = Math.round(omez(Math.max(20, dx*2 || 46), 20, 200));
    }
    else if (o.typ === 'blok' || o.typ === 'rampa'){
      o.vyska = Math.round(omez(Math.max(12, dy), 12, 200));
      o.sirka = Math.round(omez(Math.max(30, dx*2), 30, 500));
    }
    return;
  }
  if (tahani){
    const d = mys.y - tahani.y;
    tahani.posun = Math.max(tahani.posun, Math.abs(d));
    mapaY = omez(tahani.zac - d, 0, mapaMax());
  }
});

platno.addEventListener('wheel', e => {

// ============ KLIKÁNÍ V EDITORU ============
const ED_ODY = 92, ED_DOY = 440;
function klikEditor(){
  if (mys.y < ED_ODY || mys.y > ED_DOY) return;
  const x = Math.round((mys.x + editor.posun) / 20) * 20;
  if (x < 40 || x > editor.delka - 40) return;
  const b = edStred(x);
  const nahore = mys.y < b.s;

  if (editor.nastroj === 'guma'){
    let nej = -1, nejD = 1e9;
    editor.objekty.forEach((o, i) => {
      const ob = edStred(o.x);
      const yN = ob.s - ob.m/2, yD = ob.s + ob.m/2;
      const dx = Math.abs(edX(o.x) - mys.x);
      let d = 1e9;
      switch (o.typ){
        case 'tvar':
          d = Math.hypot(edX(o.x) - mys.x, o.y - mys.y);
          if (d > 34) d = (dx < 16 && mys.y > yN && mys.y < yD) ? 34 : 1e9;
          break;
        case 'bodlina': case 'bodlinaSikma': case 'blok': case 'rampa': {
          const sirka = (o.sirka || (o.typ === 'blok' || o.typ === 'rampa' ? 100 : 46))/2;
          const vys = o.vyska || 44, sm = o.smer || 1;
          const a = Math.min(o.y, o.y + sm*vys), bb2 = Math.max(o.y, o.y + sm*vys);
          d = (dx < sirka + 8 && mys.y > a - 8 && mys.y < bb2 + 8) ? dx : 1e9;
          break;
        }
        case 'roj':
          d = Math.hypot(edX(o.x) + 66 - mys.x, o.y - mys.y);
          if (d > (o.rozestup || 42) + 40) d = 1e9;
          break;
        case 'sekac': case 'pilkaZed': case 'pilkaStred': case 'hvezda':
          d = Math.hypot(edX(o.x) - mys.x, o.y - mys.y);
          if (d > (o.r || 16) + 16) d = 1e9;
          break;
        default:
          // portál, brány, mini a praporek jsou čáry přes celou chodbu
          d = (dx < 22 && mys.y > yN - 6 && mys.y < yD + 6) ? dx : 1e9;
      }
      if (d < nejD){ nejD = d; nej = i; }
    });
    if (nej >= 0){
      const smazany = editor.objekty[nej];
      const tvaru = editor.objekty.filter(o => o.typ === 'tvar').length;
      if (smazany.typ === 'tvar' && tvaru <= 2){ zvuk.chyba(); return; }
      edUloz();
      editor.objekty.splice(nej, 1); zvuk.klik();
    } else zvuk.chyba();
    return;
  }
  const n = editor.nastroj;
  if (n === 'testOdsud'){ zkusVlastni(x); return; }
  if (n === 'oznac'){
    if (editor.oznaceniOd === null || editor.oznaceniDo !== null){
      editor.oznaceniOd = x; editor.oznaceniDo = null;
    } else {
      editor.oznaceniDo = x;
      const od = Math.min(editor.oznaceniOd, x), doX = Math.max(editor.oznaceniOd, x);
      editor.schranka = editor.objekty
        .filter(o => o.typ !== 'tvar' && o.x >= od && o.x <= doX)
        .map(o => { const k = JSON.parse(JSON.stringify(o)); k.x -= od; return k; });
      zvuk.sber();
    }
    zvuk.tik(); return;
  }
  if (n === 'vloz'){
    if (!editor.schranka.length){ zvuk.chyba(); return; }
    edUloz();
    for (const k of editor.schranka){
      const kopie = JSON.parse(JSON.stringify(k));
      kopie.x = Math.round((x + kopie.x)/20)*20;
      if (kopie.x > 20 && kopie.x < editor.delka - 20) editor.objekty.push(kopie);
    }
    zvuk.vyhra(); return;
  }
  edUloz();
  if (n === 'tvar'){
    const m = SIRKY[editor.sirka].m;
    const y = omez(Math.round(mys.y/10)*10, 50 + m/2, 490 - m/2);
    const stejny = editor.objekty.find(o => o.typ === 'tvar' && Math.abs(o.x - x) < 60);
    if (stejny){ stejny.y = y; stejny.m = m; }
    else editor.objekty.push({ typ:'tvar', x, y, m });
  }
  else {
    const nova = edNahledVec();
    editor.tahnuty = null;
    if (nova){
      editor.objekty.push(nova);
      if (['sekac','bodlina','bodlinaSikma','blok','rampa','roj','mini'].includes(nova.typ))
        editor.tahnuty = { o: nova, zacX: mys.x, zacY: mys.y };
    }
  }
  zvuk.tik();
}

function klikNaMapu(){
  const odN = Math.max(1, Math.floor((mapaY - 140)/ROZESTUP));
  const doN = Math.min(POCET_LEVELU, Math.ceil((mapaY + V + 140)/ROZESTUP) + 1);
  for (let n = odN; n <= doN; n++){
    if (Math.hypot(mys.x - mapaX(n), mys.y - mapaObrY(n)) < 32){ spustLevel(n); return; }
  }
}

const jeZamceny = (n) => n > nejdalLevel && !admin;   // odemykáš vždycky jen ten další
function zmenLevel(o){
  vlastniHra = false;

function hudbaLevelu(){
