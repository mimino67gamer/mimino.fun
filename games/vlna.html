  hudbaProfil = '';
}
// hudba se přizpůsobuje: v těsném místě přidá bicí, u bosse zrychlí, v mini jde o oktávu výš
function ladHudbu(){
  const s = SVETY[L.svet];
  const m = L.bodNa(hrac.x).m;
  const tesnota = omez((300 - m) / 170, 0, 1);
  const uBosse = !!(L.boss && L.boss.hp > 0 && hrac.x > L.boss.od - 900);
  const v = hudbaLevelu();
  let tempo = (v ? v.tempo : s.tempo) * (1 + tesnota*0.34) *
              (hrac.nasobek > 1 ? 1.12 : hrac.nasobek < 1 ? 0.94 : 1);
  if (uBosse) tempo *= 1.22;
  tempo = Math.round(tempo/6)*6;
  const bici = v ? omez(v.bici + (tesnota > 0.6 ? 1 : 0), 0, 3)
                 : (uBosse ? 3 : (tesnota > 0.72 ? 3 : tesnota > 0.42 ? 2 : tesnota > 0.14 ? 1 : 0));
  const oktava = hrac.maly ? 1 : 0;
  const profil = tempo + '|' + bici + '|' + oktava + '|' + (uBosse ? 'b' : '-');
  if (profil === hudbaProfil) return;
  hudbaProfil = profil;
  zvuk.hudbaHraj(v ? v.noty : (uBosse ? ['A3','C4','E4','A4','G4','E4','C4','D4'] : s.hudba),
                 tempo, v ? v.typ : (uBosse ? 'square' : s.typ), .045, bici, oktava);
}
function zacniHru(){
  stav = 'hra';
  hrac = { x:0, y:L.bodNa(0).s, drzi:false, mrtvy:0, nasobek:1, obraceny:false, maly:false };
  trenBod = null; trenCas = 0;
  zaznam = []; hudbaProfil = ''; hudbaTik = 0;
  stopa = []; castice = []; popisky = []; otres = 0; zablesk = 0;
  cas = 0; pokusy = 1; body = 0;
  for (const h of L.hvezdy)  h.vzato = false;
  for (const b of L.brany)   b.vzato = false;
  for (const p of L.portaly) p.vzato = false;
  for (const p of L.praporky) p.vzato = false;
  L.praporky[0].vzato = true;
  if (L.boss){ L.boss.hp = 3; L.boss.strely = []; L.boss.stridani = 2; L.boss.poraz = 0; L.boss.y = 270; }
  zvuk.start(); pustHudbu();
}
function posledniPraporek(){
  // v tréninku se vracíš k automatickému praporku, jinak k tomu opravdovému
  if (trenink && trenBod && trenBod.x > 40) return trenBod;
  let p = L.praporky[0];
  for (const q of L.praporky) if (q.vzato && q.x <= hrac.x + 1) p = q;
  return p;
}
function umri(){
  const s = SVETY[L.svet];
  hrac.mrtvy = 0.9;
  zvuk.vybuch(); zvuk.prd();
  bum(hrac.x, hrac.y, s.hrana, 26, 340);
  bum(hrac.x, hrac.y, '#ffffff', 14, 220);
  bum(hrac.x, hrac.y, s.stopa, 16, 280);
  zatres(16); zablesk = 1;
  popisek(hrac.x, hrac.y - 40, 'BÁC!', '#ff6b6b');
}
function ozivni(){
  const p = posledniPraporek();
  pokusy++;
  hrac.x = p.x; hrac.y = (p.y !== undefined) ? p.y : L.bodNa(p.x).s;
  hrac.mrtvy = 0; hrac.nasobek = 1; hrac.obraceny = false;
  hrac.maly = jeMini(L, p.x);
  zaznam = zaznam.filter(b => b.x <= hrac.x + 1);
  stopa = [];
  for (const b of L.brany)   if (b.x > hrac.x) b.vzato = false;
  for (const q of L.portaly) if (q.x > hrac.x) q.vzato = false;
  if (L.boss) L.boss.strely = [];
  zvuk.klik();
}

// ============ KROK ============
function krok(dt){
  if (hrac.mrtvy > 0){
    hrac.mrtvy -= dt;
    if (hrac.mrtvy <= 0) ozivni();
    return;
  }
  cas += dt;
  hlaskaCas = Math.max(0, hlaskaCas - dt);

  const rychlost = L.rychlost * hrac.nasobek;
  const drziTed = klavesy.Space || klavesy.ArrowUp || klavesy.KeyW || mys.drzi;
  if (drziTed !== hrac.drzi){ hrac.drzi = drziTed; zvuk.tik(); }
  const nahoru = hrac.obraceny ? !hrac.drzi : hrac.drzi;

  // mini vlna — raketka se zmenší a lítá o hodně prudčeji nahoru i dolů
  const miniTed = jeMini(L, hrac.x);
  if (miniTed !== hrac.maly){
    hrac.maly = miniTed;
    zvuk.portal(); zatres(6); zablesk = .4;
    bum(hrac.x, hrac.y, '#00d9ff', 16, 240);
    popisek(hrac.x, hrac.y - 60, miniTed ? 'MINI VLNA! 🔻' : 'ZPÁTKY VELKÝ 🔺', '#00d9ff');
  }
  const svisla = hrac.maly ? 1.7 : 1;
  const R = hrac.maly ? 5 : 8;

  hrac.x += rychlost * dt;
  hrac.y += (nahoru ? -1 : 1) * rychlost * svisla * dt;

  stopa.push({ x:hrac.x, y:hrac.y });
  if (stopa.length > 70) stopa.shift();

  // záznam pro ducha nejlepšího průletu
  if (!zaznam.length || hrac.x - zaznam[zaznam.length-1].x > 22) zaznam.push({ x:hrac.x, y:hrac.y });

  hudbaTik -= dt;
  if (hudbaTik <= 0){ hudbaTik = 0.45; ladHudbu(); }

  // trénink — praporky si dává hra sama, ale jen když jsi na bezpečném místě
  if (trenink){
    trenCas -= dt;
    if (trenCas <= 0){
      const ok2 = okraje(L, hrac.x + 60);
      if (hrac.y - ok2.n > 34 && ok2.d - hrac.y > 34){
        trenBod = { x: hrac.x, y: hrac.y };
        trenCas = 1.3;
      } else trenCas = 0.2;
    }
  }

  // brány na rychlost
  for (const b of L.brany){
    if (!b.vzato && hrac.x > b.x){
      b.vzato = true; hrac.nasobek = b.nasobek;
      if (b.nasobek > 1){ zvuk.zrychli(); popisek(b.x, L.bodNa(b.x).s - 60, 'ZRYCHLENÍ!', '#ff9f1c'); }
      else { zvuk.zpomal(); popisek(b.x, L.bodNa(b.x).s - 60, 'ZPOMALENÍ', '#7bed9f'); }
      zatres(5); bum(b.x, L.bodNa(b.x).s, '#ff9f1c', 12, 200);
    }
  }
  // portály na obrácení
  for (const p of L.portaly){
    if (!p.vzato && hrac.x > p.x){
      p.vzato = true; hrac.obraceny = !hrac.obraceny;
      zvuk.portal(); zatres(7); zablesk = .5;
      bum(p.x, L.bodNa(p.x).s, '#c77dff', 18, 260);
      popisek(p.x, L.bodNa(p.x).s - 70, 'VZHŮRU NOHAMA!', '#c77dff');
    }
  }

  // stěna a bodliny
  const o = okraje(L, hrac.x);
  if (hrac.y < o.n + R || hrac.y > o.d - R){
    hrac.y = omez(hrac.y, o.n + R, o.d - R);
    umri(); return;
  }

  // volné překážky (bodliny a bloky položené kamkoliv)
  for (const pr of L.prekazky){
    if (Math.abs(pr.x - hrac.x) > 300) continue;
    if (prekazkaZasah(pr, hrac.x, hrac.y, R - 1)){ umri(); return; }
  }
  // potvory
  for (const p of L.potvory){
    if (Math.abs(p.x - hrac.x) > 700) continue;
    if (p.typ === 'chytra'){
      const cil = omez(hrac.y, p.zaklad - p.rozsah, p.zaklad + p.rozsah);
      const rychl = Math.abs(p.x - hrac.x) < 520 ? 65 : 25;
      p.y += omez(cil - p.y, -rychl*dt, rychl*dt);
    } else {
      p.y = p.zaklad + Math.sin(cas*(p.typ==='pilka' ? 1.8 : 2.2) + p.faze) * p.rozsah;
    }
    if (Math.hypot(p.x - hrac.x, p.y - hrac.y) < p.r + R - 1){ umri(); return; }
  }

  // boss
  if (L.boss && L.boss.hp > 0 && hrac.x > L.boss.od - 400){
    const bs = L.boss;
    bs.x = hrac.x + 400;
    const c = L.bodNa(bs.x);
    bs.y += omez(hrac.y - bs.y, -80*dt, 80*dt);
    bs.y = omez(bs.y, c.s - c.m/2 + 62, c.s + c.m/2 - 62);
    bs.stridani -= dt;
    if (bs.stridani <= 0){
      bs.stridani = 1.9;
      bs.strely.push({ x: bs.x - 40, y: bs.y, vy: (hrac.y > bs.y ? 26 : -26) });
      zvuk.strela();
    }
  }
  if (L.boss){
    for (const s of L.boss.strely){
      s.x -= 190*dt; s.y += s.vy*dt;
      if (Math.hypot(s.x - hrac.x, s.y - hrac.y) < 12 + R){ umri(); return; }
    }
    L.boss.strely = L.boss.strely.filter(s => s.x > hrac.x - 200);
  }

  // hvězdičky
  for (const h of L.hvezdy){
    if (h.vzato || Math.abs(h.x - hrac.x) > 60) continue;
    if (Math.hypot(h.x - hrac.x, h.y - hrac.y) < (h.velka ? 40 : 26)){
      h.vzato = true;
      if (h.velka && L.boss && L.boss.hp > 0){
        L.boss.hp--; body += 50;
        zvuk.au(); zatres(12); zablesk = .5;
        bum(L.boss.x, L.boss.y, '#ff6b6b', 22, 320);
        popisek(L.boss.x, L.boss.y - 60, 'AU!', '#ff6b6b');
        if (L.boss.hp === 0){
          L.boss.poraz = 1;
          zvuk.vyhra(); zatres(18);
          for (let i=0;i<6;i++) bum(L.boss.x + nah(-90,90), L.boss.y + nah(-90,90),
                                    ['#ffd166','#ff6b9d','#7c5cff','#2ec4b6'][i%4], 20, 340);
          hlaska = 'Boss je v háji! 🎉'; hlaskaCas = 2.5;
        }
      } else { body += 10; }
      zvuk.sber(); bum(h.x, h.y, '#ffd166', 10, 180);
      popisek(h.x, h.y - 20, h.velka ? '+50' : '+10', '#ffd166');
    }
  }
  // praporky
  for (const p of L.praporky){
    if (!p.vzato && hrac.x > p.x){
      p.vzato = true; zvuk.prapor();
      bum(p.x, L.bodNa(p.x).s, '#7bed9f', 14, 200);
      hlaska = HLASKY[Math.floor(nah(0, HLASKY.length))]; hlaskaCas = 1.6;
      popisek(p.x, L.bodNa(p.x).s - 50, 'PRAPOREK!', '#7bed9f');
    }
  }

  if (hrac.x >= L.DELKA - 60){
    stav = 'konec';
    // v tréninku ani v adminu se postup nepočítá
    if (!trenink && !admin && L.n >= 1) nejdalLevel = Math.max(nejdalLevel, levelCislo + 1);
    // duch: nech si ten nejlepší průlet (nejmíň pokusů, pak nejrychlejší)
    const stary = duchove[L.n];
    if (!stary || pokusy < stary.pokusy || (pokusy === stary.pokusy && cas < stary.cas))
      duchove[L.n] = { body: zaznam.slice(), pokusy, cas };
    zvuk.hudbaStop(); zvuk.vyhra();
    for (let i=0;i<6;i++) bum(hrac.x + nah(-120,120), nah(120,420),
                              ['#ffd166','#ff6b9d','#7c5cff','#2ec4b6'][i%4], 18, 300);
    zatres(10);
  }
}

// ============ KRESLENÍ ============
function kresliPozadi(s, tema){
  const g = ctx.createLinearGradient(0,0,0,V);
  g.addColorStop(0, s.neboA); g.addColorStop(1, s.neboB);
  ctx.fillStyle = g; ctx.fillRect(0,0,Š,V);

  const opak = (v, sirka) => ((v % sirka) + sirka) % sirka;
  // světlo v pozadí se rozsvítí do rytmu
  if (pulz > 0.02){
    const pg = ctx.createRadialGradient(Š*0.5, V*0.5, 40, Š*0.5, V*0.5, V);
    pg.addColorStop(0, 'rgba(255,255,255,' + (pulz*0.055) + ')');
    pg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = pg; ctx.fillRect(0,0,Š,V);
  }

  // vzdálené kopce / duny — dvě vrstvy pro hloubku
  if (s.dekor === 'kopce'){
    for (const [vrs, rychl, alfa, vys] of [[0, .16, .35, 190], [1, .34, .6, 120]]){
      ctx.globalAlpha = alfa; ctx.fillStyle = s.kopec;
      ctx.beginPath(); ctx.moveTo(0, V);
      for (let x=0; x<=Š; x+=16)
        ctx.lineTo(x, V - vys - Math.sin((x + kamera*rychl)/(150 + vrs*90))*36 - Math.sin((x+kamera*rychl)/61)*10);
      ctx.lineTo(Š, V); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (tema === 'poust'){
      zare('#fff6c0', 40, () => {
        ctx.fillStyle = '#fff3b0';
        ctx.beginPath(); ctx.arc(140, 96, 34, 0, 6.3); ctx.fill();
      });
    } else {
      // žhavé praskliny v lávové jeskyni
      ctx.strokeStyle = '#ff6b35'; ctx.lineWidth = 2; ctx.globalAlpha = .5;
      for (let i=0;i<8;i++){
        const x = opak(i*170 - kamera*0.34, Š+180) - 90;
        ctx.beginPath(); ctx.moveTo(x, V);
        ctx.lineTo(x + 14, V - 40 - (i%3)*18); ctx.lineTo(x - 6, V - 74 - (i%2)*20);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  // hvězdy a planeta
  if (s.dekor === 'hvezdy'){
    for (const h of hvezdicky){
      const x = opak(h.x - kamera*0.22, Š);
      const t = h.h * (0.45 + Math.sin(animCas*2 + h.x)*0.35);
      ctx.globalAlpha = Math.max(0, t);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, h.y, h.r*0.9, 0, 6.3); ctx.fill();
      if (h.r > 1.5){
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(x-h.r*2.4, h.y); ctx.lineTo(x+h.r*2.4, h.y);
        ctx.moveTo(x, h.y-h.r*2.4); ctx.lineTo(x, h.y+h.r*2.4); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    const px = opak(-kamera*0.1, Š*2.2) - 110;
    ctx.globalAlpha = .5;
    const pg = ctx.createRadialGradient(px-16, 96, 8, px, 112, 52);
    pg.addColorStop(0,'#ffd6a5'); pg.addColorStop(1,'#8b5a8f');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(px, 112, 46, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,214,165,.75)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(px, 112, 74, 16, -0.34, 0, 6.3); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // bublinky
  if (s.dekor === 'bubliny'){
    for (const b of bubliny){
      const x = opak(b.x - kamera*0.3 + Math.sin(animCas + b.y)*8, Š);
      const y = opak(b.y - animCas*b.v, V);
      ctx.globalAlpha = .3; ctx.strokeStyle = '#cdfaff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(x, y, b.r, 0, 6.3); ctx.stroke();
      ctx.globalAlpha = .5; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x - b.r*0.35, y - b.r*0.35, b.r*0.22, 0, 6.3); ctx.fill();
    }
    // paprsky světla shora
    ctx.globalAlpha = .07; ctx.fillStyle = '#cdfaff';
    for (let i=0;i<5;i++){
      const x = opak(i*230 - kamera*0.2, Š+300) - 150;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x+40, 0); ctx.lineTo(x+130, V); ctx.lineTo(x+40, V);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // obvody v počítači
  if (s.dekor === 'mriz'){
    ctx.globalAlpha = .18; ctx.strokeStyle = '#2ec4b6'; ctx.lineWidth = 1;
    const o = opak(kamera*0.4, 64);
    for (let x=-o; x<Š; x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,V); ctx.stroke(); }
    for (let y=0; y<V; y+=64){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(Š,y); ctx.stroke(); }
    ctx.globalAlpha = .55; ctx.lineWidth = 2.5;
    for (let i=0;i<10;i++){
      const x = opak(i*211 - kamera*0.5, Š+260) - 130;
      const y = 40 + (i*97) % (V-80);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+58, y); ctx.lineTo(x+58, y+44); ctx.lineTo(x+120, y+44);
      ctx.stroke();
      ctx.fillStyle = (Math.floor(animCas*3 + i) % 2) ? '#7bed9f' : '#2ec4b6';
      ctx.beginPath(); ctx.arc(x+58, y+44, 4, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // sladkosti, vločky, listy, netopýři
  if (s.dekor === 'plovak'){
    for (let i=0;i<22;i++){
      const x = opak(i*137 - kamera*0.3, Š+140) - 70;
      const y = opak(i*151 + animCas*24 + Math.sin(animCas + i)*22, V+80) - 40;
      const r = 8 + (i%3)*4;
      const f = Math.sin(animCas*2 + i);
      ctx.globalAlpha = .5;
      if (tema === 'led'){
        ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.save(); ctx.translate(x,y); ctx.rotate(animCas*0.6 + i);
        for (let k=0;k<3;k++){ ctx.rotate(Math.PI/3);
          ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke(); }
        ctx.restore();
      } else if (tema === 'cukr'){
        ctx.fillStyle = ['#fff3b0','#a1e3d8','#fb6f92','#fff'][i%4];
        ctx.beginPath(); ctx.arc(x, y, r*0.8, 0, 6.3); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r*0.45, 0.4, 3.4); ctx.stroke();
      } else if (tema === 'dzungle'){
        ctx.fillStyle = i%2 ? '#a8e063' : '#6fbf4a';
        ctx.save(); ctx.translate(x,y); ctx.rotate(f*0.6);
        ctx.beginPath(); ctx.ellipse(0, 0, r*1.3, r*0.5, 0, 0, 6.3); ctx.fill();
        ctx.restore();
      } else {  // hrad — netopýři
        ctx.fillStyle = '#1b0f26';
        ctx.save(); ctx.translate(x, y); ctx.scale(1, 1 + f*0.25);
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.quadraticCurveTo(-r*0.8, -r*0.7, -r*1.6, 0);
        ctx.quadraticCurveTo(-r*0.8, r*0.25, 0, r*0.3);
        ctx.quadraticCurveTo(r*0.8, r*0.25, r*1.6, 0);
        ctx.quadraticCurveTo(r*0.8, -r*0.7, 0, 0);
        ctx.fill(); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    if (tema === 'hrad'){
      ctx.globalAlpha = .55; ctx.fillStyle = '#fff8d6';
      ctx.beginPath(); ctx.arc(820, 96, 32, 0, 6.3); ctx.fill();
      ctx.fillStyle = s.neboA;
      ctx.beginPath(); ctx.arc(806, 88, 27, 0, 6.3); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // disko
  if (s.dekor === 'disco'){
    for (let i=0;i<8;i++){
      ctx.globalAlpha = .12 + Math.sin(animCas*3 + i)*0.05;
      ctx.fillStyle = ['#ff6b6b','#ffd166','#7bed9f','#54a0ff','#c77dff','#ff9f1c','#2ec4b6','#ff6b9d'][i];
      const x = opak(i*150 - kamera*0.45 + Math.sin(animCas*2+i)*70, Š+220) - 110;
      ctx.beginPath(); ctx.moveTo(Š/2, -40); ctx.lineTo(x, V); ctx.lineTo(x+120, V); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const bx = Š/2 + Math.sin(animCas)*130;
    zare('#fff', 26, () => {
      const bg = ctx.createRadialGradient(bx-8, 62, 4, bx, 70, 26);
      bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#9aa4c8');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bx, 70, 24, 0, 6.3); ctx.fill();
    });
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
    for (let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.moveTo(bx-24, 70+i*9); ctx.lineTo(bx+24, 70+i*9); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(bx, 70, Math.abs(i*9), 24, 0, 0, 6.3); ctx.stroke();
    }
  }
}

function kresliSteny(s){
  const LK = L.LK;
  const odI = Math.max(0, Math.floor(kamera/KROK) - 2);
  const doI = Math.min(LK.length-1, Math.ceil((kamera+Š)/KROK) + 2);
  const okrajY = (i, dolni) => LK[i].s + (dolni ? LK[i].m/2 : -LK[i].m/2);

  for (const dolni of [false, true]){
    const cestaZdi = () => {
      ctx.beginPath();
      ctx.moveTo(odI*KROK - kamera, dolni ? V+12 : -12);
      for (let i=odI;i<=doI;i++) ctx.lineTo(i*KROK - kamera, okrajY(i, dolni));
      ctx.lineTo(doI*KROK - kamera, dolni ? V+12 : -12);
      ctx.closePath();
    };
    // tělo stěny s přechodem
    const g = ctx.createLinearGradient(0, dolni ? V : 0, 0, dolni ? V*0.45 : V*0.55);
    g.addColorStop(0, s.neboA);
    g.addColorStop(1, s.zed);
    ctx.fillStyle = g; cestaZdi(); ctx.fill();

    // pruhy pro strukturu — jen vevnitř stěny
    ctx.save();
    cestaZdi(); ctx.clip();
    ctx.globalAlpha = .09; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8;
    const o = ((kamera*0.6) % 36);
    for (let x = -o - 60; x < Š + 80; x += 36){
      ctx.beginPath();
      ctx.moveTo(x, dolni ? V+20 : -20);
      ctx.lineTo(x + (dolni ? 70 : -70), dolni ? -20 : V+20);
      ctx.stroke();
    }
    ctx.restore();

    // svítící hrana
    const cesta = () => {
      ctx.beginPath();
      for (let i=odI;i<=doI;i++){
        const x = i*KROK - kamera, y = okrajY(i, dolni);
        i===odI ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
    };
    ctx.lineCap = 'round';
    zare(s.hrana, 20 + pulz*16, () => {
      ctx.strokeStyle = s.hrana; ctx.lineWidth = 5 + pulz*2.2; cesta(); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.6; cesta(); ctx.stroke();
  }
}
// tmavší rohy — hra pak vypadá „zaostřená" doprostřed
function vinetace(){
  const g = ctx.createRadialGradient(Š/2, V/2, V*0.35, Š/2, V/2, V*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = g; ctx.fillRect(0,0,Š,V);
}

function kresliSekac(x, y, r, uhel){
  zare('#dfe6f5', 14, () => {
    const g = ctx.createRadialGradient(x-r*0.3, y-r*0.3, r*0.1, x, y, r*1.3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#c3cbe0'); g.addColorStop(1, '#7d86a3');
    ctx.fillStyle = g;
    cestaPilka(x, y, r, uhel, Math.max(7, Math.round(r/2.4))); ctx.fill();
  });
  ctx.strokeStyle = 'rgba(20,18,31,.55)'; ctx.lineWidth = 1.4;
  cestaPilka(x, y, r, uhel, Math.max(7, Math.round(r/2.4))); ctx.stroke();
  ctx.fillStyle = '#3b4260';
  ctx.beginPath(); ctx.arc(x, y, r*0.34, 0, 6.3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r*0.34, uhel, uhel + 2); ctx.stroke();
}
function kresliPilkyZed(s){
  for (const p of L.pilkyZed){
    if (Math.abs(p.x - kamera - 300) > 900) continue;
    const b = L.bodNa(p.x);
    const od = p.odsazeni || 0;
    const y = b.s + (p.kde === 'nahore' ? -b.m/2 + od : b.m/2 - od);
    kresliSekac(p.x - kamera, y, p.r, animCas*(p.velka ? 1.1 : 4)*p.smer + p.faze);
  }
}
function kresliBloky(s){
  for (const bl of L.bloky){
    if (bl.x + bl.sirka < kamera - 100 || bl.x > kamera + Š + 100) continue;
    const x = bl.x - kamera;
    const nahore = bl.kde === 'nahore';
    const od = bl.odsazeni || 0;
    const zn = nahore ? 1 : -1;
    // horní/dolní obrys bloku sleduje stěnu
    const cesta = () => {
      ctx.beginPath();
      for (let q = 0; q <= bl.sirka; q += 20){
        const b = L.bodNa(bl.x + q);
        const yz = b.s + (nahore ? -b.m/2 : b.m/2) + zn*od;
        q ? ctx.lineTo(x + q, yz) : ctx.moveTo(x + q, yz);
      }
      for (let q = bl.sirka; q >= 0; q -= 10){
        const b = L.bodNa(bl.x + q);
        let cast = 1;
        if (bl.sklon){ const u = q/bl.sirka; cast = bl.sklon > 0 ? u : 1 - u; }
        const yz = b.s + (nahore ? -b.m/2 : b.m/2) + zn*(od + bl.vyska*cast);
        ctx.lineTo(x + q, yz);
      }
      ctx.closePath();
    };
    const b0 = L.bodNa(bl.x);
    const yv = b0.s + (nahore ? -b0.m/2 : b0.m/2) + zn*od;
    const g = ctx.createLinearGradient(0, yv, 0, yv + zn*bl.vyska);
    g.addColorStop(0, s.zed); g.addColorStop(1, '#0d0b16');
    ctx.fillStyle = g; cesta(); ctx.fill();
    zare(s.hrana, 14, () => {
      ctx.strokeStyle = s.hrana; ctx.lineWidth = 3.5; cesta(); ctx.stroke();
    });
    // vnitřní čtverečky jako v GD
    ctx.save(); cesta(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
    for (let q = 0; q <= bl.sirka; q += 20){
      ctx.beginPath(); ctx.moveTo(x + q, yv - 60); ctx.lineTo(x + q, yv + 60); ctx.stroke();
    }
    ctx.restore();
  }
}
function kresliPrekazky(s){
  for (const pr of L.prekazky){
    if (Math.abs(pr.x - kamera - 300) > 900) continue;
    const body = tvarPrekazky(pr).map(([a,b]) => [a - kamera, b]);
    const cesta = () => {
      ctx.beginPath();
      body.forEach(([a,b], i) => i ? ctx.lineTo(a,b) : ctx.moveTo(a,b));
      ctx.closePath();
    };
    if (pr.tvar === 'bodlina'){
      const g = ctx.createLinearGradient(body[0][0], body[0][1], body[1][0], body[1][1]);
      g.addColorStop(0,'#8e97b5'); g.addColorStop(.55,'#f2f5ff'); g.addColorStop(1,'#ffffff');
      zare(s.hrana, 10, () => { ctx.fillStyle = g; cesta(); ctx.fill(); });
      ctx.strokeStyle = 'rgba(20,18,31,.55)'; ctx.lineWidth = 1.6; cesta(); ctx.stroke();
    } else {
      const g = ctx.createLinearGradient(0, pr.y, 0, pr.y + (pr.smer||1)*(pr.vyska||46));
      g.addColorStop(0, s.zed); g.addColorStop(1, '#0d0b16');
      ctx.fillStyle = g; cesta(); ctx.fill();
      zare(s.hrana, 14, () => { ctx.strokeStyle = s.hrana; ctx.lineWidth = 3.5; cesta(); ctx.stroke(); });
      ctx.save(); cesta(); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
      for (let q = -((pr.sirka||100)/2); q <= (pr.sirka||100)/2; q += 20){
        ctx.beginPath(); ctx.moveTo(pr.x + q - kamera, pr.y - 200);
        ctx.lineTo(pr.x + q - kamera, pr.y + 200); ctx.stroke();
      }
      ctx.restore();
    }
  }
}
function kresliBodliny(s){
  for (const sp of L.spiky){
    if (Math.abs(sp.x - kamera - 300) > 900) continue;
    const bl = L.bodNa(sp.x - sp.sirka/2), bp = L.bodNa(sp.x + sp.sirka/2), bs = L.bodNa(sp.x);
    const nahore = sp.kde === 'nahore';
    const od = sp.odsazeni || 0, zn = nahore ? 1 : -1;
    const x1 = sp.x - sp.sirka/2 - kamera, x2 = sp.x + sp.sirka/2 - kamera;
    const xh = sp.x + (sp.naklon || 0)*(sp.sirka/2) - kamera;
    const y1 = bl.s + (nahore ? -bl.m/2 : bl.m/2) + zn*od;
    const y2 = bp.s + (nahore ? -bp.m/2 : bp.m/2) + zn*od;
    const bh = L.bodNa(sp.x + (sp.naklon || 0)*(sp.sirka/2));
    const yh = bh.s + (nahore ? -bh.m/2 : bh.m/2) + zn*(od + sp.vyska);

    const cesta = () => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(xh,yh); ctx.lineTo(x2,y2); ctx.closePath(); };
    const g = ctx.createLinearGradient(x1, y1, xh, yh);
    g.addColorStop(0, '#8e97b5'); g.addColorStop(0.55, '#f2f5ff'); g.addColorStop(1, '#ffffff');
    zare(s.hrana, 10, () => { ctx.fillStyle = g; cesta(); ctx.fill(); });
    ctx.strokeStyle = 'rgba(20,18,31,.55)'; ctx.lineWidth = 1.6; cesta(); ctx.stroke();
    // lesk na hrotu
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xh, yh); ctx.lineTo((x1+xh)/2, (y1+yh)/2); ctx.stroke();
  }
}

function kresliRaketku(){
  if (hrac.mrtvy > 0) return;
  const nahoru = hrac.obraceny ? !hrac.drzi : hrac.drzi;
  const uhel = hrdina.hrot ? (nahoru ? -Math.PI/4 : Math.PI/4) : (nahoru ? -0.4 : 0.4);
  const zm = (hrac.maly ? 0.58 : 1) * (obriRaketka ? 1.6 : 1);
  const r = 20 * zm;
  const x = hrac.x - kamera, y = hrac.y;

  // plamínek za hrdinou
  const p = 1 + Math.sin(animCas*40)*0.3;
  const sx = x - Math.cos(uhel)*r*1.1, sy = y - Math.sin(uhel)*r*1.1;
  zare('#ff9f1c', 20, () => {
    const pg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r*0.95*p);
    pg.addColorStop(0, 'rgba(255,255,200,.95)');
    pg.addColorStop(0.5, 'rgba(255,159,28,.7)');
    pg.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(sx, sy, r*0.95*p, 0, 6.3); ctx.fill();
  });
  kresliHrdinuTvar(hrdina, x, y, r, uhel);
  if (hrac.obraceny){
    ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, r*1.6, 0.6, 4.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r*1.6, 3.7, 6.9); ctx.stroke();
  }
}

function kresliStopu(s){
  if (stopa.length < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (duhovaStopa){
    ctx.lineWidth = 7; ctx.globalAlpha = .85;
    for (let i=1;i<stopa.length;i++){
      ctx.strokeStyle = 'hsl(' + Math.round((i*9 + animCas*120) % 360) + ',95%,62%)';
      ctx.beginPath();
      ctx.moveTo(stopa[i-1].x - kamera, stopa[i-1].y);
      ctx.lineTo(stopa[i].x - kamera, stopa[i].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    return;
  }
  const barvaStopy = barvaHrdiny();
  for (let v=0; v<2; v++){
    ctx.strokeStyle = v ? '#ffffff' : barvaStopy;
    ctx.lineWidth = v ? 2 : 7;
    ctx.globalAlpha = v ? .5 : .75;
    ctx.shadowColor = barvaStopy; ctx.shadowBlur = v ? 0 : 12;
    ctx.beginPath(); ctx.moveTo(stopa[0].x - kamera, stopa[0].y);
    for (const b of stopa) ctx.lineTo(b.x - kamera, b.y);
    ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function kresli(){
  tlacitka = [];
  const s = SVETY[L.svet];
  kamera = omez((stav === 'menu' ? 300 : hrac.x) - 240, 0, Math.max(0, L.DELKA - Š + 200));

  ctx.clearRect(0,0,Š,V);
  ctx.save();
  if (otres > 0) ctx.translate(nah(-otres,otres), nah(-otres,otres));

  kresliPozadi(s, L.svet);
  kresliSteny(s);
  kresliPrekazky(s);
  kresliBloky(s);
  kresliBodliny(s);
  kresliPilkyZed(s);

  // brány na rychlost — barevná stěna světla se šipkami
  for (const b of L.brany){
    if (Math.abs(b.x - kamera - 300) > 900) continue;
    const c = L.bodNa(b.x);
    const barva = b.nasobek > 1 ? '#ff9f1c' : '#7bed9f';
    const x = b.x - kamera, y1 = c.s - c.m/2 + 3, y2 = c.s + c.m/2 - 3;
    ctx.globalAlpha = b.vzato ? .25 : 1;
    const g = ctx.createLinearGradient(x-16, 0, x+16, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, barva); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha *= .35; ctx.fillStyle = g; ctx.fillRect(x-16, y1, 32, y2-y1);
    ctx.globalAlpha = b.vzato ? .25 : 1;
    zare(barva, 18, () => {
      ctx.strokeStyle = barva; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
    });
    for (let k = 0; k < 3; k++){
      const yy = y1 + (y2-y1) * ((k+1)/4) + Math.sin(animCas*4 + k)*3;
      kresliSipkuBrany(x, yy, 13, b.nasobek < 1, '#ffffff');
    }
    ctx.globalAlpha = 1;
  }
  // portály na obrácení — vířící kruh
  for (const p of L.portaly){
    if (Math.abs(p.x - kamera - 300) > 900) continue;
    const c = L.bodNa(p.x);
    const x = p.x - kamera;
    ctx.globalAlpha = p.vzato ? .28 : 1;
    zare('#c77dff', 22, () => {
      ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(x, c.s, 17 + Math.sin(animCas*5)*3, c.m/2 - 6, 0, 0, 6.3); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const s2 of [1, -1]){
      ctx.beginPath();
      ctx.arc(x, c.s, 15, animCas*3*s2, animCas*3*s2 + 2.1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // mini úseky
  for (const m of L.mini){
    if (m.do < kamera - 200 || m.od > kamera + Š + 200) continue;
    const odX = Math.max(m.od, kamera - 100), doX = Math.min(m.do, kamera + Š + 100);
    ctx.globalAlpha = .10; ctx.fillStyle = '#00d9ff';
    ctx.beginPath(); ctx.moveTo(odX - kamera, 0);
    for (let x = odX; x <= doX; x += KROK){ const c = L.bodNa(x); ctx.lineTo(x - kamera, c.s - c.m/2); }
    for (let x = doX; x >= odX; x -= KROK){ const c = L.bodNa(x); ctx.lineTo(x - kamera, c.s + c.m/2); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    for (const [x, dolu] of [[m.od, true], [m.do, false]]){
      if (Math.abs(x - kamera - 300) > 900) continue;
      const c = L.bodNa(x);
      zare('#00d9ff', 22, () => {
        ctx.strokeStyle = '#00d9ff'; ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.ellipse(x-kamera, c.s, 15 + Math.sin(animCas*6)*3, c.m/2 - 6, 0, 0, 6.3);
        ctx.stroke();
      });
      // trojúhelníček dolů = zmenšit, nahoru = zvětšit
      ctx.fillStyle = '#ffffff';
      const yy = c.s + Math.sin(animCas*4)*3;
      ctx.beginPath();
      if (dolu){ ctx.moveTo(x-kamera-11, yy-8); ctx.lineTo(x-kamera+11, yy-8); ctx.lineTo(x-kamera, yy+10); }
      else     { ctx.moveTo(x-kamera-11, yy+8); ctx.lineTo(x-kamera+11, yy+8); ctx.lineTo(x-kamera, yy-10); }
      ctx.closePath(); ctx.fill();
    }
  }
  // praporky = zelená čára přes celou chodbu
  for (const p of L.praporky){
    if (Math.abs(p.x - kamera - 300) > 900) continue;
    const c = L.bodNa(p.x);
    const x = p.x - kamera, y1 = c.s - c.m/2 + 2, y2 = c.s + c.m/2 - 2;
    if (p.vzato){
      zare('#31ff8f', 20, () => {
        ctx.strokeStyle = '#31ff8f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
      });
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(120,255,180,.45)'; ctx.lineWidth = 4;
      ctx.setLineDash([9, 9]);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // trénink — kde tě to vrátí
  if (trenink && trenBod && stav === 'hra'){
    const x = trenBod.x - kamera;
    ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 2; ctx.setLineDash([5,6]);
    ctx.beginPath(); ctx.arc(x, trenBod.y, 16, 0, 6.3); ctx.stroke();
    ctx.setLineDash([]);
  }
  // hvězdičky
  for (const h of L.hvezdy){
    if (h.vzato || Math.abs(h.x - kamera - 300) > 900) continue;
    const x = h.x - kamera, y = h.y + Math.sin(animCas*4 + h.faze)*5;
    const r = h.velka ? 22 : 13;
    const u = animCas*1.2 + h.faze;
    zare('#ffd166', h.velka ? 26 : 16, () => {
      const g = ctx.createRadialGradient(x, y, 1, x, y, r);
      g.addColorStop(0, '#fffbe6'); g.addColorStop(1, '#ffb703');
      ctx.fillStyle = g;
      cestaHvezda(x, y, r, r*0.44, 5, u - Math.PI/2); ctx.fill();
    });
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    cestaHvezda(x, y, r, r*0.44, 5, u - Math.PI/2); ctx.stroke();
  }
  // potvory
  for (const p of L.potvory){
    if (Math.abs(p.x - kamera - 300) > 900) continue;
    const x = p.x - kamera;
    if (p.typ === 'pilka'){
      // dráha, po které se sekáč houpe
      if (!p.maly){
        ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4,6]);
        ctx.beginPath(); ctx.moveTo(x, p.zaklad - p.rozsah); ctx.lineTo(x, p.zaklad + p.rozsah);
        ctx.stroke(); ctx.setLineDash([]);
      }
      kresliSekac(x, p.y, p.r || 16, animCas*(p.maly ? 11 : 6));
    } else {
      const blizko = p.typ === 'chytra' && Math.abs(p.x - hrac.x) < 520 && stav === 'hra';
      kresliPotvoru(x, p.y, blizko ? 18 : 15, s.hrana, hrac.x - kamera, hrac.y, animCas + p.faze);
      if (blizko){
        ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, p.y, 26 + Math.sin(animCas*8)*3, 0, 6.3); ctx.stroke();
      }
    }
  }
  // boss
  if (L.boss && stav === 'hra' && hrac.x > L.boss.od - 900){
    const bs = L.boss;
    if (bs.hp > 0){
      const bx = bs.x - kamera, r = 46 + Math.sin(animCas*6)*2;
      // rohy
      ctx.fillStyle = '#5a1030';
      for (const sg of [-1, 1]){
        ctx.beginPath();
        ctx.moveTo(bx + sg*r*0.60, bs.y - r*0.58);
        ctx.lineTo(bx + sg*r*1.00, bs.y - r*1.30);
        ctx.lineTo(bx + sg*r*0.24, bs.y - r*0.86);
        ctx.closePath(); ctx.fill();
      }
      zare('#ff3860', 26, () => {
        const g = ctx.createRadialGradient(bx - r*0.3, bs.y - r*0.3, r*0.2, bx, bs.y, r);
        g.addColorStop(0, '#ff7a9c'); g.addColorStop(1, '#8b0f3a');
        ctx.fillStyle = g;
        cestaHvezda(bx, bs.y, r, r*0.84, 12, animCas*0.4); ctx.fill();
      });
      kresliOci(bx, bs.y - r*0.12, r*0.9, hrac.x - kamera, hrac.y);
      ctx.strokeStyle = '#3a0f26'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(bx, bs.y + r*0.26, r*0.42, 0.3, Math.PI - 0.3); ctx.stroke();
      for (let i=0;i<3;i++) kresliSrdicko(bx - 26 + i*26, bs.y - r - 24, 9, i < bs.hp);
    }
    for (const st of bs.strely){
      const sx = st.x - kamera;
      zare('#ff6b6b', 18, () => {
        const g = ctx.createRadialGradient(sx, st.y, 2, sx, st.y, 14);
        g.addColorStop(0, '#fff'); g.addColorStop(1, '#ff3860');
        ctx.fillStyle = g;
        cestaHvezda(sx, st.y, 14, 6, 6, animCas*5); ctx.fill();
      });
    }
  }
  // cíl — šachovnicová stěna
  if (L.DELKA - kamera < Š + 200){
    const x = L.DELKA - kamera;
    zare('#ffffff', 24, () => {
      for (let y = 0; y < V; y += 18){
        ctx.fillStyle = (Math.floor(y/18) % 2) ? '#ffffff' : '#14121f';
        ctx.fillRect(x - 9, y, 9, 18);
        ctx.fillStyle = (Math.floor(y/18) % 2) ? '#14121f' : '#ffffff';
        ctx.fillRect(x, y, 9, 18);
      }
    });
  }

  // duch nejlepšího průletu
  const duch = duchove[L.n];
  if (duch && stav === 'hra' && duch.body.length > 2){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 3;
    ctx.setLineDash([7, 9]); ctx.lineCap = 'round';
    ctx.beginPath();
    let prvni = true, blizky = null;
    for (const b of duch.body){
      if (b.x < kamera - 60 || b.x > kamera + Š + 60) continue;
      prvni ? (ctx.moveTo(b.x - kamera, b.y), prvni = false) : ctx.lineTo(b.x - kamera, b.y);
      if (!blizky || Math.abs(b.x - hrac.x) < Math.abs(blizky.x - hrac.x)) blizky = b;
    }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    if (blizky && Math.abs(blizky.x - hrac.x) < 40){
      ctx.globalAlpha = .35;
      kresliHrdinuTvar(hrdina, blizky.x - kamera, blizky.y, 15, -Math.PI/4);
      ctx.globalAlpha = 1;
    }
  }

  kresliStopu(s);
  if (stav === 'hra') kresliRaketku();
  efektyKresli();
  vinetace();
  ctx.restore();

  if (zablesk > 0){ ctx.fillStyle = 'rgba(255,255,255,' + (zablesk*0.45) + ')'; ctx.fillRect(0,0,Š,V); }

  if (stav === 'hra') kresliHUD(s);
  if (stav === 'menu') kresliMenu();
  if (stav === 'mapa') kresliMapu();
  if (stav === 'editor') kresliEditor();
  if (stav === 'konec') kresliKonec();
  if (chat.otevren) kresliChat();
}

function kresliEdVec(ob, s, alfa){
  const x = edX(ob.x);
  if (x < -220 || x > Š + 220) return;
  ctx.globalAlpha = alfa;
  const b = edStred(ob.x);
  const yN = b.s - b.m/2, yD = b.s + b.m/2;
  if (!isFinite(ob.y)) ob = Object.assign({}, ob, { y: Math.round(b.s) });
  switch (ob.typ){
    case 'tvar':
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.setLineDash([4,5]);
      ctx.beginPath(); ctx.moveTo(x, yN); ctx.lineTo(x, yD); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(x, ob.y, 6, 0, 6.3); ctx.fill();
      break;
    case 'sekac': case 'pilkaZed': case 'pilkaStred':
      kresliSekac(x, ob.y, ob.r || 20, animCas*(ob.houpe ? 6 : 3));
      if (ob.houpe){
        ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2; ctx.setLineDash([4,6]);
        ctx.beginPath(); ctx.moveTo(x, ob.y - (ob.rozsah||34)); ctx.lineTo(x, ob.y + (ob.rozsah||34));
        ctx.stroke(); ctx.setLineDash([]);
      }
      break;
    case 'roj':
      for (let k=0;k<3;k++)
        kresliSekac(x + k*66, ob.y + (k%2 ? 1 : -1)*(ob.rozestup||42), ob.r || 10, animCas*11);
      break;
    case 'bodlina': case 'bodlinaSikma': case 'blok': case 'rampa': {
      const pr = { tvar: (ob.typ === 'blok' || ob.typ === 'rampa') ? 'blok' : 'bodlina',
                   x: ob.x, y: ob.y, sirka: ob.sirka, vyska: ob.vyska,
                   smer: ob.smer || 1, naklon: ob.naklon || 0, sklon: ob.sklon || 0 };
      const body = tvarPrekazky(pr).map(([a,b]) => [edX(a), b]);
      const cesta = () => { ctx.beginPath();
        body.forEach(([a,b], i) => i ? ctx.lineTo(a,b) : ctx.moveTo(a,b)); ctx.closePath(); };
      if (pr.tvar === 'bodlina'){
        const g = ctx.createLinearGradient(body[0][0], body[0][1], body[1][0], body[1][1]);
        g.addColorStop(0,'#8e97b5'); g.addColorStop(.55,'#f2f5ff'); g.addColorStop(1,'#ffffff');
        ctx.fillStyle = g; cesta(); ctx.fill();
        ctx.strokeStyle = 'rgba(20,18,31,.5)'; ctx.lineWidth = 1.4; ctx.stroke();
      } else {
        ctx.fillStyle = '#0d0b16'; ctx.strokeStyle = s.hrana; ctx.lineWidth = 3;
        cesta(); ctx.fill(); ctx.stroke();
      }
      break;
    }
    case 'branaPlus': case 'branaMinus': {
      const bar = ob.typ === 'branaPlus' ? '#ff9f1c' : '#7bed9f';
      zare(bar, 14, () => { ctx.strokeStyle = bar; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(x, yN+3); ctx.lineTo(x, yD-3); ctx.stroke(); });
      kresliSipkuBrany(x, b.s, 13, ob.typ === 'branaMinus', '#fff');
      break;
    }
    case 'portal':
      zare('#c77dff', 16, () => { ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.ellipse(x, b.s, 15, b.m/2 - 6, 0, 0, 6.3); ctx.stroke(); });
      break;
    case 'mini':
      ctx.fillStyle = 'rgba(0,217,255,.14)';
      ctx.fillRect(x, yN, ob.delka || 1200, yD - yN);
      zare('#00d9ff', 16, () => { ctx.strokeStyle = '#00d9ff'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.ellipse(x, b.s, 14, b.m/2 - 6, 0, 0, 6.3); ctx.stroke(); });
      break;
    case 'hvezda':
      ctx.fillStyle = '#ffd166'; cestaHvezda(x, ob.y, 13, 6, 5, -Math.PI/2); ctx.fill();
      break;
    case 'praporek':
      zare('#31ff8f', 16, () => { ctx.strokeStyle = '#31ff8f'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(x, yN+2); ctx.lineTo(x, yD-2); ctx.stroke(); });
      break;
  }
  ctx.globalAlpha = 1;
}
// co by se položilo, kdybys teď kliknul (bez pokládání)
function edNahledVec(){
  const x = Math.round((mys.x + editor.posun)/20)*20;
  const k = VELIKOSTI[editor.velikost].k;
  const n = editor.nastroj;
  const y = pripniY(x, Math.round(mys.y/10)*10);     // volně kamkoliv, jen se přichytí na hrany
  switch (n){
    case 'tvar':        return { typ:n, x, y, m: SIRKY[editor.sirka].m };
    case 'bodlina': case 'bodlinaSikma':
      return { typ:n, x, y, vyska: Math.round(44*k), sirka: Math.round(46*k),
               smer: editor.smer, naklon: n === 'bodlinaSikma' ? editor.otoceni : 0 };
    case 'blok': case 'rampa':
      return { typ:n, x, y, vyska: Math.round(46*k), sirka: Math.round(100*k),
               smer: editor.smer, sklon: n === 'rampa' ? editor.otoceni : 0 };
    case 'sekac':       return { typ:n, x, y, r: Math.round(20*k),
                                 rozsah: Math.round(34*k), houpe: editor.houpani };
    case 'roj':         return { typ:n, x, y, r: Math.round(10*k),
                                 rozestup: Math.round(42*k), houpe: editor.houpani };
    case 'hvezda':      return { typ:n, x, y };
    case 'mini':        return { typ:n, x, delka: Math.round(1200*k) };
    case 'guma':        return null;
    default:            return { typ:n, x };
  }
}

function kresliEditor(){
  const s = SVETY[vybranySvet || 'vesmir'];
  const g = ctx.createLinearGradient(0,0,0,V);
  g.addColorStop(0, s.neboA); g.addColorStop(1, s.neboB);
  ctx.fillStyle = g; ctx.fillRect(0,0,Š,V);

  // mřížka (dá se vypnout)
  if (editor.mrizka){
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    const o = editor.posun % 40;
    for (let x = -o; x < Š; x += 40){ ctx.beginPath(); ctx.moveTo(x, ED_ODY); ctx.lineTo(x, ED_DOY); ctx.stroke(); }
    for (let y = ED_ODY; y < ED_DOY; y += 40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(Š,y); ctx.stroke(); }
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(0, ED_ODY, Š, ED_DOY - ED_ODY); ctx.clip();

  // chodba
  const cesta = (dolni) => {
    ctx.beginPath();
    for (let sx = -40; sx <= Š + 40; sx += 20){
      const b = edStred(sx + editor.posun);
      const y = b.s + (dolni ? b.m/2 : -b.m/2);
      sx === -40 ? ctx.moveTo(sx, y) : ctx.lineTo(sx, y);
    }
  };
  for (const dolni of [false, true]){
    ctx.fillStyle = '#0b0a14';
    cesta(dolni);
    ctx.lineTo(Š+40, dolni ? V+40 : -40); ctx.lineTo(-40, dolni ? V+40 : -40);
    ctx.closePath(); ctx.fill();
    zare(s.hrana, 14, () => { ctx.strokeStyle = s.hrana; ctx.lineWidth = 4; cesta(dolni); ctx.stroke(); });
  }

  // označený úsek na kopírování
  if (editor.oznaceniOd !== null){
    const a = edX(editor.oznaceniOd), b2 = edX(editor.oznaceniDo !== null ? editor.oznaceniDo : editor.oznaceniOd);
    ctx.fillStyle = 'rgba(255,209,102,.13)';
    ctx.fillRect(Math.min(a,b2), ED_ODY, Math.abs(b2-a), ED_DOY - ED_ODY);
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    ctx.strokeRect(Math.min(a,b2), ED_ODY+1, Math.abs(b2-a), ED_DOY - ED_ODY - 2);
    ctx.setLineDash([]);
  }

  // objekty
  for (const ob of editor.objekty) kresliEdVec(ob, s, 1);

  // náhled: přímo ta věc, co máš vybranou, plus malé plusko na kurzoru
  if (mys.y > ED_ODY && mys.y < ED_DOY){
    if (editor.nastroj === 'guma'){
      ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(mys.x, mys.y, 20, 0, 6.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mys.x-9, mys.y-9); ctx.lineTo(mys.x+9, mys.y+9);
      ctx.moveTo(mys.x+9, mys.y-9); ctx.lineTo(mys.x-9, mys.y+9); ctx.stroke();
    } else if (editor.nastroj === 'oznac'){
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(mys.x, ED_ODY); ctx.lineTo(mys.x, ED_DOY); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      const nahled = edNahledVec();
      if (nahled) kresliEdVec(nahled, s, .5);
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mys.x - 9, mys.y); ctx.lineTo(mys.x + 9, mys.y);
      ctx.moveTo(mys.x, mys.y - 9); ctx.lineTo(mys.x, mys.y + 9);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(mys.x, mys.y, 12, 0, 6.3); ctx.stroke();
    }
  }
  ctx.restore();

  // horní pruh
  ctx.fillStyle = 'rgba(10,11,22,.94)'; ctx.fillRect(0,0,Š,ED_ODY-4);
  ctx.textAlign = 'left'; ctx.font = 'bold 21px system-ui'; ctx.fillStyle = '#fff';

  ctx.font = '13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText('Položí se to přesně tam, kam klikneš — i doprostřed.', 20, 44);
  ctx.fillText('Táhni po kliknutí = velikost. Z = krok zpět.', 20, 62);
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.fillText('věcí: ' + editor.objekty.length + '   ·   ' + Math.round(editor.posun) +
               ' / ' + editor.delka + ' px' +
               (editor.schranka.length ? '   ·   ve schránce: ' + editor.schranka.length : ''), 20, 79);
  ctx.textAlign = 'center';

  const bx = Š - 452;
  tlacitko(bx,      6, 104, 26, 'šířka: ' + SIRKY[editor.sirka].jmeno,
           () => { editor.sirka = (editor.sirka+1) % SIRKY.length; zvuk.klik(); }, '#54a0ff');
  tlacitko(bx+108,  6, 110, 26, 'let: ' + RYCHLOSTI[editor.rychlost].jmeno,
           () => { editor.rychlost = (editor.rychlost+1) % RYCHLOSTI.length; zvuk.klik(); }, '#54a0ff');
  tlacitko(bx+222,  6, 118, 26, 'hudba: ' + HUDBY[editor.hudba].jmeno,

  tlacitko(bx,     36, 200, 28, '▶  ZKUSIT LEVEL', () => zkusVlastni(0), '#ffd166');
  tlacitko(bx+206, 36, 106, 28, '↶ ZPĚT (Z)', () => edZpet(), '#7bed9f');
  tlacitko(bx+318, 36, 110, 28, 'ULOŽ KÓD', () => {

  tlacitko(bx+372, 68,  56, 24, 'menu', () => { stav = 'menu'; zvuk.klik(); }, '#c77dff');

  // posuvník
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.roundRect(20, ED_DOY + 4, Š-40, 5, 3); ctx.fill();
  ctx.fillStyle = '#ffd166';

  ctx.beginPath();
  ctx.roundRect(20 + (Š-40-pw) * (editor.posun/(editor.delka-400)), ED_DOY + 4, pw, 5, 3); ctx.fill();

  // paleta nástrojů
  const naRadku = 9, šn = 102, vn = 40, y00 = ED_DOY + 10;
  NASTROJE.forEach((nst, i) => {
    const radek = Math.floor(i / naRadku);
    const x = 8 + (i % naRadku) * (šn + 2);
    const y0 = y00 + radek * (vn + 4);
    const vyb = editor.nastroj === nst.id;
    tlacitka.push({ x, y:y0, s:šn, v:vn, akce: () => { editor.nastroj = nst.id; zvuk.klik(); } });
    const podM = mys.x>x && mys.x<x+šn && mys.y>y0 && mys.y<y0+vn;
    ctx.fillStyle = vyb ? 'rgba(255,209,102,.3)' : (podM ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.07)');

// ============ MAPA LEVELŮ ============
function kresliMapu(){
  const g = ctx.createLinearGradient(0,0,0,V);
  g.addColorStop(0,'#141833'); g.addColorStop(1,'#0a0b16');
  ctx.fillStyle = g; ctx.fillRect(0,0,Š,V);
  for (const h of hvezdicky){
    const y = ((h.y + mapaY*0.06) % V + V) % V;
    ctx.globalAlpha = h.h*.5; ctx.fillStyle = '#fff'; ctx.fillRect(h.x, y, h.r, h.r);
  }
  ctx.globalAlpha = 1;

  const odN = Math.max(1, Math.floor((mapaY - 200)/ROZESTUP));
  const doN = Math.min(POCET_LEVELU, Math.ceil((mapaY + V + 200)/ROZESTUP) + 1);

  // chodníček
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#3a3f66'; ctx.lineWidth = 26;
  ctx.beginPath();
  for (let n = odN; n <= doN; n++){
    const x = mapaX(n), y = mapaObrY(n);
    n === odN ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 3;
  ctx.setLineDash([10, 12]);
  ctx.beginPath();
  for (let n = odN; n <= doN; n++){
    const x = mapaX(n), y = mapaObrY(n);
    n === odN ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  // políčka levelů
  for (let n = odN; n <= doN; n++){
    const x = mapaX(n), y = mapaObrY(n);
    if (y < 96 || y > V + 60) continue;
    const ob = obtiznost(n);
    const pohar = (n % 10 === 0);
    const tisic = (n === POCET_LEVELU);
    const vybrany = (n === levelCislo);
    const zamceny = jeZamceny(n);
    const rr = tisic ? 30 : pohar ? 25 : 19;

    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(x, y + rr + 6, rr*0.8, 5, 0, 0, 6.3); ctx.fill();

    ctx.globalAlpha = zamceny ? .42 : 1;
    ctx.fillStyle = zamceny ? '#5a5f78' : ob.barva;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.3); ctx.fill();
    ctx.strokeStyle = vybrany ? '#fff' : 'rgba(0,0,0,.45)';
    ctx.lineWidth = vybrany ? 4 : 2;
    if (vybrany){ ctx.shadowColor = '#fff'; ctx.shadowBlur = 16; }
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.3); ctx.stroke(); ctx.shadowBlur = 0;

    ctx.fillStyle = zamceny ? 'rgba(255,255,255,.75)' : '#101020';
    ctx.font = 'bold ' + (tisic ? 16 : pohar ? 15 : 13) + 'px system-ui';
    ctx.fillText(n, x, y + 1);
    ctx.globalAlpha = 1;

    ctx.globalAlpha = zamceny ? .5 : 1;
    if (tisic){
      // vlna nad tisíckou
      ctx.strokeStyle = '#00d9ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let k=0;k<=20;k++){
        const wx = x - 26 + k*2.6, wy = y - rr - 18 + Math.sin(k*0.6 + animCas*3)*6;
        k ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy);
      }
      ctx.stroke();
    } else if (pohar) kresliPohar(x, y - rr - 16, 15);
    ctx.globalAlpha = 1;

    if (zamceny)              kresliZamek(x + rr - 3, y - rr + 3, 9);
    else if (n < nejdalLevel) kresliFajfku(x + rr - 2, y - rr + 2, 9);
    else                      kresliHrdinuTvar(hrdina, x + rr + 4, y - rr - 4, 10, -Math.PI/4);
  }

  // nápisy na začátku a na konci chodníčku
  const yTisic = mapaObrY(POCET_LEVELU);
  if (yTisic > 60 && yTisic < V + 60){
    ctx.font = 'bold 30px system-ui'; ctx.fillStyle = '#00d9ff';
    ctx.fillText('TIDAL WAVE', mapaX(POCET_LEVELU), yTisic - 88);
    ctx.font = '16px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('konec chodníčku — ten nejtěžší', mapaX(POCET_LEVELU), yTisic - 64);
  }
  const yStart = mapaObrY(1);
  if (yStart > 60 && yStart < V + 90){
    ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#7bed9f';
    ctx.fillText('START', mapaX(1), Math.min(V - 14, yStart + 46));
  }

  // hlavička a tlačítka
  ctx.fillStyle = 'rgba(10,11,22,.94)'; ctx.fillRect(0,0,Š,72);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('Chodníček levelů', 20, 26);
  ctx.font = '14px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.fillText('Klikni na kolečko a hraješ  •  táhni nahoru  •  odemčeno máš ' + nejdalLevel, 20, 52);
  ctx.textAlign = 'center';

  tlacitko(Š-320, 14, 84, 44, '+100', () => posunMapu(+ROZESTUP*100), '#7c5cff');
  tlacitko(Š-228, 14, 84, 44, '−100', () => posunMapu(-ROZESTUP*100), '#7c5cff');
  tlacitko(Š-136, 14, 116, 44, 'zpátky', () => { stav='menu'; zvuk.klik(); }, '#ffd166');

  // ukazatel, jak vysoko na chodníčku jsi
  const pruhY = 84, pruhV = V - 84 - 20;
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.roundRect(Š-18, pruhY, 8, pruhV, 4); ctx.fill();
  const cast = mapaY / Math.max(1, mapaMax());
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.roundRect(Š-18, pruhY + (1-cast)*(pruhV-40), 8, 40, 4); ctx.fill();

  if (hlaskaCas > 0){
    ctx.globalAlpha = Math.min(1, hlaskaCas);
    ctx.font = 'bold 30px system-ui'; ctx.fillStyle = '#ff6b6b';
    ctx.fillText(hlaska, Š/2, V - 40);
    ctx.globalAlpha = 1;
  }

  // ---- démon vlevo dole ----
  const dx = 22, dy = V - 104;
  tlacitka.push({ x:dx, y:dy, s:96, v:96, akce: () => otevriChat() });
  const pod = mys.x>dx && mys.x<dx+96 && mys.y>dy && mys.y<dy+96;
  ctx.fillStyle = pod ? 'rgba(199,125,255,.30)' : 'rgba(199,125,255,.16)';
  ctx.beginPath(); ctx.roundRect(dx, dy, 96, 96, 16); ctx.fill();
  ctx.strokeStyle = admin ? '#ffd166' : '#c77dff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(dx, dy, 96, 96, 16); ctx.stroke();
  kresliDemona(dx + 48, dy + 40, 26, mys.x, mys.y, animCas);
  ctx.font = 'bold 14px system-ui'; ctx.fillStyle = admin ? '#ffd166' : '#fff';
  ctx.fillText(admin ? 'ADMIN' : 'zeptej se', dx + 48, dy + 80);
  if (!chat.zpravy.length){
    ctx.font = '15px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.textAlign = 'left';
    ctx.fillText('← ten démon něco ví', dx + 106, dy + 48);
    ctx.textAlign = 'center';
  }
}

function kresliHUD(s){
  const w = Š - 120, x0 = 60, y0 = 18;

  const g = ctx.createLinearGradient(x0,0,x0+w,0);

  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x0, y0, Math.max(4, w*post), 14, 7); ctx.fill();
  for (const p of L.praporky){
    const px = x0 + w * (p.x/L.DELKA);
    ctx.fillStyle = p.vzato ? '#7bed9f' : 'rgba(255,255,255,.5)';
    ctx.fillRect(px-1, y0-3, 2, 20);

  ctx.fillText(Math.round(post*100) + ' %', x0 + w*post, y0 + 32);

  // body: kreslená hvězdička + číslo, vedle kreslený křížek pokusů
  cestaHvezda(30, 80, 11, 5, 5, -Math.PI/2);
  ctx.fillStyle = '#ffd166'; ctx.fill();
  ctx.font = 'bold 21px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';

  const šb = ctx.measureText(body).width;

  ctx.fillStyle = '#fff'; ctx.fillText(pokusy, 82 + šb + 12, 81);

  // tečka obtížnosti
  ctx.fillStyle = L.obtiznost.barva;
  ctx.beginPath(); ctx.arc(12, 103, 5, 0, 6.3); ctx.fill();

  kresliZvukIkonu(Š - 34, 80);

  ctx.font = 'bold 20px system-ui';
  if (hrac.nasobek !== 1){
    ctx.fillStyle = hrac.nasobek > 1 ? '#ff9f1c' : '#7bed9f';
    ctx.fillText(hrac.nasobek > 1 ? 'TURBO' : 'POMALU', Š/2, 60);
    kresliSipkuBrany(Š/2 - 62, 60, 11, hrac.nasobek < 1, ctx.fillStyle);
  }
  if (hrac.maly){

    ctx.font = 'bold 17px system-ui'; ctx.fillStyle = '#ff9f1c';

  }
  if (L.n <= 2 && hrac.x < 1400 && stav === 'hra'){
    ctx.globalAlpha = omez((1400 - hrac.x)/500, 0, 1);
    ctx.font = 'bold 30px system-ui'; ctx.fillStyle = '#ffd166';
    ctx.fillText(hrac.drzi ? 'DRŽÍŠ → letíš nahoru ⬆' : 'PUSŤ → letíš dolů ⬇', Š/2, V - 60);
    ctx.globalAlpha = 1;
  }
  if (hlaskaCas > 0){
    ctx.globalAlpha = Math.min(1, hlaskaCas);
    ctx.font = 'bold 30px system-ui'; ctx.fillStyle = '#7bed9f';
    ctx.fillText(hlaska, Š/2, 140); ctx.globalAlpha = 1;
  }
  if (hrac.mrtvy > 0){
    ctx.font = 'bold 34px system-ui'; ctx.fillStyle = '#ff6b6b';
    ctx.fillText('Ajaj! Zpátky k praporku…', Š/2, V/2);
  }
}

function tlacitko(x, y, s, v, popis, akce, barva='#ffd166'){
  tlacitka.push({x, y, s, v, akce});
  const mysUvnitr = mys.x>x && mys.x<x+s && mys.y>y && mys.y<y+v;
  ctx.fillStyle = mysUvnitr ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.roundRect(x, y, s, v, 12); ctx.fill();
  ctx.strokeStyle = barva; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, s, v, 12); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (v < 30 ? 13 : v < 40 ? 17 : 21) + 'px system-ui';
  ctx.fillText(popis, x + s/2, y + v/2);
}

  } else {
    ctx.font = 'bold 21px system-ui'; ctx.fillStyle = '#7bed9f';
    ctx.fillText('Tvůj kód: ' + kodProLevel(nejdalLevel) + '   (napiš ho démonovi, až budeš hrát znovu)', Š/2, 276);
  }

  tlacitko(300, 300, 360, 64,
    vlastniHra ? 'ZPÁTKY DO EDITORU'
      : (levelCislo >= POCET_LEVELU ? 'DOKONČIL JSI VŠECHNO!' : '▶  LEVEL ' + (levelCislo+1)),
    () => dalsiLevel(), '#7bed9f');
  tlacitko(238, 380, 150, 50, 'znovu', () => zacniHru(), '#ffd166');
  tlacitko(404, 380, 150, 50, vlastniHra ? 'editor' : 'mapa',
           () => vlastniHra ? otevriEditor() : otevriMapu(), '#7bed9f');
  tlacitko(570, 380, 150, 50, 'menu',  () => doMenu(), '#7c5cff');
}

// ============ SMYČKA ============
L = nactiLevel(levelCislo);
let posledni = performance.now();
function smycka(t){
  const dt = Math.max(0, Math.min((t - posledni)/1000, 0.05));
  posledni = t;
  animCas += dt;
  // puls do rytmu hudby — obrazovka „dýchá" s písničkou
  const tempoTed = parseFloat((hudbaProfil.split('|')[0]) || '120') || 120;
  pulz = Math.pow(Math.max(0, Math.sin(animCas * (tempoTed/60) * Math.PI)), 3);
  if (stav !== 'hra') hlaskaCas = Math.max(0, hlaskaCas - dt);
  if (stav === 'hra') krok(dt);
  efektyKrok(dt);
  kresli();
  requestAnimationFrame(smycka);
}
requestAnimationFrame(smycka);
</script>
